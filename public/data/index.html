   {
    "order_in_batch": 3,
    "item_id": "T-044",
    "english_text": "Tim and Jen are twins. They like to play in the park. One day, they see a big dog with a black vest. The dog is with a man who wears a hat and a badge.\n\"Can we pet the dog?\" Tim asks the man.\nThe man nods and smiles. \"Yes, you can. His name is Rex. He is a police dog. He helps me catch bad people.\"\nTim and Jen run to Rex and stroke his fur. Rex wags his tail and licks their faces. They giggle and hug him.\n\"Rex is so nice and soft,\" Jen says.\n\"He is also very smart and brave,\" the man says. \"He can find things with his nose. He can also run very fast and jump very high.\"\n\"Wow, can you show us?\" Tim asks.\nThe man nods again. He takes out a ball from his pocket and throws it far away. Rex runs after it and catches it in his mouth. He brings it back to the man and drops it at his feet.\n\"Good boy, Rex!\" the man says. He gives him a treat and a pat.\nTim and Jen clap and cheer. They want to play more with Rex.\nBut then, the man's radio makes a noise. He picks it up and listens. He frowns and says something.\n\"Sorry, kids, I have to go. There is a problem. Rex and I have to help.\"\nTim and Jen are sad. They want the man and Rex to stay.\n\"Can we see you again?\" Jen asks.\nThe man nods one more time. He puts the ball and the treat in his pocket. He puts the radio on his belt. He tells Rex to follow him.\n\"Of course, you can. We come to this park often. Maybe next time, we can play more. Bye, kids. Be good and stay safe.\"\nHe waves and walks away. Rex follows him. He looks back and barks.\nTim and Jen wave and shout. \"Bye, Rex! Bye, man! Thank you for playing with us!\"\nThey watch them go. They hope they will see them again. They think Rex is the best dog ever. They also think the man is very nice and cool. They wonder what problem they have to solve. They wish them good luck. They go back to their mom and dad and tell them about Rex and the man. They are happy. They love the park.",
    "telugu_text": "టిమ్ మరియు జెన్ ఇద్దరు తోబుట్టువులు. వాళ్ళకి పార్కులో ఆడటం అంటే చాలా ఇష్టం. ఒక రోజు, వాళ్ళు నల్లటి వెస్ట్ ఉన్న ఒక పెద్ద కుక్కను చూశారు. ఆ కుక్క ఒక మనిషితో ఉంది, ఆ మనిషి తలపైన టోపీ, బ్యాడ్జ్ పెట్టుకున్నాడు.\n\"మనం కుక్కను నిమిరామా?\" అని టిమ్ ఆ మనిషిని అడిగాడు.\nఆ మనిషి తల ఊపి నవ్వాడు. \"అవును, మీరు నిమిరావచ్చు. దాని పేరు రెక్స్. అది పోలీస్ కుక్క. అది చెడ్డ వాళ్ళను పట్టుకోవడానికి నాకు సహాయం చేస్తుంది.\"\nటిమ్ మరియు జెన్ రెక్స్ దగ్గరకు పరిగెత్తి దాని బొచ్చును నిమిరారు. రెక్స్ తోక ఊపింది, వాళ్ళ ముఖాలను నాలుకతో తాకింది. వాళ్ళు నవ్వారు, దానిని కౌగిలించుకున్నారు.\n\"రెక్స్ చాలా మంచిది, మృదువుగా ఉంది,\" అని జెన్ అంది.\n\"అది చాలా తెలివైనది, ధైర్యవంతురాలు కూడా,\" అన్నాడు ఆ మనిషి. \"దానికి దాని ముక్కుతో వస్తువులను కనుగొనగలదు. అది చాలా వేగంగా పరిగెత్తగలదు, చాలా ఎత్తుకు దూకగలదు.\"\n\"వావ్, మాకు చూపించగలరా?\" అని టిమ్ అడిగాడు.\nఆ మనిషి మళ్ళీ తల ఊపాడు. అతను తన జేబులోంచి ఒక బంతిని తీసి చాలా దూరం విసిరాడు. రెక్స్ దాని వెనకే పరిగెత్తి దానిని నోటితో పట్టుకుంది. అది దానిని మనిషి దగ్గరకు తీసుకువచ్చి అతని పాదాల దగ్గర వదిలింది.\n\"మంచి కుర్రాడు, రెక్స్!\" అన్నాడు ఆ మనిషి. అతను దానికి ఒక బహుమతి ఇచ్చి తడపాడు.\nటిమ్ మరియు జెన్ చప్పట్లు కొట్టి కేకలు వేశారు. వాళ్ళు రెక్స్ తో ఇంకా ఆడాలని అనుకున్నారు.\nకానీ అప్పుడు, ఆ మనిషి రేడియో నుండి శబ్దం వచ్చింది. అతను దాన్ని తీసుకుని విన్నాడు. అతను ముఖం చిట్లించి ఏదో అన్నాడు.\n\"క్షమించండి పిల్లలూ, నేను వెళ్లాలి. ఒక సమస్య ఉంది. రెక్స్ మరియు నేను సహాయం చేయాలి.\"\nటిమ్ మరియు జెన్ విచారించారు. వాళ్ళు ఆ మనిషిని మరియు రెక్స్ ఉండాలని కోరుకున్నారు.\n\"మనం మళ్ళీ మిమ్మల్ని చూడవచ్చా?\" అని జెన్ అడిగింది.\nఆ మనిషి మరోసారి తల ఊపాడు. అతను బంతిని మరియు బహుమతిని తన జేబులో పెట్టాడు. అతను రేడియోను తన కట్టుకుపై పెట్టుకున్నాడు. అతను రెక్స్కు తనను అనుసరించమని చెప్పాడు.\n\"తప్పకుండా, మీరు చేయవచ్చు. మేము ఈ పార్కుకు తరచుగా వస్తాము. బహుశా వచ్చేసారి, మనం ఇంకా ఎక్కువ ఆడవచ్చు. బై, పిల్లలూ. మంచిగా ఉండండి, సురక్షితంగా ఉండండి.\"\nఅతను చేతులు ఊపి వెళ్లిపోయాడు. రెక్స్ అతనిని అనుసరించింది. అది వెనక్కి తిరిగి మొరిగింది.\nటిమ్ మరియు జెన్ చేతులు ఊపి అరిచారు. \"బై, రెక్స్! బై, మనిషి! మాతో ఆడినందుకు ధన్యవాదాలు!\"\nవాళ్ళు వాళ్ళను వెళ్ళిపోవడాన్ని చూశారు. వాళ్ళు మళ్ళీ వాళ్ళను చూడాలని ఆశపడ్డారు. రెక్స్ ఎప్పుడూ ఉత్తమ కుక్క అని వాళ్ళు అనుకున్నారు. ఆ మనిషి కూడా చాలా మంచివాడు, కూల్గా ఉన్నాడని వాళ్ళు అనుకున్నారు. వాళ్ళు ఏ సమస్యను పరిష్కరించాలో ఆలోచించారు. వాళ్ళు వారికి మంచి జరగాలని కోరుకున్నారు. వాళ్ళు వాళ్ళ అమ్మ, నాన్న దగ్గరకు వెళ్లి రెక్స్ మరియు ఆ మనిషి గురించి చెప్పారు. వాళ్ళు సంతోషపడ్డారు. వాళ్ళు పార్కును ప్రేమిస్తారు."
   },
   {

    "item_id": "T-158",
    "english_text": "Once upon a time, there was a little girl named Lily. Lily liked to play with her toys all day. One day, she felt uncomfortable when her tummy hurt a lot. She did not want to play anymore.\nLily's mom saw her and asked, \"Lily, why did you quit playing with your toys?\" Lily said, \"Mom, my tummy hurts. I don't want to play now.\" Her mom hugged her and said, \"Let's go see the doctor.\"\nThe doctor checked Lily and gave her some medicine. After taking the medicine, Lily felt better. She went back to her room and started playing with her toys again. Her mom was happy to see her feeling good. They played together and had a fun day.",
    "telugu_text": "ఒకప్పుడు, లిల్లీ అనే ఒక చిన్న అమ్మాయి ఉండేది. లిల్లీ రోజంతా తన బొమ్మలతో ఆడుకోవడం అంటే చాలా ఇష్టం. ఒకరోజు, తన కడుపు చాలా నొప్పిగా ఉన్నప్పుడు లిల్లీకి అసౌకర్యంగా అనిపించింది. ఆమెకు ఇంక ఆడుకోవాలనిపించలేదు.\nలిల్లీ అమ్మ ఆమెను చూసి, \"లిల్లీ, నువ్వు బొమ్మలతో ఆడుకోవడం ఎందుకు ఆపేసావు?\" అని అడిగింది. లిల్లీ, \"అమ్మా, నా కడుపు నొప్పిగా ఉంది. నాకు ఇప్పుడు ఆడుకోవాలని లేదు,\" అంది. ఆమె అమ్మ ఆమెను హత్తుకుని, \"వెళ్లి డాక్టర్ని చూద్దాం,\" అంది.\nడాక్టర్ లిల్లీని పరీక్షించి, ఆమెకు కొంచెం మందు ఇచ్చారు. మందు తీసుకున్న తర్వాత, లిల్లీకి బాగా అనిపించింది. ఆమె తన గదిలోకి వెళ్లి మళ్లీ తన బొమ్మలతో ఆడుకోవడం మొదలుపెట్టింది. ఆమె బాగా అనిపించడం చూసి ఆమె అమ్మ సంతోషించింది. వాళ్లిద్దరూ కలిసి ఆడుకున్నారు, ఆ రోజు చాలా సరదాగా గడిపారు."
   },
   {

    "english_text": "One night, Tommy was playing with his toys. He heard a strange noise outside and went to check it out.\nWhen Tommy opened the door, he saw a skeleton standing in the garden looking right at him. Tommy was scared, so he quickly stepped back and shut the door. He whispered to himself \"What was that?\"\nTommy's parents noticed his terrified expression. His mother said, \"Maybe it's just a broken toy we threw out\". Tommy nodded, but he still wasn't sure. \nThe next day, all the kids in Tommy's neighborhood were playing hide-and-seek. Tommy was hiding under a big bush when he saw the skeleton again. Tommy yelled out in surprise, \"What are you doing here?\"\nThe skeleton suddenly came to life. It said in a spooky voice, \"I'm here to play with you\". Tommy was scared, but he was also curious. He couldn't help but smile and guess what would happen next.",
    "telugu_text": "ఒక రాత్రి, టామ్ తన బొమ్మలతో ఆడుకుంటున్నాడు. బయట ఏదో వింత శబ్దం వినిపించింది, అందుకే వెళ్లి చూశాడు.\nటామ్ తలుపు తెరిచినప్పుడు, తోటలో ఒక ఎముకగడ నిలబడి తన వైపే చూస్తున్నట్లు చూశాడు. టామ్ భయపడ్డాడు, కాబట్టి త్వరగా వెనక్కి వెళ్లి తలుపు మూశాడు. అతను తనలో తాను గుసగుసలాడాడు, \"అది ఏమిటి?\"\nటామ్ తల్లిదండ్రులు అతని భయపడిన ముఖాన్ని గమనించారు. అతని అమ్మ, \"బహుశా మనం పారేసిన పగిలిన బొమ్మ అయి ఉండొచ్చు\" అంది. టామ్ తలూపాడు, కానీ అతనికి ఇంకా ఖచ్చితంగా తెలియలేదు.\nమరుసటి రోజు, టామ్ వీధిలోని పిల్లలందరూ దాగుడుమూతలు ఆడుకుంటున్నారు. టామ్ ఒక పెద్ద పొద కింద దాక్కున్నప్పుడు మళ్లీ ఆ ఎముకగడను చూశాడు. టామ్ ఆశ్చర్యంతో అరిచాడు, \"నువ్వు ఇక్కడ ఏం చేస్తున్నావు?\"\nఆ ఎముకగడ అకస్మాత్తుగా బ్రతికింది. అది భయానక స్వరంతో, \"నేను నీతో ఆడుకోవడానికి వచ్చాను\" అంది. టామ్ భయపడ్డాడు, కానీ అతనికి ఆసక్తి కూడా కలిగింది. తదుపరి ఏమి జరుగుతుందో ఊహించకుండా ఉండలేకపోయాడు."

    "continuation": "ఒక రోజు, వాళ్ళు ఒక పెద్ద స్లైడ్ చూశారు. అన్నా ఆ స్లైడ్పై వెళ్లాలనుకుంది, కానీ బెన్ భయపడ్డాడు.\n\"నాకు కూడా కిందకి వెళ్లాలనుకుంటున్నాను,\" అన్నా అంది.\n\"సరే, కానీ నువ్వు జాగ్రత్తగా ఉండాలి. స్లైడ్ ప్రమాదకరం. జారుడు చాలా ఎత్తుగా ఉంది,\" బెన్ అన్నాడు.\nవాళ్ళు స్లైడ్ను నెట్టారు, నెట్టారు. స్లైడ్ చాలా ఎత్తుగా, గట్టిగా ఉంది. అన్నా తన కాళ్ళతో స్లైడ్ను కొట్టింది. స్లైడ్ కదలలేదు. అన్నా అరిచింది.\n\"సహాయం! సహాయం!\" బెన్ అరిచాడు.\nవాళ్ళ అమ్మ, నాన్న వాళ్ళ అరుపులు విన్నారు. వాళ్ళ అరుపులు విని కిందకి వచ్చారు. వాళ్ళు స్లైడ్పై ఉన్న అన్నా, బెన్ను, స్లైడ్ను చూశారు. వాళ్ళు వాళ్ళ అరుపులు విన్నారు.\n\"మీరు బాగానే ఉన్నారు, పిల్లలూ. మీకు గాయాలయ్యే అవకాశం ఉంది,\" వాళ్ళ అమ్మ అంది.\nఅన్నా, బెన్ వాళ్ళ అరుపులు విన్నారు. వాళ్ళు స్లైడ్ నుండి దిగి కిందకి వచ్చారు. వాళ్ళు సురక్షితంగా ఉన్నందుకు సంతోషించారు.\n\"ధన్యవాదాలు, అమ్మా. మేము బాగానే ఉన్నాము,\" అన్నా అంది.\n\"మీకు స్వాగతం, నా ప్రాణాల. మీరు చాలా తెలివైనవారు,\" వాళ్ళ అమ్మ అంది.\n\"మీకు స్వాగతం, పిల్లలూ. మీరు పార్కులో జాగ్రత్తగా ఉండటం నేర్చుకున్నారు. మీరు దయగా, గౌరవంగా ఉన్నందుకు ధన్యవాదాలు. మీరు స్లైడ్ దగ్గర జాగ్రత్తగా ఉండటం నేర్చుకున్నావు,\" వాళ్ళ అమ్మ అంది.\nఅన్నా, బెన్ నవ్వారు. వాళ్ళు కూడా సంతోషంగా ఉన్నారు. వాళ్ళు ఒకరినొకరు, వాళ్ళ అమ్మకి, వారి తల్లిదండ్రులకు ధన్యవాదాలు చెప్పారు. వాళ్ళు తమ స్నాక్ తిని సరదాగా ఉన్నారు. వాళ్ళు పార్కును, స్లైడ్ను ఆస్వాదించారు. వాళ్ళు సంతోషంగా ఉన్నారు."
   },
   {

    "continuation": "అక్కడ పాత బొమ్మలు, బట్టలు, పుస్తకాలు, బట్టలు మరియు ఒక పెద్ద పెట్టె ఉండేవి. వాళ్ళు చాలా సృజనాత్మకమైనవారు మరియు సరదాగా గడిపేవారు.\nఒక రోజు, వాళ్ళు ఆ అటకలో ఒక పాత మ్యాప్ను కనుగొన్నారు. దానిపై చాలా బొమ్మలు మరియు మ్యాప్ ఉన్నాయి. సారా, బెన్ ఆ మ్యాప్ని అనుసరించాలని, అది ఎక్కడికి వెళ్తుందో చూడాలని అనుకున్నారు. వాళ్ళు మ్యాప్ను అనుసరించి మ్యాప్ను అనుసరించడం మొదలుపెట్టారు.\nవాళ్ళు చెట్లు, పువ్వులు, మరియు పక్షులు మరియు ఇతర మనుషులు ఉన్న ఒక దేశాన్ని చూశారు. సారా, బెన్ మ్యాప్ను అనుసరించి, మ్యాప్ను అనుసరించారు. వాళ్ళు దేశం వైపు నడిచారు, మ్యాప్ వెనుక ఉన్న చాలా దేశాలకు చేరుకున్నారని చూశారు. అక్కడ చాలా మంది వ్యక్తులు మరియు జంతువులు ఉన్నాయి. వాళ్ళు చిత్రాలు మరియు దేశాలతో ఉన్న పెద్ద సందేశాన్ని చూశారు.\nసారా, బెన్ ఆశ్చర్యపోయారు. వాళ్ళు మ్యాప్ను అనుసరించి ఆ దూర దేశాన్ని చూశారు. దానిలో చాలా విషయాలు మరియు మనుషులు మరియు జంతువులు ఉన్నాయి. వాళ్ళు ఆ దేశాన్ని, ఆ దూర దేశాన్ని చూశారు. వాళ్ళు ప్రతిదాన్ని చూశారు మరియు కొత్త విషయాలు నేర్చుకున్నారు. వాళ్ళు మ్యాప్ను అనుసరించి చాలా విషయాలు చూశారు. వాళ్ళు చాలా సరదాగా గడిపారు.\nవాళ్ళు మ్యాప్ను అనుసరించినందుకు సంతోషపడ్డారు. వాళ్ళ అమ్మ మరియు నాన్నలు వారికి స్నాక్ మరియు ప్రేమను ఇచ్చారు. వాళ్ళు ప్రపంచంలోని ఉత్తమ నిధులు మరియు సాహసోపేతమైన విషయాల కోసం వారికి కృతజ్ఞతలు చెప్పారు. వాళ్ళకు ఒక గొప్ప సాహసం జరిగింది మరియు మరిన్ని అటకను అనుసరించారు. వాళ్ళు చాలా కొత్త విషయాలు నేర్చుకున్నారు మరియు చాలా నేర్చుకున్నారు."

    "beginning": "ఒకప్పుడు, మాక్స్ అనే ఒక చిన్న కుక్క ఉండేది. మాక్స్ ఒక చిన్న ఇల్లు, దాని ముందు వరండాలో నివసించేది.",
    "continuation": "ఒక రోజు, మాక్స్ వరండాలో ఒక పెద్ద పిల్లిని చూసింది. ఆ పిల్లి చెడ్డది కాదు, కానీ మాక్స్ చాలా చురుకుగా ఉండేది.\nమాక్స్ ఆ పిల్లితో స్నేహం చేయాలనుకుంది, కానీ ఆ పిల్లి మంచిది కాదు. ఆ పిల్లి మాక్స్ను వెంబడించి వరండా నుండి పారిపోయింది. మాక్స్ బాధపడింది, ఏం చేయాలో తెలియలేదు.\nఅప్పుడు, ఏదో ఊహించనిది జరిగింది. ఆ పిల్లి ఒక పెద్ద బంతిని చూసింది. ఆ పిల్లి ఆ బంతితో ఆడింది, మాక్స్ దానిని వెంబడించడం ఆపింది. ఆ పిల్లి, \"నేను నిన్ను వెంబడించినందుకు క్షమించు, మాక్స్. మనం స్నేహితులుగా ఉండవచ్చు.\" అంది. మాక్స్, ఆ పిల్లి స్నేహితులు అయ్యి ప్రతిరోజూ వరండాలో కలిసి ఆడింది."

   {
    "order_in_batch": 7,
    "language": "Telugu",
    "item_id": "STE-136",
    "beginning": "లిల్లీ, టామ్ అనే ఇద్దరు జంట పిల్లలు తోటలో ఆడుకోవడానికి ఇష్టపడేవారు. వారికి చాలా ఆకులు, కొమ్మలు ఉన్న పెద్ద చెట్టు ఉండేది.",
    "continuation": "వారు ఆ కొమ్మలను విడదీసి పైకి ఏముందో చూడాలని అనుకునేది. కొన్నిసార్లు వారు ఆ ఆకులను తీసుకుని చెట్టు ఎక్కడం చేసేవారు.\nఒక రోజు, వారు చాలా ఎత్తైన కొమ్మను కనుగొన్నారు. అది చాలా ఎత్తుగా, మెరుస్తూ, చాలా ముళ్ళు ఉన్నాయి. లిల్లీ దానిని తాకాలని అనుకుంది, కానీ టామ్ భయపడ్డాడు.\n\"రా టామ్, ఇది సరదాగా ఉంటుంది!\" లిల్లీ అంది. \"మనం ఇక్కడి నుండి ప్రపంచాన్ని చూడొచ్చు!\"\nకానీ టామ్ తలూపాడు. \"వద్దు, లిల్లీ, ఇది చాలా ప్రమాదకరం. చెట్టు చాలా ఎత్తుగా ఉంది, కొమ్మ చాలా ముళ్ళు ఉన్నాయి. అది మిమ్మల్ని గాయపరచవచ్చు. మనం ఇక్కడే ఉండాలి.\"\nలిల్లీ టామ్ మాట వినలేదు. ఆమె ఆ ఎత్తైన కొమ్మను తాకాలనుకుంది. ఆమె చాలా ఆసక్తిగా, ధైర్యంగా ఉంది. ఆమె తన చేయి చాచి కొమ్మను పట్టుకుంది. ఆమె తన కాళ్లతో దాన్ని కొట్టి, \"పట్టుకో, ఇది సరదాగా ఉంటుంది!\" అంది.\nకానీ కొమ్మ పగలలేదు. అది కొమ్మ కాదు. అది ఒక ఉచ్చు. లిల్లీ, టామ్ ఒక పెద్ద శబ్దం విన్నారు. వారు వెనక్కి తిరిగి చూసేసరికి, చెట్టు కూలిపోతోంది. కొమ్మ రెండు ముక్కలుగా విరిగిపోయి నేలపై పడింది. లిల్లీ, టామ్ చాలా విచారంగా, కోపంగా ఉన్నారు. వారు తమ చేతులు, కాళ్ళతో చెట్టును చీల్చడానికి ప్రయత్నించారు, కానీ అది చాలా బరువుగా, చాలా వేగంగా ఉంది. వారు అరిచారు, ఏడ్చారు, కానీ ఎవరూ వారిని వినలేదు. వారు ఆ చెట్టుపై చిక్కుకుపోయారు."

    "item_id": "STE-063",
    "beginning": "ఒక రోజు, ఒక అబ్బాయి మరియు అతని అమ్మ పార్కుకు వెళ్లారు. వారు ఒక పెద్ద చెట్టును చూశారు.",
    "continuation": "అబ్బాయి, \"అమ్మా, చెట్టు మీద ఒక పక్షి ఉంది!\" అన్నాడు. అతని అమ్మ, \"లేదు, అది పక్షి కాదు. అది పక్షులు పాడే శబ్దం చేస్తుంది,\" అంది.\nవారు ఆ పక్షిని పట్టుకోవాలని నిర్ణయించుకున్నారు. అది ఒక కొమ్మపై వేలాడుతున్న ఒక పెద్ద చెట్టును చూశారు. వారు ఆ పక్షిని పట్టుకోవాలనుకున్నారు, కానీ అది చాలా ఎత్తులో ఉంది. వారు దాని కోసం వెతికారు, కానీ అది చాలా ఎత్తులో ఉంది.\nఅప్పుడు, వారు ఒక శబ్దం విన్నారు. అది ఒక పక్షి! ఆ పక్షి చెట్టులో చిక్కుకుపోయింది. అబ్బాయి మరియు అతని అమ్మ చాలా ఆశ్చర్యపోయారు. వారు పక్షి వైపు చూశారు, మరియు వారికి పక్షి గూడు దొరికింది. ఆ పక్షి, \"నేను మీకు సహాయం చేయగలను!\" అంది. పక్షి ఎగిరిపోయింది, మరియు అబ్బాయి మరియు అతని అమ్మ దానిని తీసుకున్నారు. వారు మళ్లీ సంతోషపడ్డారు, మరియు వారు తమ కొత్త స్నేహితుడికి సహాయం చేసినందుకు సంతోషంగా ఇంటికి వెళ్లారు."
   },
   {
    "order_in_batch": 9,
    "language": "Telugu",
    "item_id": "STE-013",
    "beginning": "ఒక రోజు, టిమ్ అనే చిన్న పిల్లాడు నడవడానికి వెళ్ళాడు. అతను ఒక పెద్ద చెట్టును, ఒక చిన్న కుక్కను చూశాడు.",
    "continuation": "ఆ కుక్క విచారంగా ఉంది. టిమ్ ఆ కుక్క దగ్గరకు వెళ్లి, \"హాయ్, కుక్క! నువ్వు ఎందుకు విచారంగా ఉన్నావు?\" అని అన్నాడు.\nకుక్క, \"నా స్నేహితుడు ఎక్కడ దాక్కున్నాడో నాకు తెలియదు. నువ్వు నాకు సహాయం చేయగలవా?\" అంది. టిమ్ కుక్క కోసం బాధపడ్డాడు. అతనికి సహాయం చేయాలనిపించింది. కాబట్టి, టిమ్ మరియు కుక్క స్నేహితులు అయ్యారు.\nవారు ఎక్కడ చూసినా వెతికారు. వారు ఊయల మీద, స్లైడ్ మీద ఆడుకున్నారు. కుక్క ఒక పెద్ద కొండను చూసి దాన్ని పట్టుకోవడానికి ప్రయత్నించింది. కుక్క పైకి ఎక్కి, \"నేను నీకు సహాయం చేస్తాను!\" అంది. కుక్క తోక ఊపింది, టిమ్ సహాయంతో కొండ పైభాగానికి చేరుకుంది. టిమ్ చాలా సంతోషించాడు. వారు మంచి స్నేహితులు అయ్యారు మరియు ప్రతిరోజూ కలిసి ఆడుకున్నారు."
   },
   {
    "order_in_batch": 10,
    "language": "Telugu",
    "item_id": "STE-146",
    "beginning": "ఒకప్పుడు, పెద్ద మడమ ఉన్న ఒక మనిషి ఉండేవాడు. అతను చాలా ధనవంతుడు.",
    "continuation": "అతనికి పెద్ద ఇల్లు, చాలా బొమ్మలు ఉండేవి. అతని దగ్గర చాలా స్నేహితులు ఉన్నారు, కానీ అతని మంచి స్నేహితుడు ఒక పిల్లి. వాళ్ళు ప్రతిరోజూ కలిసి ఆడుకునేవారు.\nఒక రోజు, వాళ్ళు పార్కుకు వెళ్లారు. వాళ్ళు ఒక పెద్ద చెట్టును చూశారు. పిల్లి ఆ చెట్టు ఎక్కాలని అనుకుంది. పిల్లి చెట్టు ఎక్కడానికి ప్రయత్నించింది, కానీ అది చాలా చిన్నది. మనిషి సహాయం చేయడానికి ప్రయత్నించాడు, కానీ అతను చాలా చిన్నవాడు.\nఅప్పుడు, మనిషికి ఒక ఆలోచన వచ్చింది. అతను పిల్లికి ఒక ముద్దు ఇచ్చేలా చెట్టు ఎక్కాలని అనుకున్నాడు. కానీ అతను పిల్లిని పైకి లేపగానే, ఊహించనిది జరిగింది. పిల్లి చెట్టు నుండి దూకి పారిపోయింది. మనిషి ఆశ్చర్యపోయాడు, కానీ నవ్వాడు. కొన్నిసార్లు విషయాలు అవి కనిపించే విధంగా ఉండకపోవచ్చు, కానీ అవి కూడా సరదాగా ఉండవచ్చు అని అతను నేర్చుకున్నాడు."
   },
   {
    "order_in_batch": 11,
    "language": "Telugu",
    "item_id": "STE-076",
    "beginning": "లిల్లీ, బెన్ తమ బొమ్మలతో హాల్లో ఆడుకుంటున్నారు. వాళ్లకు స్పైలులా నటించడం, ఒకరికొకరు రహస్య సందేశాలు పంపడం అంటే చాలా ఇష్టం.",
    "continuation": "లిల్లీ డోర్బల్ ఒక పెట్టె, బెన్ దగ్గర ఒక ఫోన్ ఉంది. వాళ్ళు తమ స్నేహితులకు, ఒకరికొకరు ఒక ప్రశ్న, కథ చెప్పడానికి వంతులు తీసుకున్నారు.\n\"నా వంతు, బెన్,\" లిల్లీ అంది. \"నా దగ్గర నీ కోసం ఏదో ఉంది.\"\n\"నా వంతు, లిల్లీ,\" బెన్ అన్నాడు. \"నా కోసం వేచి ఉండు.\"\nలిల్లీ చాలా ఉత్సాహంగా ఉంది. ఆమె వెనుక తలుపు దగ్గరకు పరిగెత్తి, తన అమ్మను వెతకడానికి పరిగెత్తింది. కానీ తలుపు తాళం వేసి ఉంది. బెన్ దాన్ని తెరవడానికి తాళం చెవి పొందలేదు.\n\"అమ్మా, అమ్మా, తలుపు తాళం!\" లిల్లీ అంది.\n\"నా కోసం తలుపు తీయగలవా?\" బెన్ అడిగాడు.\nఅమ్మ నవ్వి తల ఊపింది. ఆమె తలుపు తీసి తలుపు తీసింది. ఆమె లిల్లీని కౌగిలించుకుని, \"నా కోసం వేచి ఉన్నందుకు ధన్యవాదాలు, లిల్లీ. ఇప్పుడు లోపలికి రండి, నా ప్రియమైన దానివి. నేను మీకు ఒక బహుమతి ఇస్తాను,\" అంది.\nబెన్ తలుపు తెరిచి లిల్లీని, అమ్మను చూశాడు. అతను అరిచాడు, \"లిల్లీ, నువ్వు చాలా తెలివైన దానివి. నువ్వు చాలా తెలివైన దానివి, బెన్. నువ్వు సరదాగా గడిపావు, లిల్లీ. నేను నీ గురించి చాలా గర్విస్తున్నాను.\"\nలిల్లీ నవ్వి బెన్ను తిరిగి కౌగిలించుకుంది. ఆమె తలుపు దగ్గరకు వెళ్లి దాన్ని తెరిచింది. బెన్ తన సొంత బహుమతితో లిల్లీ గదిలోకి పరిగెత్తాడు. అతను ఆమెకు ఒక కొత్త స్టిక్కర్ ఇచ్చి, \"నేను నీ కోసం చేశాను, లిల్లీ. ఇది నా స్నేహితురాలినా?\" అన్నాడు.\nలిల్లీ బెన్కు ధన్యవాదాలు చెప్పి అతన్ని కౌగిలించుకుంది. ఆమె అంది, \"సంతోషం, బెన్. నీకు కూడా నీ సొంత బహుమతులు ఉన్నాయి. నీకు బహుమతి ఉంది.\"\nలిల్లీ, బెన్ చాలా సంతోషపడ్డారు. వాళ్ళు ఒక కొత్త కార్డు, ఒక కొత్త బొమ్మ తయారు చేయాలని నిర్ణయించుకున్నారు. వాళ్ళు తమ బొమ్మలు, తమ కుటుంబ సభ్యులతో పంచుకున్నారు. వాళ్ళు తమ కోసం ఒక కార్డు, ఒకరి కోసం ఒక కార్డు తయారు చేశారు. వాళ్ళు ఒకరికొకరు \"నేను నిన్ను ప్రేమిస్తున్నాను\" అని రాసి, ఒకరిపై ఒకరు చెప్పారు. వాళ్ళు కౌగిలించుకుని నవ్వారు.\nవాళ్ళ అమ్మ వాళ్ళని చూసి నవ్వింది. ఆమె అంది, \"స్వాగతం, లిల్లీ, బెన్. మీరు చాలా తెలివైనవారు, దయగలవారు. మీరు నా మంచి పిల్లలు. నేను మీపై గర్విస్తున్నాను.\"\nలిల్లీ, బెన్ ఒకరినొకరు కౌగిలించుకుని, \"మేము కూడా నిన్ను ప్రేమిస్తున్నాము, అమ్మా. నువ్వే గొప్పదానివి,\" అన్నారు.\nవాళ్ళు వాళ్ళ అమ్మ, తమ బొమ్మలను, తమ కుటుంబ సభ్యులతో పంచుకున్నారు. వాళ్ళు సంతోషంగా, ప్రేమగా ఉన్నారు. వాళ్ళు మంచి స్నేహితులు."
   },
   {
    "order_in_batch": 12,
    "language": "Telugu",
    "item_id": "STE-070",
    "beginning": "ఒకప్పుడు, లిల్లీ అనే చురుకైన చిన్న అమ్మాయి ఉండేది. ఆమె తన స్నేహితులతో ఆడుకోవడం, నవ్వడం అంటే చాలా ఇష్టం.",
    "continuation": "ఒక రోజు, లిల్లీ తన మంచి స్నేహితుడు టామ్ తో ఒక పెద్ద నీటి గుంట దగ్గర ఆడుకుంటున్నాడు.\nలిల్లీ అంది, \"టామ్, నాతో కలిసి నీటి గుంటలో దూకాలనుకుంటున్నావా?\" టామ్ తల ఊపాడు, వాళ్లిద్దరూ ఆ నీటి గుంటలో దూకారు. వాళ్ళు నవ్వారు, చాలా సరదాగా గడిపారు. కొద్దిసేపటి తర్వాత, వాళ్ళు అలసిపోయారు, కొంచెం విశ్రాంతి తీసుకోవాలని అనుకున్నారు.\nవాళ్ళు నీటి గుంట అంచున కూర్చున్నప్పుడు, ఒక పెద్ద కప్ప నీటిలోంచి దూకింది! కప్ప అంది, \"రిబ్బిట్, రిబ్బిట్!\" లిల్లీ, టామ్ చాలా ఆశ్చర్యపోయారు. కప్పలు మాట్లాడగలవని వాళ్ళకి తెలియదు! కప్పలు మాట్లాడగలవని వాళ్ళకి తెలియదు. ఆ కప్ప, లిల్లీ, టామ్ తమ కొత్త స్నేహితుడితో ఆ రోజు మొత్తం నీటి గుంటలో ఆడుకున్నారు."
   },
   {
    "order_in_batch": 13,
    "language": "Telugu",
    "item_id": "STE-098",
    "beginning": "ఒకప్పుడు, ఒక ఒంటరి చిన్న అమ్మాయి ఉండేది. ఆమె చాలా విచారంగా ఉండేది, చాలా చాలా విచారంగా, ప్రతి రోజు ఆమె ఏడుసేది.",
    "continuation": "కానీ ప్రతి ఉదయం, ఆమె మళ్లీ ఎప్పుడూ ఒంటరిగా ఉండేది. ఆమె ఒంటరిగా, చాలా ఒంటరిగా ఉండేది. ఆమె తన కుటుంబానికి, కుటుంబ సభ్యులకు, స్నేహితుల గురించి చెప్పాలని అనుకుంది.\nఒక ఉదయం, ఆమెకు ఒక పెద్ద కల వచ్చింది. ఆమె తాను సృష్టించిన కల గురించి కలగంటున్నానని అనుకుంది. ఆమె కలలో, ఆమె శాశ్వతంగా ఒంటరిగా ఉందని గ్రహించింది. ఆమె ఒక్క క్షణం ఆలోచించి, ఆపై నవ్వింది.\nఆ పెద్ద కల నిజం. తన కలలను పట్టించుకోనందుకు ఆమె సంతోషపడింది. ఆమె స్నేహితులు ఆమె కోసం కేకలు వేసి, వారితో ఆడుకోవడానికి వచ్చారు. వారు అందరూ వారి దగ్గరకు వచ్చారు, ఆమె చాలా సంతోషపడింది. ఆ రోజు నుండి, ఆ చిన్న అమ్మాయి అంత ఒంటరిగా లేదు, ఆమె చుట్టూ ఉన్న ప్రతి ఒక్కరికీ ఆమె కల ఒక ఆనందం మరియు నవ్వులతో నిండిపోయింది."
   },
   {
    "order_in_batch": 14,
    "language": "Telugu",
    "item_id": "STE-052",
    "beginning": "లిల్లీ, బెన్ క్రేయాన్స్ తో ఆడుకుంటున్నారు. వాళ్లకు రంగులు వేసి చాలా వస్తువులు గీయడం అంటే ఇష్టం.",
    "continuation": "వాళ్ళు గోడలు, పైకప్పు ఉన్న పెద్ద ఇంటిని చేస్తారు. వాళ్ళు గోడపై ఒక పెద్ద సూర్యుడిని గీస్తారు.\nఒక రోజు, లిల్లీ, బెన్ గోడపై ఒక పెద్ద సూర్యుడిని గీస్తున్నారు. అది చాలా బాగుంది. వాళ్ళు ఒకరికొకరు సహాయం చేసుకుంటారు.\n\"చూడు, బెన్, గోడ రంగులు వేయడం మొదలుపెడుతుందా?\" లిల్లీ అడుగుతుంది.\n\"అవును, లిల్లీ, మనం ఒక పెద్ద సూర్యుడిని చేశాం. అది చాలా అందంగా ఉంది. సూర్యుడు చాలా ప్రకాశవంతంగా, వెచ్చగా ఉన్నాడు,\" బెన్ చెప్తాడు.\nవాళ్ళు నవ్వుతారు, ఒకరినొకరు కౌగిలించుకుంటారు. సూర్యుడు ప్రకాశిస్తున్నాడు, కానీ వాళ్ళకి ఇంకా చాలా రంగులు వేసుకుంటారు. వాళ్ళు గోడపై ఒక ప్లాస్టిక్ పామును చూస్తారు. వాళ్ళు దానిని తాకాలని, దానిపై గీయాలని అనుకుంటారు.\n\"చూడు, లిల్లీ, ఒక పెద్ద పాము!\" బెన్ చెప్తాడు.\n\"అవును, బెన్, అది పెద్దది! మనం దాన్ని గీద్దాం!\" లిల్లీ చెప్తుంది.\nవాళ్ళు పిల్లిని గీస్తారు, అది ఒక చిన్న త్రిభుజాన్ని చేస్తుంది. అది ఎరుపు రంగులో, ఆపై నీలం రంగులో, ఆపై పసుపు రంగులో ఉంటుంది. అది ఒక సరదా బొమ్మ అనుకుంటుంది.\n\"చూడు, లిల్లీ, చూడు!\" బెన్ చెప్తాడు.\n\"వావ్, బెన్, అది అద్భుతమైన పాము. మనం ఇంకా ఇంకా గీయవచ్చా?\" లిల్లీ అడుగుతుంది.\nవాళ్ళు నవ్వుకుంటూ, తమ క్రేయాన్స్ తీసుకుని తమ పెయింట్లను కడుక్కున్నారు. వాళ్ళు సంతోషంగా ఉన్నారు. వాళ్ళు తమ చిత్రాన్ని వారి అమ్మ, నాన్నకు చూపిస్తారు. వాళ్ళు, \"చూడు, అమ్మా, చూడు! మన దగ్గర చాలా రంగులు ఉన్నాయి!\""
   },

    "continuation": "ఒక రోజు, ఆమె అడవిలో నడవడానికి వెళ్ళింది.\nనడుస్తున్నప్పుడు, ఆమె ఒక పెద్ద చెట్టును చూసింది. ఆమె ఆ చెట్టు కింద కూర్చుని తన కఠినమైన కోకో గింజలను నమలడం మొదలుపెట్టింది. లిల్లీకి అది చాలా రుచిగా అనిపించింది. కానీ అప్పుడు, చెట్టు కింద కూర్చున్న ఒక ఉడుతను చూసింది.\nలిల్లీ ఉడుత దగ్గరకు వెళ్లి, \"హాయ్, ఉడుతా! నా కోకో గింజలను నమలడం నాకు ఇష్టం. నువ్వు నాతో తినాలనుకుంటున్నావా?\" అంది. ఉడుత లిల్లీ వైపు చూసి, \"అవును, నాకు కూడా కోకో అంటే చాలా ఇష్టం. మనం కలిసి పంచుకుందాం!\" అంది.\nఅలా, లిల్లీ మరియు ఉడుత ఆ రోజు మొత్తం కలిసి కోకో గింజలు తిన్నారు. వాళ్ళు మంచి స్నేహితులు అయ్యారు, మరియు ప్రతిరోజూ కలిసి ఆడుకున్నారు. ఆ రోజు నుండి, లిల్లీ మరియు ఉడుత ఎల్లప్పుడూ కోకో గింజలను పంచుకుని, చాలా సరదాగా గడిపారు."

    "continuation": "ఒక రోజు, అతను అడవిలో ఒక పెద్ద మునగను కనుగొన్నాడు. అతను చాలా సంతోషించాడు మరియు దానిని తన స్నేహితులతో పంచుకోవాలనుకున్నాడు.\nబాబ్ తన స్నేహితురాలు, సూ అనే చిన్న పక్షి దగ్గరకు గెంతుతూ వెళ్ళాడు. అతను ఆమెకు మునగను చూపించి, \"చూడు, సూ! నాకు ఒక పెద్ద మునగ దొరికింది. మనం కలిసి తిందాం!\" అన్నాడు. సూ ఉత్సాహపడింది మరియు \"అవును, మనం మునగ తిందాం!\" అంది.\nకానీ వారు మునగ తినడం మొదలుపెట్టినప్పుడు, ఏదో ఊహించనిది జరిగింది. మునగ మాట్లాడటం మొదలుపెట్టింది! మునగ, \"దయచేసి నన్ను తినవద్దు! నేను ఒక మాయా మునగను. నేను నీకు ఒక కోరిక తీర్చగలను,\" అంది. బాబ్ మరియు సూ చాలా ఆశ్చర్యపోయారు, కానీ వారు మునగను వదిలేసి, పెద్ద, రుచికరమైన క్యారెట్ల గుట్టను కోరుకున్నారు. మాయా మునగ వారి కోరికలను నిజం చేసింది. బాబ్ మరియు సూ చాలా సంతోషపడ్డారు మరియు మాయా మునగకు ధన్యవాదాలు చెప్పారు. ఆ రోజు నుండి, వారు మాయా మునగను కాపాడుకున్నారు మరియు కలిసి ఇంకా చాలా సరదా సాహసాలు చేశారు."

    "continuation": "ఒక రోజు, టిమ్ ఒక పెద్ద, సంతోషంగా ఉన్న సూర్యుడిని, ఒక పొడవైన చెట్టును గీశాడు. తన బొమ్మతో అతను చాలా గర్వపడ్డాడు.\nఅతని అమ్మ ఆ బొమ్మను చూసి, \"వావ్, టిమ్! నువ్వు నీ బొమ్మను చాలా బాగా చేశావు!\" అంది. టిమ్ నవ్వి, సంతోషంగా అనిపించాడు. అతను తన అమ్మకు చూపించాలనుకున్నాడు. అందుకే, అతను వంటగదికి వెళ్లి, టేబుల్పై ఉన్న గిన్నెలో నీళ్లు నింపాడు.\nటిమ్ ఆ గిన్నెను వంటగదికి తీసుకువెళ్లి, \"అమ్మా, నేను ఏమి చేశానో చూడు!\" అన్నాడు. కానీ టిమ్ అమ్మ గిన్నె వైపు చూసి, \"ఓహ్ లేదు, టిమ్! నువ్వు నీటిని టేబుల్పై పోశావు! ఇప్పుడు మనం దాన్ని శుభ్రం చేయాలి.\" అంది.\nటిమ్ అమ్మకు ఒక ఆలోచన వచ్చింది. ఆమె అంది, \"నీ క్రేయాన్లను తీసుకుని, గందరగోళాన్ని శుభ్రం చేద్దాం. అప్పుడు మనం ఆ బొమ్మను కలిసి చేయవచ్చు!\" అలా, టిమ్ మరియు అతని అమ్మ టేబుల్ను శుభ్రం చేసి, పగిలిన బొమ్మలు మరియు రంగుల కాగితాలను శుభ్రం చేశారు. తన బొమ్మ తిరిగి వచ్చినందుకు టిమ్ చాలా సంతోషించాడు, మరియు అతను తన అమ్మకు పెద్ద కౌగిలి ఇచ్చాడు."

    "continuation": "అది సూర్యరశ్మి ఉన్న రోజు, కాబట్టి అతను తన అమ్మతో, \"అమ్మా, నేను వెళ్లడానికి సిద్ధంగా ఉన్నాను!\" అన్నాడు. అతని అమ్మ నవ్వి, \"సరే, వెళ్దాం!\" అంది.\nవారు దుకాణానికి వెళ్లారు. దుకాణంలో, జాక్ ఒక పెద్ద బంతిని చూశాడు. అతను, \"అమ్మా, నాకు ఆ బంతి ఇవ్వగలవా?\" అని అడిగాడు. అతని అమ్మ, \"అవును, కానీ జాగ్రత్తగా ఉండాలి!\" అంది.\nవారు బంతి వైపు నడుస్తున్నప్పుడు, జాక్ అకస్మాత్తుగా చాలా వేగంగా వెళ్లాడు. అతను చాలా వేగంగా పరిగెత్తాడు, అతను ఒక పెద్ద రాయిని తగిలి కింద పడ్డాడు. అతని అమ్మ వచ్చి, \"నువ్వు బాగానే ఉన్నావా?\" అని అడిగింది. జాక్ నవ్వి, \"అవును, అమ్మా! నేను బాగానే ఉన్నాను!\" అన్నాడు.\nఅతని అమ్మ అతనికి హగ్ ఇచ్చి, \"అది గొప్ప బంతి! నువ్వు చాలా వేగంగా వెళ్లావు, జాక్!\" అంది. జాక్ నవ్వి, వారు ఇంటికి వెళ్లారు. అతను చాలా సంతోషంగా ఉన్నాడు మరియు తదుపరిసారి మరింత వేగంగా వెళ్లగలడని అతనికి తెలుసు."

   {

    "language": "Telugu",
    "item_id": "STE-085",
    "beginning": "ఒకప్పుడు, ఒక పెద్ద ఫ్యాన్ ఉండేది. వేడి రోజులకు అది చాలా బాగుండేది.",
    "continuation": "ఆ ఫ్యాన్ అంటే చాలా మంది, ఇష్టపడేవారు. అది ఎప్పుడూ సరదాగా ఉండేది. ఒక రోజు, సూ అనే చిన్న అమ్మాయికి, ఆమె స్నేహితుడు టామ్ అనే అబ్బాయికి ఒక పెద్ద పార్టీ ప్లాన్ చేశారు.\nసూ, టామ్ ఒక రుచికరమైన కేక్ తయారు చేయడానికి తమ స్నేహితులందరినీ ఆహ్వానించారు. కానీ వాళ్ళు కేక్ చేయలేదు. సూ, టామ్, \"మనం కేక్ చేద్దాం!\" అన్నారు. సూ, టామ్ వాళ్ళు ఏం చేశారో తెలియదు. వాళ్ళు చాలా పెద్దవాళ్ళు ఒక పెద్ద కేక్ తయారు చేశారు. అది చాలా పెద్దదిగా, సరదాగా ఉంది.\nకానీ అప్పుడు, ఏదో ఊహించనిది జరిగింది. ఒక పెద్ద పక్షి పార్టీకి వచ్చింది! ఆ పక్షి కేక్ను చూసి కేక్ తినాలని అనుకుంది. సూకి, టామ్కి, టామ్కి, ఆ పక్షికి ఆ పక్షి నచ్చలేదు. అది ఎగిరిపోయింది, వాళ్ళందరినీ తీసుకుపోయింది. ఇప్పుడు, సూ, టామ్, సూ, ఆ పక్షి కేక్ తినలేకపోయారు. పార్టీ ముగిసింది, వాళ్ళు చాలా బాధపడ్డారు."

   {
    "order_in_batch": 5,
    "language": "Telugu",
    "item_id": "STE-057",
    "beginning": "లిల్లీ తన అమ్మ కోసం ఒక కార్డు చేయాలనుకుంది. ఆమెకు కాగితం, క్రేయాన్స్, స్టిక్కర్లు, మరియు గ్లూ ఉన్నాయి.",
    "continuation": "ఆమె తన డిజైన్తో చాలా సంతోషంగా ఉంది. ఆమె తన క్రేయాన్స్, స్టిక్కర్లు, కాగితం, క్రేయాన్స్, స్టిక్కర్లు, మరియు క్రేయాన్స్, స్టిక్కర్లు వేసుకుంది. ఆమె తన అమ్మ దగ్గరకు వెళ్లి, \"చూడు, అమ్మా! నాకు చాలా కార్డులు ఉన్నాయి!\" అంది.\nఅమ్మ నవ్వి, \"అది చాలా బాగుంది, లిల్లీ! నువ్వు చాలా దయగలవాడివి, ప్రతి పని చేశావు. నువ్వు మంచి లాయర్వి, లిల్లీ. నువ్వు చాలా ప్రతిభావంతుడివి మరియు దయగలదానివి. నువ్వు ఎప్పుడూ నీ డిజైన్తో సంతోషంగా ఉంటావు,\" అంది.\nలిల్లీ చాలా గర్వపడింది. ఆమె తన అమ్మను కౌగిలించుకుని, \"నేను నిన్ను ప్రేమిస్తున్నాను, అమ్మా. నువ్వే నాకెఫరణ,\" అంది.\nఆమె అమ్మ, \"నేను కూడా నిన్ను ప్రేమిస్తున్నాను, లిల్లీ. నువ్వు చాలా తెలివైన వాడివి, లిల్లీ,\" అంది.\nవారు ఒకరి నుండి ఒకరు నేర్చుకున్నారు, వారు చాలా సంతోషంగా ఉన్నారు. వారు తమ పనిని ఇష్టపడ్డారు మరియు తమ అమ్మకు, నాన్నకు చూపించారు. వారు, \"నేను నిన్ను ప్రేమిస్తున్నాను, లిల్లీ. నీ కార్డు చాలా బాగుంది,\" అన్నారు.\nఅమ్మ నవ్వి, \"నేను కూడా నిన్ను ప్రేమిస్తున్నాను, లిల్లీ. నువ్వు చాలా దయగల మరియు దయగల అమ్మాయివి. నేను కూడా నిన్ను ప్రేమిస్తున్నాను. నువ్వు కూడా చాలా ధైర్యవంతులైన యోధులు, దయగల మరియు దయగల యోధులు. నువ్వు నాకెప్పుడూ, సంతోషంగా, ప్రేమగా ఉండటానికి ఎలా ఉంటావు?\" అంది.\nలిల్లీ, \"నేను ప్రేమించే యోధులు, లిల్లీ. నేను చాలా ధైర్యవంతుడిని, దయగల యోధులు. నేను నా కుటుంబం, తన నాన్నను ప్రేమిస్తున్నాను,\" అంది.\nఅమ్మ నవ్వి, \"నేను కూడా నిన్ను ప్రేమిస్తున్నాను, లిల్లీ. నువ్వే నా ధైర్యవంతురాలైన యోధుడు,\" అంది.\nలిల్లీ, \"నేను కూడా నిన్ను ప్రేమిస్తున్నాను, అమ్మా. నువ్వు నా ధైర్యవంతురాలివి, దయగల యోధులు. నేను ఎల్లప్పుడూ నన్ను ప్రేమిస్తున్నాను,\" అంది.\nఆమె అమ్మ, \"నేను కూడా నిన్ను ప్రేమిస్తున్నాను, లిల్లీ. నువ్వు చాలా దయగల యోధులు, తెలివైన యోధులు. నేను ఎల్లప్పుడూ నీకు మరియు తన నాన్నకు సహాయం చేస్తాను,\" అంది.\nవారు, \"నీ అమ్మ, సిబ్బరు, సిబ్బరు సిబ్బరు, సిబ్బరునే, మరియు ఆమె మనకు కృతజ్ఞతగా ఉంది. మరియు కొన్నిసార్లు, నువ్వు కూడా నీ కుటుంబాన్ని ప్రేమిస్తున్నాను, ఆమె, నీ హృదయం మరియు తన డిజైన్ గురించి కూడా ఛేదించవచ్చు. నువ్వు చాలా ధైర్యవంతులైన యోధులు మరియు గొప్ప యోధులు అని నేను అనుకుంటున్నాను. సిబ్బరు సిబ్బరు, ఆమె హృదయం మరియు తన నాన్న ఇచ్చిన ప్రేమను సిబ్బరుస్తోంది. మరియు ఆమె చాలా తెలివైనది. ఆమె కూడా తన డిజైన్లను చాలా ప్రేమించింది, మరియు తన డిజైన్ల గురించి చాలా గర్వపడింది"
   },
   {

    "language": "Telugu",
    "item_id": "STE-035",

    "item_id": "STE-114",
    "beginning": "ఒకప్పుడు, జాక్ అనే ఒక పిల్లవాడు ఉండేవాడు. అతనికి ఊపడానికి ఇష్టమైన ఒక చేయి ఉండేది.",
    "continuation": "ప్రతిరోజూ అతను తన చేయి ఊపుతూ, తన చుట్టూ ఉన్న ప్రపంచాన్ని చూసేవాడు.\nఒకరోజు, జాక్ తన కర్రతో ఆడుకుంటున్నాడు. అతను చాలా సంతోషంగా ఉన్నాడు, అందుకే దాన్ని ఊపడం ఆపలేకపోయాడు. అతను తన స్నేహితులతో దానిని ఊపాడు, ఆనందంతో అరిచాడు.\nఅకస్మాత్తుగా, జాక్ దగ్గరలోని పొదల నుండి పెద్ద గొంతు వినిపించింది. అది ఒక పెద్ద, స్నేహపూర్వక ఎలుగుబంటి! జాక్ భయపడ్డాడు, కానీ అతను ఆ ఎలుగుబంటికి \"హలో!\" అన్నాడు.\nఎలుగుబంటి ఇలా అంది: \"హలో, జాక్. నేను ఎలుగుబంటిని. నేను నీకు ఒక చాలా ప్రత్యేకమైన పని చేయగలను. నా నీ కర్రతో ఏదైనా ఊపాలనుకుంటున్నావా?\"\nజాక్ ఆశ్చర్యపోయాడు, కానీ ఎలుగుబంటి దయగలదని, సహాయం చేయాలనుకుంటున్నాడా అని అడిగాడు. ఎలుగుబంటి ఇలా అంది:\n\"అవును, నేను నీకు సహాయం చేయగలను. మనం కలిసి ఒక ఊపే ఆట ఆడుకుందాం!\"\nఅలా, జాక్ మరియు ఎలుగుబంటి ఒకరికొకరు ఊపడం చాలా సరదాగా ఆడుకున్నారు. వారు చాలా నవ్వారు, నాట్యం చేశారు, జాక్కు చాలా సరదాగా అనిపించింది. ఆ రోజు నుండి, జాక్ మరియు ఎలుగుబంటి మంచి స్నేహితులు అయ్యారు."
   },
   {
    "order_in_batch": 8,
    "language": "Telugu",
    "item_id": "STE-007",
    "beginning": "ఒకప్పుడు, ఒక పెద్ద అడవిలో, బెన్ అనే చిన్న కుందేలు ఉండేది. బెన్ పేద కుందేలు, ఒక పెద్ద చెక్క ముక్క దగ్గర ఉన్న చిన్న గుంటలో నివసించేది.",
    "continuation": "అది తన స్నేహితులైన చీమలను సహాయం అడగడానికి ఇష్టపడేది.\nఒక రోజు, బెన్ గింజలు వెతుకుతుండగా, ఒక పెద్ద, భయంకరమైన వలలో (పులి) తనను తినడానికి ప్రయత్నిస్తున్నట్లు చూసింది. వలలో బెన్ను చూసి, \"నువ్వు ఎందుకు విచారంగా ఉన్నావు, చిన్న కుందేలు?\" అని అడిగింది. బెన్ ఆ భయంకరమైన వలలో గురించి, అది తన ఆహారాన్ని ఎలా పంచుకోవాలో అతనికి చెప్పింది. వలలో బెన్కు సహాయం చేయాలని అనుకుంది, కాబట్టి అది కర్రను గట్టిగా పట్టుకుని దాన్ని పక్కకు నెట్టింది.\nకానీ, వలలో ఆ కర్రను చాలా బలంగా లాగింది. అది బెన్ను చాలా వేగంగా లాగింది, అప్పుడు అది బయటకు రాలేకపోయింది. వలలో బెన్ను తినలేకపోయింది. అది చాలా విచారంగా ఉండి, పెద్ద, భయంకరమైన వలలో నుండి పారిపోయింది. ఆ రోజు నుండి, బెన్ను సహాయం చేయడానికి ప్రయత్నించే ముందు ఎప్పుడూ తన స్నేహితులను అడగడానికి రాలేదు."
   },
   {

    "language": "Telugu",
    "item_id": "STE-067",
    "beginning": "ఒక రోజు, ఒక నాన్న మరియు అతని చిన్న కూతురు పార్కుకు వెళ్లారు. వాళ్ళు ఊయల మీద, స్లైడ్ మీద ఆడటం అంటే చాలా ఇష్టం.",
    "continuation": "నాన్న, \"ఆడుకుందాం. మనం బంతిని పట్టుకుందాం, ఎవరు ఎక్కువ స్కోర్ సాధించగలరో చూద్దాం,\" అన్నారు.\nచిన్న కూతురు చాలా సంతోషించింది. ఆమె బంతిని చాలా బాగా పట్టుకుంది. నాన్న, \"చాలా బాగా చేశావు, చిన్న కూతురు!\" అన్నారు. వాళ్ళు చాలా సేపు ఆడుకున్నారు, సరదాగా గడిపారు.\nఅప్పుడు, నాన్న బంతిని పట్టుకోలేకపోయారు. అది ఒక చెట్టు కింద ఉంది. చిన్న కూతురు, \"నేను బంతిని పట్టుకుంటాను!\" అంది. నాన్న బంతిని పట్టుకున్నప్పుడు, అది ఒక అందమైన సీతాకోకచిలుకగా మారింది. నాన్న మరియు చిన్న కూతురు చాలా ఆశ్చర్యపోయారు. వాళ్ళు నవ్వారు, చప్పట్లు కొట్టారు. వాళ్ళకు పార్కులో ఒక అందమైన సీతాకోకచిలుక సీతాకోకచిలుక జరిగింది."

   {
    "order_in_batch": 10,
    "language": "Telugu",
    "item_id": "STE-077",
    "beginning": "ఒకానొకప్పుడు, పాండీ అనే చాలా ముద్దుగా ఉండే ఒక పాండా ఉండేది. పాండీ చాలా చెట్లు ఉన్న పెద్ద అడవిలో నివసించేది.",
    "continuation": "అది తన స్నేహితులతో, పక్షుల, ఉడుతలతో, మరియు ఉడుతలతో కలిసి పెద్ద అడవిలో నివసించేది.\nఒక రోజు, పాండీ ఒక గాయపడిన పక్షిని కనుగొన్నాడు మరియు దానిని తన స్నేహితులకు పిలిచాడు. \"నేను నీకు సహాయం చేయగలను,\" అని పాండీ అన్నాడు. \"నువ్వు నాకు సహాయం చేయగలవా?\" పక్షి పాండీని చూసి, \"అవును, నేను నీకు సహాయం చేయగలను. కానీ ముందు నువ్వు నన్ను పిలిచి సహాయం చేయాలి,\" అంది.\nపీపీ మరియు పక్షి కలిసి అడవిలో పనిచేశారు. వారు విశ్రాంతి తీసుకోవడానికి ఒక వెచ్చని స్థలాన్ని కనుగొన్నారు. పాండీ, \"నేను నీ సహాయం చేస్తాను,\" అంది. పాండీ సహాయంతో, పక్షి రెక్క ఆరోగ్యంగా మెరుగుపడటం ప్రారంభించింది. కలిసి, వారు పక్షికి సహాయం చేయడానికి ఒక పెద్ద మరియు మెత్తని హృదయాన్ని తయారు చేశారు.\nపాండీ, \"ధన్యవాదాలు, పక్షి! నువ్వు చాలా దయగలవాడివి,\" అన్నాడు. ఆ రోజు నుండి, పాండీ మరియు పక్షి మంచి స్నేహితులు అయ్యారు. వారు ప్రతిరోజూ కలిసి ఆడుకున్నారు మరియు ఒకరికొకరు సహాయం చేసుకున్నారు. మరియు వారు సంతోషంగా ఆనందంగా జీవించారు."
   },
   {
    "order_in_batch": 11,
    "language": "Telugu",
    "item_id": "STE-061",

    "continuation": "ఆ బోర్డుపై ఒక పిల్లి బొమ్మ ఉంది. మాక్స్ ఆ పిల్లిని కలవాలనుకున్నాడు. అతను తన స్నేహితురాలు, లిల్లీ అనే పిల్లి దగ్గరకు పరిగెత్తాడు.\nమాక్స్ అన్నాడు, \"లిల్లీ, నాకు ఒక బోర్డు దొరికింది! మనం ఆ పిల్లిని కలవడానికి వెళ్దాం!\" లిల్లీ ఒప్పుకుంది, వాళ్ళు ఆ పిల్లిని వెతకడానికి వెళ్లారు. వాళ్ళు చెట్టు కింద, పొద వెనుక, మరియు గడ్డిలో వెతికారు. ఆ పిల్లి అక్కడ లేదు.\nవాళ్ళు నడుస్తున్నప్పుడు, వాళ్ళు ఒక పిల్లిని కలిశారు. ఆ పిల్లి అంది, \"హాయ్, నేను టామ్, పిల్లిని. నువ్వు నా స్నేహితురాలివి కావాలనుకుంటున్నావా?\" మాక్స్ మరియు లిల్లీ, \"అవును, మేము నీ స్నేహితురాలిగా ఉండాలనుకుంటున్నాము!\" అని అన్నారు. వాళ్ళు అందరూ కలిసి ఆడుకున్నారు మరియు సరదాగా గడిపారు."

    "language": "Telugu",
    "item_id": "STE-051",
    "beginning": "జాన్ చాలా ఉత్సాహంగా ఉన్నాడు! తన వీధిని వెళ్లి అన్వేషించడానికి ఉత్సాహంగా కాళ్లు కొట్టుకుంటూ తిరిగాడు.",
    "continuation": "అతని అమ్మ అతనికి నవ్వి, అంది, \"జాన్, నువ్వు అన్వేషించే ముందు నువ్వు చూడాలి.\" జాన్ ఉత్సాహపడ్డాడు మరియు వెంటనే తన తల్లిదండ్రులను అడిగాడు, \"నేను ఎక్కడికి వెళ్లాలి?\"\nఅతని తల్లిదండ్రులు నవ్వి, \"బయట చాలా సరదాగా ఉంటుంది!\"\nజాన్ చాలా ఉత్సాహంగా ఉన్నాడు, అందుకే అతని తల్లిదండ్రులు దూరంగా నుండి అతన్ని అనుసరించారు. వారు బయటకు వచ్చినప్పుడు, జాన్ తల్లిదండ్రులు అతన్ని ఒక పార్కుకు తీసుకెళ్లారు. అతను చాలా ఉత్సాహంగా ఉన్నాడు, అతను తన తల్లిదండ్రులకు ఫోన్ చేశాడు.\nఆ పార్కు జాన్ గురించి, అతను తన తల్లిదండ్రులకు ఫోన్ చేసి, అతను ఏమి చేస్తున్నాడో అడిగాడు. అతని తల్లిదండ్రులు అతనికి ఒక బటన్ నొక్కి, \"ఒక విషయం చెప్పు!\" అన్నారు.\nజాన్ నవ్వి, \"నా నాన్న, నేను ఒక రోజు నిన్ను పార్క్కు తీసుకెళ్లవచ్చా?\" అన్నాడు. అతని నాన్న, \"తప్పకుండా! నువ్వు అక్కడ కొత్త ప్రదేశాన్ని చూస్తావు!\" అని సమాధానం ఇచ్చాడు. జాన్ నవ్వి, \"నువ్వు ఇంకా సరదా బొమ్మలు ఇస్తే, నా నాన్న అనుమతించగలడు!\" అన్నాడు."

    "beginning": "ఒకప్పుడు, బారి అనే ఒక ఎలుగుబంటి ఉండేది. ఒక రోజు, బారి నడవడానికి వెళ్లాలని నిర్ణయించుకున్నాడు, కానీ అతను బయటకు అడుగు పెట్టగానే, అతను ఇంకా ముందుకు వెళ్లలేకపోయాడు.",
    "continuation": "అతను చాలా నిరాశపడి ఏడవడం మొదలుపెట్టాడు.\nఅప్పుడే, బాబీ అనే స్నేహపూర్వక పక్షి ఎగిరి వచ్చి బారి ఏడుస్తున్నట్లు చూసింది. బాబీ, \"బారి, నువ్వెందుకు ఏడుస్తున్నావు?\" అని అడిగాడు.\nబారి, \"నేను చాలా దూరం వెళ్లిపోయాను, నాకు చాలా అలసటగా ఉంది,\" అన్నాడు.\nబారీ, బాబీ చాలా సేపు మాట్లాడుకున్నారు. బాబీ, \"బారి, నువ్వెందుకు అంత అలసిపోయావు?\" అని అడిగాడు.\nబారి, \"నేను చాలా కాలంగా పరిగెత్తుతూ, మిగతా జంతువులతో ఆడుకుంటున్నాను,\" అన్నాడు.\nబారికి మళ్లీ సంతోషంగా అనిపించి, బాబీతో, \"నేను ఈ రోజును ఎప్పటికీ మర్చిపోను,\" అన్నాడు.\nబారి, బాబీ వీడ్కోలు చెప్పి, బారి తన ఇంటికి తిరిగి వెళ్ళాడు."

    "continuation": "అతను ఎక్కడికి వెళ్లినా ఆ కారును తనతో తీసుకువెళ్లేవాడు. ఒక రోజు, టిమ్ తన బొమ్మ కారును తీసుకుని పార్కుకు వెళ్ళాడు.\nపార్కులో, టిమ్ ఒక పెద్ద కుక్కను చూశాడు. ఆ కుక్క పెద్దగా మొరిగింది, టిమ్కి భయపడింది. టిమ్ తన బొమ్మ కారును గట్టిగా పట్టుకుని, \"హాయ్, కుక్కా! నాతో ఆడుకోవాలనుకుంటున్నావా?\" అన్నాడు. కుక్క టిమ్ని చూసి, తన బొమ్మ కారును తిరిగి ఇవ్వడానికి ఇష్టపడలేదు. కుక్క కోపంగా మారింది, టిమ్ నుండి తన బొమ్మ కారును తీసుకోవడానికి ప్రయత్నించింది.\nటిమ్ బొమ్మను వదిలేశాడు, కుక్క దాన్ని వెంబడించింది. టిమ్ తన బొమ్మ కారును వదిలేసి, \"అయ్యో! నా బొమ్మ కారు పోయింది!\" అన్నాడు. కుక్క ఆగిపోయింది, టిమ్ బొమ్మ కారును తీసుకుంది. టిమ్ చాలా బాధపడ్డాడు, మరియు కుక్క మళ్ళీ తన బొమ్మను వదిలిపెట్టదని ఆశించాడు. ఆ రోజు నుండి, టిమ్ మళ్లీ తన బొమ్మ కారును ఎప్పుడూ తనతో పెట్టుకోలేదు."

    "continuation": "ఆమె ఎక్కడికి వెళ్లినా దాన్ని తనతో తీసుకువెళ్ళేది. ఒక రోజు, ఆమె తన అమ్మతో కలిసి పార్కుకు వెళ్లి తన రాగి పైసాను తీసుకువెళ్లింది.\nపార్కులో, మియా అనే ఒక అబ్బాయిని కలిసింది. టిమ్ అనే అబ్బాయి. టిమ్ మియా రాగి పైసాను చూసి, \"వావ్! అది చాలా మంచి పైసా! నేను చూడవచ్చా?\" అన్నాడు. మియా, \"అవును, కానీ జాగ్రత్తగా ఉండు. నా అమ్మ చెప్పింది, మనం పార్కులో ఉన్న వాళ్ళతో పంచుకోవాలని.\" అంది.\nటిమ్ ఆ రాగి పైసాను చూసి అది చాలా అందంగా ఉందని అనుకున్నాడు. అతను దాన్ని తన జేబులో పెట్టుకున్నాడు. అకస్మాత్తుగా, ఒక పెద్ద గాలి వచ్చింది మరియు టిమ్ చేతి నుండి రాగి పైసాను ఊదింది. ఆ పైసా కింద పడి, పగిలిపోయింది. టిమ్ బాధపడి, \"సారీ, మియా. నాకు నా నాణెం కూడా కావాలి.\" అన్నాడు.\nటిమ్ పోగొట్టుకున్న నాణేలను పోగొట్టుకున్నందుకు మియాకు బాధగా అనిపించింది. ఆమె, \"సారీ, టిమ్. నేను దాన్ని పోగొట్టుకున్నాను.\" అంది. మియా మరియు టిమ్ కలిసి ఆ రోజు మొత్తం నాణేలతో ఆడుకున్నారు. వారు మంచి స్నేహితులు అయ్యారు మరియు పార్కులో సరదాగా గడిపారు."
   },
   {

    "language": "Telugu",
    "item_id": "STE-149",
    "beginning": "ఒకప్పుడు, ఒక ప్రసిద్ధ డాక్టర్ ఉండేవాడు. అతను ఎవరినైనా నయం చేయగలిగేవాడు.",
    "continuation": "ఒక రోజు, ఒక చిన్న అమ్మాయి డాక్టర్ దగ్గరకు వచ్చింది. ఆమె డాక్టర్ను అడిగింది, \"మీకు సహాయం కావాలా?\"\nడాక్టర్, \"అవును, దయచేసి! నా దగ్గర ఆహారం, నీళ్లు ఉన్నాయి,\" అన్నాడు.\nడాక్టర్ చిన్న అమ్మాయికి ఆహారం ఇవ్వడానికి ప్రయత్నించాడు, కానీ అది చాలా పెద్దది. అతను చాలా చిన్నవాడు. చిన్న అమ్మాయి తన అమ్మని అడిగింది, \"నేను ఆహారం కోసం ఏదో ప్రత్యేకమైనది చేయవచ్చా?\" తన అమ్మ, \"నువ్వు నీ స్నేహితుల కోసం ఆహారం ఆహారం ఆర్డర్ చేయవచ్చు, కానీ నువ్వు జాగ్రత్తగా ఉండాలి,\" అంది.\nచిన్న అమ్మాయి తన అమ్మతో కలిసి ఇంటికి వెళ్లింది. వారు ఆమె స్నేహితుల కోసం ఆహారం ఆర్డర్ చేశారు. చిన్న అమ్మాయి చాలా సంతోషించింది. ఆమె పని పూర్తయినప్పుడు, వారు తన పార్టీకి వెళ్లారు.\nఆమె తన స్నేహితులతో ఆహారం ఆర్డర్ చేసిన తర్వాత, చిన్న అమ్మాయి తన స్నేహితులకు తిని నవ్వింది. చిన్న అమ్మాయి చాలా సంతోషంగా ఉండి, సహాయం చేసినందుకు తన అమ్మకు ధన్యవాదాలు చెప్పింది. ఆ రోజు నుండి, వారు అందరూ సంతోషంగా జీవించారు."
   },

    "continuation": "ఒక రోజు, అతను చంద్రుడిని చూడడానికి తన ఇంటి నుండి పరిగెత్తాడు. అది చాలా అందంగా ఉంది, టిమ్కి తల తిరిగింది.\nటిమ్ చంద్రుడిని తాకాలని అనుకున్నాడు, కానీ అతను భయపడ్డాడు. అతను లేచి బయటకు వెళ్ళాడు. చంద్రుడు అతని కళ్ళు కదలడం మొదలుపెట్టాడు! టిమ్ భయపడ్డాడు, కానీ ధైర్యంగా ఉండాలని అతనికి తెలుసు.\nటిమ్ తన మంచం దగ్గరకు పరిగెత్తి, కళ్ళు తెరిచాడు. అతను కళ్ళు తెరిచి, చంద్రుడిని తాకాడు. చంద్రుడు టిమ్ని చూసి నవ్వాడు. టిమ్ నవ్వి, ఇంటికి వెళ్ళాడు. అతను సురక్షితంగా, సంతోషంగా ఉన్నాడు."

   {

    "language": "Telugu",
    "item_id": "STE-020",

    "continuation": "కాబట్టి, అతను దూకి చెట్టుపైకి ఎక్కాడు. చాలీకి అది సరదాగా అనిపించింది.\nచెట్టుపై, చాలీ అనే పక్షిని కలిశాడు. టామీ అన్నాడు, \"హాయ్, నేను టామీని. నువ్వేం చేస్తున్నావు?\" చాలీ అన్నాడు, \"నేను ఒక పెద్ద పక్షిని చూశాను. దాని రెక్కలపై చాలా రంగులు ఉన్నాయి.\" టామీ కూడా ఆ పక్షిపై కూర్చోవాలని అనుకున్నాడు, కానీ చాలీ వద్దని చెప్పాడు.\nవారు మాట్లాడుకుంటుండగా, ఏదో ఊహించని సంఘటన జరిగింది. ఒక పెద్ద గాలి వచ్చింది మరియు చాలీని చెట్టు నుండి కింద పడేసింది. టామీ చాలీని సహాయం చేయడానికి కిందకి ఎగిరి వచ్చాడు. అతను చాలీని కౌగిలించుకుని, \"పర్వాలేదు. నువ్వు సురక్షితంగా ఉన్నావు.\" ఆ తర్వాత, చాలీ మరియు టామీ మంచి స్నేహితులు అయ్యారు మరియు ప్రతిరోజూ కలిసి ఆడుకున్నారు."
   },
   {
    "order_in_batch": 9,
    "language": "Telugu",
    "item_id": "STE-037",
    "beginning": "ఒకానొకప్పుడు ఒక సాధారణ క్రికెట్ ఉండేది. అది వెచ్చని, సూర్యరశ్మి ఉన్న అడవిలో నివసించేది.",
    "continuation": "ప్రతిరోజూ అది తన చిన్న కాళ్లతో గెంతుతూ, దాని చుట్టూ ఉన్న అన్ని కీటకాలను, చెట్లను అనుసరిస్తూ ఉండేది.\nఒక రోజు, అది ఒక ఖాళీ స్థలానికి గెంతుతూ వెళ్తుండగా, ఏదో దాని నుండి మాయమైపోవడం చూసింది. అది రెండు శిఖరాలను గమనించింది, కానీ అది ఏమి జరుగుతుందో చూడలేకపోయింది.\nఅది త్వరగా తన రెక్కలను చాచి, \"ఇది ఏమిటి? ఇది మన మాయా శిఖరాలు,\" అని చెప్పింది. అది వాటిని చూసి, తన చిన్న కాళ్లతో కొట్టి, \"ఇది చాలా అందంగా ఉంది!\" అని చెప్పింది.\nఅప్పుడే, ఒక గొంతు వినిపించింది, \"ఆగు! నేను నీకు సహాయం చేయగలను. ఇక్కడ, నేను ఒక మాయా దేవతను! నువ్వు నాకు సహాయం చేయగలవా?\". క్రికెట్ చాలా ఉత్సాహపడింది, అది దేవతకు ధన్యవాదాలు చెప్పింది.\nదేవత, \"నీకు ఒక కోరిక కోరుకోవాలి. అప్పుడు, నువ్వు మళ్లీ ఎప్పుడూ ఎగరగలవు,\" అంది. క్రికెట్ మరియు దేవత మంచి స్నేహితులు అయ్యారు, మరియు ప్రతిరోజూ వారి మాయా శిఖరాన్ని అన్వేషించారు."

    "continuation": "వారు చాలా సంతోషంగా ఉండి, తమ నారింజ రంగు ఇంట్లో సరదాగా గడిపేవారు.\nఒక రోజు, టిమ్ మరియు కిట్టి తోటలో ఆడుకుంటున్నారు. టిమ్ సాలిని అడిగాడు, \"మనం ఏం ఆడుకుందాం?\" సాలి నవ్వి, \"నాకు ఒక పెద్ద చెట్టు ఉంది, దానితో మనం ఒక ఆట ఆడుకుందాం!\" అంది. అలా, వారు దాగుడుమూతలు ఆడారు. సాలి వెతకడం, టిమ్ దాక్కోవడానికి ఒక పొదలో దాక్కుంది.\nవారు ఆడుకుంటుండగా, సూ అనే చిన్న అమ్మాయి వారి దగ్గరకు నడిచింది. ఆమె ఒంటరిగా ఆడుకుంటున్నది చూసి, టిమ్ ఆమెను భయపెడుతున్నట్లు చూసింది. సూ అంది, \"టిమ్, నీకు ఏం కావాలి?\" టిమ్ అన్నాడు, \"నాకు ఒక పెద్ద చెట్టు కనిపిస్తోంది. దాన్ని పట్టుకోవడానికి నువ్వు నాకు సహాయం చేయగలవా?\" సాలి నవ్వి, \"అవును, సూ! మనం కలిసి ప్రయత్నిద్దాం.\"\nఅలా, సాలి టిమ్ మరియు సాలిని ఆ పెద్ద చెట్టు కింద దాగి ఉన్న ఇంటికి దారి చూపించింది. వారు అక్కడికి చేరుకున్నప్పుడు, వారు చాలా సంతోషంగా, ఉత్సాహంగా ఉన్నారు. వారు ఆ రోజు మొత్తం కలిసి ఆడుకున్నారు, మరియు లూసీ టిమ్ కోసం ఒక రుచికరమైన కేక్ చేసింది. వారు ఆడుకుంటూ, నవ్వుతూ సరదాగా గడిపారు. ఆ రోజు చివర్లో, సాలి ఇంటికి వెళ్లవలసిన సమయం వచ్చిందని తెలుసుకుంది. సాలి టిమ్కి పెద్ద చెట్టు వెనుక దాచిన రహస్య చెట్టు గురించి చెప్పింది."
   },

   {

    "beginning": "ఒకప్పుడు, ఒక ఒంటరి చిన్న అమ్మాయి ఉండేది. ఆమె చాలా విచారంగా ఉండేది, చాలా చాలా విచారంగా, ప్రతి రోజు ఆమె ఏడుసేది.",
    "continuation": "ఒక రోజు, ఆమె అమ్మ తన పడకగదికి వెళ్లి, ఒక పాత, చిరిగిన కుర్చీని చూసింది. చిన్న అమ్మాయి దాన్ని సరిచేయాలని అనుకుంది, కాబట్టి ఆమె దాన్ని తన అమ్మకి చూపించింది.\nఆమె అమ్మ ఆ కుర్చీని చూసి, \"అది చాలా పాత కుర్చీ, నాకు చాలా బాధగా ఉంది,\" అంది. చిన్న అమ్మాయి చాలా బాధపడి, ఏడవడం మొదలుపెట్టింది.\nఆమె అమ్మ ఆమెను అడిగింది, \"నీకు ఎందుకు అంత బాధగా ఉంది?\"\nచిన్న అమ్మాయి ఇలా సమాధానం చెప్పింది, \"నేను ఒంటరిని, చాలా ఒంటరిగా ఉన్నాను. నేను కొత్త కుర్చీ కోసం వెతుకుతున్నాను.\"\nఆమె అమ్మ నవ్వి, \"నువ్వు చాలా చిన్నదానివి, కానీ నీకు కావాల్సినది దొరుకుతుంది,\" అంది.\nచిన్న అమ్మాయి చాలా సంతోషించింది, మళ్లీ ఎప్పుడూ ఒంటరితనం ఉండదని ఆమెకు తెలిసింది. ఆమె తన పాత కుర్చీలో కూర్చుని, ప్రతిరోజూ బాగుపడటం, కొత్త విషయాలు నేర్చుకోవడం మొదలుపెట్టింది.\nఈ కథలోని నీతి ఏమిటంటే, బాధపడటం కంటే కలిసి పనిచేయడం ఎల్లప్పుడూ మంచిది."

    "continuation": "ఒక రోజు, ఆడుకుంటూ, వాళ్ళు ఒక పెద్ద, ఎర్రటి బంతిని కనుగొన్నారు. లిల్లీ మరియు ఆమె స్నేహితులు ఆ బంతితో ఆడుకోవాలని అనుకున్నారు.\nలిల్లీ తన బంతిని తీసుకుని, \"బంతిని కొట్టి, దాన్ని వేగంగా రోల్ చేద్దాం!\" అంది. వాళ్ళు బంతిని చాలా బలంగా తోసేశారు, అది రెండు చిన్న ముక్కలైంది. లిల్లీ బాధపడింది, ఏం చేయాలో తెలియలేదు. తన స్నేహితురాలు, ఉడుత, బంతిని పాడే శబ్దం విని, \"చింతించకు, నేను నీకు సహాయం చేస్తాను,\" అంది.\nఉడుత, లిల్లీ ఆ బొమ్మను చూసి, దానిని బంతి దగ్గరకు తీసుకువచ్చింది. ఆమె ఆ బొమ్మను తీసుకుని, \"ఇప్పుడు బంతి పాడడానికి సమయం వచ్చింది, కానీ దాన్ని విసిరి ఆడుకుందాం,\" అంది. వాళ్ళు ఆడుకోవడం కొనసాగించారు, కానీ బంతి పోయింది. లిల్లీ, ఉడుత చాలా బాధపడ్డారు, కానీ వాళ్ళు వదిలేయలేదు.\nవాళ్ళు మళ్ళీ ఆ బంతితో ఆడుకున్నారు, అది మళ్ళీ ఆడగలిగింది అని తెలుసుకుని. లిల్లీకి, ఉడుతకి మళ్ళీ సంతోషం కలిగింది, వాళ్ళు ఆడుకునేటప్పుడు మరింత జాగ్రత్తగా ఉండాలని వాగ్దానం చేసుకున్నారు. వాళ్ళు అందరూ సంతోషంగా జీవించారు."

    "continuation": "అది చాలా విచారంగా ఉండేది.\nఒక రోజు, ఒక దయగల అమ్మాయి ఆ కారును చూసింది. ఆమె కారు దగ్గరకు నడిచి వెళ్లి, \"హలో, చిన్న కారు! నువ్వు ఎందుకు అంత విచారంగా ఉన్నావు?\" అంది. ఆ కారు ఆమెకు చెప్పింది, \"నేను పేదవాడిని, ఒంటరిని. నేను నీలాగా, రేపటిలో ఉండాలని కోరుకుంటున్నాను.\"\nదయగల అమ్మాయి ఆ కారుకు సహాయం చేయాలని అనుకుంది. ఆమె ఒక ప్రణాళిక వేసుకుంది. ఆమె తన ఇంటికి వెళ్లి, ఒక బొమ్మ కారు కొనుక్కుంది. ఆ అమ్మాయి ఆ బొమ్మ కారును తన ఇంటికి తీసుకువచ్చి, దానికి కొంచెం ప్రేమను, శ్రద్ధను ఇచ్చింది.\nప్రతిరోజూ, అమ్మాయి ఆ బొమ్మ కారును చూసుకుంది. ఆమె దానికి ఆహారం, నీరు, మరియు చాలా ప్రేమ ఇచ్చింది. నెమ్మదిగా, ఆ బొమ్మ కారు మెరుగ్గా అనిపించడం మొదలుపెట్టింది. త్వరలోనే, అది ఆ పేద కారు అంత పేదది కాదు. అది సంతోషంగా ఉంది, అది అమ్మాయికి కృతజ్ఞతలు చెప్పింది.\nఈ కథలోని నీతి ఏమిటంటే, మనం ఇతరులకు సహాయం చేసినప్పుడు, మనకు కూడా సంతోషం వస్తుంది. మనం ఎంత పేదవాళ్లమైనా, ఇతరులకు సహాయం చేయడం ద్వారా కొనసాగిస్తే, మనం సంతోషంగా ఉండి, మన పట్టణాన్ని మంచి ప్రదేశంగా మార్చవచ్చు."

    "continuation": "ఒక రోజు, సూ తన కుండతో ఆడుకోవాలని అనుకుంది, కానీ అది ఆమెకు చాలా ఎత్తుగా ఉంది. ఆమె తన అమ్మని అడిగింది, \"నేను కుండతో ఆడవచ్చా?\"\nఅమ్మ చెప్పింది, \"అవును, కానీ జాగ్రత్తగా ఉండు, చాలా ఎత్తుకు దూకకు.\"\nసూ కుండపైకి దూకింది, అందులో దూకింది. ఆమె తన అందమైన కుండతో ఆడుకోవడం చాలా సరదాగా ఉంది. కానీ అప్పుడు, ఆమె ఒక తెలివితక్కువ పిల్లిని చూసింది. ఆ పిల్లి దూకి, కుండ నుండి దూకింది. పిల్లి దూకి, కుండ నుండి దూకింది!\nసూ చాలా ఆశ్చర్యపోయింది. ఆమె అంది, \"వావ్, పిల్లి చాలా సరదాగా ఉంది! నేను కూడా బంతితో ఆడవచ్చా?\" పిల్లి సంతోషంగా మ్యావ్ చేసి, \"అవును, నువ్వు కలిసి ఆడుకోవచ్చు, సూ. మనం కలిసి ఆడుకుందాం, సరదాగా గడుపుదాం.\"\nఆ రోజు నుండి, సూ మరియు పిల్లి మంచి స్నేహితులు అయ్యారు. వారు ఆ పెద్ద కుండలో కలిసి ఆడుకున్నారు, మరియు సూ తన అందమైన కుండను మళ్లీ ఎప్పుడూ విసిరితే, ఆమె దానిని ఇంకా ఎత్తుగా ఎత్తుగా ఎత్తగలిగింది."

    "item_id": "STE-097",
    "beginning": "లిల్లీ, బెన్ క్రేయాన్స్ తో ఆడుకుంటున్నారు. వాళ్లకు రంగులు వేసి చాలా వస్తువులు గీయడం అంటే ఇష్టం.",
    "continuation": "లిల్లీ ఒక పెద్ద ఇంద్రధనుస్సును గీయాలని అనుకుంది. బెన్ ఒక పొడవైన గీతను గీసి, దానిని తన పక్కన పెట్టాడు. వాళ్ళు చాలా సంతోషంగా ఉన్నారు.\nకానీ అప్పుడు, బెన్ ఒక కోపంగా ఉన్న గోధుమ రంగు కుక్కను చూశాడు. ఆ కుక్క పెద్దదిగా, గోధుమ రంగులో ఉంది, పదునైన పళ్ళు ఉన్నాయి. బెన్కు ఆ కుక్క అంటే ఇష్టం లేదు. అతను లిల్లీ మీద అరిచాడు, \"నా కుక్కను చూడు! అది కోపంగా ఉంది! అది నన్ను కోపంగా పెడుతోంది!\"\nలిల్లీ భయపడింది. ఆమెకు ఆ కుక్క అంటే భయం. ఆమె బెన్ దగ్గరికి పరిగెత్తి, అతని ముఖాన్ని నాలుకతో రుద్దింది. \"వెళ్లిపో, చెడ్డ కుక్క! నేను నిన్ను బాధపెట్టాలనుకోవడం లేదు!\" అని అరిచింది.\nకానీ బెన్ వినలేదు. అతను లిల్లీ చేతుల నుండి కుక్కను గీసుకుని, ఆమెను గట్టిగా కౌగిలించుకున్నాడు. అతను అన్నాడు, \"ఆగు, ఆగు, ఆగు! నువ్వు నన్ను బాధపెట్టు! నువ్వు చెడ్డ కుక్కవి!\"\nలిల్లీకి బాధగా అనిపించింది. ఆమె అంది, \"అది మంచిది కాదు, బెన్. నువ్వు కోపంగా ఉన్నావు. నువ్వు నా స్నేహితుడివి కాదు. నువ్వు నా స్నేహితుడివి కాదు. నువ్వు నన్ను కోపంగా మారుస్తావు!\"\nఆమె ఒక్క క్షణం ఆలోచించింది. ఆమె బెన్పట్ల దయ చూపింది. ఆమె అంది, \"నేను క్షమించు. నేను నీ స్నేహితుడిని కావాలనుకుంటున్నాను. మనం కలిసి ఇంద్రధనుస్సు గీయవచ్చు. నీకు ఇంద్రధనుస్సు అంటే ఇష్టం అని నాకు సంతోషంగా ఉంది.\"\nబెన్ నవ్వాడు. అతను అన్నాడు, \"అది మంచి ఆలోచన, లిల్లీ. నువ్వు కూడా నన్ను క్షమించావు. మనం కలిసి ఇంద్రధనుస్సు గీయవచ్చు. నేను నీకు ఇంద్రధనుస్సు గీయడంలో సహాయం చేయగలను. మనం స్నేహితులు కావచ్చు కదా?\"\nలిల్లీ అంది, \"అవును, మనం స్నేహితులు కావచ్చు. పద, ఇంద్రధనుస్సు గీద్దాం.\" వాళ్ళు చేతులు పట్టుకుని, రంగుల గీతలను గీశారు. వాళ్ళు సంతోషంగా ఉన్నారు."
   },
   {
    "order_in_batch": 8,
    "language": "Telugu",
    "item_id": "STE-123",
    "beginning": "ఒకప్పుడు, ఒక అమ్మాయి, ఒక చిన్న పాప ఉండేది. ఆ చిన్న పాప చాలా తెలివైనది.",
    "continuation": "ఆమెకు చాలా విషయాలు తెలుసు, కానీ ఆమెకు ఒక స్నేహితురాలు, ఒక తెలివితక్కువ పిల్లి కూడా ఉండేది. ఆ పిల్లి చాలా మంచిది, అమ్మాయితో ఆడుకోవడం అంటే చాలా ఇష్టం.\nఒక రోజు, అమ్మాయి, \"నేను నీ స్నేహితుడిని, అప్పుడు నేను ఆడుకుంటున్నప్పుడు నీకు ఆహ్వానం పంపాలనుకుంటున్నాను,\" అంది. పిల్లి, \"అవును, నువ్వు నాకు సహాయం చేయగలవు!\" అంది. అలా, అమ్మాయి, పిల్లి ఆ పిల్లితో కలిసి ఆడుకున్నారు, చాలా సరదాగా గడిపారు.\nకొంత సమయం తర్వాత, అమ్మాయి, పిల్లి అలసిపోయారు. వారు విశ్రాంతి తీసుకోవడానికి ఒక చెట్టు కింద కూర్చున్నారు. పిల్లి, \"నేను నీ స్నేహితురాలిగా ఉండాలనుకుంటున్నాను, కానీ నువ్వు నన్ను వదిలేయ్!\" అంది. అమ్మాయి, పిల్లి అంగీకరించాయి. పిల్లి ఎగిరిపోయింది, అమ్మాయి, పిల్లి సంతోషంగా ఉన్నాయి. ఆ రోజు నుండి, అమ్మాయి, పిల్లి ఎప్పుడూ కలిసి ఆడుకుని నవ్వాయి."
   },
   {
    "order_in_batch": 9,
    "language": "Telugu",
    "item_id": "STE-128",
    "beginning": "అన్నా, బెన్ స్నేహితులు. వాళ్ళకి పార్కులో ఆడటం అంటే ఇష్టం.",
    "continuation": "ఒక రోజు, వాళ్ళు ఒక పెద్ద స్లైడ్ చూశారు. అన్నా, \"స్లైడ్ మీద స్లైడ్ అవ్వడానికి వెళ్దాం!\" అంది. బెన్, \"వద్దు, మనం వెళ్లాలి. మనం ముందు వెళ్లాలి.\" అన్నాడు. అన్నా తల ఊపింది, కానీ బెన్ ఆమె మాట వినలేదు. అతను స్లైడ్కు పరిగెత్తి, మెట్లు ఎక్కాడు. అతను స్లైడ్ కిందకి జారి, నవ్వాడు.\nకానీ అతను కిందకి వచ్చినప్పుడు, అతని జుట్టులో ఏదో చికాకు కలిగింది. అతను తనను తాను చూసుకున్నప్పుడు, తన తలపై ఒక చిన్న గుర్తు కనిపించింది. అది ఆకుపచ్చ రంగులో, మెత్తగా ఉంది. అన్నాకు అది నచ్చలేదు. ఆమె, \"ఇది నొప్పిగా ఉంది! ఇది నొప్పిగా ఉంది!\" అంది. బెన్, \"దానిని ద్వేషించకు! ఇది కేవలం ఒక గుర్తు. ఇది నిన్ను బాగా చేయిస్తుంది.\" అని అన్నాడు. అతను అన్నాను గట్టిగా పట్టుకున్నాడు, \"నేను నిన్ను ద్వేషించను. నేను నిన్ను ద్వేషించను.\" అన్నాడు.\nఅన్నా సంతోషంగా లేదు. బెన్ తన స్నేహితుడు అని ఆమెకు నచ్చలేదు. ఆమె, \"అది మంచిది కాదు. అది మంచిది కాదు. నువ్వు నా స్నేహితుడివి కాదు.\" అంది. బెన్ సిగ్గుపడ్డాడు. అతను, \"నన్ను క్షమించు. నేను తప్పు చేశాను. నేను తప్పు చేశాను. నువ్వు నా స్నేహితుడివి.\" అన్నాడు. అతను, \"నువ్వు కూడా నీ స్నేహితుడివి. మనం వేరే దానితో ఆడుకుందాం. బహుశా అప్పుడు మనం ద్వేషించము.\" అన్నాడు. అన్నా, \"సరే. మనం కలిసి ద్వేషించకండి. మనం ఇంకోసారి స్లైడ్ ఆడుకోవచ్చు.\" అంది. బెన్, \"సరే. మనం ఇంకా స్నేహితులుగా ఉండవచ్చా?\" అని అడిగాడు. అన్నా, \"అవును, మనం ఇంకా కలిసి ఆడవచ్చు. కానీ ఇంక స్లైడ్లు లేవు. మనం వేరే దానితో ఆడవచ్చు.\" అంది. బెన్, \"అవును, మనం ఆడాలనుకుంటున్నాం. కానీ నీ మాట వింటాను. మనం తిరిగి వెళ్దాం.\" వాళ్ళు కౌగిలించుకున్నారు, వాళ్ళు మళ్ళీ స్లైడ్కి వెళ్లారు. వాళ్ళు స్లైడ్ మీద స్లైడ్ చేయడం సరదాగా గడిపారు. వాళ్ళు సంతోషంగా ఉన్నారు."

   {

    "language": "Telugu",
    "item_id": "STE-134",
    "beginning": "ఒకప్పుడు, లిల్లీ అనే చురుకైన చిన్న అమ్మాయి ఉండేది. ఆమె తన స్నేహితులతో ఆడుకోవడం, నవ్వడం అంటే చాలా ఇష్టం.",
    "continuation": "ఒక రోజు, ఆమె అమ్మ వంటగదిలో ఏదో రుచికరమైనది తయారు చేస్తున్నది చూసింది. ఆమె అంది, \"లిల్లీ, నేను తయారు చేస్తున్నప్పుడు నువ్వు తినాలి.\"\nలిల్లీకి బాధగా అనిపించింది, కానీ ఆమె వేచి ఉండాలని తెలుసు. ఆమె తన బొమ్మలతో ఆడుకుంది, తన గదిని శుభ్రం చేసింది. ఆమె అమ్మ వచ్చినప్పుడు, ఆమె ఆమెకు ఒక పెద్ద ఆశ్చర్యాన్ని ఇచ్చింది. అది ఒక కొత్త బొమ్మ కారు! లిల్లీ చాలా సంతోషించింది, ఆమె ఆనందంతో గెంతులేసింది.\nలిల్లీ తన కొత్త బొమ్మ కారుతో రోజంతా ఆడింది. కానీ అప్పుడు, ఏదో ఊహించనిది జరిగింది. కారు కదలడం మొదలుపెట్టింది! అది మరింత వేగంగా, వేగంగా వెళ్ళింది. లిల్లీ చాలా ఆశ్చర్యపోయింది, ఏమి చేయాలో తెలియలేదు. ఆమె కారును అనుసరించింది, అది ఆమెను తన గది అంతా నడిపింది. ఆమె అమ్మ లోపలికి వచ్చి కారును చూసింది. ఆమె నవ్వి, \"లిల్లీ, నువ్వు నీ కారును కనుగొన్నావు! మనం కలిసి ఒక ప్రత్యేకమైన పని పూర్తి చేద్దాం.\""

    "continuation": "లిల్లీ చేతిలో ఒక కర్ర ఉంది, బెన్ చేతిలో ఒక పువ్వు ఉంది. వాళ్ళు తమ రహస్య సందేశాలను స్పైలుగా చెప్పి, \"మాకు నువ్వెవరో, లిల్లీ? మేము నీ స్నేహితులు కావాలనుకుంటున్నాము!\" అని చెప్పేవారు.\nఅప్పుడు బెన్ టేబుల్పై ఉన్న పెద్ద పుస్తకం చూశాడు. అది ఒక నిఘంటువు. అతను దాన్ని తెరిచి లోపల చాలా పదాలు, బొమ్మలు చూశాడు. అతను లిల్లీతో, \"ఇది ఒక నిఘంటువు. ఇది చాలా పాతది, అరుదైనది. అందులో చాలా పదాలు, బొమ్మలు ఉన్నాయి. నువ్వు ప్రయత్నించాలనుకుంటున్నావా?\" అన్నాడు.\nలిల్లీ తల ఊపింది. ఆమె ఆ పుస్తకం చదవాలనుకుంది. కానీ బెన్ చెప్పిన మాటలు ఆమెకు నచ్చలేదు. అతను, \"వద్దు, నేను దాన్ని చదవాలనుకుంటున్నాను. ఇది నా పుస్తకం. నువ్వు దాన్ని తీసుకోలేవు. ఇది నాది. నువ్వు వేరే పిల్లవాడివి,\" అన్నాడు.\nలిల్లీ బాధపడింది. ఆమె, \"కానీ నేను దాన్ని చదవాలనుకుంటున్నాను. అది చాలా అందంగా, సరదాగా ఉంది. దయచేసి, బెన్, నాకు చదవడం అనుమతించు. నేను దాన్ని చదవాలనుకుంటున్నాను,\" అంది.\nబెన్ ఒక్క క్షణం ఆలోచించాడు. అతను, \"సరే, లిల్లీ, నువ్వు దాన్ని చదవవచ్చు. కానీ నువ్వు నాకు కొన్ని రుచికరమైన స్నాక్స్ కూడా ఇవ్వాలి. అప్పుడు మనం పంచుకోవచ్చు, కలిసి ఆడుకోవచ్చు,\" అన్నాడు.\nలిల్లీ నవ్వింది. ఆమె, \"ధన్యవాదాలు, బెన్. నువ్వు చాలా మంచివాడివి. నేను నీకు కొన్ని రుచికరమైన స్నాక్స్ ఇస్తాను. పద, వెళ్దాం!\"\nవాళ్ళు తమ బొమ్మలను సర్దుకుని వంటగదికి పరుగు తీశారు. వాళ్ళు తమ అమ్మలకు ఏమి చేశారో చెప్పారు, వాళ్ళకి రుచికరమైన స్నాక్స్ ఇచ్చారు. వాళ్ళ అమ్మలు వాళ్ళను గర్వపడ్డారు. వాళ్ళు, \"వావ్, ఎంత మంచి కథ. నువ్వు అద్భుతమైన స్పైరర్శకుడివి, లిల్లీ, బెన్. నువ్వు చాలా తెలివైన, దయగల స్పైయువి, బెన్,\" అన్నారు."

    "continuation": "ఒక రోజు, ఆమె తోటలో ఒక పెద్ద కోకో గింజను కనుగొంది. అది చాలా రుచిగా కనిపించింది కాబట్టి ఆమె చాలా సంతోషపడింది.\nలిల్లీ ఆ కోకో గింజను నమలాలని అనుకుంది. కానీ, అది చెడ్డదని ఆమె అనుకుంది. కాబట్టి, ఆమె ఆ కోకోను తీసుకుని తన స్నేహితుడు టామ్కి చూపించింది. \"ఈ కోకోను నమలవద్దు!\" అంది. టామ్ కోకోను చూసి, \"అది చాలా మంచి వాసన వస్తుంది!\" అన్నాడు.\nలిల్లీకి, టామ్కి ఆ కోకో చాలా నచ్చింది. వాళ్ళు ఆ రోజు మొత్తం కలిసి ఆడుకున్నారు. వాళ్ళు కోకోను నమలారు, చాలా సరదాగా గడిపారు. వాళ్ళు సంతోషంగా ఎప్పటికీ నివసించారు."

    "continuation": "ఒక రోజు, పాండీకి టిమ్ అనే కొత్త స్నేహితుడు దొరికాడు.\nపాండీ, టిమ్ కలిసి ఆడుకున్నారు, సరదాగా గడిపారు. పాండీకి పెద్ద గొంతు వినిపించింది, \"హాయ్, నేను పాండీని! నేను ఒక ముద్దుగా ఉండే పాండాని. నువ్వు ఆడుకోవాలనుకుంటున్నావా?\" టిమ్ నవ్వి, \"అవును, నేను ఆడుకోవాలనుకుంటున్నాను!\"\nపాండీ, టిమ్ రోజంతా ఆడుకున్నారు. వారు పరుగెత్తారు, గెంతులు వేశారు, కలిసి నవ్వారు. వారు చాలా సంతోషంగా ఉన్నారు. ఆ రోజు చివర్లో, వారు చాలా అలసిపోయారు కానీ చాలా సరదాగా గడిపారు. పాండీ, టిమ్ మంచి స్నేహితులు అయ్యారు మరియు ప్రతిరోజూ కలిసి ఆడుకున్నారు."

    "continuation": "ఆ పెట్టె చాలా సంతోషంగా ఉంది, ఎందుకంటే అది చాలా మంది పిల్లలతో ఆడుకోవడానికి ఇష్టపడింది.\nఒక మనిషి పార్కుకు వచ్చాడు. అతను ఆ చతురస్రాకార పెట్టెను చూసి చాలా ఆసక్తిగా ఉన్నాడు. అతను పెట్టెను తెరిచి లోపల ఉన్న ఆశ్చర్యాన్ని కనుగొన్నాడు. పెట్టెలో ఒక పెద్ద, రంగుల బంతి ఉంది.\nఆ మనిషి చాలా సంతోషించాడు మరియు ఆ రోజు మొత్తం ఆ బంతితో ఆడాడు. అతని స్నేహితులు కూడా ఆ బంతి సరదాగా ఉందని అనుకున్నారు. వాళ్ళందరూ కలిసి ఆ బంతితో ఆడుకున్నారు మరియు చాలా సంతోషంగా గడిపారు. ఆ చతురస్రాకార పెట్టె ఎప్పుడూ మంచి ఆశ్చర్యానికి దారితీసేది."

   {
    "order_in_batch": 5,
    "language": "Telugu",
    "item_id": "STE-068",
    "beginning": "ఒకప్పుడు, లిల్లీ అనే ఒక చిన్న అమ్మాయి అందమైన వస్తువులను సేకరించడానికి ఆసక్తిగా ఉండేది. ఆమె రాళ్లు, ఆకులు, పువ్వులను కనుగొనడానికి ఇష్టపడేది.",
    "continuation": "ఒక రోజు, ఆమె తన తోటలో ఒక పెద్ద, మెరిసే రాయిని కనుగొంది. ఆమె చాలా సంతోషించింది మరియు దానిని తన స్నేహితులకు చూపించాలనుకుంది.\nలిల్లీ తన స్నేహితుడు టామ్ను పిలిచి, \"నా పెద్ద, మెరిసే రాయిని చూడు! నేను దానిని అందరికీ చూపిస్తాను\" అంది. టామ్ ఆసక్తిగా, \"ఏమిటది?\" అని అడిగాడు. లిల్లీ, \"ఈ రాయి చాలా అందంగా ఉంది. నేను దానిని నా స్నేహితులకు చూపిస్తాను\" అంది.\nమరుసటి రోజు, లిల్లీ మరియు టామ్ లిల్లీ తోటలోని పెద్ద రాయి దగ్గరకు వెళ్లారు. వారు కలిసి ఆ రాయిని చూశారు. అది ఎంత అందంగా ఉందో చూసి వారు చాలా సంతోషించారు. టామ్, \"వావ్, అది చాలా అందంగా ఉంది! మనం ఇంకా ఎక్కువ రాయిలను సేకరించి మన స్నేహితులతో పంచుకుందాం\" అన్నాడు.\nలిల్లీ మరియు టామ్ మరిన్ని రాయిలను కనుగొని వాటిని వారి స్నేహితులకు తీసుకువెళ్లారు. అందరూ రాయిలను ఇష్టపడ్డారు మరియు వారందరూ కలిసి ఆడుకున్నారు. వారు చాలా సంతోషంగా ఉండి, చాలా సరదాగా గడిపారు."

   {
    "order_in_batch": 6,
    "language": "Telugu",
    "item_id": "STE-022",
    "beginning": "లిల్లీ, టామ్ అనే ఇద్దరు జంట పిల్లలు తోటలో ఆడుకోవడానికి ఇష్టపడేవారు. వారికి చాలా ఆకులు, కొమ్మలు ఉన్న పెద్ద చెట్టు ఉండేది.",
    "continuation": "ఒక రోజు, వారు ఒక చెట్టు కింద కొత్త చెట్టును కనుగొన్నారు. అది పొడవుగా, వంపుగా ఉంది, దానిపై గీతలు ఉన్నాయి. లిల్లీ, టామ్ అది సరదాగా ఉందని అనుకున్నారు.\nవారు ఆ చెట్టు దగ్గర కూర్చుని, తమ చేతులు, కాళ్ళను చుట్టూ కదిలించారు. వారు నడుస్తున్నప్పుడు పక్షులు పాడటం, గడ్డి చేయడం విన్నారు. వారు చాలా సరదాగా గడిపారు, అప్పుడు ఒక స్వరం వినిపించింది. అది వారి అమ్మ.\n\"హేయ్, మీ ఇద్దరూ, నేను ఇక్కడ కొత్త చెట్టును తెచ్చాను. ఇది సరదాగా ఉంది. మీరు చెట్లను, పువ్వులను చూస్తున్నారా?\" అమ్మ అంది.\n\"అవును, అమ్మా, మేము ఇక్కడే ఉన్నారు. మేము మీ స్నేహితులు కావాలనుకుంటున్నాము. మేము ఇక్కడ ఆడుకుంటున్నాము, మీరు ఇక్కడ ఏం చేస్తున్నారు?\" లిల్లీ, టామ్ అన్నారు.\n\"మేము కూడా స్నేహితులు కావాలనుకుంటున్నాము. మేము చెట్టును ఇష్టపడతాము. మీరు మాకు దయగా, దయగా ఉన్నారు. మీరు నా స్నేహితులు కావాలనుకుంటున్నారా?\" అమ్మ అంది.\n\"అవును, అమ్మా, మేము ఇష్టపడతాము. మేము మా స్నేహితులను ఇష్టపడతాము. మేము వారిని సంతోషపరిచాము. మేము వాళ్ళను చాలా ప్రేమించాము. మేము ఒక అందమైన గ్రామంలో నివసించేాము, మేము సంతోషంగా ఉన్నాము,\" లిల్లీ, టామ్ అన్నారు.\n\"అవును, మేము మా స్నేహితులను. మేము ప్రతిరోజు చెట్టుపై మరియు పక్షులతో కలిసి ఆడుకుంటున్నాము. మీరు మాకు మీ స్నేహితులు, మీరు చాలా దయగలవారు,\" అమ్మ అంది.\n\"మీరు మా స్నేహితులను కలిగి ఉన్నందుకు సంతోషంగా ఉన్నాము, లిల్లీ. మేము మీకు వారి స్నేహితులు, మరియు గ్రామంలో ఉంటాను. మేము నా స్నేహితులు. మరియు మేము మిమ్మల్ని చాలా ప్రేమించాము,\" టామ్ అన్నాడు.\nవారికి మరిన్ని స్నేహితులు, కుటుంబాలు ఇంకా ఎక్కువ స్నేహితులు కావాలని వారు కోరుకున్నారు. వారు కేవలం వారితో మాట్లాడాలని కోరుకున్నారు. వారు తమ తల్లిదండ్రులను సంతోషపెట్టాలని కోరుకున్నారు. వారు ఒకరినొకరు మిస్ అవ్వాలని కోరుకున్నారు. వారు ఎల్లప్పుడూ దయగా, స్వార్థపరులుగా ఉండకూడదని కోరుకున్నారు. వారి హృదయంలో ఒకరి నుండి ఒకరు రాయాలని కోరుకున్నారు. వారు వారికి మరిన్ని స్నేహితులను కూడా కోరుకున్నారు."

    "continuation": "ఆమె చాలా బాగా చేసింది మరియు సంతోషంగా ఉంది.\nకానీ అప్పుడు ఆమెకు పెద్ద శబ్దం వినిపించింది. ఆమె చూసింది, ఒక పెద్ద కుక్క పరిగెడుతూ, గర్జిస్తూ ఉంది. లిల్లీ భయపడింది మరియు కోపంగా ఉంది. ఆమె తన కార్డును కింద పడేసి ఏడవడం మొదలుపెట్టింది.\nఆమె అమ్మ ఏడుపు విని పరిగెత్తుకు వచ్చింది. ఆమె లిల్లీని కౌగిలించుకుని, \"నువ్వు బాగానే ఉన్నావా, బంగారం? ఎందుకు భయపడుతున్నావు?\" అంది.\nలిల్లీ, \"నా కార్డు! నేను నా అమ్మ కోసం ఒక కార్డు చేయాలనుకుంటున్నాను, కానీ నేను చేయలేను,\" అంది.\nఆమె అమ్మ నవ్వి, \"చింతించకు, లిల్లీ. నేను నీకు సహాయం చేస్తాను. నాకు ఒక ఆలోచన ఉంది. నువ్వు మళ్లీ కార్డు చేయాలనుకుంటున్నావా?\" అంది.\nలిల్లీ తల ఊపింది మరియు నవ్వింది. ఆమె అంది, \"సరే, అమ్మా. నువ్వు నాకు సహాయం చేయగలవా? నేను కార్డు చేయాలనుకుంటున్నాను. నాకు ఇంకా పెద్ద పదాలు నేర్చుకోవాలని ఉంది.\"\nఆమె అమ్మ ఆమెను వంటగదికి తీసుకువెళ్లి కార్డును పైకెత్తింది. దానిపై \"నేను నిన్ను ప్రేమిస్తున్నాను లిల్లీ. నువ్వు ధైర్యవంతురాలివి. నువ్వు నీ బొమ్మలతో బాగా ఆడుతావు. ఇప్పుడు, నీ కార్డును చదవడం, రాయడం మరియు నవ్వడం ఎలా ఉంటుందో చూడు. అది చాలా బాగుంటుంది.\"\nలిల్లీ తన కార్డును చూసి చాలా గర్వపడింది. ఆమె అంది, \"ధన్యవాదాలు, అమ్మా. నువ్వు అద్భుతం. నీ కార్డు అద్భుతంగా ఉంది. నేను నిన్ను ప్రేమిస్తున్నాను, అమ్మా.\"\nఆమె అమ్మ ఆమెను కౌగిలించుకుని, \"నేను కూడా నిన్ను ప్రేమిస్తున్నాను, లిల్లీ. నువ్వు గొప్ప రోజువి. నువ్వు చాలా తెలివైన వాడివి. నువ్వు నన్ను సంతోషపరుస్తావు.\""
   },

    "continuation": "అతను కారులో ఉండి, తన అమ్మ కోసం వేచి ఉన్నాడు. ఆమె అతన్ని పార్కుకు తీసుకెళ్లమని అడిగింది. అది జాక్కి చాలా సరదాగా అనిపించింది.\nఅమ్మ జాక్కి ఒక ప్రత్యేకమైన బహుమతి ఇచ్చింది. అది ఏదో ప్రత్యేకమైన పని కోసం ఆమె అతనికి ఒక చిన్న సంచి ఇచ్చింది. జాక్ చాలా సంతోషించాడు. అతను సంచిని తీసుకుని కారులోంచి బయటకు పరిగెత్తాడు. అతను తన కొత్త సంచిని పట్టుకుని పార్కుకు వెళ్ళాడు.\nపార్కులో, జాక్ చాలా మంది ఇతర వ్యక్తులను మరియు వస్తువులను చూశాడు. అతనికి చాలా బాగుంది. అకస్మాత్తుగా, అతను మరొక పిల్లవాడిని చూశాడు. ఆ మరొక పిల్లవాడు చాలా విచారంగా కనిపించాడు. జాక్ ఆ పిల్లవాడికి సహాయం చేయాలనుకున్నాడు, కాబట్టి అతను సంచిని తీసుకుని అతనికి ఇచ్చాడు. ఆ మరొక పిల్లవాడు చాలా కృతజ్ఞతతో ఉన్నాడు. అతను జాక్కి ధన్యవాదాలు చెప్పి, తన కొత్త సంచితో పారిపోయాడు.\nఆ ఇద్దరు పిల్లలు చాలా సంతోషంగా ఉన్నారు. జాక్ అమ్మ దీన్ని చూసి నవ్వింది. ఆమె జాక్ చాలా ప్రత్యేకమైనదాన్ని ఇచ్చినందుకు సంతోషపడింది. జాక్ మరియు ఆ మరొక పిల్లవాడు స్నేహితులు అయ్యారు మరియు ప్రతిరోజూ పార్కులో ఆడుకున్నారు."

    "continuation": "ఒక రోజు, ఆ ఫ్యాన్కు కొత్త స్నేహితులు కావాలనిపించింది.\nఆ ఫ్యాన్కు కొత్త స్నేహితుడు కావాలని అనిపించింది. అందుకే, ఫ్యాన్ సూర్యుడిని అడిగింది, \"నేను నీతో ఆడుకోవచ్చా?\" సూర్యుడు, \"అవును, మనం కలిసి ఆడుకుందాం!\" అన్నాడు. ఫ్యాన్ చాలా సంతోషపడింది.\nవారు రోజంతా ఆడుకున్నారు, ఆడుకున్నారు. ఫ్యాన్కు కొత్త స్నేహితుడు దొరకడం సంతోషంగా అనిపించింది. ఆ ఫ్యాన్కు, సూర్యుడికి చాలా సరదాగా అనిపించింది. ఫ్యాన్కు కొత్త స్నేహితులు దొరకడం చాలా బాగుంది."

   {

    "language": "Telugu",
    "item_id": "STE-015",
    "beginning": "ఒకానొకప్పుడు, టిమ్ అనే చిన్న పిల్లాడు మరియు అతని నారింజ రంగు పిల్లి కిట్టి, వారి స్నేహితురాలు సాలిని చూడటానికి వెళ్లారు. సాలి చిన్న ఇంట్లో, పెరట్లో ఒక పెద్ద చెట్టుతో నివసించేది.",
    "continuation": "టిమ్ మరియు కిట్టి ఆడుకోవడానికి మరియు దాగుడుమూతలు ఆడటానికి ఇష్టపడ్డారు.\nఒక రోజు, వారు ఒక ఆట ఆడుకుంటున్నారు. సాలి టిమ్తో, \"నువ్వు దాగుడుమూతలో చాలా బాగా ఆడతావా?\" అని అడిగింది. టిమ్ ఒప్పుకుని, \"అవును, ఆడుకుందాం!\" అన్నాడు. వారు దాగుడుమూతలు ఆడటం మొదలుపెట్టారు, మరియు సాలి ముందుగా దాక్కుంది. టిమ్ తనను కనుగొనే వరకు వేచి చూశాడు.\nటిమ్ వేచి ఉన్నప్పుడు, అతను కిట్టిని మరియు పెద్ద చెట్టు కింద తొంగి చూశాడు. కిట్టి అదృశ్యమైంది! టిమ్ ఆందోళన చెందాడు మరియు \"కిట్టి ఎక్కడికి వెళ్లింది?\" అని అడిగాడు. కిట్టి, \"నేను నిన్ను కనుగొనలేకపోతున్నాను, టిమ్!\" అంది. వారు నవ్వుకున్నారు మరియు ఇంకా దాగుడుమూతలు ఆడుతూనే ఉన్నారు.\nఆ రోజు చివర్లో, వారు చెట్టు కింద మరియు చెట్టు వెనుక దాక్కున్న కిట్టిని కనుగొన్నారు. టిమ్ ఆమెను కనుగొని, ఆమెను కూడా కౌగిలించుకున్నాడు. వారు ఆటను ఆపి, కిట్టి ఇంటికి తిరిగి వెళ్లారు. వారు నవ్వుతూ, \"ఇది ఎప్పుడూ గొప్ప ఆట!\" అన్నారు."

   {
    "order_in_batch": 2,

    "item_id": "STE-079",

    "continuation": "అతను ఒక లోతైన గుంటను చూసి, అది తడిగా ఉందని గమనించాడు. అతను అనుకున్నాడు, \"బహుశా నేను అందులో కూర్చోవాలి.\"\nబాబీ ఆ లోతైన గుంటను దాటి వెళ్ళాడు, అక్కడ ఒక స్వరం విన్నాడు. అది ఆమె స్నేహితుడు, శామీ. శామీ అన్నాడు, \"నాకు నువ్వు ఎందుకు అలా ప్రవర్తిస్తున్నావు? నువ్వు ఆడాలనుకుంటున్నావా?\" బారి అన్నాడు, \"అవును, నేను ఆడాలనుకుంటున్నాను!\" శామీ నవ్వి, \"అవును, నేను నీకు ఆడుతున్నాను!\" అన్నాడు.\nఅలా బారి మరియు శామీ కలిసి ఆడుకున్నారు. వారు చెరువులో పరుగెత్తారు, దూకారు, చాలా సరదాగా గడిపారు. బారి తన స్నేహితుడి సహాయానికి చాలా గర్వపడ్డాడు. వారు ఇద్దరూ నవ్వి, కలిసి ఆడుకోవడం చాలా సరదాగా గడిపారు."

   {

    "item_id": "STE-045",

    "continuation": "ఒక రోజు, అతను తన కిటికీ బయట పెద్ద, భయంకరమైన మేఘాన్ని చూశాడు. టిమ్ కిటికీలోంచి చూశాడు, చంద్రుడిని చూశాడు. అది చాలా భయంకరంగా ఉంది!\nటిమ్ తన అమ్మ దగ్గరకు పరిగెత్తి, \"అమ్మా, చంద్రుడు చాలా భయంకరంగా ఉన్నాడు! అది ఏమిటి?\" అన్నాడు. అతని అమ్మ కిటికీలోంచి బయటకు చూసి, \"నాకు తెలియదు, టిమ్. అది ఎలా కనిపిస్తోంది?\" అంది. టిమ్ నవ్వి, \"అది చాలా బాగుంది! నేను దానిని తాకాలనుకుంటున్నాను!\" అన్నాడు.\nఅతని అమ్మ అతన్ని బయటకు తీసుకుని, వారు కలిసి ఆ భయంకరమైన మేఘాన్ని చూశారు. అది చాలా పెద్దదిగా, భయపెట్టేదిగా ఉంది. టిమ్, అతని అమ్మ నవ్వారు. వారు బయటకు వెళ్లి, చంద్రుడిని చూసి, \"వావ్! అది భయంకరంగా ఉంది!\" అన్నారు. వారు లోపలికి వెళ్లి ఆ భయంకరమైన మేఘాన్ని చూస్తూ, నవ్వుతూ ఇంటికి తిరిగి నడిచారు."

    "continuation": "ఒక రోజు, ఆమె తన అమ్మతో కలిసి మ్యూజియానికి వెళ్లింది. ఆ మ్యూజియం చాలా పెద్దదిగా ఉంది, చూడడానికి చాలా విషయాలు ఉన్నాయి.\nమ్యూజియంలో, మియా ఒక సరదా ముసలివాడిని కలిసింది. ఆ ముసలివాడు జోకులు చెప్పడం, వాళ్ళని నవ్వించడం అంటే చాలా ఇష్టం. ఆ ముసలివాడు జోకులు చెప్పి, ప్రజలను నవ్వించేవాడు. మియా ఆ ముసలివాడిని ఇష్టపడింది, వాళ్ళు స్నేహితులయ్యారు.\nమియా అమ్మ ఆమెను ఇంటికి వెళ్లమని పిలిచింది. మియా ఆ ముసలివాడిని గుర్తు చేసుకుని, త్వరలో మళ్ళీ మ్యూజియంకి వస్తానని చెప్పింది. ఆ ముసలివాడు సంతోషంగా, \"ధన్యవాదాలు, మియా!\" అన్నాడు. మియా తన కొత్త స్నేహితుడికి వీడ్కోలు చెప్పి, మ్యూజియం నుండి వెళ్లిపోయింది."

    "continuation": "ఒక రోజు, ఆమె తన గదిలో ఒక మురికి కుర్చీని కనుగొంది. ఆమె దాన్ని శుభ్రం చేయాలనుకుంది, కానీ ఎలా చేయాలో తెలియలేదు.\nలిల్లీకి సహాయం అవసరమైంది. ఆమె తన నాన్నని అడిగింది, \"ఈ కుర్చీని ఎలా శుభ్రం చేయాలో మీరు నాకు సహాయం చేయగలరా?\" ఆమె నాన్న, \"అవును, మనం కలిసి పని చేద్దాం\" అన్నారు. వారు ఆ కుర్చీని ఒక పెద్ద గుడ్డతో కప్పారు, మరియు లిల్లీ మళ్లీ గదిని అలంకరించడం మొదలుపెట్టింది.\nలిల్లీ పని పూర్తి చేసినప్పుడు, ఆమె అమ్మ గదిలోకి వచ్చింది. ఆమె ఆ మురికి కుర్చీని చూసి, \"వావ్! ఇది చాలా బాగుంది!\" అంది. లిల్లీ తన పని మీద చాలా గర్వపడింది. ఆమె తన అమ్మ, నాన్నకు చూపించింది, వారు ఆమెను చాలా గర్వపడ్డారు. ఆ రోజు నుండి, లిల్లీ తన గదిని శుభ్రంగా, చక్కగా ఉంచుకోవడం నేర్చుకుంది."
   },
   {
    "order_in_batch": 13,
    "language": "Telugu",
    "item_id": "STE-108",

    "continuation": "టిమ్ ఇష్టమైన రంగు సూర్యుడి బొమ్మతో అతని గదిలో ఉండేది. ప్రతిరోజూ, అతను దాన్ని గీసి, తన క్రేయాన్తో కొత్త బొమ్మలను గీసేవాడు.\nఒక రోజు, టిమ్ అమ్మ, \"టిమ్, నువ్వు నీ క్రేయాన్తో నీ క్రేయాన్తో చాలా జాగ్రత్తగా ఉండు,\" అంది. టిమ్ తన క్రేయాన్ను చూసి తన అమ్మకు చూపించాడు. అతని అమ్మ, \"అది చాలా బాగుంది, టిమ్! ఇప్పుడు మనం బొమ్మ గీయడానికి ఒక పెద్ద బొమ్మ గీయదాం,\" అంది.\nటిమ్ తన బొమ్మను పూర్తి చేశాడు, అది అతని ఇష్టమైన రంగు. అతను దాన్ని తన అమ్మకి చూపించాడు, ఆమె దాన్ని చాలా ఇష్టపడింది. వారు కలిసి బొమ్మ గీయడానికి వెళ్లారు, అది ఎప్పుడూ లేనంత అందమైన బొమ్మ. వారు పని పూర్తి చేసినప్పుడు, టిమ్ తన అమ్మకి, తన క్రేయాన్ ఇచ్చినందుకు చాలా సంతోషంగా భావించాడు."

   {

    "continuation": "ఆమె అంది, \"అమ్మా, మనం ఆలివ్లను కొనిపోవచ్చా? అవి చాలా రుచిగా కనిపిస్తున్నాయి!\"\nఆమె అమ్మ నవ్వి, \"అవును, సాలి, మనం ఆలివ్లను కొనుక్కోవచ్చు. కానీ నువ్వు నాతో ఒక ప్రత్యేకమైన పనిలో భాగం కావాలని వాగ్దానం చేయాలి.\" సాలి అంగీకరించింది, వాళ్ళు తమ ఇంటికి వెళ్లారు.\nఇంట్లో, సాలి మరియు ఆమె అమ్మ ఆలివ్ల జాడీని నింపి, వాటిని ఒక పెద్ద సంచిలో పెట్టారు. వాళ్ళు ఇంట్లో ఉన్న మంచి ఆలివ్ల జాడీని కూడా చూశారు. సాలి అడిగింది, \"అమ్మా, మనం ఆలివ్ల జాడీలో ఒకటి తీసుకోవచ్చా?\"\nఆమె అమ్మ జాడీని తెరిచి, \"అవును, సాలి, ఆలివ్ల జాడీని కొనుగోలు చేద్దాం. అది ఒక ప్రత్యేకమైన జాడీ అవుతుంది.\" వాళ్ళు ఆలివ్ల జాడీని కొన్నారు, సాలి మరియు ఆమె అమ్మ దానిని కలిసి ఆనందించారు.\nఆ రోజు నుండి, సాలి ఆలివ్ల జాడీని కొనేందుకు తాను ఇష్టపడేందున, ఆమె ఆ ఆలివ్లను ఎప్పుడూ గుర్తుంచుకునేది. ఆ ప్రత్యేకమైన జాడీ ఆమె ఆలివ్ల జాడీని చూసిన ప్రతిసారీ, సాలి చాలా సంతోషంగా ఉండేది."

    "continuation": "అతను చూశాడు, చూశాడు, కానీ ఉత్తమమైన చీజ్ను కనుగొనలేకపోయాడు. అతనికి బాధగా అనిపించింది.\nఅప్పుడు, టిమ్ ఒక పెద్ద పిల్లిని చూశాడు. పిల్లి, \"హాయ్, చిన్న ఎలుకా. నువ్వు దారి తప్పావా?\" అంది. టిమ్, \"అవును, నేను దారి తప్పాను. నన్ను ఇంటికి వెళ్ళడానికి దారి చూపించగలవా?\" అన్నాడు. పిల్లి నవ్వి, \"నేను నీకు దారి చూపించగలను, కానీ ముందుగా, నువ్వు నా పిల్లితో నాతో కలిసి చిక్కుముడిలోకి రావాలి.\" అంది.\nటిమ్ భయపడ్డాడు కానీ పిల్లితో కలిసి చిక్కుముడిలోకి వెళ్ళాడు. వారు నడుస్తున్నప్పుడు, పిల్లి టిమ్ని చూసి, \"నువ్వు ఎక్కడికి వెళ్తున్నావు?\" అని అడిగింది. టిమ్, \"నేను ఇంటికి దారి కనుగొనలేకపోతున్నాను,\" అన్నాడు. పిల్లి, \"చింతించకు, నేను నీకు దారి చూపించగలను.\" అంది. పిల్లి చిక్కుముడిలోకి వెళ్లి, \"నేను నీకు దారి చూపించగలను.\" అంది.\nకానీ అప్పుడు, ఏదో ఊహించనిది జరిగింది. పిల్లి ఒక పెద్ద చీజ్ ముక్కను కనుగొంది, \"నేను దీన్ని చేశాను!\" అంది. పిల్లి చీజ్ను కత్తిరించి, టిమ్ యొక్క స్నేహితుడైన పిల్లి దానిని చేసింది. టిమ్ చాలా సంతోషించాడు, మరియు తన కొత్త స్నేహితుడైన పిల్లితో చిక్కుముడిలో గడిపిన సరదా రోజును ఎప్పటికీ మర్చిపోలేదు."

    "item_id": "STE-050",
    "beginning": "ఒకానొకప్పుడు, ఏమీ అనే ఒక అమ్మాయి ఉండేది. ఏమీకి ఒక వీణ ఉండేది.",
    "continuation": "ఆమె దాన్ని వాయించడం, తన స్నేహితులతో ఆడుకోవడం అంటే చాలా ఇష్టం. ఒక రోజు, ఆమె పార్కులో సంగీతం చేయడానికి కొన్ని వీణలు తయారు చేసింది.\nఏమీ తన స్నేహితుడు టామ్ని కలిసింది. టామ్ అన్నాడు, \"వావ్! నాకు నీ వీణలు అంటే ఇష్టం! నేను నీ కోసం ఒకటి పట్టుకోనా?\" ఏమీ నవ్వి, \"అవును, నువ్వు పట్టుకోవచ్చు!\" అంది. టామ్ చాలా సంతోషించాడు. అతను వీణలను పట్టుకుని తన వీణతో ఆడాడు.\nఏమీ, టామ్ రోజంతా ఆడుకున్నారు. వాళ్ళు చాలా సరదాగా గడిపారు. ఇంటికి వెళ్లవలసిన సమయం వచ్చినప్పుడు, ఏమీ అంది, \"నా వీణలు దొరకడం లేదు.\" టామ్ అన్నాడు, \"నేను నీకు వెతకడంలో సహాయం చేస్తాను.\" వాళ్ళు అన్ని చోట్లా వెతికారు, కానీ వీణ దొరకలేదు.\nఅప్పుడు, వాళ్ళు ఒక పెద్ద చెట్టును చూశారు. ఆ చెట్టులో ఒక పక్షి ఉంది. ఆ పక్షి వీణను తీసుకుని ఎగిరిపోయింది. ఏమీ, టామ్ విచారంగా ఉన్నారు. వాళ్ళు ఆ పక్షిని కనుగొని వీణ తిరిగి ఇవ్వాలని నిర్ణయించుకున్నారు.\nవాళ్ళు ఆ పక్షిని కనుగొని, అది వీణను కనుగొని ఎగిరిపోయింది. ఏమీ, టామ్ మళ్ళీ సంతోషపడ్డారు. వాళ్ళు పార్కులో కలిసి ఆడుకున్నారు, చాలా సరదాగా గడిపారు."
   },
   {
    "order_in_batch": 4,
    "language": "Telugu",
    "item_id": "STE-094",
    "beginning": "ఒక రోజు, చాలీ అనే ఆసక్తిగల చిన్న కప్ప బయటకు నడవడానికి వెళ్ళాడు. అతను ఒక పెద్ద చెట్టును చూశాడు మరియు దానిపైకి ఎక్కాలని అనుకున్నాడు.",
    "continuation": "చాలీ ఎక్కడం మొదలుపెట్టాడు మరియు పైకి వెళ్ళాడు. అతను పైనుంచి చాలా విషయాలను చూశాడు.\nచాలీ కిందకి చూశాడు మరియు నేలపై ఒక మెత్తని ఆకుపచ్చ కీటకాన్ని చూశాడు. ఆ కీటకానికి ఆకలిగా ఉంది మరియు సహాయం కావాలి. చాలీ పైకి చూశాడు మరియు ఒక చిన్న కీటకాన్ని చూశాడు. \"హాయ్, కీటకా!\" అన్నాడు చాలీ. ఆ కీటకం అతన్ని చూసి, \"హాయ్, చాలీ! నేను ఒక నిద్రిస్తున్న పక్షిని. నువ్వు నన్ను మేల్కొలిపినందుకు ధన్యవాదాలు,\" అంది.\nచాలీ మేల్కొన్నప్పుడు, ఆ కీటకం పోయింది అని చూశాడు. చాలీ చాలా ఆశ్చర్యపోయాడు. అతను పైకి చూశాడు మరియు నేలపై ఒక చిన్న రాయిని చూశాడు. ఆ కీటకం ఆ రాయిని తాకింది మరియు ఒక అందమైన పాట పాడింది. చాలీ నవ్వాడు మరియు ఆ కీటకానికి ధన్యవాదాలు చెప్పాడు. వారు మంచి స్నేహితులు అయ్యారు మరియు ఆ రోజు మొత్తం కలిసి ఆడుకున్నారు."
   },

    "continuation": "ఒక రోజు, ఆమె అమ్మ ఆమెకు పెద్దగా కౌగిలించుకుంది. \"నువ్వు చాలా సంతోషంగా ఉన్నావు,\" అని అమ్మ అంది, \"నువ్వు చాలా మంచిదానివి. రేపు నీకు కారంగా ఉండే ఏదైనా ఉంది.\"\nలిల్లీ చాలా ఉత్సాహపడింది. ఆమె వెంటనే తన పళ్ళతో, కారంగా ఉండే కుకీలు తిని ఇంకొంచెం చూడటానికి వెళ్లింది. అప్పుడు ఆమె అమ్మ ఆమెకు ఏదో చూపించాలనుకుంది. ఆమె కొన్ని రుచులను తీసుకుని, \"ఇది మంచి రుచి చూద్దాం!\" అంది.\nలిల్లీ తన పళ్ళతో కొన్ని రుచులు తీసుకుని తన చేతులను గిన్నెలో ముంచింది. అంతా కరిగిపోయే వరకు ఆమె చాలా జాగ్రత్తగా, మెరుగ్గా అనిపించింది. అప్పుడు, ఆమె అమ్మ ఆమెను హత్తుకుంది.\n\"అది మంచి ఆలోచన, లిల్లీ,\" అంది. \"మరిన్ని ప్రత్యేకమైన ఆహారం చేసుకోవడానికి నువ్వు ఏదో ఒకటి తీసుకోవాలనుకుంటున్నావా?\"\nలిల్లీ కళ్ళు మెరిశాయి. ఆమె నవ్వి, \"అవును! నువ్వు చాలా ధనవంతురాలివి.\"\nఅలా, లిల్లీ మరియు ఆమె అమ్మ కలిసి మరిచిన పరుపును తిన్నారు. అది చాలా రుచిగా ఉంది. అది చాలా రుచిగా ఉంది! మరియు అది పూర్తయినప్పుడు, ఆమె అమ్మ తన కోసం ఒక ప్రత్యేకమైన భోజనం చేసింది. లిల్లీ చాలా సంతోషంగా ఉంది, ఎందుకంటే ఆమెకు ఒక ముఖ్యమైన ప్రత్యేకమైన పరుపు దొరికింది."

    "beginning": "ఒకప్పుడు, ఒక ఒంటరి చిన్న అమ్మాయి ఉండేది. ఆమె చాలా విచారంగా ఉండేది, చాలా చాలా విచారంగా, ప్రతి రోజు ఆమె ఏడుసేది.",
    "continuation": "ఒక రోజు, ఆమె తన గదిలో ఆడుకుంటుండగా, తలుపు తట్టే శబ్దం వినిపించింది. ఆమె తలుపు తెరిచింది, ఒక స్నేహపూర్వక ముఖాన్ని చూసింది. అది ఒక చిన్న కప్ప!\nచిన్న అమ్మాయి చాలా సంతోషించి, \"హలో! నువ్వెవరు?\" అంది.\nకప్ప ఇలా సమాధానం ఇచ్చింది, \"నేను ఒక మాయా కప్పని! నేను నీ కలలను నిజం చేయగలను. నీకు ఏమి కావాలి?\"\nచిన్న అమ్మాయి ఒక్క క్షణం ఆలోచించి, \"నేను నా కలలను నిజం చేయాలనుకుంటున్నాను\" అంది.\nకప్ప నవ్వి, \"సరే, నేను నీ కలలను నిజం చేయగలను. నువ్వు ఏమి కోరుకుంటున్నావు?\" అంది.\nచిన్న అమ్మాయి కొద్దిసేపు ఆలోచించి, \"నా కలలను నిజం చేసే ఒకరిని కావాలి\" అంది.\nకప్ప నవ్వి, \"నీ కలలను నిజం చేసే ఒకరిని నాకు తెలుసు. నిన్ను సంతోషపెట్టడానికి, నేను నిన్ను సంతోషపెట్టడానికి ఏదైనా అద్భుతమైన పని చేస్తాను\" అంది.\nచిన్న అమ్మాయి చాలా ఉత్సాహపడింది, ఆమె అతన్ని గట్టిగా కౌగిలించుకుంది. ఆ రోజు నుండి, ఆమె మళ్లీ ఒంటరిగా లేదు."

    "item_id": "STE-041",
    "beginning": "లిల్లీ, బెన్ క్రేయాన్స్ తో ఆడుకుంటున్నారు. వాళ్లకు రంగులు వేసి చాలా వస్తువులు గీయడం అంటే ఇష్టం.",
    "continuation": "లిల్లీ ఒక పెద్ద పువ్వును గీస్తుంది. ఆమె దాన్ని బెన్కి చూపించి, \"ఇది నీ పువ్వు. ఇది చాలా అందంగా ఉంది. నువ్వు దీన్ని ఎక్కడ దొర్లించావు?\" అని అంటుంది.\nబెన్ పువ్వు వైపు చూసి, \"ఇది నా పువ్వు. నేను దీనిని నాకు సొంతం చేసుకోవచ్చా?\" అని అడుగుతాడు.\nలిల్లీ ఒక్క క్షణం ఆలోచిస్తుంది. ఆమె తన క్రేయాన్స్ అంటే ఇష్టం, కానీ ఆమె బెన్ని బాధపెట్టకూడదని అనుకుంటుంది. ఆమె, \"లేదు, నువ్వు తీసుకో. ఇది నా పువ్వు. నేను దీన్ని తయారు చేశాను. నువ్వు నీ కాగితంపై గీయవచ్చు. నువ్వు వేరే ఏదైనా గీయవచ్చు,\" అంటుంది.\nబెన్ ఒక్క క్షణం ఆలోచిస్తాడు. అతనికి ఒక ఆలోచన వస్తుంది. అతను, \"నేను ఏం గీయాలి?\" అని అడుగుతాడు.\nలిల్లీ ఒక్క క్షణం ఆలోచిస్తుంది. ఆమె బెన్ని తన కాగితంపై గీయమని అర్థమవుతుంది. ఆమె, \"ఒక రాక్ పౌడర్ (సిగ్గర్) తో నేను ఒక పువ్వు గీయవచ్చా?\" అని అంటుంది.\nబెన్ ఒక్క క్షణం ఆలోచిస్తాడు. అతను, \"అవును, నువ్వు గీయవచ్చు. కానీ నేను నీ క్రేయాన్స్ వాడవచ్చా? అవి అందంగా లేవు, కాబట్టి నేను నా కాగితంపై గీయవచ్చా?\" అంటాడు.\nలిల్లీ తల ఊపుతుంది. ఆమె, \"అవును, నువ్వు నా కాగితంపై గీయవచ్చు. నేను నీ కాగితంపై రాస్తాను. నేను నీ రాక్ పౌడర్ వాడతాను. నువ్వు నా కాగితంపై ఒక పువ్వు గీయవచ్చు. నువ్వు నా క్రేయాన్స్ వాడవచ్చు,\" అంటుంది.\nబెన్ నవ్వుతాడు. అతను, \"ధన్యవాదాలు, లిల్లీ. నువ్వు మంచి చెల్లెలువి. నేను నీ కాగితంపై గీయవచ్చా?\" అంటాడు.\nలిల్లీ తల వణికిస్తుంది. ఆమె, \"అవును, నువ్వు గీయవచ్చు. కానీ నువ్వు నా కాగితంపై గీయకూడదు. నువ్వు నా క్రేయాన్స్ వాడాలి. ఇంకా నా కాగితం మీద గీయడానికి కాదు. నువ్వు నన్ను ఎందుకు గీస్తున్నావు?\" అంటుంది.\nబెన్, \"నేను నీ కాగితం మీద గీయాలనుకుంటున్నాను. కానీ నేను కాగితం మీద గీయాలి. నా కాగితం మీద\" అంటాడు.\nలిల్లీ, బెన్ కలిసి గీయడం ప్రారంభిస్తారు. వాళ్లకు కాగితం మీద గీయడం అంటే ఇష్టం. వాళ్లకు సరదాగా ఉంటుంది. వాళ్లు సంతోషంగా ఉంటారు."

    "item_id": "STE-003",
    "beginning": "అన్నా, బెన్ స్నేహితులు. వాళ్ళకి పార్కులో ఆడటం అంటే ఇష్టం.",
    "continuation": "ఒక రోజు, వాళ్ళు ఒక పెద్ద స్లైడ్ చూశారు. అది సరదాగా అనిపించింది.\n\"స్లైడ్కి వెళ్దాం!\" అన్నా అంది.\n\"సరే!\" బెన్ అన్నాడు.\nవాళ్ళు స్లైడ్ దగ్గరికి పరిగెత్తారు. వాళ్ళు మెట్లపైకి ఎక్కారు. స్లైడ్ చాలా ఎత్తుగా ఉంది. వాళ్ళు స్లైడ్ పైభాగంలో కూర్చున్నారు. వాళ్ళు వేగంగా కిందకు జారారు. వాళ్ళు నవ్వారు.\nవాళ్ళు కిందకి వెళ్లారు. వాళ్ళు సంతోషంగా ఉన్నారు. వాళ్ళు మళ్ళీ మళ్ళీ చేశారు. వాళ్ళకి సరదాగా అనిపించింది.\nకానీ అప్పుడు, వాళ్ళు ఒక స్వరాన్ని విన్నారు.\n\"హేయ్, పిల్లలూ, ఏం చేస్తున్నారు?\" ఆ స్వరం చెప్పింది. వాళ్ళు పైకి చూశారు. వాళ్ళు ఒక మనిషి ముఖాన్ని చూశారు. అతను ఒక టోపీ, కోటు వేసుకుని ఉన్నాడు. అతను కోపంగా ఉన్నాడు.\n\"అర్ర్, నువ్వెవరు?\" ఆ మనిషి అన్నాడు. అతను వాళ్ళ వైపు చూశాడు.\n\"మేము అన్నా, బెన్. మేము స్లైడ్కి వస్తున్నాము. మేము స్లైడ్లో జారాలనుకున్నాము. మీరు మాతో చేరాలనుకుంటున్నారా?\" అన్నా అంది.\n\"లేదు, ధన్యవాదాలు. నాకు స్లైడ్ అంటే ఇష్టం. అది సరదాగా ఉంటుంది. దయచేసి నన్ను తాకవద్దు,\" అన్నాడు ఆ మనిషి.\nఅన్నా, బెన్ భయపడ్డారు. వాళ్ళు ఆ మనిషిని చూశారు. వాళ్ళు అతని టోపీని, కోటును చూశారు. వాళ్ళు అతని గొంతును చూశారు.\n\"ఓహ్, లేదు! మేము క్షమించండి. మేము నిన్ను అడగలేదు. మేము స్లైడ్లో జారాలనుకున్నాము,\" అన్నాడు ఆ మనిషి.\nఆ మనిషి వాళ్ళ వైపు చూశాడు. అతను ఇంకా కోపంగా ఉన్నాడు. కానీ వాళ్ళకి అతని గొంతు అంటే ఇష్టం. అతను ఇక కోపంగా లేడు. అతను దయగలవాడు.\n\"పర్వాలేదు. మీరు ఆడవచ్చు. కానీ జాగ్రత్తగా ఉండండి. స్లైడ్ చాలా ఎత్తుగా ఉంది. మీరు సమతుల్యం చేసుకోవాలి,\" అన్నాడు ఆ మనిషి.\nఅతను వాళ్ళ చేతులు పట్టుకున్నాడు. అతను వాళ్ళని స్లైడ్ దగ్గరికి నడిపించాడు. అతను వాళ్ళని వదిలేశాడు. వాళ్ళు స్లైడ్లో జారారు. వాళ్ళు నవ్వారు. వాళ్ళు సరదాగా గడిపారు. వాళ్ళు సంతోషంగా ఉన్నారు."
   }

  "STEB08": [
   {
    "order_in_batch": 1,
    "language": "Telugu",
    "item_id": "STE-001",
    "beginning": "ఒకప్పుడు, పెద్ద మడమ ఉన్న ఒక మనిషి ఉండేవాడు. అతను చాలా ధనవంతుడు.",
    "continuation": "అతనికి చాలా టోపీలు ఉండేవి, అతనికి పెద్ద టోపీ ఉండేది. ఆ మనిషి చాలా మందికి, పెద్ద మడమ ఉన్న పిల్లలకి, మరియు తన బొమ్మలకు సహాయం చేయడం ఇష్టపడేవాడు. ఒక రోజు, అతను తన స్నేహితుడు సమ్ తో నడవడానికి వెళ్ళాడు.\nవారు నడుస్తున్నప్పుడు, వారు ఒక పెద్ద చెట్టును చూశారు. ఆ మనిషి ఆ చెట్టు ఎక్కాలని అనుకున్నాడు, కానీ అతను చాలా చిన్నవాడు. సమ్ అన్నాడు, \"మన టోపీలు వస్తాయి, కానీ నేను నీతో ఎక్కవచ్చా?\" దయగల మనిషి అన్నాడు, \"అవును, మనం కలిసి ఎక్కవచ్చు.\"\nవారు ఎక్కారు, ఎక్కారు, మరియు సమ్ టోపీలు పెట్టుకున్నాడు. అతను చాలా సంతోషించాడు. కానీ అప్పుడు, ఏదో ఊహించనిది జరిగింది. ఒక పెద్ద పక్షి కిందకి వచ్చి ఒక టోపీని తీసుకుంది. ఆ పక్షి టోపీని ఎగిరిపోయింది! ఆ మనిషి మరియు సమ్ చాలా ఆశ్చర్యపోయారు.\nఆ మనిషి మరియు సమ్ ఒకరినొకరు చూసుకున్నారు, వారి టోపీలు తిరిగి కావాలని కోరుకున్నారు. కాబట్టి, వారు మళ్ళీ ప్రయత్నించారు. ఈసారి, వారు టోపీని పట్టుకుని ఎగిరారు. పక్షి ఇంకా టోపీలు వేసుకుంది! ఆ మనిషి మరియు సమ్ సంతోషంగా ఉన్నారు, మరియు వారు తమ పెద్ద మడమలతో కలిసి నడవడానికి తిరిగి వెళ్లారు."
   },
   {
    "order_in_batch": 2,
    "language": "Telugu",
    "item_id": "STE-089",
    "beginning": "ఒక మంగళవారం, టిమ్ అనే చిన్న పిల్లాడు పార్కుకు వెళ్ళాడు. అతను ఊయల మీద ఆడాలనుకున్నాడు, కానీ అతని బూట్లు కట్టనివి అని చూశాడు.",
    "continuation": "అతను చుట్టూ చూశాడు మరియు తన స్నేహితురాలు సూనిని చూశాడు. సూనికి ఆడుకోవడానికి ఒక బొమ్మ ఉంది. టిమ్ సూనిని అడిగాడు, \"నువ్వు నాకు నీ బూటుతో ఆడుకోవడానికి సహాయం చేయగలవా?\"\nసూని అంది, \"అవును, నేను నీకు సహాయం చేయగలను. మనం కలిసి కట్టుకుందాం!\" వారు ఊయల దగ్గరికి పరిగెత్తి, బూటును కట్టారు. వారు కట్టిన తర్వాత, వారు నవ్వుతూ ఊయల మీద ఆడుకున్నారు.\nకానీ అప్పుడు, వారు ఆడుకుంటుండగా, వారు ఒక పెద్ద, కోపంగా ఉన్న కుక్కను చూశారు. ఆ కుక్క టిమ్, సూనిని వెంబడించింది, మరియు వారు పరుగెత్తవలసి వచ్చింది. వారు పరుగెత్తారు, పరుగెత్తారు, కానీ కుక్క వేగంగా ఉంది. కుక్క వారిని పట్టుకుని, వారిని బాధపెట్టింది. వారు బూటుతో ఆడకూడదని అనుకున్నారు. టిమ్ మరియు సూని ఇంటికి వెళ్లి, విచారంగా ఉన్నారు."
   },
   {
    "order_in_batch": 3,
    "language": "Telugu",
    "item_id": "STE-058",
    "beginning": "ఒకప్పుడు, ఒక పెద్ద అడవిలో, బెన్ అనే చిన్న కుందేలు ఉండేది. బెన్ పేద కుందేలు, ఒక పెద్ద చెక్క ముక్క దగ్గర ఉన్న చిన్న గుంటలో నివసించేది.",
    "continuation": "బెన్ ఆ చెక్క ముక్కపై గెంతుతూ, దూకుతూ ఆడుకోవడం అంటే చాలా ఇష్టం.\nఒక రోజు, బెన్ చెక్క ముక్క దగ్గర ఒక పెద్ద, మెరిసే వస్తువును కనుగొన్నాడు. అతను దానిని తన చిన్న నోటితో తీసుకుని, తన స్నేహితుడైన ఉడుతకు చూపించాడు. \"చూడు, ఉడుతా! నాకు ఒక పెద్ద, మెరిసే వస్తువు దొరికింది!\" అన్నాడు బెన్. ఉడుత ఆ మెరిసే వస్తువును చూసి, \"వావ్! మనం దానిని మన ఇంటికి తీసుకువెళ్లి దాన్ని సురక్షితంగా ఉంచుదాం\" అంది.\nఅందుకే, బెన్ మరియు ఉడుత వారి కొత్త మెరిసే వస్తువుతో వారి ఇళ్లకు తిరిగి వెళ్లారు. అది అడవిలో నివసించే ఒక చిన్న, హాయిగా ఉండే జంతువు జంతువు. వారు ఆ జంతువును తమ కొత్త ఇల్లుగా చేసుకున్నారు, మరియు వారు తమ కొత్త స్నేహితుడిని చాలా ప్రేమించారు. ఆ రోజు నుండి, బెన్ మరియు ఉడుత తమ కొత్త స్నేహితుడి కోసం చెక్క ముక్కల కోసం వెతకడానికి మరియు కలిసి ఆడుకోవడానికి అడవిలో వెళ్లారు."
   },
   {
    "order_in_batch": 4,
    "language": "Telugu",
    "item_id": "STE-138",
    "beginning": "జాన్ చాలా ఉత్సాహంగా ఉన్నాడు! తన వీధిని వెళ్లి అన్వేషించడానికి ఉత్సాహంగా కాళ్లు కొట్టుకుంటూ తిరిగాడు.",
    "continuation": "కానీ అక్కడికి వెళ్లగానే, అతను ఒక అద్భుతమైనదాన్ని చూశాడు. అది అతని అమ్మ, మరియు ఆమె అతనికి నవ్వింది.\nజాన్ తన అమ్మ వైపు చూసి, \"అమ్మా, నువ్వు ఎక్కడికి వెళ్తున్నావు?\" అన్నాడు.\nఆమె, \"నేను నీకు ఒక ఆశ్చర్యం ఇస్తాను, జాన్! కానీ ముందుగా, నువ్వు నీ బూట్లు వేసుకోవడం మర్చిపోకు.\" అంది.\nజాన్ నవ్వి, \"సరే, నేను మర్చిపోను!\" అన్నాడు.\nవారు తమ దారిలో వెళ్లారు, మరియు జాన్ త్వరలోనే తన ఇంటి దగ్గర ఉన్న వీధికి చేరుకున్నాడు. అక్కడ అతను ఒక పెద్ద ఆశ్చర్యానికి సిద్ధంగా ఉన్నాడు!\nజాన్ తన అమ్మను కౌగిలించుకున్నాడు, మరియు వారు కలిసి నడుస్తున్నప్పుడు తన బూట్లు వేసుకోవడం మర్చిపోలేదు. ఇప్పుడు అతను ఇంటికి వెళ్లి తన అమ్మకు బహుమతి ఇవ్వబోతున్నాడు!"

   {
    "order_in_batch": 5,
    "language": "Telugu",
    "item_id": "STE-095",
    "beginning": "లిల్లీ, బెన్ తమ బొమ్మలతో హాల్లో ఆడుకుంటున్నారు. వాళ్లకు స్పైలులా నటించడం, ఒకరికొకరు రహస్య సందేశాలు పంపడం అంటే చాలా ఇష్టం.",
    "continuation": "లిల్లీ దగ్గర చాలా బొమ్మలు ఉన్నాయి, బెన్కు ఒక టోపీ, ఒక మంచం, ఒక పుస్తకం ఉన్నాయి. వాళ్ళు మంచి స్నేహితులు, ఎప్పుడూ కలిసి సరదాగా గడిపేవారు.\nఒక రోజు, లిల్లీ సామ్ను తన బొమ్మ పెట్టెలో పెట్టి ఉంది. బెన్ తన బొమ్మ పెట్టెను తెరవడానికి ప్రయత్నిస్తున్నాడు, కానీ అది తాళం వేసి ఉంది. అతను దానిని తెరవడానికి ప్రయత్నించాడు, కానీ తాళం చెవి లేదు. అతను తన మంచం కింద చూశాడు, కానీ అతను పెట్టెను చూడలేదు.\n\"బెన్, నువ్వు తాళం చెవి ఎక్కడ?\" లిల్లీ తన పెట్టెను తెరిచి అడిగింది.\n\"లేదు, నేను తిరిగి వచ్చేస్తాను. అది మంచం కింద ఉంది,\" బెన్ చెప్పాడు. అతను తన టెడ్డీ బేర్ను హత్తుకుని, \"చింతించకు, లిల్లీ. నేను నీకు తిరిగి రానిస్తానని వాగ్దానం చేస్తున్నాను. నేను తాళాన్ని తెరిస్తాను,\" అన్నాడు.\nలిల్లీ బెన్ను చూస్తుంది, అతని బొమ్మ పెట్టె వైపు చూస్తుంది. బెన్ విచారంగా, ఒంటరిగా ఉన్నట్లు ఉన్నట్లు ఆమె చూస్తుంది. ఆమె బెన్తో గుసగుసలాడుతుంది, \"హాయ్, బెన్. నేను బెన్. నేను పాత తాళాన్ని పోగొట్టుకున్నాను. నీ బొమ్మ పెట్టె ఎక్కడ ఉందో నాకు తెలియదు. అది ఎక్కడ ఉందో నేను మర్చిపోయాను.\"\nబెన్ సారా వైపు చూస్తాడు, అతను బాధపడుతున్నాడు. అతను, \"నువ్వు ఎందుకు విచారంగా ఉన్నావు, లిల్లీ? నీ బొమ్మ పెట్టె ఎక్కడ ఉందో నాకు తెలియదు. నువ్వు నా బొమ్మను పోగొట్టుకున్నావని అనుకున్నాను. నన్ను క్షమించు, లిల్లీ. నేను దాన్ని నీ పెట్టెలో పోగొట్టుకున్నాను. నాకు తాళం బొమ్మ పెట్టె ఎక్కడ ఉందో తెలుసు,\" అన్నాడు.\nలిల్లీ బెన్ను కౌగిలించుకుని, \"నేను దాన్ని అల్మారంలో కనుగొన్నాను. బహుశా నేను దాన్ని కనుగొన్నాను. బహుశా అది నీ బొమ్మ పెట్టెలో ఉండవచ్చు. బహుశా అది నీ పెట్టెలో ఉన్న రంధ్రం ద్వారా తిరిగి వస్తాడేమో. కానీ మనం దాన్ని దాచిపెడదాం. మనం పంచుకోవచ్చు, కలిసి ఆడుకుందాం,\" అంది.\nబెన్ తల ఊపుతాడు. \"అవును, నాకు కావాలి. కానీ మనం కలిసి ఆడుకోవాలి, తాళాన్ని దాచుకోవాలి. బహుశా మనం దానితో ఆడుకుంటాం. కానీ మనం దాన్ని తిరిగి పెట్టాలి. మన ఆట సమయాన్ని కోల్పోవచ్చు, మన బొమ్మలను పంచుకోవాలి. మనం అలా చేస్తే, ఎవరు కలిసి ఆడుకోవచ్చు, ఒకరి తర్వాత ఒకరు ఆడవచ్చు,\" అన్నాడు.\nలిల్లీ, బెన్ ఒకరినొకరు కౌగిలించుకుంటారు. వాళ్ళు కౌగిలించుకుని మళ్లీ ఆడటానికి వెళ్తారు. వాళ్ళు సంతోషంగా, సురక్షితంగా ఉంటారు. వాళ్ళు తమ బొమ్మలను పంచుకుంటారు మరియు మంచి స్నేహితులుగా ఉండరు."
   },

    "item_id": "STE-024",
    "beginning": "సారా, బెన్ అనే ఇద్దరు జంట పిల్లలు అటకలో ఆడుకోవడానికి ఇష్టపడేవారు. ఆ అటక చాలా పెద్ద స్థలం, అందులో చాలా పాత వస్తువులు ఉండేవి.",
    "continuation": "వాళ్లకు చాలా బొమ్మలతో కూడిన పెద్ద బొమ్మ పెట్టె ఉండేది. కొన్నిసార్లు వాళ్లు అటకలో కూర్చునేవారు, ఆటలు, బొమ్మలు, పదాలను మాత్రమే ఆడేవారు.\nఒక రోజు, సారా, బెన్ తమ బొమ్మలను సర్దాలని నిర్ణయించుకున్నారు. వాళ్లు తమ బొమ్మలను, పుస్తకాలను ఒక పెద్ద పెట్టెలో, ఒక పజిల్, ఒక బొమ్మల కోసం ఒక పజిల్, మరియు ఒక బెంచ్ కోసం ఒక పుస్తకం ఇచ్చారు. ఆ తర్వాత వాళ్ళు ఒక పెట్టెలో ఒక ప్రణాళిక వేశారు.\nసారా, బెన్ చాలా ఉత్సాహంగా ఉన్నారు. వాళ్లు తమ బొమ్మలను, పుస్తకాలు, పుస్తకాలు, పుస్తకాలను తీసుకున్నారు. వాళ్లు ప్రతిభావంతులైన పిల్లలు అనుకుంటారు. వాళ్లు ఒక తోబుట్టువులను, ఒక కర్రను, ఒక పెట్టెను, మరియు ఒక బొమ్మలన్నింటినీ ఉంచి, ఒక అటకను సర్దారు.\nవాళ్ళు తమ బొమ్మలను, తమ పుస్తకాలను, బొమ్మలను, బొమ్మలను, పుస్తకాలను సర్దారు. కొన్ని పుస్తకాలను వేరు చేసి వాటిని రెండు కుప్పలుగా చేశారు. వాళ్లు తమ గది, తమ పుస్తకాలను సర్దారు, వాటిని వేరు చేశారు. వాళ్లు వాటిని తమ కుప్పలుగా, పెట్టెలతో నింపి, తమ బొమ్మలను సర్దారు.\nవాళ్లు తమ బొమ్మలను, పుస్తకాలను, జంతువుల పుస్తకాలను, పుస్తకాలను వేరు చేశారు. వాళ్లు చాలా సరదాగా ఆడుకున్నారు, చాలా సంతోషంగా ఉన్నారు.\nకానీ అప్పుడు, సారాకు పెద్ద శబ్దం వినిపించింది. ఆమె కిటికీలోంచి బయటకు చూసింది, పైకప్పును చూసింది. అది మురికిగా, భయపెట్టేలా కనిపించింది. ఆమె తన బొమ్మలను, పుస్తకాలు, పుస్తకాలను కదిలించింది. ఆమె చాలా గందరగోళంగా, భయంగా అనిపించింది.\nబెన్, సారా గదిలోకి పరిగెత్తి దాక్కున్నారు. వాళ్ళు వాళ్ళ అమ్మను వెతికారు, కానీ వాళ్ళని కనుగొనలేకపోయింది. వాళ్ళు ఏడవడం, అరువడం, అరువడం మొదలుపెట్టారు. వారు చాలా భయపడ్డారు, కోపంగా ఉన్నారు.\nవాళ్ళ అమ్మ వాళ్ళని విన్నది, సహాయం చేయడానికి వచ్చింది. ఆమె వాళ్ళని భయపెడుతుండగా, ఆమె వాళ్ళని మంచం మీద నుండి పిలిచింది. ఆమె వాళ్ళను ఓదార్చాలనుకుంది.\nఆమె వాళ్ళ గదికి పరిగెత్తి, వాళ్ళను కౌగిలించుకుంది. ఆమె వాళ్ళను హత్తుకుని, వారిని శిక్షిస్తుందని చెప్పింది. ఆమె వాళ్ళ బొమ్మలను, పుస్తకాలను, బొమ్మలను సర్దివేసింది. సారా, బెన్, ఒకరినొకరు కౌగిలించుకుని తమ బొమ్మలను, పుస్తకాలను సర్దడం మొదలుపెట్టారు. వాళ్ళు చాలా విసుగు చెందారు, బాధపడ్డారు, భయపడ్డారు.\nకొంత సమయం తర్వాత, వాళ్ళ అమ్మ వాళ్ళని హత్తుకుని, తనను ప్రేమతో అందించింది. వాళ్ళు శిక్షించబడినట్లు, చెడ్డ వాటిని నిరోధించకూడదని చెప్పింది. కేవలం అటకలు, పుస్తకాలతో సమయం గడపాలని, సౌకర్యాన్ని, కూసరిని పంచుకోవాలని చెప్పింది. ఆమె బొమ్మలను, పుస్తకాలను సర్ది, చదవడం, కథలు, కథలు చెప్పింది. ఆమె, బెన్ తమ పాఠం నేర్చుకున్నారు. వాళ్లకు ఇక విసుగు లేదు."
   },
