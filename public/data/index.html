    "continuation": "అది తన స్నేహితులతో, పక్షులు, కీటకాలతో ఆడుకోవడం అంటే చాలా ఇష్టం. ఒక రోజు, పాండీకి ఒక పెద్ద ఎర్రటి బంతి కనిపించింది. అది దానితో ఆడుకోవాలని అనుకుంది, కానీ అది చాలా దూరంగా ఉంది.\nపాండీ తన స్నేహితుడైన పక్షిని, \"నేను ఆ పెద్ద ఎర్రటి బంతిని తీసుకురావడానికి నువ్వు నాకు సహాయం చేయగలవా?\" అని అడిగింది. పక్షి, \"అవును, నేను నీకు సహాయం చేయగలను. నేను ఎగిరి పైకి వెళ్లి నీకోసం బంతిని తీసుకురాగలను,\" అంది. పాండీ చాలా సంతోషించి, \"ధన్యవాదాలు, పక్షి!\" అంది.\nపక్షి పాండీని చాలా ఎత్తుకు ఎగరేసింది. పాండీ ఆ పెద్ద ఎర్రటి బంతిని చూసింది, కానీ అది ఇంకా చాలా దూరంలో ఉంది. అది తన స్నేహితులైన చీమలను సహాయం అడిగింది. చీమలు చాలా చిన్నవి, కానీ అవి చాలా తెలివైనవి. అవి చెట్టు ఎక్కి పెద్ద ఎర్రటి బంతిని తెచ్చాయి. పాండీ మరియు అతని స్నేహితులు ఆ రోజు మొత్తం ఆ బంతితో ఆడుకున్నారు. అవి చాలా సంతోషంగా ఉండి, చాలా సరదాగా గడిపాయి."

    "beginning": "ఒకప్పుడు, ఒక పెద్ద ఫ్యాన్ ఉండేది. వేడి రోజులకు అది చాలా బాగుండేది.",
    "continuation": "ఫ్యాన్కి టిమ్ అనే స్నేహితుడు ఉండేవాడు. టిమ్ ఒక చిన్న పిల్లాడు. ఫ్యాన్ పనిచేయడం లేదని అతను చూశాడు. ఫ్యాన్ తన కోసం సరిచేయాలని టిమ్కి తెలుసు.\nటిమ్ తన నాన్నను సహాయం అడిగాడు. తన నాన్న ఒక పనిముట్టును ఉపయోగించి ఫ్యాన్ను సరిచేశాడు. ఫ్యాన్ మళ్లీ పనిచేయడం మొదలుపెట్టింది. ఫ్యాన్ తనను తాను సరిచేయడం చూసి టిమ్ చాలా సంతోషించాడు. కానీ అప్పుడు, ఫ్యాన్ ఇంకా పనిచేయడం లేదని టిమ్ చూశాడు. ఫ్యాన్ లోపల ఒక రంధ్రం ఉంది.\nటిమ్కి ఒక ఆలోచన వచ్చింది. అతను ఫ్యాన్ను తీసుకుని దానిపై పనిచేశాడు. అతను ఫ్యాన్ను సరిచేస్తానని అనుకున్నాడు. కానీ ఫ్యాన్ను సరిచేయడానికి చాలా సమయం పట్టింది. అప్పుడు, ఏదో ఊహించనిది జరిగింది. ఫ్యాన్ కదలడం మొదలుపెట్టి, మళ్లీ పనిచేయడం మొదలుపెట్టింది! టిమ్ మరియు ఫ్యాన్ కలిసి పనిచేయడం చూసి చాలా సంతోషపడ్డారు."

   {
    "order_in_batch": 15,
    "language": "Telugu",
    "item_id": "STE-101",
    "beginning": "లిల్లీ, టామ్ అనే ఇద్దరు జంట పిల్లలు తోటలో ఆడుకోవడానికి ఇష్టపడేవారు. వారికి చాలా ఆకులు, కొమ్మలు ఉన్న పెద్ద చెట్టు ఉండేది.",
    "continuation": "వారు దానిపైకి ఎక్కి చెట్లపై ఉన్న పక్షులను చూడాలని అనుకున్నారు.\nఒక రోజు, వారు చెట్టులో ఒక బోర్డును చూశారు. దానిపై 'బ్యాడ్జ్' అని రాసి ఉంది. అది చాలా దూరం నుండి వచ్చింది. అది ఒక కుక్కపిల్ల! ఆ కుక్కపిల్ల చెట్టు దగ్గరకు పరిగెత్తి దానిపైకి దూకింది. అది టామ్, లిల్లీని చూసి తోక ఊపింది. అది తోక ఊపింది, మొరిగింది.\n\"చూడు, లిల్లీ, ఒక కుక్కపిల్ల!\" టామ్ అన్నాడు. అతను చెట్టు దగ్గరకు పరిగెత్తి దానిని నిమురుకోవడానికి ప్రయత్నించాడు.\n\"జాగ్రత్త, టామ్!\" లిల్లీ అంది. ఆమె కుక్కలా మొరిగింది. ఆమె కూడా కుక్కలా అంది, కానీ ఆమె భయపడింది. ఆమె చెట్టుపైకి ఎక్కి కుక్క దగ్గరకు పరుగెత్తింది.\nకుక్కపిల్ల లిల్లీని చూసి దాని నోటితో పట్టుకుంది. అది దాని నోటితో లిల్లీ చేతిని నాలుకతో తాకింది. లిల్లీ ఆశ్చర్యపోయింది. ఆమె భయపడింది, విచారించింది. ఆమె ఏడ్చింది.\n\"అమ్మా, అమ్మా, మాకు సహాయం చెయ్యి!\" అని ఆమె ఏడ్చింది.\nఅమ్మ బయటకు వచ్చి కుక్కను చూసింది. ఆమె కుక్క దగ్గరకు పరిగెత్తి దాన్ని నిమిరింది.\n\"నువ్వు బాగానే ఉన్నావా, లిల్లీ?\" అని ఆమె అడిగింది.\nకుక్క ఆమె చేతిని నాలుకతో రుద్దింది. దానికి అది నచ్చింది.\n\"అమ్మా, అమ్మా, మేము పార్కుకి వెళ్తున్నాము!\" అని లిల్లీ చెప్పింది.\n\"ఓహ్, లిల్లీ, నువ్వు చాలా తెలివితక్కువ. కుక్కపిల్లకు అది నచ్చదు. అది దాని యజమాని. అది సరదాగా ఉండవచ్చు. నువ్వు దాన్ని ఊపకూడదు. అది ప్రమాదకరంగా ఉండవచ్చు,\" అని అమ్మ చెప్పింది.\nఅమ్మ లిల్లీ, టామ్ను హత్తుకుంది. వారు తమ పాఠం నేర్చుకున్నారు. వారు కుక్క దగ్గరకు వెళ్లి దానికి ఆహారం ఇచ్చారు. వారు దానికి కొంచెం పాలు, కొంచెం బ్రెడ్ ఇచ్చారు.\nఅమ్మ, లిల్లీ స్పాట్, స్పాట్ అని పేరు పెట్టారు. వారు పార్కులో స్పాట్ తో ఆడుకున్నారు. స్పాట్ సంతోషంగా, కృతజ్ఞతతో ఉంది. అది లిల్లీ చేతిని నాలుకతో రుద్దింది, తోక ఊపింది. అది లిల్లీ, టామ్లను ప్రేమిస్తున్నాము. అది వారి కొత్త స్నేహితుడు."

    "continuation": "ఒక రోజు, టిమ్ తన బొమ్మ కారుతో పార్కుకు వెళ్ళాడు. అతను తన స్నేహితురాలు సాలిని చూశాడు. సాలి విచారంగా ఉంది. టిమ్ అడిగాడు, \"సాలి, నువ్వెందుకు విచారంగా ఉన్నావు?\"\nసాలి అంది, \"నా బొమ్మ కారు పగిలిపోయింది, నాకు అది కావాలి.\" టిమ్ సాలికి సహాయం చేయాలనుకున్నాడు. అతను అన్నాడు, \"నేను నీ బొమ్మను సరిచేస్తాను, సాలి.\" అతను బొమ్మ కారును తిరిగి ఇవ్వడానికి ప్రయత్నించాడు, కానీ సాలి దాన్ని తీసుకోలేదు.\nఅప్పుడు, టిమ్కి ఒక ఆలోచన వచ్చింది. అతను అన్నాడు, \"సాలి, నేను నీకు నా బొమ్మ కారును తిరిగి ఇస్తాను, దాన్ని తిరిగి ఇస్తాను.\" సాలి చాలా సంతోషించింది. ఆమె టిమ్కు ధన్యవాదాలు చెప్పి, బొమ్మను టిమ్కి ఇచ్చింది. టిమ్ ఆ బొమ్మ కారుతో, తన బొమ్మ కారుతో ఆడాడు. వాళ్ళకి చాలా సరదాగా అనిపించింది, వాళ్లిద్దరూ పార్కులో సంతోషంగా జీవించారు."

   {
    "order_in_batch": 5,
    "language": "Telugu",
    "item_id": "STE-039",

    "continuation": "ఒక రోజు, ఆమె తన గదిలో ఒక పగిలిన ప్లాస్టిక్ బొమ్మను కనుగొంది. దాన్ని మళ్ళీ అందంగా చేయడానికి ఆమె చాలా ఉత్సాహపడింది.\nలిల్లీ తన స్నేహితుడు టామ్ని అడిగింది, \"నువ్వు ప్లాస్టిక్ బొమ్మను సరిచేయడంలో నాకు సహాయం చేయగలవా?\" టామ్ సహాయం చేయడానికి అంగీకరించాడు, వాళ్లిద్దరూ కలిసి పని చేయడం మొదలుపెట్టారు. వాళ్ళు చాలా ఓపికగా ఉండి, ప్రతి ఒక్కరూ తన వంతు ప్రయత్నం చేశారు.\nకొంత సమయం తర్వాత, వాళ్ళు బొమ్మను సరిచేసి, దాన్ని మళ్ళీ కొత్తగా చేశారు. లిల్లీ చాలా సంతోషించింది, తన సహాయానికి టామ్కు ధన్యవాదాలు చెప్పింది. వాళ్లిద్దరూ కలిసి పనిచేస్తే ఏదైనా సరిచేయవచ్చని నేర్చుకున్నారు. వాళ్ళు సంతోషంగా ఆనందంగా జీవించారు."
   },
   {

    "continuation": "అతని అమ్మ అంది, \"జాక్, మనం దుకాణానికి వెళ్దాం.\"\nవారు దుకాణంలోకి చేరుకున్నప్పుడు, జాక్ ఒక పెద్ద, గుండ్రని లాలీపాప్ను చూశాడు. అతను, \"అమ్మా, ఇది ఏమిటి?\" అని అడిగాడు.\nఅతని అమ్మ అంది, \"మనం దాన్ని ఇంటికి తీసుకువచ్చి ఇంటికి తీసుకుందాం. అది చాలా ఖరీదైనది, అది ఇంటికి ఒక ఫోటో తీసుకు వస్తోంది.\"\nజాక్ చాలా సంతోషించాడు. అతను తన అమ్మకు ధన్యవాదాలు చెప్పి, \"ధన్యవాదాలు!\" అన్నాడు.\nజాక్ తన డబ్బును చెల్లించడానికి ఇంటికి పరిగెత్తాడు. అతను చాలా డబ్బుతో ఇంటికి వచ్చాడు. దాన్ని చూడటం చూసి అతను చాలా సంతోషించాడు. అతను దానిని తన తల్లిదండ్రులకు చూపించాడు, వారందరూ కూడా అది చాలా ఇష్టపడతుందని అనుకున్నారు.\nజాక్ అమ్మ అంది, \"జాక్, నువ్వు ఇప్పుడు దుకాణానికి వెళ్లవచ్చు.\" జాక్ చాలా ఉత్సాహపడ్డాడు మరియు తన కుటుంబంతో ఇంటికి పరుగెత్తాడు."

    "beginning": "ఒకప్పుడు, టిమ్ అనే ఒక చిన్న పిల్లాడు ఉండేవాడు. అతను తన క్రేయాన్లతో గీయడం అంటే చాలా ఇష్టం.",
    "continuation": "ఒక రోజు, టిమ్ తన క్రేయాన్లతో పార్కులో పెద్ద, ప్రకాశవంతమైన సూర్యుడిని గీశాడు. సూర్యుడు చాలా ప్రకాశవంతంగా ఉన్నాడు, అతను సంతోషంగా ఉన్నాడు.\nటిమ్ తన స్నేహితురాలు సూనుని చూశాడు, ఆమెకు ఆ ప్రకాశవంతమైన సూర్యుడిని గీయాలని అనుకున్నాడు. టిమ్ సూనుని అడిగాడు, \"నువ్వు నా రంగులను నాకు ఇవ్వవా?\" సూను అంది, \"అవును, మనం కలిసి గీద్దాం.\"\nవారు ఒక పెద్ద, ప్రకాశవంతమైన సూర్యుడి బొమ్మను గీశారు. టిమ్ ఆ బొమ్మను తన అమ్మకు చూపించాడు. ఆమె చాలా సంతోషించి, \"చాలా బాగా చేశావు, టిమ్! నువ్వు గీయడంలో చాలా మంచివాడివి,\" అంది. వారు తమ రంగులను పంచుకోవడం, కలిసి గీయడం అంటే చాలా ఇష్టం."
   },
   {
    "order_in_batch": 12,
    "language": "Telugu",
    "item_id": "STE-074",
    "beginning": "ఒక రోజు, ఒక నాన్న మరియు అతని చిన్న కూతురు పార్కుకు వెళ్లారు. వాళ్ళు ఊయల మీద, స్లైడ్ మీద ఆడటం అంటే చాలా ఇష్టం.",
    "continuation": "నాన్న ఒక బెంచీపై పెద్ద పుస్తకం చదువుతున్నారు. చిన్న కూతురు కూడా ఆ పుస్తకం చదవాలనుకుంది.\nవాళ్ళు చదువుకుంటుండగా, ఒక పెద్ద పక్షి వచ్చింది. ఆ పక్షి పుస్తకం మీదకి దూకి, దాన్ని తీసుకుపోయింది. చిన్న కూతురు చాలా ఆశ్చర్యపోయింది! ఆమె అరిచింది, \"వద్దు, పక్షి! అది మంచిది కాదు!\"\nనాన్న ఆ పక్షిని చూసి నవ్వాడు. అతను, \"చింతించకు, చిన్న కూతురు. ఆ పక్షి నీ పుస్తకం తిరిగి వచ్చి నాతో ఆడుకోవాలనుకుంటుందేమో!\" అన్నాడు. చిన్న కూతురు నవ్వి, \"అవును, నాన్న! నేను పక్షితో ఆడుకోవడానికి వస్తాను!\" అంది. వాళ్ళు ఇంటికి వెళ్లి ఆ పక్షితో రోజంతా ఆడుకున్నారు."
   },
   {
    "order_in_batch": 13,
    "language": "Telugu",
    "item_id": "STE-031",
    "beginning": "ఒక రోజు, మాక్స్ అనే ఉల్లాసమైన కుక్క బయటకు నడవడానికి వెళ్ళాడు. మాక్స్ ఒక పెద్ద చెట్టు దగ్గర ఒక బోర్డును చూశాడు.",
    "continuation": "ఆ బోర్డులో, \"ఈ రోజు నువ్వు వెళ్ళడానికి ఒక ప్రత్యేకమైన చోటును కనుగొనాలి\" అని రాసి ఉంది. మాక్స్ చాలా ఉత్సాహపడ్డాడు.\nమాక్స్ ఒక దారిలో నడిచాడు. దారిలో, అతను టిమ్ అనే స్నేహపూర్వక పిల్లిని కలిశాడు. టిమ్ మాక్స్ దగ్గరకు వచ్చి, \"హలో, మాక్స్! నీకు ఏమైందో తెలుసా?\" అని అన్నాడు. మాక్స్, \"నాకు తెలియదు, కానీ ఆ ప్రత్యేకమైన చోటు ఎక్కడ ఉందో నాకు తెలియదు\" అని సమాధానం ఇచ్చాడు. టిమ్ ఒక్క క్షణం ఆలోచించి, \"నాకు తెలుసు! మనం ఆ ప్రత్యేకమైన చోటును కనుక్కుందాం\" అన్నాడు.\nమాక్స్ మరియు టిమ్ చూశారు, చూశారు. అప్పుడు, వారు లిల్లీ అనే ఒక చిన్న అమ్మాయిని చూశారు. ఆమె తన బొమ్మను పోగొట్టుకున్నందున ఏడుస్తోంది. మాక్స్, \"ఆమెను కనుగొన్నందుకు ధన్యవాదాలు! నేను నీకు సహాయం చేయాలనుకుంటున్నాను\" అన్నాడు. లిల్లీ నవ్వి, \"ధన్యవాదాలు, మాక్స్! నేను నా బొమ్మను పోగొట్టుకున్నాను\" అంది.\nమాక్స్ మరియు టిమ్ ఆ బొమ్మను లిల్లీకి తిరిగి ఇచ్చారు. ఆమె చాలా సంతోషించింది, మరియు ఆమె తన బొమ్మ కోసం మాక్స్ మరియు టిమ్ను ధన్యవాదాలు చెప్పింది. ఈ కథలోని నీతి ఏమిటంటే: ఇతరులకు సహాయం చేయడం వలన కొత్త స్నేహితులు దొరుకుతారు మరియు మీకు కూడా సంతోషం కలుగుతుంది."
   },
   {
    "order_in_batch": 14,
    "language": "Telugu",
    "item_id": "STE-029",
    "beginning": "ఒకానొకప్పుడు, టిమ్ అనే చిన్న పిల్లాడు మరియు అతని నారింజ రంగు పిల్లి కిట్టి, వారి స్నేహితురాలు సాలిని చూడటానికి వెళ్లారు. సాలి చిన్న ఇంట్లో, పెరట్లో ఒక పెద్ద చెట్టుతో నివసించేది.",
    "continuation": "టిమ్, లూసీ మరియు సాలి కలిసి ఆడుకోవడం మరియు సరదాగా గడపడం అంటే చాలా ఇష్టం.\nఒక రోజు, వారు ఆడుకుంటుండగా, చెట్టు నుండి ఒక వింత శబ్దం వినిపించింది. \"అది ఏ శబ్దం?\" అని టిమ్ అడిగాడు. \"నాకు తెలియదు,\" అంది లూసీ, \"కానీ మనం చూద్దాం!\" వారు చెట్టు దగ్గరకు వెళ్లి ఒక చిన్న పక్షిని చూశారు. ఆ పక్షి ఆ శబ్దాన్ని మళ్ళీ మళ్లీ చేస్తూ ఉంది. టిమ్ మరియు లూసీ చాలా ఆశ్చర్యపోయారు.\nటిమ్, \"ఇది ఏ శబ్దం, లూసీ?\" అని అడిగాడు. లూసీ కొద్దిసేపు ఆలోచించి, \"నాకు తెలియదు, టిమ్,\" అంది. వారు పక్షిని అడిగారు, అది అది ఒక చిన్న నారింజ పక్షి అని చెప్పింది. ఆ పక్షి టిమ్ మరియు లూసీ వైపు చూసి, \"అది నాకు పుట్టినరోజు. నేను నా అమ్మను చాలా మిస్ అయ్యాను!\" టిమ్, లూసీ మరియు పక్షి అందరూ నవ్వుతూ, వారు ఒక కొత్త స్నేహితుడిని కనుగొన్నారని తెలుసుకున్నారు."
   },

    "continuation": "ఒక రోజు, ఆమె తన గదిలో ఒక పెద్ద పెట్టెను కనుగొంది. \"పెట్టెలో ఏముంది?\" అని ఆమె అడిగింది.\nపెట్టెలో లోపల ఒక చిన్న నక్షత్రం బొమ్మ ఉంది. లిల్లీ చాలా ఆశ్చర్యపోయింది, అది ఏమిటో తెలుసుకోవాలని అనుకుంది. ఆమె ఆ నక్షత్రానికి దాని రహస్యాన్ని చెప్పింది. వారు కలిసి ఆ పెట్టెను తెరిచారు.\nపెట్టె లోపల, లిల్లీ మరియు ఆమె అమ్మ ఒక పెద్ద ఆశ్చర్యాన్ని కనుగొన్నారు. వారు ఒక మాయా రాగి రాయిని కనుగొన్నారు! ఆమె చాలా సంతోషించింది మరియు దానిని తన అమ్మకు చూపించింది. ఆమె అమ్మ నవ్వి, \"అది నిజం కాదు, కానీ అది నిజం కాదు. మనం దాన్ని అందరికీ ఒక ప్రత్యేక శక్తితో ఒక ప్రత్యేక బహుమతిగా ఉపయోగించవచ్చు\" అంది. అలా, వారు ఆ నిధిని పెట్టెను తెరిచి, ఒక కొత్త స్నేహితుడిని కనుగొన్నారు."

    "continuation": "వాళ్ళు రోజంతా పరుగెత్తేవారు, దూకేవారు, నవ్వేవారు. లిల్లీ చాలా సంతోషంగా ఉండేది.\nఒక రోజు, వర్షం పడటం మొదలైంది. లిల్లీ మరియు ఆమె స్నేహితులు లోపలికి వెళ్లవలసి వచ్చింది. వాళ్ళు కిటికీలోంచి బయటకు చూసి, వాళ్ళు తడిసిపోతారేమో అని చూశారు. \"అయ్యో!\" అంది లిల్లీ స్నేహితుడు టామ్. \"ఇప్పుడు మనం బయట ఆడలేం.\" లిల్లీకి విచారం కలిగింది, కానీ ఆమె లోపలనే ఉండిపోయింది.\nఅప్పుడు, ఏదో ఊహించనిది జరిగింది. వర్షం ఆగిపోయింది, సూర్యుడు వచ్చాడు. లిల్లీ మరియు ఆమె స్నేహితులు బయటకు వచ్చి ఆడుకోవడానికి వెళ్లారు. వాళ్ళు నవ్వారు, చాలా సరదాగా గడిపారు. వర్షం గురించి మర్చిపోయి, లిల్లీ వర్షం గురించి మర్చిపోయింది."

    "continuation": "ఒక రోజు, ఆమె అమ్మ ఒక బోర్డు తీసుకుని, \"లిల్లీ, నువ్వు ఈ బోర్డులో 'నేను నిన్ను ప్రేమిస్తున్నాను' అని చెప్పాలి\" అంది. లిల్లీ చాలా సంతోషించింది, \"ధన్యవాదాలు, అమ్మా\" అంది.\nమరుసటి రోజు, లిల్లీకి బాధగా అనిపించింది. తన అమ్మ చెప్పేది వినకపోతే, ఆమెకు కూడా బాధగా అనిపించింది. అందుకే ఆమె తన అమ్మకు బోర్డు గురించి చెప్పి, \"నేను ఇకపై 'నేను' అనే మాటను చెబుతాను\" అంది. ఆమె అమ్మ నవ్వి, \"నేను చెప్పగలను\" అంది.\nకొన్ని రోజుల తర్వాత, లిల్లీకి ఆ బోర్డు గుర్తొచ్చింది, ఆమెకు చాలా బాధగా అనిపించింది. తాను తెలిసిన అన్ని విషయాలు గుర్తు చేసుకుంది, మరియు బోర్డుల గురించి మాత్రమే చెప్పాల్సింది అని ఆమెకు తెలిసింది.\nఈ కథలోని నీతి ఏమిటంటే, మీ తల్లిదండ్రులను వినడం ముఖ్యం, ఎందుకంటే వారికి తెలిసిన ప్రతిదానికీ ఆలోచించండి."

    "continuation": "ఆమె ఆ వీణతో ఆడుకోవడం అంటే చాలా ఇష్టం. ఒక రోజు, ఆమె తన వీణతో పార్కుకు వెళ్లింది.\nపార్కులో, ఏమీ ఒక పెద్ద స్లైడ్ చూసింది. ఆమె ఆ స్లైడ్లో ఆడాలని అనుకుంది. అందుకే, ఆమె స్లైడ్ పైకి ఎక్కింది. కానీ, ఆమె స్లైడ్ కిందకి జారినప్పుడు, ఏదో ఊహించనిది జరిగింది. ఆ స్లైడ్ మాట్లాడగలదు!\nఆ స్లైడ్ ఒక మాయా స్లైడ్. అది అంది, \"నేను నిన్ను ఇంకా ఎత్తుకు వెళ్లడానికి సహాయం చేయగలను!\" ఏమీ సంతోషపడింది. ఆమె ఆ మాయా స్లైడ్పై ఒక ప్రయాణానికి వెళ్ళింది. ఆమె పైకి చేరుకున్నప్పుడు, ఆమె ఇంకా ఎక్కువ వీణ వాయించగలిగింది. ఏమీ ఆ మాయా స్లైడ్కు ధన్యవాదాలు చెప్పి, ఇంటికి వెళ్లింది."
   },
   {
    "order_in_batch": 15,
    "language": "Telugu",
    "item_id": "STE-047",
    "beginning": "ఒకప్పుడు, ఒక అమ్మాయి, ఒక చిన్న పాప ఉండేది. ఆ చిన్న పాప చాలా తెలివైనది.",
    "continuation": "ఒక రోజు, ఆ చిన్న పాప బయట ఆడుకోవాలని అనుకుంది. ఆమె ఒక పెద్ద ఎర్రటి బంతిని కనుగొని, దాన్ని తనతో తీసుకువెళ్లింది.\nఆమె ఆడుకుంటుండగా, ఆమె పెద్ద శబ్దం వింది. అది ఏమిటో చూడడానికి ఆమె పరిగెత్తింది, అప్పుడు ఒక పెద్ద, కోపంగా ఉన్న కుక్కను చూసింది. ఆ కుక్క చిన్న పాప బంతిని పట్టుకుని పారిపోయింది. చిన్న పాప బాధపడింది.\nకానీ అప్పుడు, చిన్న పాపకి ఒక ఆలోచన వచ్చింది. ఆమె తన అమ్మ దగ్గరకు వెళ్లి, బంతి గురించి చెప్పింది. అమ్మ కుక్కకు ఒక పెద్ద ఎముక ఇచ్చింది. చిన్న పాప మళ్ళీ సంతోషపడింది. ఆమె రోజంతా తన బంతితో, ఆ పెద్ద ఎర్రటి బంతితో ఆడింది."
   }
  ]
 }
}</script>
<script>
(function(){
"use strict";
/* ================= CONFIG (Vyshnavi edits only this block) ================= */
var CONFIG = {
  ENDPOINT_URL: "https://script.google.com/macros/s/AKfycbxdm6o6fmDin_sfOK9MsIH6IgjqqGVqwdEQfS2xPqw52wX2S4JX71EvUp1HnbtuWJxD/exec",          // paste the Google Apps Script web-app URL here (ends with /exec)
  TARGET_PER_BATCH: 2,       // aim: every batch rated by this many different people
  STUDY_VERSION: "storytom-ratings-v2"
};
/* ========================================================================== */

var ITEMS = JSON.parse(document.getElementById("items-data").textContent);
var TB = Object.keys(ITEMS.translation_batches);                    // TB01..TB40 (priority order)
var SEN = Object.keys(ITEMS.story_batches).filter(function(b){return b.indexOf("SENB")===0});
var STE = Object.keys(ITEMS.story_batches).filter(function(b){return b.indexOf("STEB")===0});
var KEY = "storytom_ratings_v2";
var app = document.getElementById("app");

/* ---------- state ---------- */
function newState(){return {session_id:rid(), profile:null, done_batches:[], queue:[], cur:null, answers:{}, orders:{}, outbox:[], sent:0, sets_started:0};}
var S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || newState(); }catch(e){ S = newState(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} renderStatus(); }
function rid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function el(t,c,txt){ var e=document.createElement(t); if(c) e.className=c; if(txt!=null) e.textContent=txt; return e; }
function clear(){ app.textContent=""; window.scrollTo(0,0); }
function nowIso(){ return new Date().toISOString(); }

/* ---------- sending (automatic logging) ---------- */
var flushing=false;
function enqueue(rec){ rec.record_id=rid(); rec.session_id=S.session_id; rec.client_version=CONFIG.STUDY_VERSION; S.outbox.push(rec); save(); flush(); }
async function flush(){
  if(flushing || !CONFIG.ENDPOINT_URL || !S.outbox.length) return;
  flushing=true;
  var batch=S.outbox.slice(0,25), body=JSON.stringify({records:batch});
  try{
    var r=await fetch(CONFIG.ENDPOINT_URL,{method:"POST",body:body});
    var j=await r.json();
    if(j && j.ok){ drop(batch.length); }
  }catch(err){
    /* not confirmed by the sheet: keep the records queued and retry (duplicates are removed by record_id) */
  }
  flushing=false; save();
  if(S.outbox.length) setTimeout(flush,4000);
}
function drop(n){ S.outbox.splice(0,n); S.sent+=n; }
setInterval(flush,15000); window.addEventListener("online",flush);

function renderStatus(){
  var st=document.getElementById("status"); if(!st) return;
  st.textContent="";
  st.appendChild(el("b","ok","✓ Saved on this device"));
  if(CONFIG.ENDPOINT_URL){
    st.appendChild(document.createTextNode(" · "));
    if(S.outbox.length) st.appendChild(el("b","warn","Sending "+S.outbox.length+"…"));
    else st.appendChild(el("b","ok","✓ Sent"));
  }
}

/* ---------- assignment ---------- */
async function getCounts(){
  if(!CONFIG.ENDPOINT_URL) return null;
  try{
    var ctl=new AbortController(); var t=setTimeout(function(){ctl.abort()},6000);
    var r=await fetch(CONFIG.ENDPOINT_URL+"?action=counts",{signal:ctl.signal}); clearTimeout(t);
    var j=await r.json(); return (j && j.ok) ? (j.counts||{}) : null;
  }catch(e){ return null; }
}
function pick(list, counts){
  var open=list.filter(function(b){return S.done_batches.indexOf(b)<0});
  if(!open.length) return null;
  if(counts){
    for(var i=0;i<open.length;i++){ if((counts[open[i]]||0) < CONFIG.TARGET_PER_BATCH) return open[i]; }
    return open.slice().sort(function(a,b){return (counts[a]||0)-(counts[b]||0)})[0];
  }
  var first=open.slice(0,10); return first[Math.floor(Math.random()*first.length)];
}
function total(list,counts){ return list.reduce(function(s,b){return s+(counts[b]||0)},0); }
async function assignSet(){
  var p=S.profile, counts=await getCounts(), q=[];
  if(p.en && p.te){ var t=pick(TB,counts); if(t) q.push(t); }
  var lang;
  if(p.en && p.te){
    if(counts){ var e=total(SEN,counts), te=total(STE,counts); lang = e<te ? "en" : te<e ? "te" : (Math.random()<.5?"en":"te"); }
    else lang = Math.random()<.5?"en":"te";
  } else lang = p.en ? "en" : "te";
  var s=pick(lang==="en"?SEN:STE,counts) || pick(lang==="en"?STE:SEN,counts && (p.en&&p.te) ? counts : null);
  if(s && (s.indexOf("SENB")===0 ? p.en : p.te)) q.push(s);
  S.queue=q; S.sets_started++; save();
  return q.length>0;
}

/* ---------- batch handling ---------- */
function itemsOf(b){ return b.indexOf("TB")===0 ? ITEMS.translation_batches[b] : ITEMS.story_batches[b]; }
function taskOf(b){ return b.indexOf("TB")===0 ? "translation" : "story"; }
function seededShuffle(arr, seed){
  var a=arr.slice(), h=0; for(var i=0;i<seed.length;i++){ h=(h*31+seed.charCodeAt(i))>>>0; }
  for(var j=a.length-1;j>0;j--){ h=(h*1664525+1013904223)>>>0; var k=h%(j+1); var t=a[j]; a[j]=a[k]; a[k]=t; }
  return a;
}
function startNextBatch(){
  if(!S.queue.length){ S.cur=null; save(); return showDone(); }
  var b=S.queue[0];
  if(!S.orders[b]) S.orders[b]=seededShuffle(itemsOf(b).map(function(x){return x.item_id}), S.session_id+b);
  S.answers[b]=S.answers[b]||{};
  S.cur={batch:b, idx:0}; save(); showIntro(b);
}
function finishBatch(){
  var b=S.cur.batch;
  if(S.done_batches.indexOf(b)<0) S.done_batches.push(b);
  enqueue({type:"batch_complete", rater_name:S.profile.name, task:taskOf(b), batch_id:b, n_items:S.orders[b].length, completed_at:nowIso()});
  S.queue.shift(); S.cur=null; save(); startNextBatch();
}

/* ---------- screens ---------- */
function showWelcome(){
  clear();
  var c=el("div","card");
  c.appendChild(el("h1",null,"Help us test AI stories in Telugu and English"));
  c.appendChild(el("p",null,"You’ll read short children’s stories and give each one a score. One set takes about 25–30 minutes. There are no right or wrong answers; we want your honest opinion."));
  c.appendChild(el("p","muted","Your answers are used only for research. We store your name and date of birth with your answers, nothing else. Your answers are saved as you go, so you can close the page and continue later on the same device."));
  var b=el("button","btn","Start"); b.onclick=showAbout; c.appendChild(b);
  app.appendChild(c);
}
function ynGroup(cur, onset){
  var g=el("div","yn"); ["Yes","No"].forEach(function(v){
    var b=el("button",null,v); b.type="button"; b.setAttribute("aria-pressed", String(cur===(v==="Yes")));
    b.onclick=function(){ onset(v==="Yes"); Array.prototype.forEach.call(g.children,function(x){x.setAttribute("aria-pressed","false")}); b.setAttribute("aria-pressed","true"); };
    g.appendChild(b);
  }); return g;
}
function showAbout(){
  clear();
  var p={name:"",dob:"",en:null,te:null};
  var c=el("div","card"); c.appendChild(el("h2",null,"About you"));
  c.appendChild(el("label","q","Your name"));
  var n=el("input"); n.type="text"; n.autocomplete="name"; c.appendChild(n);
  c.appendChild(el("label","q","Date of birth"));
  var d=el("input"); d.type="date"; c.appendChild(d);
  c.appendChild(el("label","q","Are you good in English?")); c.appendChild(ynGroup(null,function(v){p.en=v;check()}));
  c.appendChild(el("label","q","Are you good in Telugu?")); c.appendChild(ynGroup(null,function(v){p.te=v;check()}));
  var go=el("button","btn","Continue"); go.disabled=true; c.appendChild(go);
  function check(){ go.disabled = !(n.value.trim() && d.value && p.en!==null && p.te!==null); }
  n.oninput=check; d.oninput=check; d.onchange=check;
  go.onclick=async function(){
    p.name=n.value.trim(); p.dob=d.value;
    var age=ageOn(p.dob);
    if(age<18) return stop("Thank you! This study is for people aged 18 and over.");
    if(!p.en && !p.te) return stop("Thank you! This study needs English or Telugu.");
    S.profile=p; save();
    go.disabled=true; go.textContent="Preparing your set…";
    if(!(await assignSet())) return stop("Thank you! All sets you can rate are already complete.");
    startNextBatch();
  };
  app.appendChild(c);
}
function ageOn(dob){ var b=new Date(dob), t=new Date(); var a=t.getFullYear()-b.getFullYear(); var m=t.getMonth()-b.getMonth(); if(m<0||(m===0&&t.getDate()<b.getDate())) a--; return a; }
function stop(msg){ clear(); var c=el("div","card"); c.appendChild(el("h2",null,msg)); app.appendChild(c); }

function showIntro(b){
  clear();
  var c=el("div","card"), t=taskOf(b), n=S.orders[b].length;
  if(t==="translation"){
    c.appendChild(el("h2",null,"Part: translation quality ("+n+" stories)"));
    c.appendChild(el("p",null,"You’ll see an English story and its Telugu translation. Rate how well the Telugu keeps the meaning, and how natural it is."));
  } else {
    var lang = b.indexOf("SENB")===0 ? "English" : "Telugu";
    c.appendChild(el("h2",null,"Part: "+lang+" stories ("+n+" stories)"));
    c.appendChild(el("p",null,"Each story was started for the AI (the grey part). Please rate only what the AI wrote after it."));
  }
  c.appendChild(el("p","muted","Answers move you to the next story automatically. Use “‹ Back” to change an earlier answer."));
  var go=el("button","btn","Begin"); go.onclick=function(){ showItem(); }; c.appendChild(go);
  app.appendChild(c);
}

var T_Q=[
  {k:"meaning", q:"Meaning: does the Telugu say the same thing as the English?", a:["Meaning mostly lost or wrong","Main meaning kept, some parts wrong","All meaning kept"]},
  {k:"fluency", q:"Fluency: ignoring the English, is the Telugu natural and correct?", a:["Hard to read, many errors","Readable, some unnatural parts","Natural, correct Telugu"]}
];
var S_Q=[
  {k:"grammar", q:"Grammar: are the sentences correct?", a:["Many errors","Some errors, readable","No errors"]},
  {k:"natural", q:"Natural: does it sound like a person wrote it for a child?", a:["Clearly unnatural","Stiff in places","Completely natural"]},
  {k:"makes_sense", q:"Makes sense: does the story make sense from start to end?", a:["Doesn’t make sense","Mostly, with some jumps","Makes complete sense"]},
  {k:"follows_beginning", q:"Follows the beginning: does it continue the grey part?", a:["Ignores the beginning","Loosely related","Follows it closely"]}
];

var shownAt=0, advanceTimer=null;
function showItem(){
  clear(); clearTimeout(advanceTimer);
  var b=S.cur.batch, idx=S.cur.idx, ids=S.orders[b], id=ids[idx];
  var item=itemsOf(b).filter(function(x){return x.item_id===id})[0];
  var t=taskOf(b), A=S.answers[b][id] || (S.answers[b][id]={});
  shownAt=Date.now();

  var top=el("div","progress");
  var back=el("button","linkbtn","‹ Back"); back.type="button";
  if(idx===0) back.classList.add("hidden");
  back.onclick=function(){ S.cur.idx--; save(); showItem(); };
  top.appendChild(back); top.appendChild(el("span",null,(idx+1)+" of "+ids.length)); app.appendChild(top);

  var c=el("div","card");
  if(t==="translation"){
    c.appendChild(el("div","label","English original"));
    c.appendChild(el("div","text",item.english_text));
    c.appendChild(el("hr"));
    c.appendChild(el("div","label","Telugu translation"));
    c.appendChild(el("div","text te",item.telugu_text));
  } else {
    var te = item.language==="te";
    c.appendChild(el("div","label","The grey part was given to the AI. Please rate only what comes after it."));
    var d=el("div","text"+(te?" te":""));
    d.appendChild(el("span","grey",item.beginning+" "));
    d.appendChild(document.createTextNode(item.continuation));
    c.appendChild(d);
  }
  app.appendChild(c);

  var qc=el("div","card"), QS = t==="translation"?T_Q:S_Q;
  QS.forEach(function(Q){
    qc.appendChild(el("label","q",Q.q));
    var sc=el("div","scale");
    for(var v=1;v<=5;v++){ (function(v){
      var bt=el("button",null,String(v)); bt.type="button"; bt.setAttribute("aria-pressed",String(A[Q.k]===v));
      bt.onclick=function(){ A[Q.k]=v; Array.prototype.forEach.call(sc.children,function(x){x.setAttribute("aria-pressed","false")}); bt.setAttribute("aria-pressed","true"); answered(); };
      sc.appendChild(bt); })(v); }
    qc.appendChild(sc);
    var an=el("div","anchors"); Q.a.forEach(function(x,i){ an.appendChild(el("span",null,(i===0?"1 = ":i===1?"3 = ":"5 = ")+x)); }); qc.appendChild(an);
  });
  if(t==="translation"){
    var ck=el("label","check"); var cb=el("input"); cb.type="checkbox"; cb.checked=!!A.gender_error;
    cb.onchange=function(){ A.gender_error=cb.checked; save(); if(complete()) record(); };
    ck.appendChild(cb); ck.appendChild(el("span",null,"Wrong he/she/it used for a person or animal (optional)")); qc.appendChild(ck);
  }
  var nt=el("button","linkbtn",A.note?"Edit note":"+ Add a note (optional)"); nt.type="button";
  var ta=el("textarea"+""); ta.className=A.note?"":"hidden"; ta.value=A.note||"";
  nt.onclick=function(){ ta.classList.remove("hidden"); ta.focus(); };
  ta.oninput=function(){ A.note=ta.value; save(); clearTimeout(advanceTimer); };
  ta.onblur=function(){ if(complete()) record(); };
  qc.appendChild(nt); qc.appendChild(ta);
  var nx=el("button","btn",idx===ids.length-1?"Finish this part":"Next ›"); nx.disabled=!complete();
  nx.onclick=function(){ next(); };
  qc.appendChild(nx); app.appendChild(qc);

  function complete(){ return QS.every(function(Q){return A[Q.k]}); }
  function answered(){
    A.seconds_on_item=(A.seconds_on_item||0)+Math.round((Date.now()-shownAt)/1000); shownAt=Date.now();
    save(); nx.disabled=!complete();
    if(complete()){ record(); if(ta.classList.contains("hidden")){ clearTimeout(advanceTimer); advanceTimer=setTimeout(next,600); } }
  }
  function record(){
    enqueue({type:"item", rater_name:S.profile.name, date_of_birth:S.profile.dob, good_english:S.profile.en?"yes":"no", good_telugu:S.profile.te?"yes":"no",
      task:t, batch_id:b, item_id:id, position_shown:idx+1,
      meaning:A.meaning||"", fluency:A.fluency||"", gender_error: t==="translation" ? (A.gender_error?"yes":"no") : "",
      grammar:A.grammar||"", natural:A.natural||"", makes_sense:A.makes_sense||"", follows_beginning:A.follows_beginning||"",
      note:A.note||"", seconds_on_item:A.seconds_on_item||0, answered_at:nowIso()});
  }
  function next(){
    clearTimeout(advanceTimer);
    if(!complete()) return;
    if(S.cur.idx < ids.length-1){ S.cur.idx++; save(); showItem(); }
    else finishBatch();
  }
}

function showDone(){
  clear();
  var c=el("div","card");
  c.appendChild(el("h1",null,"Thank you, "+(S.profile?S.profile.name:"")+"!"));
  c.appendChild(el("p",null,"Your ratings are saved. Want to help a little more? Each extra set takes about 25 minutes."));
  var more=el("button","btn","Rate one more set");
  more.onclick=async function(){ more.disabled=true; more.textContent="Preparing…"; if(await assignSet()) startNextBatch(); else stop("Thank you! There are no more sets for you to rate."); };
  var done=el("button","btn alt","I’m done (download my file)");
  done.onclick=function(){ download(); finalScreen(); };
  c.appendChild(more); c.appendChild(done);
  var other=el("button","linkbtn","Someone else wants to rate on this device"); other.type="button";
  other.onclick=function(){ if(S.outbox.length && CONFIG.ENDPOINT_URL){ flush(); }
    if(confirm("First tap OK to download this person’s file. Then the page starts fresh for the next person.")){ download(); var keep=S.outbox; S=newState(); S.outbox=keep; save(); showWelcome(); } };
  c.appendChild(other); app.appendChild(c);
}
function finalScreen(){
  clear(); var c=el("div","card");
  c.appendChild(el("h1",null,"All done. Thank you!"));
  c.appendChild(el("p",null,"A file with your answers has been downloaded to your device. Please send that file to Mani (WhatsApp or email). If no file appeared, tap “Download my responses” at the bottom."));
  app.appendChild(c);
}

/* ---------- manual download ---------- */
var COLS=["session_id","rater_name","date_of_birth","good_english","good_telugu","task","batch_id","item_id","position_shown","meaning","fluency","gender_error","grammar","natural","makes_sense","follows_beginning","note","seconds_on_item","batch_completed"];
function csvCell(v){ v=(v==null?"":String(v)); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function buildFile(){
  var p=S.profile||{}, lines=[];
  lines.push("# Story rating study: responses");
  lines.push("# Name: "+(p.name||"")+" | Downloaded: "+nowIso()+" | Session: "+S.session_id+" | Version: "+CONFIG.STUDY_VERSION);
  lines.push("# Completed parts: "+(S.done_batches.join(", ")||"none"));
  lines.push("# Please send this file to Mani.");
  lines.push(COLS.join(","));
  Object.keys(S.answers).forEach(function(b){
    var ids=S.orders[b]||[];
    ids.forEach(function(id,i){
      var A=S.answers[b][id]; if(!A) return; var t=taskOf(b);
      var row={session_id:S.session_id, rater_name:p.name, date_of_birth:p.dob, good_english:p.en?"yes":"no", good_telugu:p.te?"yes":"no", task:t, batch_id:b, item_id:id, position_shown:i+1,
        meaning:A.meaning, fluency:A.fluency, gender_error: t==="translation"?(A.gender_error?"yes":"no"):"", grammar:A.grammar, natural:A.natural, makes_sense:A.makes_sense, follows_beginning:A.follows_beginning,
        note:A.note, seconds_on_item:A.seconds_on_item, batch_completed: S.done_batches.indexOf(b)>=0?"yes":"no"};
      lines.push(COLS.map(function(c){return csvCell(row[c])}).join(","));
    });
  });
  return lines.join("\n")+"\n";
}
function download(){
  var p=S.profile||{}, name=(p.name||"rater").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"rater";
  var fname="story_ratings_"+name+"_"+new Date().toISOString().slice(0,10)+".txt";
  try{
    var blob=new Blob([buildFile()],{type:"text/plain;charset=utf-8"}), url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},3000);
  }catch(e){ alert("Download did not start. Please take a screenshot and tell Mani."); }
}
document.getElementById("dl").onclick=download;

/* ---------- start / resume ---------- */
renderStatus(); flush();
if(S.cur){ showItem(); }
else if(S.profile && S.queue.length){ startNextBatch(); }
else if(S.profile && S.done_batches.length){ showDone(); }
else showWelcome();
})();

</script>
