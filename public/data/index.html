  "TB30": [
   {
    "order_in_batch": 1,
    "item_id": "T-145",
    "english_text": "Once upon a time there was a tiny boy named Toby. He loved to play in the park, but he was always careful not to get too close to the road. Toby had a bright red helmet to protect his head when he went out to play!\nOne day, Toby and his friends went to the park for a special game. They decided to play sack race! With thick sacks over their shoulders, they ran around the park. Even with the helmet on, Toby couldn't see too well, but he kept running. \nAt last, Toby crossed the finish line first! All of his friends cheered and gave him a big round of applause. Toby was happy and proud of himself. He couldn't stop smiling as they all went home. \nFrom then on, Toby always wore his helmet when he went outside to play, just in case he ever wanted to race again!",
    "telugu_text": "ఒకప్పుడు టోబీ అనే చిన్న పిల్లాడు ఉండేవాడు. అతనికి పార్కులో ఆడుకోవడం అంటే చాలా ఇష్టం, కానీ రోడ్డు దగ్గరకు వెళ్లకూడదని ఎప్పుడూ జాగ్రత్త పడేవాడు. టోబీ బయటకు వెళ్లి ఆడుకోవడానికి తన తలను కాపాడుకోవడానికి ఒక మెరిసే ఎర్రటి హెల్మెట్ ఉండేది!\nఒక రోజు, టోబీ మరియు అతని స్నేహితులు ఒక ప్రత్యేక ఆట కోసం పార్కుకు వెళ్లారు. వాళ్ళు సంచి పరుగు పందెం ఆడాలని నిర్ణయించుకున్నారు! భుజాలపై మందపాటి సంచులు వేసుకుని, వాళ్ళు పార్కులో పరిగెత్తారు. హెల్మెట్ పెట్టుకున్నా కూడా, టోబీ అంత బాగా చూడలేకపోయాడు, కానీ పరిగెడుతూనే ఉన్నాడు.\nచివరికి, టోబీ ముందుగా గమ్యాన్ని చేరుకున్నాడు! అతని స్నేహితులందరూ కేకలు వేసి, అతనికి పెద్దగా చప్పట్లు కొట్టారు. టోబీ సంతోషంగా, గర్వంగా ఉన్నాడు. వాళ్ళు అందరూ ఇంటికి వెళ్తున్నప్పుడు అతను నవ్వడం ఆపలేకపోయాడు.\nఅప్పటి నుండి, టోబీ బయటకు వెళ్లి ఆడుకోవడానికి ఎప్పుడూ తన హెల్మెట్ను ధరించేవాడు, ఎందుకంటే అతను మళ్లీ పందెం ఆడాలని అనుకుంటే!"
   },
   {
    "order_in_batch": 2,
    "item_id": "T-178",
    "english_text": "Hank and Tina loved to go play outside. One day, Hank noticed something in the sky. It was a noisy bird. \"Look!\" Hank said. \"Let's dive!\" \nTina smiled. They held hands, took a deep breath and dove into the air. It felt like flying! \nThe bird had an envelope in its mouth. The bird flew away. Hank and Tina chased after it. They soared and soared until they finally caught up to it. \nHank held out his hand. \"Can I have the envelope, please?\" \nThe bird stopped flying and gave Hank the envelope. He opened it and tiny confetti flew all around them. \n\"Look at all this! What a noisy surprise!\" laughed Hank. \nTina smiled. Then they hugged and flew away, still laughing.",
    "telugu_text": "హ్యాంక్ మరియు టినా బయట ఆడుకోవడానికి చాలా ఇష్టపడేవారు. ఒక రోజు, హ్యాంక్ ఆకాశంలో ఏదో గమనించాడు. అది ఒక శబ్ద చేసే పక్షి. \"చూడు!\" హ్యాంక్ అన్నాడు. \"వేద్దాం!\"\nటినా నవ్వింది. వారు చేతులు పట్టుకున్నారు, లోతుగా శ్వాస తీసుకుని గాలిలోకి దూకారు. అది ఎగురుతున్నట్లు అనిపించింది!\nఆ పక్షి నోటిలో ఒక ఎన్వలప్ (లేఖ) పట్టుకుని ఉంది. ఆ పక్షి ఎగిరిపోయింది. హ్యాంక్ మరియు టినా దానిని వెంబడించారు. వారు ఎగిరి, ఎగిరి, చివరికి దానిని పట్టుకున్నారు.\nహ్యాంక్ తన చేయి చాచాడు. \"దయచేసి నాకు ఆ ఎన్వలప్ ఇవ్వగలవా?\"\nఆ పక్షి ఎగరడం ఆపి, హ్యాంక్కు ఆ ఎన్వలప్ను ఇచ్చింది. అతను దానిని తెరిచాడు మరియు చిన్న చిన్న కాగితపు ముక్కలు (కాన్ఫెట్టి) వారి చుట్టూ ఎగిరిపోయాయి.\n\"ఇదంతా చూడు! ఎంత శబ్దంతో కూడిన ఆశ్చర్యం!\" హ్యాంక్ నవ్వాడు.\nటినా నవ్వింది. అప్పుడు వారు కౌగిలించుకుని, ఇంకా నవ్వుతూ ఎగిరిపోయారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-082",
    "english_text": "Once upon a time, there was a little girl named Sally. Sally had a big shelf in her room. She loved to fill the shelf with her toys and books. Every day, she would play with her toys and read her books.\nOne day, Sally got a new toy. It was a pretty doll with a pink dress. She was very happy and played with the doll all day. She put the doll on the shelf with her other toys.\nBut, her old teddy bear felt jealous. He wanted to play with Sally too. So, when Sally went to bed, the teddy bear jumped off the shelf and went to sleep next to her. In the morning, Sally saw the teddy bear and gave him a big hug. Now, all her toys were happy on the shelf.",
    "telugu_text": "ఒకప్పుడు, సాలీ అనే ఒక చిన్న అమ్మాయి ఉండేది. సాలీ గదిలో ఒక పెద్ద షెల్ఫ్ ఉండేది. ఆమె తన బొమ్మలు, పుస్తకాలతో ఆ షెల్ఫ్ను నింపడానికి చాలా ఇష్టపడేది. ప్రతిరోజూ, ఆమె తన బొమ్మలతో ఆడుకునేది, తన పుస్తకాలను చదివేది.\nఒక రోజు, సాలీకి ఒక కొత్త బొమ్మ దొరికింది. అది గులాబీ రంగు దుస్తులు వేసుకున్న ఒక అందమైన బొమ్మ. ఆమె చాలా సంతోషించి, ఆ రోజు మొత్తం ఆ బొమ్మతో ఆడింది. ఆమె ఆ బొమ్మను తన ఇతర బొమ్మలతో కలిసి షెల్ఫ్పై పెట్టింది.\nకానీ, ఆమె పాత టెడ్డీ బేర్ అసూయపడింది. కూడా సాలీతో ఆడుకోవాలని అది కోరుకుంది. అందుకే, సాలీ పడుకోవడానికి వెళ్ళినప్పుడు, టెడ్డీ బేర్ షెల్ఫ్ నుండి దూకి, తన పక్కన పడుకుంది. ఉదయం, సాలీ టెడ్డీ బేర్ను చూసి, దానికి పెద్దగా కౌగిలించుకుంది. ఇప్పుడు, ఆమె షెల్ఫ్పై ఉన్న అన్ని బొమ్మలు సంతోషంగా ఉన్నాయి."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-093",
    "english_text": "One day, a boy and his mom went to a big hotel. It was a cold, icy day. They wanted to have fun inside where it was warm. The boy saw a big door and wanted to know what was behind it. He asked his mom, \"Can we go in there?\"\nHis mom looked at the door and replied, \"I don't know, let's ask the man at the desk.\" They went to the man and the boy asked, \"Can we go in the big door?\"\nThe man smiled and replied, \"Yes, but you need a key. Here you go!\" He gave the boy a shiny key.\nThe boy and his mom went to the big door and used the key. When they opened the door, they saw a big room full of toys and games! They didn't know the hotel had a fun playroom. The boy was so happy and played all day with his mom. They had the best day ever at the icy hotel.",
    "telugu_text": "ఒక రోజు, ఒక అబ్బాయి మరియు అతని అమ్మ ఒక పెద్ద హోటల్కు వెళ్లారు. అది చల్లని, మంచుతో కూడిన రోజు. లోపల వెచ్చగా ఉండడం వలన వారు సరదాగా ఉండాలనుకున్నారు. అబ్బాయి ఒక పెద్ద తలుపును చూశాడు మరియు దాని వెనుక ఏమిటో తెలుసుకోవాలని అనుకున్నాడు. అతను తన అమ్మను అడిగాడు, \"మనం లోపలికి వెళ్లవచ్చా?\"\nఅతని అమ్మ తలుపు వైపు చూసి, \"నాకు తెలియదు, డెస్క్లో ఉన్న మనిషిని అడుగుదాం.\" వారు ఆ మనిషి దగ్గరకు వెళ్లారు మరియు అబ్బాయి, \"మనం పెద్ద తలుపులోకి వెళ్లవచ్చా?\" అని అడిగాడు.\nఆ మనిషి నవ్వి, \"అవును, కానీ నీకు తాళం చెవి కావాలి. ఇటు తీసుకో!\" అతను అబ్బాయికి మెరిసే తాళం చెవి ఇచ్చాడు.\nఅబ్బాయి మరియు అతని అమ్మ పెద్ద తలుపు దగ్గరకు వెళ్లి తాళం చెవిని ఉపయోగించారు. వారు తలుపు తెరిచినప్పుడు, బొమ్మలు మరియు ఆటలతో నిండిన ఒక పెద్ద గదిని చూశారు! హోటల్లో సరదాగా ఉండే ఆట స్థలం ఉందని వారికి తెలియదు. అబ్బాయి చాలా సంతోషించాడు మరియు తన అమ్మతో రోజంతా ఆడుకున్నాడు. మంచు హోటల్లో వారికి ఎప్పుడూ లేనంత మంచి రోజు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-074",
    "english_text": "Tom and Lily were friends who liked to play near the pond. They saw many fish and frogs and ducks in the pond. They also saw a big boat that belonged to Mr. Brown, who lived in a house by the pond. Tom and Lily wanted to ride the boat, but they knew they had to ask Mr. Brown first.\nOne day, Tom had a bad idea. He said to Lily, \"Let's borrow the boat and go to the other side of the pond. We can see more things there. Mr. Brown won't mind, he is not here.\" Lily was scared, but Tom said, \"Don't worry, we will be back soon. It will be fun.\"\nTom and Lily took the boat and rowed to the other side of the pond. They saw many flowers and birds and bugs. They forgot about the time and the boat. They did not see the dark clouds and the wind that came. The pond became rough and the boat began to rock. Tom and Lily were afraid and tried to row back, but it was too late. The boat tipped over and they fell into the water. They screamed for help, but no one heard them.\nMr. Brown came back and saw his boat upside down in the pond. He ran to the water and saw Tom and Lily struggling to swim. He jumped in and saved them. He was angry and sad. He said to them, \"Why did you take my boat without asking? You could have drowned. You are very naughty and foolish. You are not my friends anymore. Go away and don't come back.\"\nTom and Lily were wet and cold and ashamed. They said, \"We are sorry, Mr. Brown. We made a big mistake. We won't do it again. Please forgive us.\" But Mr. Brown did not listen. He took his boat and went to his house. He locked the door and did not talk to them.\nTom and Lily walked home, crying and regretting. They learned a hard lesson. They learned that they should not borrow things without permission. They learned that they should listen to their fears and not to bad ideas. They learned that they should respect other people's property and feelings. They learned that they should be honest and responsible. They hoped that Mr. Brown would forgive them someday, but they did not know if he would. They lost a friend and a chance to play near the pond. They were very sorry.",
    "telugu_text": "టామ్, లిల్లీ స్నేహితులు. వాళ్ళకి చెరువు దగ్గర ఆడుకోవడం అంటే చాలా ఇష్టం. వాళ్ళు చెరువులో చాలా చేపలు, కప్పలు, మరియు మల్లెపూల పక్షులను చూశారు. చెరువు దగ్గర ఒక పెద్ద పడవ కూడా ఉంది, అది మిస్టర్ బ్రౌన్ది. మిస్టర్ బ్రౌన్ చెరువు దగ్గర ఒక ఇంట్లో నివసించేవాడు. టామ్, లిల్లీ ఆ పడవలో ప్రయాణించాలని అనుకున్నారు, కానీ ముందుగా మిస్టర్ బ్రౌన్ను అడగాలి అని వారికి తెలుసు.\nఒక రోజు, టామ్కి ఒక చెడ్డ ఆలోచన వచ్చింది. అతను లిల్లీతో, \"పడవను అప్పుగా తీసుకుని చెరువు అవతలి వైపుకు వెళ్దాం. అక్కడ ఇంకా చాలా విషయాలు కనిపిస్తాయి. మిస్టర్ బ్రౌన్ పట్టించుకోడు, అతను ఇక్కడ లేడు\" అన్నాడు. లిల్లీ భయపడింది, కానీ టామ్, \"చింతించకు, మనం త్వరగా తిరిగి వస్తాం. ఇది సరదాగా ఉంటుంది\" అన్నాడు.\nటామ్, లిల్లీ పడవ తీసుకుని చెరువు అవతలి వైపుకు కాయించారు. వాళ్ళు చాలా పువ్వులు, పక్షులు, మరియు కీటకాలను చూశారు. వాళ్ళు సమయం, పడవ గురించి మర్చిపోయారు. వాళ్ళు వచ్చిన చీకటి మేఘాలను, గాలిని చూడలేదు. చెరువు గందరగోళంగా మారింది, పడవ ఊగడం మొదలుపెట్టింది. టామ్, లిల్లీ భయపడ్డారు మరియు తిరిగి కాయించడానికి ప్రయత్నించారు, కానీ చాలా ఆలస్యం అయింది. పడవ పక్కకు తగిలి, వాళ్ళు నీటిలో పడిపోయారు. వాళ్ళు సహాయం కోసం అరిచారు, కానీ ఎవరూ వినలేదు.\nమిస్టర్ బ్రౌన్ తిరిగి వచ్చి, చెరువులో తన పడవ పడకపై చూశాడు. అతను నీటిలోకి పరిగెత్తి, టామ్, లిల్లీ ఈత కొట్టుకోవడానికి కష్టపడుతున్నట్లు చూశాడు. అతను దూకి, వారిని కాపాడాడు. అతను కోపంగా, విచారంగా ఉన్నాడు. అతను వాళ్ళతో, \"నేను అడగకుండా నా పడవను ఎందుకు తీసుకున్నారు? మీరు మునిగిపోయేవాళ్ళు. మీరు చాలా అల్లరి పిల్లలు, తెలివితక్కువ వాళ్ళు. మీరు ఇక నా స్నేహితులు కాదు. వెళ్లిపోండి, తిరిగి రాకండి\" అన్నాడు.\nటామ్, లిల్లీ తడిచి, చల్లగా, సిగ్గుపడ్డారు. వాళ్ళు, \"క్షమించండి, మిస్టర్ బ్రౌన్. మేము పెద్ద తప్పు చేశాం. మేము మళ్ళీ చేయము. దయచేసి మమ్మల్ని క్షమించండి\" అన్నారు. కానీ మిస్టర్ బ్రౌన్ వినలేదు. అతను తన పడవ తీసుకుని తన ఇంటికి వెళ్ళాడు. అతను తలుపు గడియ పెట్టాడు మరియు వాళ్ళతో మాట్లాడలేదు.\nటామ్, లిల్లీ ఏడుస్తూ, బాధపడి ఇంటికి నడిచారు. వాళ్ళు ఒక కఠినమైన పాఠం నేర్చుకున్నారు. అనుమతి లేకుండా వస్తువులను అప్పు తీసుకోకూడదని వాళ్ళు నేర్చుకున్నారు. తమ భయాలను, చెడు ఆలోచనలను వినాలని వాళ్ళు నేర్చుకున్నారు. ఇతరుల ఆస్తిని మరియు భావాలను గౌరవించాలని వాళ్ళు నేర్చుకున్నారు. నిజాయితీగా, బాధ్యతగా ఉండాలని వాళ్ళు నేర్చుకున్నారు. మిస్టర్ బ్రౌన్ ఎప్పుడైనా క్షమించాలని ఆశించారు, కానీ అతను అలా చేస్తాడో లేదో వారికి తెలియదు. వాళ్ళు ఒక స్నేహితుడిని, చెరువు దగ్గర ఆడుకునే అవకాశాన్ని కోల్పోయారు. వాళ్ళు చాలా చింతిశారు."
   }

  "TB31": [
   {
    "order_in_batch": 1,
    "item_id": "T-127",
    "english_text": "Once upon a time, in a big forest, there lived a squirrel named Sam. Sam loved to find nuts and wrap them up in leaves to save for later. One day, he found a big nut that was hard to wrap. He tried and tried, but it just did not fit.\nSam went to his friend, a wise old owl, and asked, \"Can you help me wrap this big nut?\" The owl looked at the nut and said, \"This nut is too big for you to wrap, but I can teach you how to break it into smaller pieces.\"\nSam listened carefully to the wise owl and learned how to break the big nut into smaller pieces. Then, he was able to wrap the smaller pieces in leaves and save them for later. Sam was very happy and thanked the wise owl for his help.\nThe moral of the story is that sometimes, we need help from others to solve our problems. It is always good to ask for help and learn from our friends.",
    "telugu_text": "ఒకప్పుడు, ఒక పెద్ద అడవిలో, సమ్ అనే ఉడుత ఉండేది. సమ్ గింజలను కనుగొని, వాటిని తరువాత పెట్టుకోవడానికి ఆకులతో చుట్టేయడానికి చాలా ఇష్టపడేది. ఒక రోజు, అతనికి చుట్టడం కష్టమైన పెద్ద గింజ దొరికింది. అతను ప్రయత్నించాడు, ప్రయత్నించాడు, కానీ అది సరిపోలేదు.\nసమ్ తన స్నేహితుడు, తెలివైన వృద్ధ గుడ్లగూబ దగ్గరకు వెళ్లి, \"ఈ పెద్ద గింజను చుట్టడానికి నాకు సహాయం చేయగలవా?\" అని అడిగాడు. గుడ్లగూబ ఆ గింజను చూసి, \"ఈ గింజ నీకు చుట్టడానికి చాలా పెద్దది, కానీ దానిని చిన్న ముక్కలుగా ఎలా విడగొట్టాలో నేను నీకు నేర్పించగలను\" అంది.\nసమ్ తెలివైన గుడ్లగూబ మాటలను శ్రద్ధగా విన్నాడు మరియు పెద్ద గింజను చిన్న ముక్కలుగా ఎలా విడగొట్టాలో నేర్చుకున్నాడు. అప్పుడు, అతను చిన్న ముక్కలను ఆకులతో చుట్టి, వాటిని తరువాత పెట్టుకోవడానికి పెట్టగలిగాడు. సమ్ చాలా సంతోషించాడు మరియు తన సహాయానికి తెలివైన గుడ్లగూబకు ధన్యవాదాలు చెప్పాడు.\nఈ కథలోని నీతి ఏమిటంటే, కొన్నిసార్లు, మన సమస్యలను పరిష్కరించడానికి మనకు ఇతరుల సహాయం అవసరం. సహాయం అడగడం మరియు మన స్నేహితుల నుండి నేర్చుకోవడం ఎల్లప్పుడూ మంచిది."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-109",
    "english_text": "One day, a woman went to the store. She wanted to buy a cheap toy for her little boy. She saw many toys, but she wanted the cheapest one.\nThe woman saw another woman with a cheap toy. She went to talk to her. \"Where did you find that cheap toy?\" the woman asked. The other woman said, \"I found it over there, by the big box.\"\nThe woman went to the big box and found the cheap toy. She was very happy. She bought the toy and went home. She gave the toy to her little boy. The little boy played with the toy, but it broke very fast. The woman and the little boy were sad.",
    "telugu_text": "ఒక రోజు, ఒక స్త్రీ దుకాణానికి వెళ్లింది. తన చిన్న కొడుకు కోసం తక్కువ ధరలో ఉండే బొమ్మ కొనాలనుకుంది. ఆమె చాలా బొమ్మలను చూసింది, కానీ తనకు తక్కువ ధర ఉన్నదానిని కొనాలని అనుకుంది.\nఆ స్త్రీ ఒక వేరే స్త్రీని తక్కువ ధర బొమ్మతో చూసింది. ఆమె దానితో మాట్లాడటానికి వెళ్ళింది. \"ఆ తక్కువ ధర బొమ్మను ఎక్కడ కనుక్కున్నావు?\" అని ఆ స్త్రీ అడిగింది. ఆ వేరే స్త్రీ, \"నేను దానిని అక్కడ కనుక్కున్నాను, ఆ పెద్ద పెట్టె దగ్గర\" అంది.\nఆ స్త్రీ పెద్ద పెట్టె దగ్గరకు వెళ్లి ఆ తక్కువ ధర బొమ్మను కనుగొంది. ఆమె చాలా సంతోషించింది. ఆమె ఆ బొమ్మను కొని ఇంటికి వెళ్లింది. ఆమె ఆ బొమ్మను తన చిన్న కొడుకుకి ఇచ్చింది. చిన్న కొడుకు ఆ బొమ్మతో ఆడుకున్నాడు, కానీ అది చాలా త్వరగా పగిలిపోయింది. ఆ స్త్రీ, చిన్న కొడుకు ఇద్దరూ విచారించారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-155",
    "english_text": "Once upon a time, there was a little boy named Tim. Tim liked to eat at a restaurant with his mom and dad. The restaurant was big and had many yummy foods. Tim was happy when he went there.\nOne day, Tim saw a big tree outside the restaurant. He wanted to climb it, but it was difficult. Tim tried and tried, but he could not climb the tree. He felt sad because he wanted to see the top of the tree.\nThen, a kind bird came to help Tim. The bird flew up and up, and Tim held onto the bird. But Tim was scared and let go of the bird. He started to fall, but the bird caught him just in time. Tim was safe and thanked the bird. They became good friends and went to eat at the restaurant together.",
    "telugu_text": "ఒకప్పుడు, టిమ్ అనే ఒక చిన్న పిల్లాడు ఉండేవాడు. టిమ్ తన అమ్మ, నాన్నతో రెస్టారెంట్కి తినడానికి ఇష్టపడేవాడు. ఆ రెస్టారెంట్ పెద్దదిగా ఉండి, చాలా రుచికరమైన ఆహారాలు ఉండేవి. టిమ్ అక్కడికి వెళ్ళినప్పుడు సంతోషపడేవాడు.\nఒకరోజు, టిమ్ రెస్టారెంట్ బయట ఒక పెద్ద చెట్టును చూశాడు. అతను దానిపైకి ఎక్కాలని అనుకున్నాడు, కానీ అది కష్టంగా ఉంది. టిమ్ ప్రయత్నించాడు, ప్రయత్నించాడు, కానీ అతను చెట్టుపైకి ఎక్కలేకపోయాడు. చెట్టు పైభాగాన్ని చూడాలని కోరుకున్నందున అతను విచారించాడు.\nఅప్పుడు, ఒక దయగల పక్షి టిమ్కి సహాయం చేయడానికి వచ్చింది. ఆ పక్షి పైకి పైకి ఎగిరింది, టిమ్ ఆ పక్షిని పట్టుకున్నాడు. కానీ టిమ్ భయపడి పక్షిని వదిలేశాడు. అతను పడిపోవడం మొదలుపెట్టాడు, కానీ పక్షి అతన్ని సరిగ్గా పట్టుకుంది. టిమ్ సురక్షితంగా ఉన్నాడు మరియు పక్షికి కృతజ్ఞతలు చెప్పాడు. వారు మంచి స్నేహితులు అయ్యారు మరియు కలిసి రెస్టారెంట్కి తినడానికి వెళ్లారు."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-128",
    "english_text": "Once upon a time, in a big forest, there was a small cabin. In the cabin lived a kind man named Tom and his little dog, Spot. They loved to play and make things together.\nOne day, Tom and Spot went for a walk in the forest. They saw a spoiled little girl named Lily. She was crying. Tom asked, \"Why are you crying, Lily?\"\nLily said, \"I lost my toy in the forest and I can't find it.\" Tom and Spot wanted to help. They looked all around the forest. Finally, Spot found the toy and gave it to Lily.\nLily was very happy and said, \"Thank you, Tom and Spot!\" After that, they all became good friends. Tom, Spot, and Lily would play together and make fun things in the cabin. They lived happily ever after.",
    "telugu_text": "ఒకప్పుడు, ఒక పెద్ద అడవిలో, ఒక చిన్న గుడిసె ఉండేది. ఆ గుడిసెలో టామ్ అనే దయగల మనిషి మరియు అతని చిన్న కుక్క స్పాట్ అనే కుక్క ఉండేవి. వాళ్ళు కలిసి ఆడుకోవడానికి, వస్తువులు చేయడానికి చాలా ఇష్టపడేవారు.\nఒక రోజు, టామ్ మరియు స్పాట్ అడవిలో నడవడానికి వెళ్లారు. వాళ్ళు లిల్లీ అనే చిన్న పాపను చూశారు. ఆమె ఏడుస్తోంది. టామ్, \"లిల్లీ, నువ్వెందుకు ఏడుస్తున్నావు?\" అని అడిగాడు.\nలిల్లీ, \"నేను నా బొమ్మను అడవిలో పోగొట్టుకున్నాను, దాన్ని కనుక్కోలేకపోతున్నాను,\" అంది. టామ్ మరియు స్పాట్ సహాయం చేయాలనుకున్నారు. వాళ్ళు అడవి అంతా చూశారు. చివరికి, స్పాట్ ఆ బొమ్మను కనుగొని లిల్లీకి ఇచ్చింది.\nలిల్లీ చాలా సంతోషించింది మరియు, \"ధన్యవాదాలు, టామ్ మరియు స్పాట్!\" అంది. ఆ తర్వాత, వాళ్ళు అందరూ మంచి స్నేహితులు అయ్యారు. టామ్, స్పాట్ మరియు లిల్లీ కలిసి గుడిసెలో ఆడుకుంటూ, సరదాగా పనులు చేసేవారు. వాళ్ళు సంతోషంగా ఆనందంగా జీవించారు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-079",
    "english_text": "Once upon a time, there was a cow. She was brown. Every day the cow would go to the meadow and eat the grass until she was full.\nOne day, a farmer saw the cow and said to her, \"Do you want to marry me?\" The cow looked around, but she didn't know how to say yes or no.\nBut then she remembered that she was supposed to say, \"Moo!\" So the cow said \"Moo!\" and the farmer took her away to his house.\nAt the house, the farmer made the cow a nice home and fed her fresh grass every day. She was happy and the farmer was happy too.\nAnd that was how the cow and the farmer got married. They both lived happily ever after. The end.",
    "telugu_text": "ఒకప్పుడు, ఒక ఆవు ఉండేది. అది గోధుమ రంగులో ఉండేది. ప్రతిరోజూ ఆ ఆవు గడ్డి తినడానికి మైదానానికి వెళ్ళేది, కడుపు నిండినంత వరకు.\nఒక రోజు, ఒక రైతు ఆ ఆవును చూసి, \"నువ్వు నాతో పెళ్లి చేసుకోవాలనుకుంటున్నావా?\" అని అడిగాడు. ఆ ఆవు చుట్టూ చూసింది, కానీ 'అవును' లేదా 'కాదు' అని ఎలా చెప్పాలో తెలియలేదు.\nఅప్పుడు దానికి 'మూ' అని చెప్పాలని గుర్తుకు వచ్చింది. కాబట్టి ఆ ఆవు \"మూ\" అంది, రైతు ఆమెను తన ఇంటికి తీసుకెళ్ళాడు.\nఇంటిలో, రైతు ఆ ఆవుకు మంచి ఇల్లు కట్టాడు, ప్రతిరోజూ తాజా గడ్డి తినిపించాడు. అది సంతోషంగా ఉండేది, రైతు కూడా సంతోషంగా ఉన్నాడు.\nఅలా ఆ ఆవు, రైతు పెళ్లి చేసుకున్నారు. వాళ్లిద్దరూ సంతోషంగా ఎప్పటికీ నివసించారు. ముగింపు."
   }

  "TB32": [
   {
    "order_in_batch": 1,
    "item_id": "T-001",
    "english_text": "Once upon a time, there was a nosy bee named Paul. He and his friends lived in a hive close to a meadow. One day, Paul and his friends decided to visit the meadow. \nWhen Paul and the rest of the bees reached the meadow, there were many flowers. Paul was so excited he started buzzing around the meadow. His bee friends were all enjoying their time. \nSuddenly, Paul noticed a meandering ant walking on the grass. Paul flew over to the ant and said, \"Hello! What's your name? I'm Paul.\" \nThe ant said, \"My name is Antony. It's nice to meet you. Where are you visiting from?\" \nPaul replied, \"We're visiting from our hive nearby. We wanted to explore and look at the pretty flowers. Would you like to join us?\" \nAntony smiled. \"I would love to join you,\" he said. \nAnd with that, Paul and the rest of his bee friends flew off with Antony the ant to explore the meadow some more.",
    "telugu_text": "ఒకప్పుడు, పాల్ అనే చిలిపి తేనెటీగ ఉండేది. అతను మరియు అతని స్నేహితులు ఒక పొలమ దగ్గర ఉన్న తేనెపట్టులో నివసించేవారు. ఒక రోజు, పాల్ మరియు అతని స్నేహితులు పొలాన్ని చూడాలని నిర్ణయించుకున్నారు.\nపాల్ మరియు మిగతా తేనెటీగలు పొలానికి చేరుకున్నప్పుడు, అక్కడ చాలా పువ్వులు ఉన్నాయి. పాల్ చాలా ఉత్సాహపడ్డాడు, అతను పొలంలో చుట్టూ తిరగడం మొదలుపెట్టాడు. అతని తేనె స్నేహితులు అందరూ వారి సమయాన్ని ఆనందిస్తున్నారు.\nఅకస్మాత్తుగా, పాల్ గడ్డిపై నడుస్తున్న ఒక గెంతుతున్న చీమను గమనించాడు. పాల్ ఆ చీమ దగ్గరకు ఎగిరి, \"హలో! నీ పేరు ఏమిటి? నేను పాల్.\" అన్నాడు.\nచీమ, \"నా పేరు ఆంటొనీ. నిన్ను కలవడం సంతోషంగా ఉంది. నువ్వు ఎక్కడి నుండి వస్తున్నావు?\" అన్నాడు.\nపాల్, \"మేము మా దగ్గరలోని తేనెపట్టు నుండి వస్తున్నాము. మేము అన్వేషించాలని మరియు అందమైన పువ్వులను చూడాలని అనుకున్నాము. నువ్వు మాతో చేరాలనుకుంటున్నావా?\" అని బదులిచ్చాడు.\nఆంటొనీ నవ్వాడు. \"నేను నీతో చేరడానికి చాలా సంతోషిస్తాను,\" అన్నాడు.\nఅలా, పాల్ మరియు అతని మిగతా తేనె స్నేహితులు ఆంటొనీ చీమతో కలిసి పొలాన్ని ఇంకొంచెం అన్వేషించడానికి ఎగిరిపోయారు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-087",
    "english_text": "Tom likes to play with his computer. He has many games and pictures on it. He can make sounds and colors with it. He thinks his computer is very interesting.\nOne day, his friend Anna comes to his house. She wants to play with him. She sees his computer and asks, \"What is that?\"\nTom says, \"This is my computer. It is fun. Do you want to try?\"\nAnna nods and sits next to him. Tom shows her how to use the mouse and the keyboard. He opens a game with animals. They can click on the animals and hear their noises.\nAnna likes the game. She clicks on a cow and hears it moo. She laughs and says, \"That is funny. The cow says moo.\"\nTom smiles and says, \"Yes, it does. And the duck says quack. And the dog says woof.\"\nThey play with the computer for a long time. They learn many animal sounds and names. They have a lot of fun. They think the computer is very interesting.",
    "telugu_text": "టామ్ తన కంప్యూటర్తో ఆడుకోవడానికి ఇష్టపడతాడు. దానిపై చాలా ఆటలు, బొమ్మలు ఉన్నాయి. అది దానితో శబ్దాలు, రంగులు చేయగలదు. తన కంప్యూటర్ చాలా ఆసక్తికరంగా ఉందని అతను అనుకుంటాడు.\nఒక రోజు, అతని స్నేహితురాలు అన్నా అతని ఇంటికి వస్తుంది. ఆమె అతనితో ఆడుకోవాలనుకుంటుంది. ఆమె అతని కంప్యూటర్ను చూసి, \"అది ఏమిటి?\" అని అడుగుతుంది.\nటామ్, \"ఇది నా కంప్యూటర్. ఇది సరదాగా ఉంటుంది. నువ్వు ప్రయత్నించాలనుకుంటున్నావా?\" అని చెప్తాడు.\nఅన్నా తల ఊపి, అతని పక్కన కూర్చుంటుంది. టామ్ ఆమెకు మౌస్, కీబోర్డ్ ఎలా ఉపయోగించాలో చూపిస్తాడు. అతను జంతువులతో ఒక ఆట తెరుస్తాడు. వారు జంతువులపై క్లిక్ చేసి వాటి శబ్దాలు వినవచ్చు.\nఅన్నా ఆ ఆటను ఇష్టపడుతుంది. ఆమె ఒక ఆవుపై క్లిక్ చేసి అది 'మౌ' అని వింటుంది. ఆమె నవ్వుతూ, \"అది సరదాగా ఉంది. ఆవు 'మౌ' అంటుంది,\" అంటుంది.\nటామ్ నవ్వి, \"అవును, అది అలానే. మరియు ఆ నెమలి 'క్వాక్' అంటుంది. మరియు కుక్క 'వూఫ్' అంటుంది,\" అని చెప్తాడు.\nవారు చాలా సేపు కంప్యూటర్తో ఆడుకుంటారు. వారు చాలా జంతువుల శబ్దాలు, పేర్లు నేర్చుకుంటారు. వారికి చాలా సరదాగా ఉంటుంది. వారు కంప్యూటర్ చాలా ఆసక్తికరంగా ఉందని అనుకుంటారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-160",
    "english_text": "One morning, Tom woke up early. He felt happy because today was a sunny day. He put on his clothes and went to play outside.\nWhile playing, Tom saw a big, scary bug. He was scared at first, but then he remembered that bugs can be friends too. So, he smiled at the bug and said, \"Hello, bug!\"\nThe bug smiled back at Tom. They played together all morning. The scary bug was not so scary after all. They became good friends and had lots of fun.",
    "telugu_text": "ఒక ఉదయం, టామ్ త్వరగా లేచాడు. ఈ రోజు సూర్యరశ్మి ఉన్నందున అతను సంతోషంగా ఉన్నాడు. అతను తన బట్టలు వేసుకుని బయటకు ఆడటానికి వెళ్ళాడు.\nఆడుకుంటూ, టామ్ ఒక పెద్ద, భయంకరమైన కీటకాన్ని చూశాడు. మొదట అతను భయపడ్డాడు, కానీ ఆ తర్వాత కీటకాలు కూడా స్నేహితులు కాగలవని అతనికి గుర్తుకొచ్చింది. కాబట్టి, అతను ఆ కీటకానికి నవ్వి, \"హలో, కీటకా!\" అన్నాడు.\nఆ కీటకం టామ్కు తిరిగి నవ్వింది. వారు ఆ ఉదయం మొత్తం కలిసి ఆడుకున్నారు. ఆ భయంకరమైన కీటకం అంత భయంకరంగా లేదు. వారు మంచి స్నేహితులు అయ్యారు మరియు చాలా సరదాగా గడిపారు."

   {
    "order_in_batch": 4,
    "item_id": "T-141",
    "english_text": "Once upon a time, there was a nice boy named Tim. Tim had a big book to study. He liked to study a lot. But one day, Tim lost his book. He looked everywhere but could not find it. Tim was sad.\nTim's friend, Max, saw Tim was sad. Max wanted to help Tim. Max had a bag with a zip. He opened the zip and took out a book. Max gave the book to Tim. Tim was happy to have a book to study again.\nBut the book Max gave Tim was not the same. Tim tried to study, but it was hard. He missed his old book. Tim and Max looked for the old book together. They found it under Tim's bed. Tim was very happy. Now, Tim could study his nice old book and play with his friend Max.",
    "telugu_text": "ఒకప్పుడు, టిమ్ అనే మంచి అబ్బాయి ఉండేవాడు. టిమ్కి చదవడానికి ఒక పెద్ద పుస్తకం ఉండేది. అతనికి చాలా చదవడం అంటే ఇష్టం. కానీ ఒక రోజు, టిమ్ తన పుస్తకాన్ని పోగొట్టుకున్నాడు. అతను అన్ని చోట్లా వెతికాడు కానీ దొరకలేదు. టిమ్ బాధపడ్డాడు.\nటిమ్ స్నేహితుడు, మాక్స్, టిమ్ బాధగా ఉన్నాడు చూశాడు. మాక్స్ టిమ్కి సహాయం చేయాలనుకున్నాడు. మాక్స్ దగ్గర జిప్ ఉన్న బ్యాగ్ ఉండేది. అతను జిప్ తెరిచి ఒక పుస్తకాన్ని తీశాడు. మాక్స్ ఆ పుస్తకాన్ని టిమ్కి ఇచ్చాడు. మళ్లీ చదవడానికి పుస్తకం దొరికినందుకు టిమ్ సంతోషించాడు.\nకానీ మాక్స్ టిమ్కి ఇచ్చిన పుస్తకం పాతది కాదు. టిమ్ చదవడానికి ప్రయత్నించాడు, కానీ అది కష్టంగా ఉంది. అతనికి తన పాత పుస్తకం గుర్తొచ్చింది. టిమ్ మరియు మాక్స్ కలిసి పాత పుస్తకాన్ని వెతికారు. అది టిమ్ మంచం కింద దొరికింది. టిమ్ చాలా సంతోషించాడు. ఇప్పుడు, టిమ్ తన మంచి పాత పుస్తకాన్ని చదవగలడు మరియు తన స్నేహితుడు మాక్స్తో ఆడుకోగలడు."
   },

    "item_id": "T-152",
    "english_text": "Once upon a time, in a big forest, there was a long tunnel. Many animals lived near the tunnel. One day, a little girl named Amy went to the forest to play.\nAmy saw a big, sour lemon stuck in the tunnel. She wanted to help the animals. She tried to release the lemon, but it was too big for her small hands. She needed help.\nAmy asked her friend, a strong bear, to help her. The bear used his big paws to release the lemon from the tunnel. The animals were happy, and they all played together in the forest.",
    "telugu_text": "ఒకప్పుడు, ఒక పెద్ద అడవిలో, ఒక పొడవైన సొరంగం ఉండేది. చాలా జంతువులు ఆ సొరంగం దగ్గర నివసించేవి. ఒక రోజు, ఏమీ అనే చిన్న అమ్మాయి ఆడుకోవడానికి అడవికి వెళ్లింది.\nఏమీ సొరంగంలో అంటుకున్న పెద్ద, పుల్లని నిమ్మకాయను చూసింది. ఆమె జంతువులకు సహాయం చేయాలనుకుంది. ఆమె నిమ్మకాయను బయటకు తీయడానికి ప్రయత్నించింది, కానీ అది ఆమె చిన్న చేతులకు చాలా పెద్దదిగా ఉంది. ఆమెకు సహాయం కావాలి.\nఏమీ తన స్నేహితుడు అయిన బలమైన ఎలుగుబంటికి సహాయం అడిగింది. ఆ ఎలుగుబంటి తన పెద్ద పాదాలతో సొరంగం నుండి నిమ్మకాయను బయటకు తీశాడు. జంతువులు సంతోషపడ్డాయి, మరియు అన్నీ కలిసి అడవిలో ఆడుకున్నాయి."

  "TB33": [
   {
    "order_in_batch": 1,
    "item_id": "T-153",
    "english_text": "Once upon a time, in a small town near the sea, there lived a little girl named Lily. Lily loved to play near the water when the tide went in and out. One day, she saw a fancy crab with a big, shiny shell. The crab was dancing on the sand.\n\"Hello, Mr. Crab!\" said Lily. \"Why are you dancing?\"\n\"Hi, Lily!\" said the crab. \"I am dancing because today is my birthday. I want to celebrate with my friends.\"\nLily wanted to help the crab celebrate. She put on her fanciest dress and invited all the crab's friends to the beach. They played games, ate yummy treats, and danced together. The tide went in and out, and they all had a great time. The crab was very happy that Lily helped him celebrate his special day.",
    "telugu_text": "ఒకప్పుడు, సముద్రం దగ్గర ఉన్న ఒక చిన్న పట్టణంలో, లిల్లీ అనే ఒక చిన్న అమ్మాయి ఉండేది. జలము ఒడ్డుకు వచ్చి వెళ్ళేటప్పుడు లిల్లీ నీటి దగ్గర ఆడుకోవడం అంటే చాలా ఇష్టం. ఒక రోజు, ఆమెకు పెద్ద, మెరిసే పెంకు ఉన్న ఒక అందమైన తాబేలు కనిపించింది. ఆ తాబేలు ఇసుకపై నాట్యం చేస్తుండగా ఉంది.\n\"హలో, తాబేలు గారూ!\" అంది లిల్లీ. \"నువ్వు ఎందుకు నాట్యం చేస్తున్నావు?\"\n\"హాయ్, లిల్లీ!\" అంది తాబేలు. \"నేను నా పుట్టినరోజు కాబట్టి నాట్యం చేస్తున్నాను. నేను నా స్నేహితులతో జరుపుకోవాలనుకుంటున్నాను.\"\nలిల్లీ తాబేలును జరుపుకోవడానికి సహాయం చేయాలనుకుంది. ఆమె తన అందమైన దుస్తులు వేసుకుని, అన్ని తాబేలు స్నేహితులను బీచ్కు ఆహ్వానించింది. వారు ఆటలు ఆడారు, రుచికరమైన స్నాక్స్ తిన్నారు, మరియు కలిసి నాట్యం చేశారు. జలము ఒడ్డుకు వచ్చి వెళ్ళింది, మరియు వారందరూ చాలా సరదాగా గడిపారు. లిల్లీ తన ప్రత్యేకమైన రోజును జరుపుకోవడానికి తాబేలుకు సహాయం చేసినందుకు చాలా సంతోషించింది."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-070",
    "english_text": "One day, a little boy named Tim went to the beach with his mom. The sun was shining and the sky was blue. Tim saw the waves in the water and wanted to play with them. He asked his mom, \"Can I go play in the waves, please?\"\nHis mom said, \"Yes, but be careful, Tim!\" So, Tim ran to the water and started to jump and splash in the waves. He had so much fun. He saw a quiet spot on the sand and decided to take a break.\nWhile he was sitting in the quiet spot, a little girl named Sue came up to him. She said, \"Hi! I want to play in the waves too. Can I play with you?\" Tim smiled and said, \"Yes, let's play together!\" They both ran back to the water and played in the waves until the sun went down.",
    "telugu_text": "ఒక రోజు, టిమ్ అనే చిన్న పిల్లాడు తన అమ్మతో బీచ్కు వెళ్ళాడు. సూర్యుడు ప్రకాశిస్తున్నాడు, ఆకాశం నీలంగా ఉంది. టిమ్ నీటిలో వచ్చే అలలను చూసి వాటితో ఆడుకోవాలని అనుకున్నాడు. అతను తన అమ్మను అడిగాడు, \"దయచేసి నేను అలల్లో ఆడుకోవచ్చా?\"\nఅతని అమ్మ అంది, \"అవును, కానీ జాగ్రత్తగా ఉండు, టిమ్!\" అలా, టిమ్ నీటిలోకి పరిగెత్తి అలల్లో దూకడం, చిలకడం మొదలుపెట్టాడు. అతనికి చాలా సరదాగా అనిపించింది. అతను ఇసుకలో ఒక ప్రశాంతమైన చోటును చూసి, విరామం తీసుకోవాలని నిర్ణయించుకున్నాడు.\nఅతను ఆ ప్రశాంతమైన చోట కూర్చున్నప్పుడు, సూ అనే చిన్న అమ్మాయి అతని దగ్గరకు వచ్చింది. ఆమె అంది, \"హాయ్! నాకు కూడా అలల్లో ఆడాలని ఉంది. నేను నీతో ఆడుకోవచ్చా?\" టిమ్ నవ్వి, \"అవును, మనం కలిసి ఆడుకుందాం!\" వాళ్లిద్దరూ మళ్లీ నీటిలోకి పరిగెత్తి సూర్యుడు అస్తమించే వరకు అలల్లో ఆడుకున్నారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-029",
    "english_text": "One day, a long, long time ago, there was a little bird named Bobo. Bobo loved to fly high in the sky. He felt like he belonged there, with the clouds and the sun.\nOne day, Bobo met a new friend named Lulu. Lulu was a tiny bug who wanted to see the sky too. Bobo said, \"Lulu, I can take you up to the sky!\" Lulu was very happy and climbed on Bobo's back.\nAs they went up, up, up into the sky, something unexpected happened! Bobo and Lulu found a big, shiny star. The star said, \"Hello, I am Starry! I am lost. Can you help me go back to the night sky?\"\nBobo and Lulu looked at each other and said, \"Yes, Starry! We will help you!\" So, they all went on a long journey to find the night sky. When they finally found it, Starry was so happy, and Bobo and Lulu felt like they belonged in the sky too. From that day on, they all became the best of friends, and they played together in the sky every day.",
    "telugu_text": "ఒక రోజు, చాలా చాలా కాలం క్రితం, బాబో అనే ఒక చిన్న పక్షి ఉండేది. బాబోకి ఆకాశంలో ఎత్తుకు ఎగరడం అంటే చాలా ఇష్టం. మేఘాలు, సూర్యునితో తాను అక్కడే ఉన్నానని అతనికి అనిపించేది.\nఒక రోజు, బాబో ఒక కొత్త స్నేహితురాలైన లూలూని కలిశాడు. లూలూ ఒక చిన్న కీటకం, కూడా ఆకాశాన్ని చూడాలని కోరుకుంది. బాబో, \"లూలూ, నేను నిన్ను ఆకాశానికి తీసుకెళ్లగలను!\" లూలూ చాలా సంతోషించి బాబో వీపుపైకి ఎక్కింది.\nవారు పైకి, పైకి, పైకి ఆకాశంలోకి వెళ్తున్నప్పుడు, ఏదో ఊహించనిది జరిగింది! బాబో, లూలూ ఒక పెద్ద, మెరిసే నక్షత్రాన్ని కనుగొన్నారు. ఆ నక్షత్రం, \"హలో, నేను స్టార్రీని! నేను తప్పిపోయాను. రాత్రి ఆకాశానికి తిరిగి వెళ్లడానికి మీరు నాకు సహాయం చేయగలరా?\" అంది.\nబాబో, లూలూ ఒకరినొకరు చూసుకుని, \"అవును, స్టార్రీ! మేము నీకు సహాయం చేస్తాము!\" అని అన్నారు. అలా, వారు రాత్రి ఆకాశాన్ని కనుగొనడానికి ఒక సుదీర్ఘ ప్రయాణం చేశారు. చివరికి వారు దాన్ని కనుగొన్నప్పుడు, స్టార్రీ చాలా సంతోషించాడు, బాబో, లూలూ కూడా ఆకాశంలో ఉన్నట్లు భావించారు. ఆ రోజు నుండి, వారు అందరూ మంచి స్నేహితులు అయ్యారు, మరియు ప్రతిరోజూ ఆకాశంలో కలిసి ఆడుకున్నారు."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-192",
    "english_text": "Once upon a time, there was a messy room. In this room, there was a magazine. The magazine was on the floor. A little boy named Tim lived in this house. Tim liked to look at the pictures in the magazine. He did not like to clean his room.\nOne day, Tim's mom told him to clean his room. She said, \"Please pick up the magazine and put it away.\" Tim did not want to, but he did it anyway. He put the magazine on a shelf. Then, he went to play outside.\nWhen Tim came back, he saw the magazine on the floor again. He thought, \"How did it get there?\" He picked it up and put it back on the shelf. He went to play again. When he came back, the magazine was on the floor again! He was confused.\nTim asked his mom, \"Why does the magazine keep falling?\" His mom smiled and said, \"It is because you put it on the edge of the shelf. It does not remain there.\" Tim learned that he needed to put things away better. So, he put the magazine in a safer place, and it remained there. And from that day on, Tim's room was not so messy anymore.",
    "telugu_text": "ఒకప్పుడు, ఒక గది చాలా అస్తవ్యస్తంగా ఉండేది. ఈ గదిలో ఒక మ్యాగజైన్ ఉండేది. ఆ మ్యాగజైన్ నేలపై ఉంది. టిమ్ అనే ఒక చిన్న పిల్లాడు ఈ ఇంట్లో ఉండేవాడు. టిమ్కి మ్యాగజైన్లో ఉన్న బొమ్మలు చూడటం అంటే ఇష్టం. తన గదిని శుభ్రం చేయడం అంటే అతనికి ఇష్టం లేదు.\nఒక రోజు, టిమ్ అమ్మ తన గదిని శుభ్రం చేయమని చెప్పింది. ఆమె, \"దయచేసి మ్యాగజైన్ను తీసుకుని, దాన్ని పక్కన పెట్టు,\" అంది. టిమ్కి అది చేయాలని అనిపించలేదు, కానీ అతను అదే చేశాడు. అతను మ్యాగజైన్ను ఒక షెల్ఫ్పై పెట్టాడు. ఆ తర్వాత, అతను బయట ఆడుకోవడానికి వెళ్ళాడు.\nటిమ్ తిరిగి వచ్చినప్పుడు, అతను మ్యాగజైన్ మళ్ళీ నేలపై చూశాడు. అతను అనుకున్నాడు, \"అది ఎలా అక్కడకు వచ్చింది?\" అతను దాన్ని తీసుకుని మళ్ళీ షెల్ఫ్పై పెట్టాడు. అతను మళ్ళీ ఆడుకోవడానికి వెళ్ళాడు. అతను తిరిగి వచ్చినప్పుడు, మ్యాగజైన్ మళ్ళీ నేలపై ఉంది! అతను గందరగోళపడ్డాడు.\nటిమ్ తన అమ్మను అడిగాడు, \"మ్యాగజైన్ ఎందుకు పడిపోతూ ఉంటుంది?\" అతని అమ్మ నవ్వి, \"నువ్వు దాన్ని షెల్ఫ్ అంచున పెట్టావు. అది అక్కడ ఉండదు,\" అంది. టిమ్ తన వస్తువులను సరిగ్గా పెట్టాలని నేర్చుకున్నాడు. కాబట్టి, అతను మ్యాగజైన్ను సురక్షితమైన చోట పెట్టాడు, అది అక్కడ అలాగే ఉండిపోయింది. ఆ రోజు నుండి, టిమ్ గది అంత అస్తవ్యస్తంగా లేదు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-117",
    "english_text": "Once upon a time, there was a little fish named Fin. Fin loved to swim all day long. One day, a big storm came to the sea. The storm had loud thunder that scared poor Fin.\nFin swam very fast to find a safe place to hide. He found a big rock and swam under it. The thunder was not as loud under the rock. Fin felt better now.\nAfter the storm was gone, Fin swam out from under the rock. The sun was shining and it was a beautiful day. Fin was happy to swim and play with his friends again. And they all lived happily ever after.",
    "telugu_text": "ఒకప్పుడు, ఫిన్ అనే చిన్న చేప ఉండేది. ఫిన్ రోజంతా ఈదడానికి చాలా ఇష్టం. ఒకరోజు, సముద్రంలో పెద్ద తుఫాను వచ్చింది. ఆ తుఫానులో పెద్ద గర్జన ఉండేది, అది పేదమైన ఫిన్ను భయపెట్టింది.\nఫిన్ సురక్షితంగా దాక్కోవడానికి చాలా వేగంగా ఈదాడు. అది ఒక పెద్ద రాయిని కనుగొని, దాని కింద ఈదాడు. రాయి కింద గర్జన అంత పెద్దగా లేదు. ఫిన్కు ఇప్పుడు మంచి అనుభూతి కలిగింది.\nతుఫాను పోయిన తర్వాత, ఫిన్ రాయి కింద నుండి బయటకు ఈదాడు. సూర్యుడు ప్రకాశిస్తున్నాడు, అది చాలా అందమైన రోజు. ఫిన్ తన స్నేహితులతో మళ్లీ ఈదడానికి, ఆడుకోవడానికి సంతోషపడ్డాడు. వాళ్ళందరూ సంతోషంగా ఎప్పటికీ నివసించారు."
   }

  "TB34": [
   {
    "order_in_batch": 1,
    "item_id": "T-149",
    "english_text": "Once upon a time there was a dependable princess. She lived in a castle and wanted to get her own pet. So, she asked her father the King if he would get her a pet. \nThe King said, \"No. I don't think we can get a pet, princess.\" But the princess was determined. \n\"Please, Daddy,\" said the princess, \"I promise I'll be dependable. I'll take care of it.\"\nThe King smiled. He knew his princess was dependable. So he agreed, \"Okay. Let's get a pet.\"\nThe dependable princess was so happy, she jumped for joy. Together with the King, they went to get their pet.\nThe End.",
    "telugu_text": "ఒకానొకప్పుడు ఒక నమ్మకమైన రాణి ఉండేది. ఆమె ఒక కోటలో నివసించేది మరియు తన సొంత పెంపుడు జంతువును పొందాలని కోరుకుంది. కాబట్టి, ఆమె తన తండ్రికి రాజుగారిని తన కోసం ఒక పెంపుడు జంతువు తీసుకురావాలని అడిగింది.\nరాజు, \"లేదు. మనం ఒక పెంపుడు జంతువును పొందలేము, రాణీ,\" అన్నారు. కానీ రాణి దృఢంగా ఉంది.\n\"దయచేసి, నాన్న,\" అంది రాణి, \"నేను నమ్మకమైనదాన్ని అవుతాను. నేను దానిని చూసుకుంటాను.\"\nరాజు నవ్వారు. తన రాణి నమ్మకమైనదని ఆయనకు తెలుసు. కాబట్టి ఆయన అంగీకరించారు, \"సరే. మనం ఒక పెంపుడు జంతువును తీసుకుందాం.\"\nఆ నమ్మకమైన రాణి చాలా సంతోషించింది, ఆమె ఆనందంతో గెంతుతూ ఉలిగింది. రాజుతో కలిసి, వారు వారి పెంపుడు జంతువును తీసుకురావడానికి వెళ్లారు.\nశుభం."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-174",
    "english_text": "Once upon a time, there was a lively dog named Spot. Spot loved to run and play all day long. He had a big yard where he could have fun. But one day, Spot saw something new outside his yard. It was a shiny thing called a license.\nSpot wanted the license, but he knew he was not allowed to leave his yard. He looked at the license and then at his yard. Spot was sad because he could not get the license. He wanted it so much.\nOne day, Spot's friend, a bird named Tweet, came to visit. Spot told Tweet about the license. Tweet flew up high and got the license for Spot. Spot was very happy and loved his new license. He played with it all day long. And Spot and Tweet became best friends forever.",
    "telugu_text": "ఒకప్పుడు, స్పాట్ అనే ఉల్లాసమైన కుక్క ఉండేది. స్పాట్ రోజంతా పరుగెత్తడానికి, ఆడుకోవడానికి చాలా ఇష్టపడేది. తనకి సరదాగా ఉండే పెద్ద తోట ఉండేది. కానీ ఒక రోజు, స్పాట్ తన తోట బయట ఏదో కొత్తది చూశాడు. అది లైసెన్స్ అనే మెరిసే వస్తువు.\nస్పాట్కి ఆ లైసెన్స్ కావాలి, కానీ తన తోటను వదిలి వెళ్లడానికి అనుమతి లేదని అతనికి తెలుసు. స్పాట్ ఆ లైసెన్స్ను, ఆపై తన తోట వైపు చూశాడు. లైసెన్స్ దొరకక స్పాట్ బాధపడ్డాడు. అతనికి అది చాలా కావాలి.\nఒక రోజు, స్పాట్ స్నేహితుడు, ట్విట్ అనే పక్షి వచ్చి సందర్శించడానికి వచ్చింది. స్పాట్ ట్విట్కి ఆ లైసెన్స్ గురించి చెప్పాడు. ట్విట్ ఎత్తుకు ఎగిరి స్పాట్ కోసం ఆ లైసెన్స్ను తీసుకువచ్చింది. స్పాట్ చాలా సంతోషించాడు, తన కొత్త లైసెన్స్ను ప్రేమించాడు. అతను రోజంతా దానితో ఆడుకున్నాడు. స్పాట్, ట్విట్ ఎప్పటికీ మంచి స్నేహితులు అయ్యారు."
   },
   {

    "telugu_text": "ఒకప్పుడు, లూసీ అనే ఒక చిన్న అమ్మాయి ఉండేది. ఆమె తన బొమ్మలతో ఆడుకోవడం అంటే చాలా ఇష్టం. ఆమె దగ్గర వాటితో నిండిన ఒక పెద్ద పెట్టె ఉండేది. ఒక రోజు, లూసీ తన బొమ్మ పెట్టెలో మెరిసే సూదిని చూసింది. అది ఎలా అక్కడకు వచ్చిందో ఆమెకు తెలియదు. ఆమె దాన్ని తీయాలని అనుకుంది, కానీ ఆమె అమ్మ సూదులతో ఆడుకోవడం సురక్షితం కాదని చెప్పింది.\nలూసీ అమ్మ ఆ సూదిని తీసివేసి, బదులుగా ఒక పెద్ద, మెత్తని టెడ్డీ బేర్ను ఇచ్చింది. లూసీ ఆ టెడ్డీ బేర్కి మిస్టర్ కడ్ల్స్ అని పేరు పెట్టింది. వాళ్ళు రోజంతా కలిసి ఆడుకున్నారు. లూసీకి కొత్త స్నేహితురాలు దొరకడం చాలా సంతోషంగా అనిపించింది. మిస్టర్ కడ్ల్స్ తన ఇతర బొమ్మలలాగా అల్లరి చేయలేదు.\nఒక రోజు, లూసీ మరియు మిస్టర్ కడ్ల్స్ తన ఇతర బొమ్మలతో టీ పార్టీ చేసుకున్నారు. వాళ్ళు అందరూ ఒక చిన్న టేబుల్ చుట్టూ కూర్చుని, నకిలీ టీ మరియు కుకీలు తిన్నారు. లూసీ మిస్టర్ కడ్ల్స్పై ఏమీ పోకుండా చాలా జాగ్రత్తగా ఉంది. తన ఇతర బొమ్మలలాగా అతన్ని అల్లరి చేయకూడదని ఆమె అనుకుంది. వాళ్ళు అందరూ సంతోషంగా ఎప్పటికీ నివసించారు."

    "order_in_batch": 2,
    "item_id": "T-039",
    "english_text": "Once upon a time, there lived a tall, white bear. The bear was always very hungry and so he looked for food all day in his wide forest. One day the bear came across a yummy berry bush. The bear was delighted and ate all of the berries. When he had eaten all of the berries, the bear found that he was still hungry.\nThe bear looked around and saw a beehive nearby. He thought to himself, \"If I eat the honey from this hive, I won't be so hungry!\" So he grabbed the beehive and tried to cover it with his big paws but the hive was too big and he couldn't cover it completely. \nSuddenly, the beekeeper came out of the beehouse and saw the bear with his hive. The beekeeper shouted, \"What are you doing with my hive! Give it back right now!\" \nThe bear tried to explain, but it was too late. The beekeeper was very angry and took the bear away to the police station.\nThe moral of this story is that it is not okay to take something which is not yours, even if you are very hungry. Always remember to take only what is yours!",
    "telugu_text": "ఒకానొకప్పుడు, ఒక పొడవాటి, తెల్లటి ఎలుగుబంటి ఉండేది. ఆ ఎలుగుబంటి ఎప్పుడూ చాలా ఆకలితో ఉండేది, అందుకే అది రోజంతా తన పెద్ద అడవిలో ఆహారం కోసం వెతుకుతూ ఉండేది. ఒక రోజు, ఆ ఎలుగుబంటి ఒక రుచికరమైన బెర్రీ పొదను చూసింది. ఎలుగుబంటి చాలా సంతోషించి, ఆ బెర్రీలన్నింటినీ తిన్నది. అన్ని బెర్రీలు తిన్న తర్వాత కూడా, ఎలుగుబంటికి ఇంకా ఆకలిగా అనిపించింది.\nఎలుగుబంటి చుట్టూ చూసింది, పక్కనే ఒక తేనెపట్టును చూసింది. అది తనలో తాను అనుకుంది, \"నేను ఈ తేనెపట్టు నుండి తేనె తింటే, నాకు అంత ఆకలిగా ఉండదు!\" అందుకే అది తేనెపట్టును పట్టుకుని, తన పెద్ద పాదాలతో దాన్ని కప్పడానికి ప్రయత్నించింది, కానీ ఆ పట్టు చాలా పెద్దదిగా ఉంది, అది పూర్తిగా కప్పలేకపోయింది.\nఅకస్మాత్తుగా, తేనెపట్టు నుండి తేనెపట్టుదారు బయటకు వచ్చి, తన పట్టుతో ఉన్న ఎలుగుబంటిని చూశాడు. తేనెపట్టుదారు అరిచాడు, \"నా పట్టుతో ఏం చేస్తున్నావు! దాన్ని ఇప్పుడే నాకు తిరిగి ఇవ్వు!\"\nఎలుగుబంటి వివరించడానికి ప్రయత్నించింది, కానీ చాలా ఆలస్యం అయింది. తేనెపట్టుదారు చాలా కోపంగా ఉండి, ఎలుగుబంటిని పోలీస్ స్టేషన్కు తీసుకెళ్లాడు.\nఈ కథలోని నీతి ఏమిటంటే, నువ్వు చాలా ఆకలిగా ఉన్నా, నీది కాని దేనినీ తీసుకోవడం సరికాదు. నీది అయిన దానిని మాత్రమే తీసుకోవాలని ఎప్పుడూ గుర్తుంచుకో!"

   {
    "order_in_batch": 3,
    "item_id": "T-167",
    "english_text": "One day, a big, round ball was ready to roll down the hill. The ball was very happy to roll and play. But then, the rain came. The rain made the ball wet and the hill slippery. The ball was sad, and it could not roll as fast as before.\nThe ball saw a little girl with an umbrella. She was trying to stay dry from the rain. The ball rolled to her, and she saw how sad the ball was. The girl wanted to help the ball roll again. She had an idea!\nThe girl used her umbrella to cover the ball from the rain. They started to roll down the hill together. The ball was happy again, and the girl was having fun too. They rolled and played all day, even in the rain. And they became the best of friends.",
    "telugu_text": "ఒక రోజు, ఒక పెద్ద, గుండ్రటి బంతి కొండ దిగడానికి సిద్ధంగా ఉంది. బంతి రోలింగ్ చేసి, ఆడుకోవడానికి చాలా సంతోషంగా ఉంది. కానీ అప్పుడు వర్షం వచ్చింది. వర్షం బంతిని తడిపింది, కొండ జారడానికి వీలు లేకుండా జారేలా చేసింది. బంతి విచారంగా ఉంది, అది అంత వేగంగా రోల్ కాలేదు.\nబంతి ఒక చిన్న అమ్మాయిని, ఆమె గొడుగుతో చూసింది. ఆమె వర్షం నుండి పొడిగా ఉండటానికి ప్రయత్నిస్తోంది. బంతి ఆమె దగ్గరకు రోల్ అయ్యింది, మరియు ఆమె బంతి ఎంత విచారంగా ఉందో చూసింది. అమ్మాయి బంతి మళ్లీ రోల్ అవ్వడానికి సహాయం చేయాలనుకుంది. ఆమెకు ఒక ఆలోచన వచ్చింది!\nఅమ్మాయి తన గొడుగును ఉపయోగించి బంతిని వర్షం నుండి కప్పింది. వారు కలిసి కొండ దిగడం ప్రారంభించారు. బంతి మళ్లీ సంతోషంగా ఉంది, మరియు అమ్మాయి కూడా సరదాగా ఉంది. వారు వర్షంలో కూడా రోల్ చేసి ఆడుకున్నారు. మరియు వారు మంచి స్నేహితులుగా మారారు."
   },
   {

    "telugu_text": "ఒకప్పుడు, టిమ్ అనే ఒక చిన్న పిల్లాడు ఉండేవాడు. టిమ్ చాలా విచారంగా, బాధగా ఉండేవాడు. ఆడుకోవడానికి తోడుగా ఎవరూ లేరు. ఒక రోజు, అతను మంచిగా అనిపించడానికి బయటకు నడవాలని నిర్ణయించుకున్నాడు.\nటిమ్ నడుస్తున్నప్పుడు, అతను పెద్ద గుండ్రటి హ్యాండిల్ ఉన్న ఒక తలుపును చూశాడు. ఆ తలుపు వెనుక ఏమిటో అతనికి ఆసక్తి కలిగింది. టిమ్ చేయి చాచి ఆ హ్యాండిల్ను పట్టుకున్నాడు. అతను దానిని నెమ్మదిగా తిప్పి తలుపును తెరిచాడు.\nతలుపు వెనుక, టిమ్ బొమ్మలు, ఆడుకోవడానికి కొత్త స్నేహితులు ఉన్న ఒక గదిని కనుగొన్నాడు. అతను ఇక బాధపడలేదు. అతను ఆ కొత్త స్నేహితులతో రోజంతా ఆడుకున్నాడు మరియు చాలా సరదాగా గడిపాడు. ఆ రోజు నుండి, టిమ్ ఎప్పుడూ సంతోషంగా ఉండేవాడు మరియు ఒంటరిగా భావించలేదు."

   {
    "order_in_batch": 5,
    "item_id": "T-138",
    "english_text": "Once upon a time, in a small town, there lived a helpful girl named Lily. She loved to help her friends and family. One day, Lily found a broken toy car. She wanted to fix it and make it like new again.\nLily took the toy car to her dad. He knew how to restore things. He showed Lily how to put the pieces back together. Lily was very happy to learn this. She felt proud when the toy car was fixed.\nNext, Lily made a label for the toy car. She wrote \"Lily's Toy Car\" on it. She showed the toy car to her friends. They all thought Lily was very helpful. They played with the toy car together, and they all had lots of fun.",
    "telugu_text": "ఒకానొకప్పుడు, ఒక చిన్న పట్టణంలో, లిల్లీ అనే సహాయకారి అమ్మాయి ఉండేది. ఆమె తన స్నేహితులకు, కుటుంబ సభ్యులకు సహాయం చేయడం అంటే చాలా ఇష్టం. ఒక రోజు, లిల్లీకి పగిలిన బొమ్మ కారు దొరికింది. దానిని సరిచేసి కొత్తలా చేయాలని ఆమె అనుకుంది.\nలిల్లీ ఆ బొమ్మ కారును తన నాన్న దగ్గరకు తీసుకెళ్లింది. ఆయనకు వస్తువులను ఎలా సరిచేయాలో తెలుసు. ఆయన లిల్లీకి ముక్కలను ఎలా తిరిగి అమర్చాలో చూపించారు. ఇది నేర్చుకుని లిల్లీ చాలా సంతోషించింది. బొమ్మ కారు సరిచేయబడినప్పుడు ఆమె గర్వపడింది.\nతరువాత, లిల్లీ ఆ బొమ్మ కారుకు ఒక లేబుల్ చేసింది. దానిపై \"లిల్లీ బొమ్మ కారు\" అని రాసింది. ఆమె ఆ బొమ్మ కారును తన స్నేహితులకు చూపించింది. అందరూ లిల్లీ చాలా సహాయకారి అని అనుకున్నారు. వాళ్ళు కలిసి ఆ బొమ్మ కారుతో ఆడుకున్నారు, అందరూ చాలా సరదాగా గడిపారు."

    "telugu_text": "ఒకప్పుడు, ఒక బలహీనమైన వస్తువు ఉండేది. అది పెద్దగా పెరగలేదు మరియు చాలా విచారంగా ఉండేది.\nఅప్పుడు ఒక రోజు, ఆ బలహీనమైన వస్తువు వికసించింది! ఆ బలహీనమైన వస్తువు నుండి ఒక అందమైన పువ్వు పెరిగింది. అది అద్భుతంగా రంగులమయమైనది, ప్రకాశవంతమైన గులాబీ మరియు ఊదా రేకులతో.\nఆ బలహీనమైన వస్తువు చాలా సంతోషంగా ఉంది. అది తన రేకులను వ్యాపింపజేసి సూర్యరశ్మిలో నవ్వింది.\nఆ బలహీనమైన వస్తువు ఇప్పుడు అందం మరియు సరదా వస్తువు. ప్రతి రోజు, అది మరింతగా వికసించింది. అది సూర్యుని వెచ్చదనాన్ని ఆస్వాదించింది మరియు తన కొత్త స్నేహితులతో సంతోషంగా కిలకిలమన్నది.\nఆ బలహీనమైన వస్తువు బలంగా మరియు సంతోషంగా మారింది. అది వికసించినందుకు సంతోషంగా ఉంది మరియు అందరూ కూడా సంతోషంగా ఉన్నారు."

    "english_text": "Once upon a time, there was a little girl named Mia. Mia had a big, green ball. She loved to play with her green ball every day. It was very interesting to her because it could bounce very high.\nOne day, while playing with her green ball, Mia saw a small cat. The cat was hiding behind a tree. Mia wanted to be friends with the cat. So, she went close to the cat and whispered, \"Hello, cat. I am Mia. Do you want to play with me?\"\nThe cat looked at Mia and her green ball. The cat thought it was interesting too. The cat whispered back, \"Hello, Mia. I am Tom. I would love to play with you and your green ball.\" Mia and Tom played together all day. They had so much fun with the green ball.\nFrom that day on, Mia and Tom became best friends. They played with the green ball every day. They whispered secrets to each other and laughed together. Mia and Tom were very happy to have found each other.",
    "telugu_text": "ఒకప్పుడు, మియా అనే ఒక చిన్న అమ్మాయి ఉండేది. మియా దగ్గర ఒక పెద్ద, ఆకుపచ్చ బంతి ఉండేది. ప్రతిరోజూ తన ఆకుపచ్చ బంతితో ఆడుకోవడం ఆమెకు చాలా ఇష్టం. అది చాలా ఆసక్తికరంగా ఉండేది ఎందుకంటే అది చాలా ఎత్తుకు గెంతుతుంది.\nఒక రోజు, తన ఆకుపచ్చ బంతితో ఆడుకుంటుండగా, మియా ఒక చిన్న పిల్లిని చూసింది. ఆ పిల్లి ఒక చెట్టు వెనుక దాక్కుని ఉంది. మియా ఆ పిల్లితో స్నేహం చేయాలనుకుంది. కాబట్టి, ఆమె పిల్లి దగ్గరకు వెళ్లి, \"హలో, పిల్లి. నేను మియాను. నాతో ఆడుకోవాలనుకుంటున్నావా?\" అని గుసగుసలాడింది.\nఆ పిల్లి మియాను మరియు ఆమె ఆకుపచ్చ బంతిని చూసింది. పిల్లికి కూడా అది ఆసక్తికరంగా అనిపించింది. పిల్లి తిరిగి గుసగుసలాడింది, \"హలో, మియా. నేను టామ్ను. నేను నీతో, నీ ఆకుపచ్చ బంతితో ఆడుకోవడానికి చాలా ఇష్టపడతాను.\" మియా మరియు టామ్ రోజంతా కలిసి ఆడుకున్నారు. వారు ఆ ఆకుపచ్చ బంతితో చాలా సరదాగా గడిపారు.\nఆ రోజు నుండి, మియా మరియు టామ్ మంచి స్నేహితులు అయ్యారు. వారు ప్రతిరోజూ ఆ ఆకుపచ్చ బంతితో ఆడుకున్నారు. వారు ఒకరితో ఒకరు రహస్యాలు చెప్పుకుని, కలిసి నవ్వారు. మియా మరియు టామ్ ఒకరినొకరు కనుగొన్నందుకు చాలా సంతోషంగా ఉన్నారు."

   {
    "order_in_batch": 4,
    "item_id": "T-062",
    "english_text": "Once upon a time, there was a wealthy man. He had a big house and many things. He also had a big orange tree in his yard. The tree had many big, round oranges.\nOne day, the man went for a walk. He liked to wander near his house. As he walked, he saw a little girl. She was looking at the orange tree.\nThe girl was hungry. The man saw this and felt sad. He wanted to help her. So, he picked an orange from the tree and gave it to the girl. The girl was very happy. She said, \"Thank you!\" and ate the orange.\nFrom that day on, the man and the girl became good friends. They would wander and play near the orange tree. They were both very happy.",
    "telugu_text": "ఒకప్పుడు, ఒక ధనవంతుడు ఉండేవాడు. అతనికి పెద్ద ఇల్లు, చాలా వస్తువులు ఉన్నాయి. అతని తోటలో ఒక పెద్ద నారింజ చెట్టు కూడా ఉంది. ఆ చెట్టు మీద చాలా పెద్ద, గుండ్రని నారింజలు ఉండేవి.\nఒక రోజు, ఆ మనిషి నడవడానికి వెళ్ళాడు. అతను తన ఇంటి దగ్గర తిరగడానికి ఇష్టపడేవాడు. అతను నడుస్తుండగా, ఒక చిన్న అమ్మాయిని చూశాడు. ఆమె ఆ నారింజ చెట్టు వైపు చూస్తోంది.\nఆ అమ్మాయికి ఆకలిగా ఉంది. ఆ మనిషి దీన్ని చూసి బాధపడ్డాడు. అతను ఆమెకు సహాయం చేయాలనుకున్నాడు. అందుకే, అతను చెట్టు నుండి ఒక నారింజ తీసుకుని అమ్మాయికి ఇచ్చాడు. అమ్మాయి చాలా సంతోషించింది. ఆమె, \"ధన్యవాదాలు!\" అని చెప్పి, ఆ నారింజ తిన్నది.\nఆ రోజు నుండి, ఆ మనిషి, ఆ అమ్మాయి మంచి స్నేహితులు అయ్యారు. వారు నారింజ చెట్టు దగ్గర తిరుగుతూ ఆడుకునేవారు. వాళ్ళిద్దరూ చాలా సంతోషంగా ఉండేవారు."
   },
   {

    "english_text": "Once upon a time, there was a tidy painter named Tom. Tom loved to travel and paint. One day, he went to a big park to paint pretty flowers.\nIn the park, Tom met a little girl named Sue. Sue said, \"Hi, what are you doing?\" Tom replied, \"Hello, I am a painter. I am painting flowers.\" Sue was happy and watched Tom paint.\nAs Tom painted, he kept his paints and brushes very tidy. Sue liked how neat Tom was. They had a fun day in the park, and Sue learned about painting from her new friend, the tidy painter.",
    "telugu_text": "ఒకప్పుడు, టామ్ అనే చక్కని రంగులవాడు ఉండేవాడు. టామ్ ప్రయాణించడం, చిత్రాలు గీయడం అంటే చాలా ఇష్టం. ఒక రోజు, అతను అందమైన పువ్వులు వేయడానికి ఒక పెద్ద పార్కుకు వెళ్ళాడు.\nపార్కులో, టామ్ అనే ఒక చిన్న అమ్మాయిని కలిశాడు. సూ అనే అమ్మాయి. సూ అంది, \"హాయ్, నువ్వేం చేస్తున్నావు?\" టామ్ ఇలా సమాధానం చెప్పాడు, \"హలో, నేను రంగులవాడిని. నేను పువ్వులు గీస్తున్నాను.\" సూ సంతోషంగా టామ్ గీస్తున్నది చూసింది.\nటామ్ గీస్తున్నప్పుడు, అతను తన రంగులు, బ్రష్లను చాలా చక్కగా ఉంచుకున్నాడు. టామ్ ఎంత శుభ్రంగా ఉన్నాడో సూకి నచ్చింది. వారు పార్కులో సరదాగా ఒక రోజు గడిపారు, మరియు సూ తన కొత్త స్నేహితుడు, ఆ చక్కని రంగులవాడిని నుండి చిత్రాల గురించి నేర్చుకుంది."

    "english_text": "One day, a little boy named Tim found a wallet. The wallet was huge! It was much bigger than his toy car. Tim was very excited. He wanted to show it to his mom and dad.\nHe ran to his mom and said, \"Look, mom! I found a huge wallet!\" His mom looked at the wallet and smiled. She said, \"Wow, Tim! That is a big wallet. Let's show it to your dad.\"\nTim and his mom went to find dad. When they found him, Tim said, \"Dad, look at the huge wallet I found!\" His dad looked at the wallet and was excited too. He said, \"That's great, Tim! Let's see if we can find who it belongs to.\"\nTogether, they looked for the owner of the huge wallet. They asked their friends and neighbors. Finally, they found the owner. It was their neighbor, Mr. Brown. Mr. Brown was so happy to have his wallet back. He thanked Tim and gave him a big hug.",
    "telugu_text": "ఒక రోజు, టిమ్ అనే చిన్న పిల్లాడికి ఒక వాలెట్ దొరికింది. ఆ వాలెట్ చాలా పెద్దది! అది అతని బొమ్మ కారు కంటే చాలా పెద్దది. టిమ్ చాలా సంతోషించాడు. అతను దానిని తన అమ్మ, నాన్నకు చూపించాలనుకున్నాడు.\nఅతను తన అమ్మ దగ్గరకు పరిగెత్తి, \"చూడు, అమ్మా! నాకు ఒక పెద్ద వాలెట్ దొరికింది!\" అతని అమ్మ వాలెట్ను చూసి నవ్వింది. ఆమె అంది, \"వావ్, టిమ్! అది పెద్ద వాలెట్. దానిని నీ నాన్నకు చూపిద్దాం.\"\nటిమ్, అతని అమ్మ నాన్నను వెతకడానికి వెళ్లారు. వాళ్ళని కనుగొన్నప్పుడు, టిమ్ అన్నాడు, \"నాన్నా, నేను కనుగొన్న పెద్ద వాలెట్ను చూడండి!\" అతని నాన్న వాలెట్ను చూసి కూడా ఉత్సాహపడ్డాడు. అతను అన్నాడు, \"అది చాలా బాగుంది, టిమ్! అది ఎవరిదో మనం కనుక్కోవడానికి ప్రయత్నిద్దాం.\"\nకలిసి, వాళ్ళు పెద్ద వాలెట్ యజమాని కోసం వెతికారు. వాళ్ళు తమ స్నేహితులు, పొరుగువారిని అడిగారు. చివరికి, వాళ్ళు యజమానిని కనుగొన్నారు. అది వారి పొరుగువాడు, మిస్టర్ బ్రౌన్. తన వాలెట్ తిరిగి దొరికినందుకు మిస్టర్ బ్రౌన్ చాలా సంతోషించాడు. అతను టిమ్కు ధన్యవాదాలు చెప్పి, పెద్దగా కౌగిలించుకున్నాడు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-045",
    "english_text": "One day, a brown dog went to school. He saw a big blackboard in the room. The brown dog wanted to write on the blackboard. He picked up a white stick and wrote \"zip\" on the blackboard.\nA little girl came into the room. She saw the brown dog and the word \"zip\" on the blackboard. The little girl said, \"Wow! You can write, brown dog! Can you teach me to write 'zip' too?\"\nThe brown dog nodded his head. He picked up the white stick and showed the little girl how to write \"zip\" on the blackboard. They had fun writing on the blackboard together.\nLater, the little girl and the brown dog went outside to play. They ran and played tag. They zipped around the yard, laughing and having fun. The brown dog was happy to have a new friend.\nAt the end of the day, the little girl hugged the brown dog. She said, \"Thank you for teaching me to write 'zip' on the blackboard, brown dog. You are my best friend.\" The brown dog wagged his tail and licked her face. They were both very happy.",
    "telugu_text": "ఒక రోజు, ఒక గోధుమ కుక్క స్కూల్కి వెళ్లింది. గదిలో ఒక పెద్ద నల్లబల్ల చూసింది. ఆ గోధుమ కుక్క నల్లబల్లపై రాయాలని అనుకుంది. అది ఒక తెల్లటి కర్రను తీసుకుని, నల్లబల్లపై \"జిప్\" అని రాసింది.\nఒక చిన్న అమ్మాయి గదిలోకి వచ్చింది. ఆమె గోధుమ కుక్కను, నల్లబల్లపై ఉన్న \"జిప్\" అనే పదాన్ని చూసింది. చిన్న అమ్మాయి, \"వావ్! నువ్వు రాయగలవు, గోధుమ కుక్క! నాకు కూడా 'జిప్' ఎలా రాయాలో నేర్పిస్తావా?\" అంది.\nగోధుమ కుక్క తల ఊపింది. అది తెల్లటి కర్రను తీసుకుని, చిన్న అమ్మాయికి నల్లబల్లపై \"జిప్\" ఎలా రాయాలో చూపించింది. వారు కలిసి నల్లబల్లపై రాయడం సరదాగా చేశారు.\nతరువాత, చిన్న అమ్మాయి మరియు గోధుమ కుక్క ఆడుకోవడానికి బయటకు వెళ్లారు. వారు పరుగు తీసి ట్యాగ్ గేమ్ ఆడారు. వారు తోటలో జిప్ చేస్తూ, నవ్వుతూ సరదాగా ఆడుకున్నారు. గోధుమ కుక్కకు కొత్త స్నేహితుడు దొరకడం సంతోషంగా అనిపించింది.\nఆ రోజు చివర్లో, చిన్న అమ్మాయి గోధుమ కుక్కను కౌగిలించుకుంది. ఆమె, \"నల్లబల్లపై 'జిప్' ఎలా రాయాలో నేర్పినందుకు ధన్యవాదాలు, గోధుమ కుక్క. నువ్వు నా మంచి స్నేహితుడివి,\" అంది. గోధుమ కుక్క తోక ఊపింది, ఆమె ముఖాన్ని నాలుకతో రుద్దింది. ఇద్దరూ చాలా సంతోషంగా ఉన్నారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-110",
    "english_text": "Lily liked to feed the pigeons in the park. She had a bag of bread and she broke it into small pieces. She threw the pieces on the grass and watched the pigeons come and eat. She liked their soft feathers and their cooing sounds.\nBut one day, a big dog came to the park. He saw the pigeons and he wanted to chase them. He ran towards them, barking and growling. The pigeons were scared and they flew away. They scattered in the sky, leaving the bread behind.\nLily was angry and sad. She loved the pigeons and she did not want the dog to scare them. She shouted at the dog, \"Go away, bad dog! Leave the pigeons alone!\" But the dog did not listen. He was tough and he did not care.\nLily had an idea. She picked up the bread and threw it at the dog. The bread hit the dog on the nose and the ears and the tail. The dog was surprised and he stopped barking. He did not like the bread. He shook his head and ran away.\nLily was happy and proud. She had saved the pigeons and she had scared the dog. She looked up and saw the pigeons coming back. They landed on the grass and ate the bread. They cooed and thanked Lily. Lily smiled and fed them more bread. She liked the pigeons and they liked her.",
    "telugu_text": "లిల్లీకి పార్కులో గుడ్లగూబలకు ఆహారం ఇవ్వడం అంటే చాలా ఇష్టం. ఆమె దగ్గర బ్రెడ్ సంచి ఉంది, దానిని చిన్న ముక్కలుగా చేసింది. ఆ ముక్కలను గడ్డిపై విసిరి గుడ్లగూబలు వచ్చి తినడాన్ని చూసింది. ఆమె వాటి మెత్తని ఈకలు, వాటి కూత శబ్దాలు అంటే చాలా ఇష్టం.\nకానీ ఒక రోజు, ఒక పెద్ద కుక్క పార్కుకు వచ్చింది. అది గుడ్లగూబలను చూసి వాటిని తరుముకోవాలని అనుకుంది. అది వాటి వైపు పరిగెత్తింది, మొరుగుతూ గర్జించింది. గుడ్లగూబలు భయపడ్డాయి, అవి ఎగిరిపోయాయి. అవి ఆకాశంలో చెల్లాచెదురై, బ్రెడ్ను వదిలేశాయి.\nలిల్లీ కోపంగా, విచారంగా ఉంది. ఆమెకు గుడ్లగూబలు అంటే చాలా ఇష్టం, ఆ కుక్క వాటిని భయపెట్టకూడదని ఆమె అనుకుంది. ఆమె కుక్కతో అరిచింది, \"వెళ్లిపో, చెడ్డ కుక్కా! గుడ్లగూబలకు వదిలేయ్!\" కానీ కుక్క వినలేదు. అది గట్టిగా ఉంది, దానికి పట్టించుకోలేదు.\nలిల్లీకి ఒక ఆలోచన వచ్చింది. ఆమె బ్రెడ్ను తీసుకుని కుక్కపై విసిరింది. బ్రెడ్ కుక్క ముక్కు, చెవులు, తోకపై తగిలింది. కుక్క ఆశ్చర్యపోయింది, మొరగడం ఆపింది. దానికి బ్రెడ్ నచ్చలేదు. అది తల ఊపి పారిపోయింది.\nలిల్లీ సంతోషంగా, గర్వంగా ఉంది. ఆమె గుడ్లగూబలను కాపాడుకుంది, కుక్కను భయపెట్టింది. ఆమె పైకి చూసింది, గుడ్లగూబలు తిరిగి వస్తున్నవి చూసింది. అవి గడ్డిపైకి దిగి బ్రెడ్ తిన్నాయి. అవి కూశాయి, లిల్లీకి కృతజ్ఞతలు చెప్పాయి. లిల్లీ నవ్వి వాటికి ఇంకా బ్రెడ్ ఇచ్చింది. లిల్లీకి గుడ్లగూబలు అంటే ఇష్టం, అవి కూడా ఆమెను ఇష్టపడ్డాయి."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-038",
    "english_text": "Once upon a time, there was a little dog named Spot. Spot had a hurt leg. He could not play with his friends. Spot was very sad.\nOne day, a harmless butterfly came to visit Spot. The butterfly told Spot, \"I can help you heal your leg.\" Spot was very happy. The butterfly touched Spot's leg with her wings.\nIn a few days, Spot's leg was all better. He could play with his friends again. Spot and the butterfly became best friends. And they all lived happily ever after.",
    "telugu_text": "ఒకానొకప్పుడు, స్పాట్ అనే చిన్న కుక్క ఉండేది. స్పాట్కు కాలు గాయమైంది. అది తన స్నేహితులతో ఆడుకోలేకపోయింది. స్పాట్ చాలా విచారంగా ఉండేది.\nఒక రోజు, ఒక హానిచేయని సీతాకోకచిలుక స్పాట్ను చూడడానికి వచ్చింది. సీతాకోకచిలుక స్పాట్తో, \"నేను నీ కాలు నయం చేయడంలో సహాయం చేయగలను,\" అని చెప్పింది. స్పాట్ చాలా సంతోషపడింది. సీతాకోకచిలుక తన రెక్కలతో స్పాట్ కాలును తాకింది.\nకొన్ని రోజుల్లో, స్పాట్ కాలు పూర్తిగా నయమైంది. అది మళ్లీ తన స్నేహితులతో ఆడుకోగలిగింది. స్పాట్ మరియు సీతాకోకచిలుక మంచి స్నేహితులు అయ్యారు. వాళ్ళు అందరూ సంతోషంగా జీవించారు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-113",
    "english_text": "Daniel was so excited - he was going to see Daddy's car! Daddy said it was so cool. Daddy and Daniel went outside, and there it was. A shiny red car!\n\"Oh wow!\" exclaimed Daniel.\n\"Do you like it?\" asked Daddy.\n\"Yes! It's so cool!\" said Daniel.\nDaddy said they had to do some work so the car could look even nicer. He carefully removed all the leaves and dirt that had gotten on the car. Daniel watched as Daddy scrubbed and polished the car until it looked shiny and new.\n\"There!\" said Daddy proudly. \"Now it's even cooler!\"\nDaniel smiled and clapped as he watched Daddy finish with the car. From now on, Daddy and Daniel could take it for nice rides in the country.",
    "telugu_text": "డానియెల్ చాలా ఉత్సాహంగా ఉన్నాడు - అతను నాన్న కారు చూడబోతున్నాడు! నాన్న అది చాలా బాగుంటుందని అన్నాడు. నాన్న, డానియెల్ బయటకు వెళ్లారు, అక్కడ అది ఉంది. మెరిసే ఎర్రటి కారు!\n\"ఓహ్ వావ్!\" అని డానియెల్ అరిచాడు.\n\"నీకు ఇష్టమా?\" అని నాన్న అడిగాడు.\n\"అవును! అది చాలా బాగుంది!\" అన్నాడు డానియెల్.\nకారు ఇంకా అందంగా కనిపించడానికి కొంచెం పని చేయాలని నాన్న అన్నాడు. అతను కారుపై అంటుకున్న ఆకులన్నీ, మట్టిని జాగ్రత్తగా తీశాడు. నాన్న కారును మెరిసిపోయేలా, కొత్తగా కనిపించేలా రుద్ది మెరిపించారు.\n\"ఇదిగో!\" అని నాన్న గర్వంగా అన్నాడు. \"ఇప్పుడు ఇది ఇంకా బాగుంది!\"\nనాన్న కారు పూర్తి చేస్తున్నప్పుడు డానియెల్ నవ్వి చప్పట్లు కొట్టాడు. ఇకపై, నాన్న, డానియెల్ దానిని గ్రామంలో మంచి రైడ్ల కోసం తీసుకెళ్లవచ్చు."
   }

  "TB38": [
   {
    "order_in_batch": 1,
    "item_id": "T-186",
    "english_text": "Once upon a time, there was a little boy named Tim. Tim had a favorite tie. He wore it every day. One day, Tim saw a big dog. The dog had Tim's tie in its mouth. Tim was sad and wanted his tie back.\nTim thought of a plan. He would become very quiet and sneak up on the dog. He tiptoed closer and closer to the dog. But then, something unexpected happened. The dog saw Tim and ran away with the tie.\nTim chased the dog through the park. They ran and ran until the dog stopped. The dog dropped the tie and wagged its tail. Tim was happy to get his tie back. The dog was not mean, it just wanted to play. Tim and the dog became friends and played together every day.",
    "telugu_text": "ఒకప్పుడు, టిమ్ అనే ఒక చిన్న పిల్లాడు ఉండేవాడు. టిమ్కి ఒక ఇష్టమైన టై ఉండేది. అతను దాన్ని ప్రతిరోజూ ధరించేవాడు. ఒక రోజు, టిమ్ ఒక పెద్ద కుక్కను చూశాడు. ఆ కుక్క నోట్లో టిమ్ టైని పట్టుకుని ఉంది. టిమ్ బాధపడ్డాడు మరియు తన టైని తిరిగి పొందాలనుకున్నాడు.\nటిమ్ ఒక ప్రణాళిక గురించి ఆలోచించాడు. అతను చాలా నిశ్శబ్దంగా మారి, కుక్క దగ్గరకు రహస్యంగా వెళ్ళాడు. అతను కుక్క దగ్గరకు నెమ్మదిగా, నెమ్మదిగా వెళ్ళాడు. కానీ అప్పుడు, ఏదో ఊహించనిది జరిగింది. కుక్క టిమ్ను చూసి, టైతో పారిపోయింది.\nటిమ్ పార్కులో కుక్కను వెంబడించాడు. వారు పరుగెత్తారు, పరుగెత్తారు, కుక్క ఆగిపోయే వరకు. కుక్క టైని వదిలి, తోక ఊపింది. టిమ్ తన టైని తిరిగి పొంది సంతోషించాడు. కుక్క చెడ్డది కాదు, అది కేవలం ఆడుకోవాలనుకుంది. టిమ్ మరియు కుక్క స్నేహితులు అయ్యారు మరియు ప్రతిరోజూ కలిసి ఆడుకున్నారు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-006",
    "english_text": "Once upon a time there was a little girl. She was very small and very brave. She had a big yellow bucket.\nOne day she wanted to explore the world and see what was out there. She put her bucket on her head and started walking.\nAs she looked around, she saw many things she hadn't seen before. This made her a little bit scared, but she kept going.\nThen she saw something new. It was a huge animal! She asked, \"What are you?\" But the animal just stared at her.\nThe little girl felt scared but she was brave. She picked up her bucket and walked closer to the animal. She asked it again and this time it answered. \"I'm an elephant!\"\nThe little girl was very happy and excited. She wanted to learn more about the elephant and its home. She asked lots of questions and the elephant was happy to answer them.\nThe little girl smiled and said goodbye to the elephant. She was no longer scared, she had made a new friend. She picked up her bucket and went home with a smile on her face.",
    "telugu_text": "ఒకానొకప్పుడు ఒక చిన్న అమ్మాయి ఉండేది. ఆమె చాలా చిన్నది మరియు చాలా ధైర్యవంతురాలు. ఆమెకు ఒక పెద్ద పసుపు రంగు బకెట్ ఉండేది.\nఒక రోజు ఆమె ప్రపంచాన్ని అన్వేషించాలని మరియు అక్కడ ఏమి ఉందో చూడాలని అనుకుంది. ఆమె తన బకెట్ను తలపై పెట్టుకుని నడవడం మొదలుపెట్టింది.\nఆమె చుట్టూ చూసినప్పుడు, ఆమె ఇంతకుముందు చూడని చాలా విషయాలను చూసింది. ఇది ఆమెను కొంచెం భయపెట్టింది, కానీ ఆమె ముందుకు వెళ్ళింది.\nఅప్పుడు ఆమె ఏదో కొత్తదానిని చూసింది. అది ఒక పెద్ద జంతువు! ఆమె, \"నువ్వెవరు?\" అని అడిగింది. కానీ ఆ జంతువు ఆమె వైపే చూసింది.\nచిన్న అమ్మాయికి భయపడినా, ఆమె ధైర్యంగా ఉంది. ఆమె తన బకెట్ను తీసుకుని జంతువు దగ్గరకు నడిచింది. ఆమె మళ్ళీ అడిగింది, ఈసారి అది సమాధానం చెప్పింది. \"నేను ఏనుగును!\"\nచిన్న అమ్మాయి చాలా సంతోషించి ఉత్సాహపడింది. ఆమె ఏనుగు గురించి మరియు దాని ఇంటి గురించి ఇంకా తెలుసుకోవాలని అనుకుంది. ఆమె చాలా ప్రశ్నలు అడిగింది మరియు ఏనుగు వాటికి సమాధానం చెప్పడానికి సంతోషించింది.\nచిన్న అమ్మాయి నవ్వి ఏనుగుకు వీడ్కోలు చెప్పింది. ఆమెకు ఇక భయం లేదు, ఆమెకు ఒక కొత్త స్నేహితుడు దొరికాడు. ఆమె తన బకెట్ను తీసుకుని ముఖంలో చిరునవ్వుతో ఇంటికి వెళ్లింది."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-071",
    "english_text": "Once upon a time, there was a powerful king who ruled over a big land. He had a helper named Tom. Tom's job was to serve the king his food every day. The king liked Tom because he was always quiet.\nOne day, the king said to Tom, \"I want to feel silence in my castle. Can you help me?\" Tom nodded his head and said, \"Yes, I can help you, king.\"\nTom went around the castle and told everyone to be quiet. Soon, the castle was very silent. The king was very happy with Tom's help. They enjoyed the silence together, and Tom kept serving the king every day.",
    "telugu_text": "ఒకానొకప్పుడు, ఒక బలమైన రాజు ఉండేవాడు, అతను ఒక పెద్ద భూమిని పాలించేవాడు. అతనికి టామ్ అనే సహాయకుడు ఉండేవాడు. టామ్ పని ఏమిటంటే, ప్రతిరోజూ రాజుకు ఆహారం అందించడం. రాజుకు టామ్ అంటే ఇష్టం ఎందుకంటే అతను ఎప్పుడూ నిశ్శబ్దంగా ఉండేవాడు.\nఒకరోజు, రాజు టామ్తో, \"నా కోటలో నాకు నిశ్శబ్దం కావాలి. నువ్వు నాకు సహాయం చేయగలవా?\" అని అన్నాడు. టామ్ తల ఊపి, \"అవును, నేను మీకు సహాయం చేయగలను, రాజా,\" అన్నాడు.\nటామ్ కోట చుట్టూ వెళ్లి అందరినీ నిశ్శబ్దంగా ఉండమని చెప్పాడు. త్వరలోనే, కోట చాలా నిశ్శబ్దంగా మారింది. రాజు టామ్ సహాయానికి చాలా సంతోషించాడు. వారు కలిసి ఆ నిశ్శబ్దాన్ని ఆస్వాదించారు, మరియు టామ్ ప్రతిరోజూ రాజుకు సేవ చేస్తూనే ఉన్నాడు."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-195",
    "english_text": "One day, a cat named Tom found a fake laser. He wanted to play with it. Tom had a friend named Tim, who was also a cat. Tom wanted to act like a big cat and scare Tim with the laser. \nTom went to Tim's house and showed him the laser. Tim was scared at first, but then he saw that it was fake. Tom was sad because his plan did not work. Tim felt bad for Tom, so he decided to help him.\nTogether, Tom and Tim found a way to make the fake laser look real. They played with it and had lots of fun. In the end, they both learned that it was more fun to play together than to scare each other.",
    "telugu_text": "ఒక రోజు, టామ్ అనే పిల్లికి ఒక నకిలీ లేజర్ దొరికింది. అది దానితో ఆడుకోవాలని అనుకుంది. టామ్కి టిమ్ అనే స్నేహితుడు ఉన్నాడు, అతను కూడా ఒక పిల్లి. టామ్ పెద్ద పిల్లిలా నటించి, లేజర్తో టిమ్ను భయపెట్టాలనుకున్నాడు.\nటామ్ టిమ్ ఇంటికి వెళ్లి అతనికి ఆ లేజర్ను చూపించాడు. టిమ్ మొదట్లో భయపడ్డాడు, కానీ తర్వాత అది నకిలీదని చూశాడు. తన ప్రణాళిక పని చేయకపోవడం వలన టామ్ బాధపడ్డాడు. టిమ్కి టామ్ పట్ల బాధ కలిగింది, కాబట్టి అతను అతనికి సహాయం చేయాలని నిర్ణయించుకున్నాడు.\nకలిసి, టామ్ మరియు టిమ్ ఆ నకిలీ లేజర్ను నిజమైనదిలా కనిపించేలా ఒక మార్గాన్ని కనుగొన్నారు. వారు దానితో ఆడుకున్నారు మరియు చాలా సరదాగా గడిపారు. చివరికి, ఒకరినొకరు భయపెట్టడం కంటే కలిసి ఆడుకోవడం మరింత సరదాగా ఉంటుందని వాళ్లిద్దరూ నేర్చుకున్నారు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-009",
    "english_text": "Once there was a clumsy girl who liked to eat a lot. One day she stumbled upon a big statue in the park. She was so hungry and thought that it would be so yummy to eat the statue. The girl started to eat the statue and quickly realized it was not so yummy after all. She was so clumsy that she had eaten too much of the statue and now she couldn’t get the pieces out of her mouth. She was stuck and couldn’t breathe because of all the statue pieces. The girl had a bad ending, as she could not get out of the bad situation.",
    "telugu_text": "ఒకప్పుడు తినడానికి చాలా ఇష్టపడే ఒక అల్లరి అమ్మాయి ఉండేది. ఒకరోజు ఆమె పార్కులో ఒక పెద్ద విగ్రహాన్ని చూసింది. ఆమెకు చాలా ఆకలిగా అనిపించింది, ఆ విగ్రహాన్ని తినడం చాలా రుచిగా ఉంటుందని అనుకుంది. ఆ అమ్మాయి ఆ విగ్రహాన్ని తినడం మొదలుపెట్టింది, కానీ అది అంత రుచికరమైనది కాదని త్వరగా అర్థమైంది. ఆమె చాలా అల్లరిగా ఉండటంతో, ఆమె విగ్రహం చాలా ఎక్కువగా తినేసింది, ఇప్పుడు నోటి నుండి ఆ ముక్కలను తీయలేకపోయింది. ఆ విగ్రహ ముక్కల వల్ల ఆమె ఊపిరి ఆడక, ఇరుక్కుపోయింది. ఆ అమ్మాయికి చెడ్డ ముగింపు వచ్చింది, ఎందుకంటే ఆమె ఆ చెడ్డ పరిస్థితి నుండి బయటపడలేకపోయింది."

   {
    "order_in_batch": 1,
    "item_id": "T-154",
    "english_text": "Once upon a time, there was a lucky onion. It was not like other onions. It could stand up all by itself! The lucky onion lived in a big garden. It had many friends like the tomato, the carrot, and the potato.\nOne day, the lucky onion saw a big bird in the sky. The bird came down and wanted to eat the onion. But the lucky onion was very smart. It stood very still, and the bird thought it was a rock. The bird flew away, and the onion was safe.\nThe onion's friends were so happy that it was safe. They all played together in the garden. The lucky onion was happy too. It knew that being able to stand was a special gift. And so, the lucky onion and its friends lived happily ever after.",
    "telugu_text": "ఒకప్పుడు, ఒక అదృష్టవంతుడైన ఉల్లిపాయ ఉండేది. అది మిగతా ఉల్లిపాయలలా లేదు. అది ఒంటరిగా నిలబడగలిగేది! ఆ అదృష్టవంతుడైన ఉల్లిపాయ ఒక పెద్ద తోటలో నివసించేది. దాని దగ్గర టొమాటో, క్యారెట్, మరియు బంగాళాదుంప వంటి చాలా స్నేహితులు ఉండేవి.\nఒక రోజు, ఆ అదృష్టవంతుడైన ఉల్లిపాయ ఆకాశంలో ఒక పెద్ద పక్షిని చూసింది. ఆ పక్షి కిందకి వచ్చి ఉల్లిపాయను తినాలని అనుకుంది. కానీ ఆ అదృష్టవంతుడైన ఉల్లిపాయ చాలా తెలివైనది. అది చాలా నిశ్చలంగా నిలబడింది, ఆ పక్షి దాన్ని ఒక రాయి అనుకుంది. ఆ పక్షి ఎగిరిపోయింది, ఉల్లిపాయ సురక్షితంగా ఉంది.\nఉల్లిపాయ స్నేహితులు అది సురక్షితంగా ఉందని చాలా సంతోషించారు. వాళ్ళు అందరూ తోటలో కలిసి ఆడుకున్నారు. ఆ అదృష్టవంతుడైన ఉల్లిపాయ కూడా సంతోషంగా ఉంది. నిలబడగలిగేది ఒక ప్రత్యేకమైన బహుమతి అని అది తెలుసుకుంది. అలా, ఆ అదృష్టవంతుడైన ఉల్లిపాయ మరియు దాని స్నేహితులు సంతోషంగా ఎప్పటికీ నివసించారు."

   {
    "order_in_batch": 2,
    "item_id": "T-002",
    "english_text": "Once upon a time, in a big forest, there was a small dog named Max. Max loved to play and get bones. One day, Max saw a big bone under a tree. He wanted that bone very much. But there was a problem. A fierce cat was sitting near the tree.\nMax knew he had to be smart to get the bone. He thought and thought. Then he had an idea. He found a small ball and threw it far away. The fierce cat saw the ball and ran after it. Max knew this was his chance.\nMax ran to the tree and got the big bone. He was so happy! The fierce cat came back and saw that the bone was gone. But Max was already far away, enjoying his prize. And from that day on, Max knew that being smart could help him get what he wanted.",
    "telugu_text": "ఒకప్పుడు, ఒక పెద్ద అడవిలో, మాక్స్ అనే చిన్న కుక్క ఉండేది. మాక్స్ ఆడుకోవడానికి, ఎముకలు దొంగిలించడానికి చాలా ఇష్టపడేది. ఒక రోజు, మాక్స్ ఒక చెట్టు కింద పెద్ద ఎముకను చూసింది. అది ఆ ఎముకను చాలా కోరుకుంది. కానీ ఒక సమస్య ఉంది. ఒక కోపంగా ఉన్న పిల్లి ఆ చెట్టు దగ్గర కూర్చుని ఉంది.\nఎముకను పొందడానికి తనకి తెలివిగా ఉండాలని మాక్స్ తెలుసుకుంది. అది ఆలోచించింది, ఆలోచించింది. అప్పుడు దానికి ఒక ఆలోచన వచ్చింది. అది ఒక చిన్న బంతిని కనుగొని, దాన్ని చాలా దూరం విసిరింది. కోపంగా ఉన్న పిల్లి ఆ బంతిని చూసి దాని వెనకాల పరుగెత్తింది. ఇది తన అవకాశం అని మాక్స్ తెలుసుకుంది.\nమాక్స్ చెట్టు దగ్గరకు పరిగెత్తి, పెద్ద ఎముకను తీసుకుంది. అది చాలా సంతోషించింది! కోపంగా ఉన్న పిల్లి తిరిగి వచ్చి ఎముక పోయిందని చూసింది. కానీ మాక్స్ ఇప్పటికే చాలా దూరంలో, తన బహుమతిని ఆనందిస్తూ ఉన్నాడు. ఆ రోజు నుండి, తెలివిగా ఉండటం వలన తాను కోరుకున్నది పొందవచ్చని మాక్స్ తెలుసుకున్నాడు."

   {
    "order_in_batch": 3,
    "item_id": "T-108",
    "english_text": "Once upon a time, there was a little girl named Lily. She loved to eat delicious grapes. One day, she saw a big bunch of grapes on the table. She was very happy and wanted to eat them all.\nLily asked her mom, \"Can I eat the delicious grapes, please?\" Her mom said, \"Yes, but only take a few. If you eat too many, you will get a tummy ache.\" But Lily didn't listen to her mom. She took the whole bunch of grapes and ran to her room.\nIn her room, Lily ate all the grapes very fast. She felt so full and her tummy started to hurt. She began to cry. Her mom came in and saw the empty grape stems. \"Lily, you didn't listen to me,\" her mom said. \"Now you have a tummy ache because you ate too many grapes.\"\nLily felt sad and her tummy still hurt. She wished she had listened to her mom. The delicious grapes were gone and now she had a bad tummy ache. Lily learned that she should always listen to her mom's advice.",
    "telugu_text": "ఒకప్పుడు, లిల్లీ అనే ఒక చిన్న అమ్మాయి ఉండేది. ఆమెకు రుచికరమైన ద్రాక్ష తినడం అంటే చాలా ఇష్టం. ఒక రోజు, ఆమె టేబుల్పై పెద్ద ద్రాక్ష గుత్తిని చూసింది. ఆమె చాలా సంతోషించింది మరియు వాటిని అన్నీ తినాలని అనుకుంది.\nలిల్లీ తన అమ్మని అడిగింది, \"దయచేసి నేను ఆ రుచికరమైన ద్రాక్ష తినవచ్చా?\" ఆమె అమ్మ అంది, \"అవును, కానీ కొద్దిగా మాత్రమే తీసుకో. నువ్వు చాలా ఎక్కువగా తింటే, నీకు కడుపు నొప్పి వస్తుంది.\" కానీ లిల్లీ తన అమ్మ మాట వినలేదు. ఆమె ఆ ద్రాక్ష గుత్తి మొత్తాన్ని తీసుకుని తన గదికి పరిగెత్తింది.\nతన గదిలో, లిల్లీ ఆ ద్రాక్షలన్నింటినీ చాలా వేగంగా తిన్నది. ఆమె చాలా నిండుగా అనిపించింది మరియు ఆమె కడుపు నొప్పి మొదలైంది. ఆమె ఏడవడం మొదలుపెట్టింది. ఆమె అమ్మ లోపలికి వచ్చి ఖాళీ ద్రాక్ష గల్లాలను చూసింది. \"లిల్లీ, నువ్వు నా మాట వినలేదు,\" అని ఆమె అమ్మ అంది. \"ఇప్పుడు నువ్వు చాలా ద్రాక్షలు తిన్నందున నీకు కడుపు నొప్పి వచ్చింది.\"\nలిల్లీ బాధపడింది మరియు ఆమె కడుపు ఇంకా నొప్పిగా ఉంది. తన అమ్మ మాట వినాల్సింది అని ఆమె కోరుకుంది. రుచికరమైన ద్రాక్ష పోయాయి మరియు ఇప్పుడు ఆమెకు చెడు కడుపు నొప్పి వచ్చింది. లిల్లీ తన అమ్మ సలహాలను ఎప్పుడూ వినాలని నేర్చుకుంది."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-199",
    "english_text": "Once upon a time, in a small town, there lived a cop named Tom. Tom was very good at his job, and he always helped people. All the other cops were envious of Tom because he was so good at his job.\nOne day, Tom saw two kids named Jack and Jill. They were having a problem. They were trying to discuss who would get the last cookie. Jack wanted it, but so did Jill. They didn't know what to do.\nTom went up to Jack and Jill and helped them. He said, \"Why don't you break the cookie in half and share it?\" Jack and Jill thought that was a great idea. They thanked Tom and shared the cookie. Everyone was happy, and Tom felt good about helping his friends.",
    "telugu_text": "ఒకానొకప్పుడు, ఒక చిన్న పట్టణంలో, టామ్ అనే ఒక పోలీస్ ఉండేవాడు. టామ్ తన పనిలో చాలా మంచివాడు, మరియు అతను ఎప్పుడూ ప్రజలకు సహాయం చేసేవాడు. మిగతా పోలీస్ అందరూ టామ్ అంటే అసూయ పడేవారు, ఎందుకంటే అతను తన పనిలో చాలా మంచివాడు.\nఒకరోజు, టామ్ జాక్ మరియు జిల్ అనే ఇద్దరు పిల్లలను చూశాడు. వారికి ఒక సమస్య ఉంది. చివరి కుకీ ఎవరు తీసుకుంటారు అని వాళ్ళు మాట్లాడుకోవడానికి ప్రయత్నిస్తున్నారు. జాక్ దాన్ని కోరుకున్నాడు, కానీ జిల్ కూడా కోరుకుంది. వారికి ఏమి చేయాలో తెలియలేదు.\nటామ్ జాక్ మరియు జిల్ దగ్గరకు వెళ్లి వారికి సహాయం చేశాడు. అతను, \"మీరు కుకీని రెండుగా చేసి పంచుకోవాలని ఎందుకు అనుకోరు?\" అన్నాడు. జాక్ మరియు జిల్ అది గొప్ప ఆలోచన అని అనుకున్నారు. వారు టామ్కు ధన్యవాదాలు చెప్పి, కుకీని పంచుకున్నారు. అందరూ సంతోషంగా ఉన్నారు, మరియు తన స్నేహితులకు సహాయం చేసినందుకు టామ్ సంతోషంగా భావించాడు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-019",
    "english_text": "One day, a cat named Tom found a big crack in the wall. He was very sad because the crack looked terrible. Tom wanted to solve the problem and make the wall look nice again.\nTom asked his friend, a dog named Max, to help him solve the problem. Max was very good at fixing things. They worked together to find a way to fix the terrible crack.\nFirst, they tried to put mud on the crack, but it was still there. Then, they tried to put tape on it, but it didn't work. Finally, they found some paint and painted over the crack. The wall looked nice again, and Tom and Max were happy. They had solved the problem of the terrible crack.",
    "telugu_text": "ఒక రోజు, టామ్ అనే పిల్లి గోడలో పెద్ద పగులును కనుగొన్నాడు. ఆ పగులు చాలా భయంకరంగా కనిపించడంతో అతను చాలా విచారించాడు. టామ్ ఆ సమస్యను పరిష్కరించాలని, గోడను మళ్లీ అందంగా కనిపించాలని అనుకున్నాడు.\nటామ్ తన స్నేహితుడు, మాక్స్ అనే కుక్కను సమస్యను పరిష్కరించడంలో సహాయం చేయమని అడిగాడు. మాక్స్ వస్తువులను సరిచేయడంలో చాలా మంచివాడు. వారు ఆ భయంకరమైన పగులును సరిచేయడానికి ఒక మార్గాన్ని కనుగొనడానికి కలిసి పనిచేశారు.\nముందుగా, వారు పగులుపై మట్టి వేయడానికి ప్రయత్నించారు, కానీ అది ఇంకా అలాగే ఉంది. ఆ తర్వాత, వారు దానిపై టేప్ వేయడానికి ప్రయత్నించారు, కానీ అది పని చేయలేదు. చివరకు, వారు కొంచెం రంగును కనుగొని, ఆ పగులుపై రంగు వేయారు. గోడ మళ్లీ అందంగా కనిపించింది, టామ్ మరియు మాక్స్ సంతోషపడ్డారు. వారు ఆ భయంకరమైన పగులు సమస్యను పరిష్కరించారు."

    "telugu_text": "ఒకప్పుడు, ఒక పెద్ద పచ్చని అడవిలో, ఒక బలమైన చెట్టు ఉండేది. ఆ చెట్టు చాలా ఎత్తుగా ఉండేది మరియు జంతువులకు చాలా నీడ ఇచ్చేది. చాలా జంతువులు ఆ చెట్టు కింద కూర్చోవడం, ఆడుకోవడం అంటే చాలా ఇష్టం.\nఒక రోజు, ఒక చిన్న పక్షి ఆ చెట్టు దగ్గరకు వచ్చి, \"నమస్కారం, బలమైన చెట్టు! నేను నీ నీడలో నివసించవచ్చా? నా పాత ఇల్లు మంచిది కాదు. అది కుళ్ళిపోయింది,\" అంది. ఆ చిన్న పక్షికి సహాయం చేయడానికి చెట్టు సంతోషించింది. \"తప్పకుండా, చిన్న పక్షి! నువ్వు నా నీడలో నివసించవచ్చు మరియు ఇక్కడ సురక్షితంగా ఉండవచ్చు,\" అని చెట్టు సమాధానం చెప్పింది.\nఆ చిన్న పక్షి చెట్టు యొక్క బలమైన కొమ్మలలో ఒక గూడు కట్టింది, మరియు వారు మంచి స్నేహితులు అయ్యారు. ఆ చిన్న పక్షి ప్రతిరోజూ పాటలు పాడేది, మరియు చెట్టు వినడానికి ఇష్టపడింది. చెట్టు ఆ చిన్న పక్షిని సూర్యుడి నుండి మరియు వర్షం నుండి కాపాడుకుంది. వారు కలిసి సంతోషంగా ఉండేవారు, మరియు వారి స్నేహం కారణంగా అడవి ఒక మంచి ప్రదేశంగా మారింది."

    "order_in_batch": 2,
    "item_id": "T-023",
    "english_text": "Once upon a time, there was a little girl. She was so small and so happy. She loved to play with her friends in the park.\nOne day, the little girl wanted to pick a grape from a tall tree. She couldn't reach it so she knelt down and asked why she couldn't reach it.\nA wise old man heard the little girl's question and said, \"The higher you want to go, the deeper you need to kneal.\" The little girl was confused and asked what it meant.\nThe wise old man then told the little girl, \"Sometimes, to get something that's higher up, you have to go deep. If you want to reach your goals, you have to put in the effort first.\"\nThe little girl understood the wise old man's message. She knelt down and tried her best to reach the grape. And you know what? She got it!\nfrom this, the little girl realized that she should always try her best and not give up. Maybe you can learn this lesson too!",
    "telugu_text": "ఒకప్పుడు, ఒక చిన్న అమ్మాయి ఉండేది. ఆమె చాలా చిన్నది మరియు చాలా సంతోషంగా ఉండేది. ఆమె పార్కులో తన స్నేహితులతో ఆడుకోవడం అంటే చాలా ఇష్టం.\nఒక రోజు, ఆ చిన్న అమ్మాయి ఒక ఎత్తైన చెట్టు నుండి ద్రాక్ష పండును తీసుకోవాలనుకుంది. ఆమె దాన్ని అందుకోలేకపోయింది, కాబట్టి ఆమె మోకరిల్లి, ఎందుకు అందుకోలేదో అడిగింది.\nఒక తెలివైన వృద్ధుడు ఆ చిన్న అమ్మాయి ప్రశ్న విన్నాడు మరియు ఇలా అన్నాడు, \"నువ్వు ఎంత ఎత్తుకు వెళ్లాలనుకుంటే, అంత లోతుగా మోకరిల్లాడాలి.\" చిన్న అమ్మాయి గందరగోళపడింది మరియు అది అంటే ఏమిటో అడిగింది.\nఅప్పుడు ఆ తెలివైన వృద్ధుడు చిన్న అమ్మాయికి ఇలా చెప్పాడు, \"కొన్నిసార్లు, పైనున్న దాన్ని పొందడానికి, నువ్వు లోతుగా వెళ్లాలి. నీ లక్ష్యాలను చేరుకోవాలంటే, ముందుగా ప్రయత్నం చేయాలి.\"\nచిన్న అమ్మాయి తెలివైన వృద్ధుడి సందేశాన్ని అర్థం చేసుకుంది. ఆమె మోకరిల్లి, ద్రాక్ష పండును అందుకోవడానికి తన వంతు ప్రయత్నం చేసింది. మరియు మీకు తెలుసా? ఆమె దాన్ని పట్టుకుంది!\nదీని నుండి, ఆ చిన్న అమ్మాయి తాను ఎల్లప్పుడూ తన వంతు ప్రయత్నం చేయాలి మరియు వదిలిపెట్టకూడదని గ్రహించింది. బహుశా నువ్వు కూడా ఈ పాఠం నేర్చుకోవచ్చు!"
