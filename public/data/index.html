<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Story rating study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#111722;--card:#1B2330;--ink:#E6EAF2;--muted:#A3ADBD;--line:#34405A;--accent:#5B9BFF;--accent-ink:#0B1220;--soft:#1E3354;--grey:#8B94A4;--ok:#4ADE80;--warn:#F5B041;--bad:#F87171;
 font-family:"Noto Sans","Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:1.45rem;line-height:1.25;margin:6px 0 10px}
h2{font-size:1.15rem;margin:4px 0 8px}
p{margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted);font-size:.92rem}
label.q{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=date],textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
textarea{min-height:70px}
.yn{display:flex;gap:10px}
.yn button,.scale button{flex:1;min-height:46px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.yn button[aria-pressed=true],.scale button[aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.scale{display:flex;gap:6px}
.anchors{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:4px;gap:8px}
.anchors span:nth-child(2){text-align:center}
.anchors span:last-child{text-align:right}
.btn{display:block;width:100%;min-height:50px;border:none;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--card);color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.text{white-space:pre-wrap;font-size:1rem}
.te{font-family:"Noto Sans Telugu","Noto Sans",sans-serif;font-size:1.05rem}
.grey{color:var(--grey)}
.label{font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.progress{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:8px}
.linkbtn{background:none;border:none;color:var(--accent);font:inherit;cursor:pointer;padding:6px 0}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.check input{width:22px;height:22px;margin-top:2px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.status{font-size:.82rem;color:var(--muted)}
.status b.ok{color:var(--ok)} .status b.warn{color:var(--warn)}
.small{min-height:40px;padding:0 12px;width:auto;margin:0;font-size:.9rem}
.hidden{display:none!important}
</style>
</head>
<body>

    "item_id": "T-147",
    "english_text": "Once upon a time, there was a fast rabbit who loved to run. He was very proud of how fast he could run. One day, he received a candle as a gift from his friend, the turtle. The rabbit was very happy to get the candle and said thank you to his friend.\nThe rabbit and the turtle decided to have a race to see who was the fastest. They both knew that the rabbit was fast, but the turtle was slow. The rabbit was so sure he would win that he thought he could take a break and light his candle. While the rabbit was playing with the candle, the turtle kept moving slowly and passed the rabbit.\nWhen the rabbit saw the turtle pass him, he tried to catch up. But he had spent too much time playing with the candle, and the turtle won the race. The rabbit learned that being fast is not always enough, and sometimes slow and steady wins the race.",
    "telugu_text": "ఒకానొకప్పుడు, పరుగెత్తడానికి ఇష్టపడే ఒక వేగవంతమైన కుందేలు ఉండేది. అది ఎంత వేగంగా పరుగెత్తగలదో దాని గురించి చాలా గర్వపడేది. ఒక రోజు, దాని స్నేహితుడైన తాబేలు నుండి ఒక దీపాన్ని బహుమతిగా అందుకుంది. కుందేలుకు దీపం దొరికినందుకు చాలా సంతోషించి, తన స్నేహితుడికి ధన్యవాదాలు చెప్పింది.\nకుందేలు మరియు తాబేలు ఎవరు వేగంగా పరుగెత్తగలరో చూడటానికి పందెం వేయాలని నిర్ణయించుకున్నారు. కుందేలు వేగంగా ఉంటుందని, కానీ తాబేలు నెమ్మదిగా ఉంటుందని వాళ్లిద్దరికీ తెలుసు. కుందేలు గెలుస్తానని చాలా నమ్మింది, కాబట్టి అది విరామం తీసుకుని తన దీపాన్ని వెలిగించుకోవాలని అనుకుంది. కుందేలు దీపంతో ఆడుకుంటున్నప్పుడు, తాబేలు నెమ్మదిగా కదులుతూ కుందేలును దాటిపోయింది.\nతాబేలు తనను దాటి వెళ్లేదానిని కుందేలు చూసినప్పుడు, అది అందుకోవడానికి ప్రయత్నించింది. కానీ అది దీపంతో ఆడుకోవడానికి చాలా సమయం గడిపింది, మరియు తాబేలు పందెం గెలిచింది. వేగంగా ఉండటం ఎప్పుడూ సరిపోదని, కొన్నిసార్లు నెమ్మదిగా స్థిరంగా ఉన్నవాడే పందెం గెలుస్తాడని కుందేలు నేర్చుకుంది."

   {
    "order_in_batch": 5,
    "item_id": "T-130",
    "english_text": "One day, a cute dog named Spot went to school. He had a big bag with him. Spot was happy because today was show-and-tell. He had a secret in his bag that he wanted to show his friends.\nAt school, Spot's friend, Max, asked, \"What's in your bag, Spot?\" Spot smiled and said, \"It's a surprise for show-and-tell!\" Max was excited and couldn't wait to see what it was. The other kids at school were also excited.\nWhen it was time for show-and-tell, Spot went to the front of the room. He opened his bag and took out a big load of colorful balls. The kids were so happy! They all played with the balls and had lots of fun. Spot's surprise was a big hit at school.",
    "telugu_text": "ఒక రోజు, స్పాట్ అనే ఒక మంచి కుక్క స్కూల్కి వెళ్ళింది. దాని దగ్గర ఒక పెద్ద బ్యాగ్ ఉంది. ఈ రోజు చూపించుకునే రోజు కాబట్టి స్పాట్ చాలా సంతోషంగా ఉంది. తన స్నేహితులకు చూపించాలనుకుంటున్న ఒక రహస్యం తన బ్యాగ్లో ఉంది.\nస్కూల్లో, స్పాట్ స్నేహితుడు మాక్స్, \"నీ బ్యాగ్లో ఏముంది, స్పాట్?\" అని అడిగాడు. స్పాట్ నవ్వి, \"ఇది చూపించుకునేందుకు ఒక ఆశ్చర్యం!\" అంది. మాక్స్ ఉత్సాహపడ్డాడు, అది ఏమిటో చూడాలని ఆత్రుత పడ్డాడు. స్కూల్లోని మిగతా పిల్లలు కూడా ఉత్సాహపడ్డారు.\nచూపించుకునే సమయం వచ్చినప్పుడు, స్పాట్ గది ముందుకి వెళ్ళింది. అది తన బ్యాగ్ను తెరిచి, రంగురంగుల బంతులతో నిండిన పెద్ద గుంపును బయటకు తీసింది. పిల్లలు చాలా సంతోషించారు! వాళ్ళు అందరూ బంతులతో ఆడుకున్నారు, చాలా సరదాగా గడిపారు. స్పాట్ యొక్క ఆశ్చర్యం స్కూల్లో పెద్ద విజయం సాధించింది."
   }

   {
    "order_in_batch": 1,
    "item_id": "T-190",
    "english_text": "Once upon a time, there was a big rat named Tom. He lived in a peaceful place with many other animals. They all played and had fun together. One day, a big storm came and scared all the animals. They all ran away to find a safe place to hide.\nTom, the big rat, felt sad because all his friends were gone. He wanted to unite all his friends and bring them back to their peaceful home. So, he started to look for them. He found a small bird named Lily, who was hiding in a tree. \"Lily, let's go find our friends and bring them back home,\" said Tom. Lily agreed, and they went to find their friends together.\nAs they found their friends, they told them not to be scared anymore. The storm was gone, and it was safe to go back to their peaceful place. All the animals were happy to be together again. They thanked Tom and Lily for helping them. From that day on, they all lived happily ever after, knowing that they could always unite and help each other when they were scared or in trouble.",
    "telugu_text": "ఒకానొకప్పుడు, టామ్ అనే పెద్ద ఎలుక ఉండేది. అది చాలా ప్రశాంతమైన చోట, చాలా ఇతర జంతువులతో కలిసి ఉండేది. వాళ్ళు అందరూ కలిసి ఆడుకుంటూ సరదాగా గడిపేవారు. ఒక రోజు, పెద్ద తుఫాను వచ్చింది, అది అన్ని జంతువులను భయపెట్టింది. వాళ్ళు అందరూ దాక్కునే సురక్షితమైన స్థలాన్ని వెతకడానికి పారిపోయారు.\nటామ్, ఆ పెద్ద ఎలుక, తన స్నేహితులందరూ పోయినందుకు బాధపడ్డాడు. అతను తన స్నేహితులందరినీ కలిపి, వారిని వారి ప్రశాంతమైన ఇంటికి తీసుకురావాలని అనుకున్నాడు. అందుకే, అతను వారిని వెతకడం మొదలుపెట్టాడు. చెట్టులో దాక్కుని ఉన్న లిల్లీ అనే చిన్న పక్షిని అతను కనుగొన్నాడు. \"లిల్లీ, మన స్నేహితులను వెతకడానికి వెళ్లి, వారిని ఇంటికి తీసుకురొద్దాం,\" అన్నాడు టామ్. లిల్లీ అంగీకరించింది, వాళ్ళు కలిసి వారి స్నేహితులను వెతకడానికి వెళ్లారు.\nవాళ్ళ స్నేహితులను కనుగొన్నప్పుడు, వాళ్ళు ఇక భయపడకూడదని వారికి చెప్పారు. తుఫాను పోయింది, తిరిగి వారి ప్రశాంతమైన స్థలానికి వెళ్లడం సురక్షితమని తెలిసింది. అన్ని జంతువులు మళ్లీ కలిసి ఉండటం సంతోషపడ్డాయి. వారు సహాయం చేసినందుకు టామ్, లిల్లీకి ధన్యవాదాలు చెప్పారు. ఆ రోజు నుండి, వాళ్ళు అందరూ సంతోషంగా జీవించారు, భయపడినప్పుడు లేదా కష్టంలో ఉన్నప్పుడు ఎప్పుడూ కలిసి ఉండగలమని, ఒకరికొకరు సహాయం చేసుకోగలమని తెలుసుకున్నారు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-056",
    "english_text": "Once upon a time, there was a gentle bear. He was walking through a park when he bumped into a little mouse.\n\"Hello!\" said the mouse.\n\"Hi!\" said the bear.\n\"I think you’re carrying something on your back!\" said the mouse.\n\"Yes, I am!\" said the bear.\nThe bear showed the mouse a tray that he was carrying.\n\"It's really heavy!\" said the bear.\n\"Let me help you!\" said the mouse.\nThe mouse grabbed one end of the tray, and the bear grabbed the other. They both started to weigh it.\n\"It's very heavy!\". said the mouse.\n\"Yes, let's put it down,\" said the bear.\nThe bear and the mouse put the tray down on the ground.\n\"Thanks for your help, Mouse,\" said the bear.\n\"No problem, Bear,\" said the mouse. \"It's always nice to see a gentle bear like you!\"",
    "telugu_text": "ఒకప్పుడు, ఒక దయగల ఎలుగుబంటి ఉండేది. అది ఒక పార్కులో నడుచుకుంటూ వెళ్తుండగా, ఒక చిన్న ఎలుకను తగిలింది.\n\"హలో!\" అంది ఎలుక.\n\"హాయ్!\" అన్నాడు ఎలుగుబంటి.\n\"మీ వెనుక ఏదో మోస్తున్నట్లుంది!\" అంది ఎలుక.\n\"అవును, నేను మోస్తున్నాను!\" అన్నాడు ఎలుగుబంటి.\nఎలుగుబంటి తాను మోస్తున్న ఒక ప్లేట్ను ఎలుకకు చూపించాడు.\n\"అది నిజంగా బరువుగా ఉంది!\" అన్నాడు ఎలుగుబంటి.\n\"నేను నీకు సహాయం చేస్తాను!\" అంది ఎలుక.\nఎలుక ప్లేట్ ఒక చివరను పట్టుకుంది, మరియు ఎలుగుబంటి మరొక చివరను పట్టుకున్నాడు. వాళ్లిద్దరూ దానిని బరువుగా కొలవడం మొదలుపెట్టారు.\n\"అది చాలా బరువుగా ఉంది!\" అంది ఎలుక.\n\"అవును, దాన్ని కింద పెడదాం,\" అన్నాడు ఎలుగుబంటి.\nఎలుగుబంటి మరియు ఎలుక ఆ ప్లేట్ను నేలపై పెట్టారు.\n\"సహాయానికి ధన్యవాదాలు, ఎలుకా,\" అన్నాడు ఎలుగుబంటి.\n\"పర్వాలేదు, ఎలుగుబంటి,\" అంది ఎలుక. \"మీలాంటి దయగల ఎలుగుబంటిని చూడటం ఎప్పుడూ బాగుంటుంది!\""
   },
   {
    "order_in_batch": 3,
    "item_id": "T-010",
    "english_text": "One day, a little boy named Tim went to the park with his mom. They saw a calm dog sitting by a tree. Tim liked the dog and wanted to play with it.\nTim asked his mom, \"Can I play with the dog, please?\" His mom said, \"Yes, but be careful and don't go too far.\"\nTim walked up to the dog and said, \"Hi, dog! Do you want to play with me?\" The dog wagged its tail and barked, \"Yes, I want to play!\" They played a game of catch with a ball. Tim threw the ball and the dog ran to get it. They played until the dog got tired.\nThen, Tim saw a big sign with the number zero on it. He asked the dog, \"Do you know what that means?\" The dog shook its head and barked, \"No, I don't know.\" Tim's mom came over and told them, \"Zero means none or nothing, Tim.\"\nTim and the dog learned something new that day. They were happy to play together and learn about the number zero.",
    "telugu_text": "ఒక రోజు, టిమ్ అనే చిన్న పిల్లాడు తన అమ్మతో పార్కుకు వెళ్ళాడు. వారు ఒక చెట్టు దగ్గర కూర్చున్న ఒక ప్రశాంతమైన కుక్కను చూశారు. టిమ్కి ఆ కుక్క నచ్చింది మరియు దానితో ఆడుకోవాలనిపించింది.\nటిమ్ తన అమ్మని అడిగాడు, \"దయచేసి నేను కుక్కతో ఆడుకోవచ్చా?\" అతని అమ్మ, \"అవును, కానీ జాగ్రత్తగా ఉండు మరియు చాలా దూరం వెళ్ళకు,\" అంది.\nటిమ్ కుక్క దగ్గరకు వెళ్లి, \"హాయ్, కుక్కా! నాతో ఆడుకోవాలనుకుంటున్నావా?\" కుక్క తోక ఊపింది మరియు మొరిగింది, \"అవును, నేను ఆడాలనుకుంటున్నాను!\" వారు ఒక బంతితో పట్టుకునే ఆట ఆడారు. టిమ్ బంతిని విసిరి, కుక్క దాన్ని అందుకోవడానికి పరుగెత్తింది. కుక్క అలసిపోయే వరకు వారు ఆడుకున్నారు.\nఅప్పుడు, టిమ్ దానిపై సున్నా సంఖ్య ఉన్న పెద్ద బోర్డును చూశాడు. అతను కుక్కని అడిగాడు, \"దాని అర్థం తెలుసా?\" కుక్క తల ఊపింది మరియు మొరిగింది, \"లేదు, నాకు తెలియదు.\" టిమ్ అమ్మ వచ్చి వారికి చెప్పింది, \"సున్నా అంటే ఏమీ లేదు లేదా ఏమీ కాదు, టిమ్.\"\nటిమ్ మరియు కుక్క ఆ రోజు కొత్త విషయం నేర్చుకున్నారు. కలిసి ఆడుకోవడానికి మరియు సున్నా సంఖ్య గురించి తెలుసుకోవడానికి వారు సంతోషపడ్డారు."
   },

    "order_in_batch": 4,
    "item_id": "T-017",
    "english_text": "Timmy was playing in his garden. He saw a distant green lake. He got excited and wanted to go and take a look. \n\"Mommy, can I go to the distant green lake?\" he asked. \nMommy said, \"No, Timmy. It is too far away. It's dangerous.\"\nBut Timmy insisted, \"I really want to go, mommy.\" \nMommy said, \"No, Timmy\". But he did not listen and ran away towards the lake.\nAfter a while, Timmy reached the distant green lake. But to his surprise, there was no water in it. It was all dried up. He got very sad and felt lost. \nHe started yelling for help but there was nobody around to help him. Timmy was stuck and started to cry. After a long time, he managed to find his way back home. But it was already too late, he was in big trouble. \nMommy was very angry. She had no other choice and punished Timmy for not listening to her. Timmy was very sad and learnt a good lesson that day!",
    "telugu_text": "టిమీ తన తోటలో ఆడుకుంటున్నాడు. అతను దూరంగా ఉన్న ఆ పచ్చని సరస్సును చూశాడు. అతను ఉత్సాహపడ్డాడు మరియు వెళ్లి చూడాలని అనుకున్నాడు.\n\"అమ్మా, నేను ఆ దూరంగా ఉన్న పచ్చని సరస్సుకి వెళ్లవచ్చా?\" అని అతను అడిగాడు.\nఅమ్మ చెప్పింది, \"వద్దు, టిమీ. అది చాలా దూరంలో ఉంది. అది ప్రమాదకరం.\"\nకానీ టిమీ మొండిగా ఉన్నాడు, \"నేను నిజంగా వెళ్లాలనుకుంటున్నాను, అమ్మా.\"\nఅమ్మ చెప్పింది, \"వద్దు, టిమీ.\" కానీ అతను వినలేదు మరియు సరస్సు వైపు పారిపోయాడు.\nకొంత సమయం తర్వాత, టిమీ దూరంగా ఉన్న పచ్చని సరస్సు దగ్గరకు చేరుకున్నాడు. కానీ ఆశ్చర్యానికి, అందులో నీరు లేదు. అది అంతా ఎండిపోయింది. అతను చాలా విచారించాడు మరియు తప్పిపోయినట్లు భావించాడు.\nఅతను సహాయం కోసం అరిచాడు కానీ అతనికి సహాయం చేయడానికి ఎవరూ లేరు. టిమీ చిక్కుకుపోయాడు మరియు ఏడవడం మొదలుపెట్టాడు. చాలా సమయం తర్వాత, అతను ఇంటికి తిరిగి వెళ్ళే దారి కనుగొన్నాడు. కానీ అది చాలా ఆలస్యం, అతను పెద్ద సమస్యలో ఉన్నాడు.\nఅమ్మ చాలా కోపగించుకుంది. ఆమెకు వేరే మార్గం లేదు మరియు ఆమె మాట విననందుకు టిమీని శిక్షించింది. టిమీ చాలా విచారించాడు మరియు ఆ రోజు ఒక మంచి పాఠం నేర్చుకున్నాడు!"
   },

    "item_id": "T-063",
    "english_text": "One day, a little dog named Max saw a big pit. Max was scared because he felt helpless. Max did not know how to get around the pit. He wanted to go to his friend's house on the other side. Max thought about what to do.\nMax saw a big bird named Betty. Max said, \"Betty, can you help me? I need to go to my friend's house. There is a big pit in the way. I feel helpless.\" Betty listened to Max's request.\nBetty said, \"I will help you, Max.\" Betty picked up Max with her strong wings. She flew Max over the pit. Max was very happy. He thanked Betty for helping him. Max went to his friend's house and played all day.",
    "telugu_text": "ఒక రోజు, మాక్స్ అనే చిన్న కుక్క ఒక పెద్ద గుంట చూశాడు. మాక్స్ భయపడ్డాడు ఎందుకంటే అతను నిస్సహాయంగా ఉన్నట్లు భావించాడు. మాక్స్ ఆ గుంట దాటడానికి ఎలాగో తెలియలేదు. అతను తన స్నేహితుడి ఇంటికి అవతలి వైపు వెళ్లాలనుకున్నాడు. మాక్స్ ఏమి చేయాలో ఆలోచించాడు.\nమాక్స్ ఒక పెద్ద పక్షి అయిన బెట్టిని చూశాడు. మాక్స్ అన్నాడు, \"బెట్టి, నువ్వు నాకు సహాయం చేయగలవా? నేను నా స్నేహితుడి ఇంటికి వెళ్లాలి. దారిలో ఒక పెద్ద గుంట ఉంది. నేను నిస్సహాయంగా ఉన్నాను.\" బెట్టి మాక్స్ అభ్యర్థన వింది.\nబెట్టి అంది, \"నేను నీకు సహాయం చేస్తాను, మాక్స్.\" బెట్టి తన బలమైన రెక్కలతో మాక్స్ను ఎత్తింది. ఆమె మాక్స్ను గుంటపై నుండి ఎగరేసింది. మాక్స్ చాలా సంతోషించాడు. తనను సహాయం చేసినందుకు బెట్టికి కృతజ్ఞతలు చెప్పాడు. మాక్స్ తన స్నేహితుడి ఇంటికి వెళ్లి రోజంతా ఆడుకున్నాడు."

    "item_id": "T-177",
    "english_text": "One day, a cat and a dog were playing near a hedge. They were very good friends. The cat said, \"I am bored. I want to play a game.\" The dog agreed, \"Yes, let's play a game.\"\nThey decided to play hide and seek. The cat would hide, and the dog would try to find her. The cat went to the hedge and found a part where she could hide. The dog closed his eyes and counted to ten. When he opened his eyes, he started looking for the cat.\nThe dog looked and looked but could not find the cat. He was about to give up when he heard a funny noise. He went to the hedge and saw the cat laughing with a new friend, a rabbit. The dog said, \"Wow, I didn't expect to find two friends!\" The cat, the dog, and the rabbit played together, and the day was not boring anymore.",
    "telugu_text": "ఒక రోజు, ఒక పిల్లి, ఒక కుక్క ఒక పొద దగ్గర ఆడుకుంటున్నాయి. అవి చాలా మంచి స్నేహితులు. పిల్లి అంది, \"నాకు విసుగ్గా ఉంది. నేను ఒక ఆట ఆడాలనుకుంటున్నాను.\" కుక్క ఒప్పుకుంది, \"అవును, మనం ఒక ఆట ఆడుకుందాం.\"\nవాళ్ళు దాగుడుమూతలు ఆడాలని నిర్ణయించుకున్నారు. పిల్లి దాక్కుంటుంది, కుక్క ఆమెను వెతకడానికి ప్రయత్నిస్తుంది. పిల్లి పొద దగ్గరకు వెళ్లి దాక్కోవడానికి ఒక చోటును కనుగొంది. కుక్క కళ్ళు మూసుకుని పది వరకు లెక్కించింది. కళ్ళు తెరిచినప్పుడు, అది పిల్లి కోసం వెతకడం మొదలుపెట్టింది.\nకుక్క చూసింది, చూసింది కానీ పిల్లిని కనుగొనలేకపోయింది. అది వదిలేయబోతుండగా, అది ఒక సరదా శబ్దం వింది. అది పొద దగ్గరకు వెళ్లి పిల్లిని ఒక కొత్త స్నేహితురాలైన కుందేలుతో నవ్వుతూ చూసింది. కుక్క అంది, \"వావ్, నేను ఇద్దరు స్నేహితులను కనుక్కోవాలని అనుకోలేదు!\" పిల్లి, కుక్క, మరియు కుందేలు కలిసి ఆడుకున్నాయి, ఆ రోజు ఇక విసుగ్గా లేదు."

    "item_id": "T-191",
    "english_text": "Once upon a time, there was a fancy dress. It had many pretty colors and a big stitch on it. The dress lived in a box in a girl's room.\nOne day, the girl wanted to wear the dress. But it was raining outside. The girl did not want the dress to get wet. She wanted to protect the dress.\nShe put on a big coat over the dress. The coat kept the dress dry. The girl and the fancy dress were happy. They knew they would be safe and pretty together.",
    "telugu_text": "ఒకానొకప్పుడు, ఒక ఫ్యాన్సీ డ్రెస్ ఉంది. దానిపై చాలా అందమైన రంగులు మరియు ఒక పెద్ద కుట్టు ఉంది. ఆ డ్రెస్ ఒక అమ్మాయి గదిలో ఒక పెట్టెలో నివసించేది.\nఒక రోజు, అమ్మాయి ఆ డ్రెస్ వేసుకోవాలనుకుంది. కానీ బయట వర్షం పడుతోంది. అమ్మాయి డ్రెస్ తడవకూడదని అనుకుంది. ఆమె డ్రెస్ ని రక్షించాలనుకుంది.\nఆమె డ్రెస్ మీద ఒక పెద్ద కోటు వేసుకుంది. ఆ కోటు డ్రెస్ పొడిగా ఉంచింది. అమ్మాయికి, ఆ ఫ్యాన్సీ డ్రెస్కి సంతోషం కలిగింది. వారు కలిసి సురక్షితంగా మరియు అందంగా ఉంటారని వారికి తెలుసు."

   {
    "order_in_batch": 3,
    "item_id": "T-100",
    "english_text": "Tom and Jen were friends. They liked to play in the park. One day, they found a map in a box. The map had a big X on it. Tom and Jen wanted to find the X.\nThey followed the map. They walked a long way. They crossed the street, the bridge, and the hill. They got tired and hungry. They did not see the X.\nThey came to a big fence. The map said the X was behind the fence. But the fence was locked. They could not go in. They saw a sign. The sign said: \"Danger. Keep out.\"\nTom and Jen were scared. They wanted to go back. But they did not remember the way. They looked at the map. The map was torn and dirty. They could not read it.\nThey wished they had not followed the map. They wished they had stayed in the park. They regretted their choice. They cried for help. They hoped someone would find them.",
    "telugu_text": "టామ్ మరియు జెన్ స్నేహితులు. వాళ్లకు పార్కులో ఆడుకోవడం అంటే చాలా ఇష్టం. ఒక రోజు, వాళ్ళు ఒక పెట్టెలో ఒక మ్యాప్ కనుగొన్నారు. ఆ మ్యాప్లో పెద్ద 'ఎక్స్' ఉంది. టామ్ మరియు జెన్ ఆ 'ఎక్స్' ను కనుగొనాలనుకున్నారు.\nవాళ్ళు మ్యాప్ను అనుసరించారు. వాళ్ళు చాలా దూరం నడిచారు. వాళ్ళు వీధిని, వంతెనను, కొండను దాటారు. వాళ్ళు అలసిపోయారు, ఆకలిగా ఉన్నారు. వాళ్ళు ఆ 'ఎక్స్' ను చూడలేదు.\nవాళ్ళు ఒక పెద్ద కంచె దగ్గరకు వచ్చారు. మ్యాప్లో 'ఎక్స్' కంచె వెనుక ఉందని ఉంది. కానీ ఆ కంచె తాళం వేసి ఉంది. వాళ్ళు లోపలికి వెళ్లలేకపోయారు. వాళ్ళు ఒక బోర్డును చూశారు. ఆ బోర్డులో ఇలా ఉంది: \"ప్రమాదం. బయట ఉండండి.\"\nటామ్ మరియు జెన్ భయపడ్డారు. వాళ్ళు వెనక్కి వెళ్లాలనుకున్నారు. కానీ వాళ్లకు దారి గుర్తులేదు. వాళ్ళు మ్యాప్ను చూశారు. మ్యాప్ చిరిగిపోయి మురికిగా ఉంది. వాళ్ళు దాన్ని చదవలేకపోయారు.\nవాళ్ళు మ్యాప్ను అనుసరించకూడదని కోరుకున్నారు. వాళ్ళు పార్కులోనే ఉండాలని కోరుకున్నారు. వాళ్ళు తమ ఎంపికను పశ్చాత్తాపపడ్డారు. వాళ్ళు సహాయం కోసం ఏడ్చారు. ఎవరైనా వాళ్ళను కనుగొంటారని ఆశించారు."

   {
    "order_in_batch": 4,
    "item_id": "T-086",
    "english_text": "One day, a red bird named Tim felt very lucky. He had a job to take mail to his animal friends. He liked to fly and make his friends happy. Today, he had mail for his best friend, a small cat named Lily.\nWhen Tim got to Lily's house, he said, \"Hi, Lily! I have mail for you!\" Lily was excited and said, \"Wow, thank you, Tim!\" She opened the mail and found a pretty picture inside. It was a picture of a big, happy sun. Lily felt happy too.\nTim and Lily played together all day. They felt lucky to have each other as friends. They laughed and had a lot of fun. At the end of the day, they said goodbye and Tim flew away to take more mail to his other friends.",
    "telugu_text": "ఒక రోజు, టిమ్ అనే ఎర్రటి పక్షికి చాలా అదృష్టం అనిపించింది. తన జంతు స్నేహితులకు ఉత్తరాలు తీసుకువెళ్లడం అతని పని. అతనికి ఎగరడం అంటే ఇష్టం, తన స్నేహితులను సంతోషపెట్టడం అంటే ఇష్టం. ఈ రోజు, తన మంచి స్నేహితురాలు, లిల్లీ అనే చిన్న పిల్లికి ఉత్తరం ఉంది.\nటిమ్ లిల్లీ ఇంటికి వెళ్ళినప్పుడు, అతను, \"హాయ్, లిల్లీ! నీకోసం ఉత్తరం ఉంది!\" అన్నాడు. లిల్లీ ఉత్సాహంగా, \"వావ్, థాంక్యూ, టిమ్!\" అంది. ఆమె ఉత్తరం తెరిచి లోపల ఒక అందమైన బొమ్మను కనుగొంది. అది ఒక పెద్ద, సంతోషంగా ఉన్న సూర్యుడి బొమ్మ. లిల్లీ కూడా సంతోషపడింది.\nటిమ్ మరియు లిల్లీ ఆ రోజు మొత్తం కలిసి ఆడుకున్నారు. ఒకరినొకరు స్నేహితులుగా ఉండటం వారికి అదృష్టంగా అనిపించింది. వారు నవ్వారు, చాలా సరదాగా గడిపారు. ఆ రోజు చివర్లో, వారు వీడ్కోలు చెప్పుకుని, టిమ్ తన ఇతర స్నేహితులకు మరిన్ని ఉత్తరాలు తీసుకువెళ్లడానికి ఎగిరిపోయాడు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-132",
    "english_text": "Once upon a time, there was a famous cat named Tom. Tom loved to wear a big red hat. Every day, Tom would put on his hat and go outside to play.\nOne morning, Tom was hungry. He wanted to eat his favorite cereal. He went to the kitchen and saw that the cereal box was empty. \"Oh no!\" said Tom. He needed to go to the store to get more cereal.\nTom put on his big red hat and walked to the store. He found the cereal and brought it home. He was so happy to eat his cereal. And every day after that, Tom would wear his big red hat and eat his favorite cereal.",
    "telugu_text": "ఒకప్పుడు, టామ్ అనే ఒక ప్రసిద్ధ పిల్లి ఉండేది. టామ్కి పెద్ద ఎరుపు టోపీ పెట్టుకోవడం అంటే చాలా ఇష్టం. ప్రతిరోజూ, టామ్ తన టోపీ పెట్టుకుని బయటకు ఆడుకోవడానికి వెళ్ళేది.\nఒక ఉదయం, టామ్కి ఆకలి వేసింది. తన ఇష్టమైన సిరియల్ తినాలనిపించింది. అది వంటగదికి వెళ్లి చూసింది, సిరియల్ పెట్టె ఖాళీగా ఉందని చూసింది. \"అయ్యో!\" అంది టామ్. ఇంకొంత సిరియల్ తీసుకోవడానికి దుకాణానికి వెళ్లాలి.\nటామ్ తన పెద్ద ఎరుపు టోపీ పెట్టుకుని దుకాణానికి నడిచింది. అది సిరియల్ను కనుగొని ఇంటికి తీసుకువచ్చింది. తన సిరియల్ తినడం చూసి అది చాలా సంతోషించింది. ఆ రోజు నుండి ప్రతిరోజూ, టామ్ తన పెద్ద ఎరుపు టోపీ పెట్టుకుని తన ఇష్టమైన సిరియల్ తినేది."
   }
  ],
  "TB04": [
   {
    "order_in_batch": 1,
    "item_id": "T-046",
    "english_text": "Once upon a time, in a big, big forest, there was a band of animals. In the band, there was a fast rabbit, a big bear, and a wise owl. They all lived together and played fun games.\nOne day, the rabbit found a rich, shiny stone. The rabbit was so happy! He wanted to show the stone to his friends. But, he thought that someone might take it. So, he hid the stone in a secret place.\nThe next day, the rabbit could not find the stone! He was sad. He rushed to his friends and told them about the stone. The wise owl said, \"Let's look for the stone together!\" They all looked and looked, and finally, they found the stone.\nThe rabbit was so happy that he shared the stone with his friends. They all played with the stone and had a great time. From that day on, the band of animals knew that sharing was the best way to be happy.",
    "telugu_text": "ఒకానొకప్పుడు, ఒక పెద్ద, పెద్ద అడవిలో, జంతువుల గుంపు ఉండేది. ఆ గుంపులో, ఒక వేగంగా పరుగెత్తే కుందేలు, ఒక పెద్ద ఎలుగుబంటి, మరియు ఒక తెలివైన గుడ్లగూబ ఉండేవి. వాళ్ళు అందరూ కలిసి నివసించి, సరదా ఆటలు ఆడేవారు.\nఒక రోజు, కుందేలు ఒక ధనవంతుడైన, మెరిసే రాయిని కనుగొంది. కుందేలు చాలా సంతోషపడింది! అతను ఆ రాయిని తన స్నేహితులకు చూపించాలనుకున్నాడు. కానీ, ఎవరైనా దాన్ని తీసుకోతారేమోనని అనుకున్నాడు. అందుకే, అతను ఆ రాయిని ఒక రహస్య స్థలంలో దాచాడు.\nమరుసటి రోజు, కుందేలు ఆ రాయిని కనుగొనలేకపోయింది! అతను విచారించాడు. అతను తన స్నేహితులకు పరిగెత్తి, ఆ రాయి గురించి వారికి చెప్పాడు. తెలివైన గుడ్లగూబ, \"మనం కలిసి ఆ రాయిని వెతుకుదాం!\" అంది. వాళ్ళు అందరూ వెతికారు, వెతికారు, చివరికి, వాళ్ళు ఆ రాయిని కనుగొన్నారు.\nకుందేలు చాలా సంతోషపడింది, అందుకే ఆ రాయిని తన స్నేహితులతో పంచుకున్నాడు. వాళ్ళు అందరూ ఆ రాయితో ఆడుకున్నారు మరియు చాలా సరదాగా గడిపారు. ఆ రోజు నుండి, జంతువుల గుంపు పంచుకోవడం అనేది సంతోషంగా ఉండటానికి ఉత్తమ మార్గం అని తెలుసుకుంది."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-024",
    "english_text": "Once there was a little boy named Tim. He was three years old and very curious. Tim wanted to explore the world, so he decided to take a walk. \nAs Tim walked, he guessed what he would find around the corner. Around every turn, he wondered what he would see. He saw birds and squirrels, trees and flowers. He even saw some bees! \nThen, Tim reached a dead end. He was disappointed, but then he noticed another path! He followed it and soon came to a start. He had no idea what it was, so he decided to take a closer look. \nHe found that the start was a gate. Beyond the gate was a garden full of beautiful flowers. Tim was so excited! He went to the gate and tried to open it, but it didn't budge. \nA man came over and asked what he was doing. Tim explained he just wanted to explore. The man was very rude and told him to leave. \nTim sadly walked back the way he came, but he was determined to find a way into the garden. He guessed he would find a way one day.",
    "telugu_text": "ఒకప్పుడు టిమ్ అనే ఒక చిన్న పిల్లాడు ఉండేవాడు. అతనికి మూడు సంవత్సరాలు, చాలా ఆసక్తిగా ఉండేవాడు. టిమ్ ప్రపంచాన్ని చూడాలని అనుకున్నాడు, అందుకే నడవాలని నిర్ణయించుకున్నాడు.\nటిమ్ నడుస్తున్నప్పుడు, మూల దగ్గర ఏం దొరుకుతుందో ఊహించుకున్నాడు. ప్రతి మలుపులో, ఏం చూస్తాడో అని ఆలోచించాడు. అతను పక్షులు, ఉడుతలు, చెట్లు, పువ్వులు చూశాడు. అతను కొన్ని తేనెటీగలను కూడా చూశాడు!\nఅప్పుడు, టిమ్ ఒక మూలకి చేరుకున్నాడు. అతను నిరాశపడ్డాడు, కానీ అప్పుడు అతను మరొక దారిని గమనించాడు! అతను దానిని అనుసరించి త్వరలోనే ఒక ప్రారంభానికి చేరుకున్నాడు. అది ఏమిటో అతనికి తెలియదు, కాబట్టి అతను దగ్గరగా చూడాలని నిర్ణయించుకున్నాడు.\nఆ ప్రారంభం ఒక గేటు అని అతను కనుగొన్నాడు. గేటు దాటిన చోట అందమైన పువ్వులతో నిండిన తోట ఉంది. టిమ్ చాలా ఉత్సాహపడ్డాడు! అతను గేటు దగ్గరకు వెళ్లి దాన్ని తెరవడానికి ప్రయత్నించాడు, కానీ అది కదలలేదు.\nఒక వ్యక్తి వచ్చి, అతను ఏమి చేస్తున్నాడో అడిగాడు. టిమ్ అతను కేవలం అన్వేషించాలనుకుంటున్నానని వివరించాడు. ఆ వ్యక్తి చాలా మొరటుగా మాట్లాడి, వెళ్లిపోమని చెప్పాడు.\nటిమ్ విచారంగా తాను వచ్చిన దారిలో వెనక్కి నడిచాడు, కానీ తోటలోకి వెళ్ళే మార్గాన్ని కనుగొనాలని దృఢంగా నిర్ణయించుకున్నాడు. ఒక రోజు తాను ఒక మార్గాన్ని కనుగొంటానని ఊహించుకున్నాడు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-182",
    "english_text": "Once upon a time, there was a little boy named Tim. Tim was a regular boy who loved to play outside. One day, he found a big, shiny ball in his yard. The ball was very special, and it made him very happy.\nAs Tim played with the ball, he saw his friend, Sue. Sue wanted to play with the ball too. Tim said, \"Let's play together, but we must be careful not to drop the ball.\" Sue agreed, and they played all day long.\nAs the sky turned dark, Tim and Sue knew it was time to go home. They were very tired, but also very happy. Before leaving, Sue said, \"Thank you for sharing your ball, Tim. We had so much fun!\" Tim smiled and said, \"You're welcome, Sue. Sharing is what makes playing even more fun!\"\nAnd from that day on, Tim and Sue always shared their toys and played together. They learned that sharing is a good thing to do, and it made their friendship even stronger.",
    "telugu_text": "ఒకానొకప్పుడు, టిమ్ అనే ఒక చిన్న పిల్లాడు ఉండేవాడు. టిమ్ ఒక సాధారణ పిల్లాడు, బయట ఆడుకోవడం అంటే చాలా ఇష్టం. ఒక రోజు, అతను తన తోటలో ఒక పెద్ద, మెరిసే బంతిని కనుగొన్నాడు. ఆ బంతి చాలా ప్రత్యేకమైనది, అది అతనికి చాలా సంతోషాన్ని ఇచ్చింది.\nటిమ్ ఆ బంతితో ఆడుకుంటుండగా, అతను తన స్నేహితురాలు సూనిని చూశాడు. సూని కూడా ఆ బంతితో ఆడాలని అనుకుంది. టిమ్ అన్నాడు, \"మనం కలిసి ఆడుకుందాం, కానీ బంతిని పడకుండా జాగ్రత్తగా ఉండాలి.\" సూని అంగీకరించింది, వాళ్లిద్దరూ రోజంతా ఆడుకున్నారు.\nఆకాశం చీకటిగా మారినప్పుడు, టిమ్, సూని ఇంటికి వెళ్లవలసిన సమయం వచ్చిందని తెలుసుకున్నారు. వాళ్ళు చాలా అలసిపోయారు, కానీ చాలా సంతోషంగా కూడా ఉన్నారు. వెళ్లే ముందు, సూని అంది, \"నీ బంతిని పంచుకున్నందుకు ధన్యవాదాలు, టిమ్. చాలా సరదాగా గడిపాము!\" టిమ్ నవ్వి, \"సంతోషం, సూని. పంచుకోవడం వలన ఆడుకోవడం ఇంకా సరదాగా మారుతుంది!\"\nఆ రోజు నుండి, టిమ్, సూని ఎల్లప్పుడూ తమ బొమ్మలను పంచుకుని కలిసి ఆడుకునేవారు. పంచుకోవడం మంచి పని అని వాళ్ళు నేర్చుకున్నారు, అది వారి స్నేహాన్ని మరింత బలంగా చేసింది."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-025",
    "english_text": "Once upon a time, there was a little girl named Julia. This morning, she wanted to go on an adventure. She put on her warm coat and her scarf, and then stepped out of doors. As soon as she looked around, she saw a big, icy lake. She said, \"Wow! Look at that lake! It's all mine!\"\nJulia wanted to explore the middle of the lake, so she took off her shoes and put them aside. Then, she put one careful foot into the icy water. She squealed, \"It's so cold!\" She looked around and wondered what she should do next. \n \nSuddenly, she heard a soft voice say, \"Put your feet back on the ground, Julia.\" She turned around and saw that it was her Dad.\nHe smiled at her and said, \"You can explore, but you can't go in the lake. It's too icy!\" \nJulia nodded and said, \"Ok. I won't go in the lake!\" She put her shoes back on, and she and her Dad walked around the lake, looking at all the animals.\nThe end.",
    "telugu_text": "ఒకప్పుడు, లిల్లీ అనే ఒక చిన్న అమ్మాయి ఉండేది. ఈ రోజు ఉదయం, ఆమె ఒక సాహసయాత్రకు వెళ్లాలని అనుకుంది. ఆమె తన వెచ్చని కోటును, స్కార్ఫ్ను వేసుకుని, బయటకు నడిచింది. తను చుట్టూ చూసిన వెంటనే, ఒక పెద్ద, మంచుతో కప్పబడిన సరస్సు కనిపించింది. ఆమె అంది, \"వావ్! ఆ సరస్సును చూడు! అది అంతా నాది!\"\nలిల్లీ సరస్సు మధ్యలో అన్వేషించాలని అనుకుంది, కాబట్టి ఆమె తన బూట్లు తీసి పక్కన పెట్టింది. అప్పుడు, ఆమె ఒక జాగ్రత్తగా పాదాన్ని మంచు నీటిలోకి పెట్టింది. ఆమె అరిచింది, \"చాలా చల్లగా ఉంది!\" ఆమె చుట్టూ చూసి, తదుపరి ఏమి చేయాలో ఆలోచించింది.\nఅకస్మాత్తుగా, ఒక మెత్తని స్వరం వినిపించింది, \"లిల్లీ, నీ కాళ్లను మళ్లీ నేలపై ఉంచు.\" ఆమె వెనక్కి తిరిగి చూసింది, అది తన నాన్న అని చూసింది.\nఅతను ఆమెకు నవ్వి, \"నువ్వు అన్వేషించవచ్చు, కానీ నువ్వు సరస్సులోకి వెళ్లలేవు. అది చాలా మంచుతో ఉంది!\"\nలిల్లీ తలూపి, \"సరే. నేను సరస్సులోకి వెళ్ళను!\" ఆమె తన బూట్లు వేసుకుంది, మరియు ఆమె, ఆమె నాన్న సరస్సు చుట్టూ నడిచారు, అన్ని జంతువులను చూశారు.\nముగింపు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-005",
    "english_text": "Once upon a time, there was a little cat named Kitty. Kitty loved to sleep all day. She had a favorite spot near the window with a big, soft curtain. Kitty thought it was easy to sleep there.\nOne sunny day, Kitty was sleeping behind the curtain. A little bird named Birdy came to the window. Birdy said, \"Kitty, do you want to come out and play?\" Kitty woke up and looked at Birdy. She said, \"No, I want to sleep. It is easy to sleep here.\"\nBirdy flew away and Kitty went back to sleep. But while she was sleeping, the wind blew the curtain. The curtain fell on Kitty. Kitty was scared and cried for help. But no one heard her cries. So, Kitty stayed under the curtain, sad and alone.",
    "telugu_text": "ఒకానొకప్పుడు, కిట్టి అనే ఒక చిన్న పిల్లి ఉండేది. కిట్టి రోజంతా నిద్రపోవడానికి చాలా ఇష్టపడేది. కిటికి కిటికీ దగ్గర పెద్ద, మెత్తటి తెర ఉన్న చోటు అంటే చాలా ఇష్టం. అక్కడ నిద్రపోవడం సులభమని కిట్టి అనుకుంది.\nఒక సూర్యరశ్మి ఉన్న రోజు, కిట్టి తెర వెనుక నిద్రిస్తోంది. బర్డీ అనే ఒక చిన్న పక్షి కిటికీ దగ్గరకు వచ్చింది. బర్డీ అంది, \"కిట్టి, బయటికి వచ్చి ఆడుకోవాలనుకుంటున్నావా?\" కిట్టి నిద్ర లేచి బర్డీని చూసింది. అది అంది, \"లేదు, నాకు నిద్ర కావాలి. ఇక్కడ నిద్రపోవడం సులభం.\"\nబర్డీ ఎగిరిపోయింది, కిట్టి మళ్లీ నిద్రపోయింది. కానీ అది నిద్రపోతున్నప్పుడు, గాలి తెరను ఊదింది. తెర కిట్టిపైన పడింది. కిట్టి భయపడి సహాయం కోసం ఏడ్చింది. కానీ ఎవరూ ఆమె ఏడుపు వినలేదు. అందుకే, కిట్టి తెర కింద, బాధగా ఒంటరిగా ఉండిపోయింది."
   }

  "TB05": [
   {
    "order_in_batch": 1,
    "item_id": "T-018",
    "english_text": "Once upon a time, a little star lived in the sky. The star was broken, but it still shone bright. Every night, the star would lean down to see the world below.\nOne night, a boy looked up and saw the broken star. He wished for a friend to play with. The star heard his wish and felt sad. The star wanted to help the boy, but didn't know how.\nThe next day, the boy went to the park. He saw a girl who was alone. The boy went to her and asked if she wanted to play. The girl smiled and said yes. The broken star saw this from the sky and felt happy. The boy and the girl became best friends.\nThe broken star learned that even if it was not perfect, it could still make others happy. And the boy learned that sometimes, you just need to ask for what you want. They all lived happily ever after.",
    "telugu_text": "ఒకప్పుడు, ఒక చిన్న నక్షత్రం ఆకాశంలో నివసించేది. ఆ నక్షత్రం పగిలిపోయినా, ఇంకా ప్రకాశవంతంగా మెరిసిపోతోంది. ప్రతి రాత్రి, ఆ నక్షత్రం కింద ఉన్న ప్రపంచాన్ని చూడడానికి వంగేది.\nఒక రాత్రి, ఒక అబ్బాయి పైకి చూసి ఆ పగిలిన నక్షత్రాన్ని చూశాడు. అతను ఆడుకోవడానికి ఒక స్నేహితుడిని కోరుకున్నాడు. ఆ నక్షత్రం అతని కోరికను వింది, బాధపడింది. ఆ నక్షత్రం అబ్బాయికి సహాయం చేయాలనుకుంది, కానీ ఎలా చేయాలో తెలియలేదు.\nమరుసటి రోజు, అబ్బాయి పార్కుకు వెళ్ళాడు. అక్కడ ఒంటరిగా ఉన్న ఒక అమ్మాయిని చూశాడు. అబ్బాయి ఆమె దగ్గరకు వెళ్లి ఆడుకోవాలనుకుంటుందా అని అడిగాడు. అమ్మాయి నవ్వి, అవును అంది. పగిలిన నక్షత్రం ఆకాశం నుండి దీన్ని చూసి సంతోషపడింది. అబ్బాయి, అమ్మాయి మంచి స్నేహితులు అయ్యారు.\nపగిలిన నక్షత్రం, అది పరిపూర్ణంగా లేకపోయినా, ఇతరులను సంతోషపెట్టగలదని నేర్చుకుంది. మరియు అబ్బాయి, కొన్నిసార్లు, మనం కోరుకున్నది అడగడమే సరిపోతుందని నేర్చుకున్నాడు. వాళ్ళు ఎప్పటికీ సంతోషంగా జీవించారు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-122",
    "english_text": "Helen was feeling uncomfortable as she stood in the laundry room. She had been sent here by her mother to fold clothes.\n\"Do it quickly!\" her mother demanded.\nHelen looked around, feeling overwhelmed. She had never folded laundry before. She did not know where to start.\nHelen frowned. She didn't want to be here, but she had to do what her mother said.\nSo, she tried her best. She folded shirt after shirt, but she was too slow for her mother.\n\"Faster!\" her mother demanded.\nHelen felt frustrated. She wished she could be done with the task quickly, but it was too hard.\nFinally, after much effort, she finished the task. She breathed a sigh of relief.\nHer mother smiled. \"Good job,\" she said.\nHelen smiled back, thankful that the uncomfortable task was finally over.",
    "telugu_text": "హెలెన్ బట్టల గదిలో నిలబడినప్పుడు అసౌకర్యంగా అనిపించింది. బట్టలు మడతపెట్టడానికి తన అమ్మ ఆమెను ఇక్కడికి పంపింది.\n\"త్వరగా చేయి!\" అని ఆమె అమ్మ అడిగింది.\nహెలెన్ చుట్టూ చూసింది, చాలా ఒత్తిడిగా అనిపించింది. ఇంతకుముందు ఆమె ఎప్పుడూ బట్టలు మడతపెట్టలేదు. ఎక్కడ మొదలు పెట్టాలో ఆమెకు తెలియలేదు.\nహెలెన్ ముఖం చిట్లించింది. ఆమె ఇక్కడ ఉండాలని అనుకోలేదు, కానీ తన అమ్మ చెప్పింది చేయాలి.\nఅందుకే, ఆమె తన వంతు ప్రయత్నం చేసింది. ఆమె చొక్కా తర్వాత చొక్కా మడతపెట్టింది, కానీ ఆమె తన అమ్మకు చాలా నెమ్మదిగా ఉంది.\n\"వేగంగా!\" అని ఆమె అమ్మ అడిగింది.\nహెలెన్ నిరాశ చెందింది. ఆ పని త్వరగా పూర్తవాలని ఆమె కోరుకుంది, కానీ అది చాలా కష్టంగా ఉంది.\nచివరికి, చాలా ప్రయత్నం చేసిన తర్వాత, ఆమె పని పూర్తి చేసింది. ఆమె ఊపిరి వదిలింది.\nఆమె అమ్మ నవ్వింది. \"చాలా బాగా చేశావు,\" అంది.\nఅసౌకర్యమైన పని చివరకు పూర్తయినందుకు కృతజ్ఞతగా హెలెన్ కూడా నవ్వింది."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-034",
    "english_text": "Once, there was a big sun who was very impatient. The sun wanted to melt all the snow to make way for the flowers to grow. The sun knew that when the snow was gone, the animals would wake up from sleep and come out to play.\nThe sun worked hard every day, shining bright and warm. The snow began to melt, and little streams of water flowed. The sun knew that soon, the animals would wake up and see the flowers.\nOne day, the sun saw a big bear wake up from sleep. The bear saw the flowers and was so happy. The sun smiled, knowing that its hard work had paid off. Now, all the animals could enjoy the warm days and play together in the beautiful meadow.",
    "telugu_text": "ఒకప్పుడు, చాలా తొందరపడే ఒక పెద్ద సూర్యుడు ఉన్నాడు. పువ్వులు పెరగడానికి దారి చేయడానికి అతను అన్ని మంచును కరిగించాలని అనుకున్నాడు. మంచు పోయినప్పుడు, జంతువులు నిద్ర నుండి మేల్కొని వచ్చి ఆడుకోవడానికి వస్తాయని సూర్యుడు తెలుసుకున్నాడు.\nసూర్యుడు ప్రతిరోజూ కష్టపడి పనిచేశాడు, ప్రకాశవంతంగా మరియు వెచ్చగా మెరిశాడు. మంచు కరగడం మొదలైంది, మరియు చిన్న నీటి ప్రవాహాలు ప్రవహించాయి. త్వరలో, జంతువులు మేల్కొని పువ్వులను చూస్తాయని సూర్యుడు తెలుసుకున్నాడు.\nఒక రోజు, సూర్యుడు ఒక పెద్ద ఎలుగుబంటి నిద్ర నుండి మేల్కొనడాన్ని చూశాడు. ఎలుగుబంటి పువ్వులను చూసి చాలా సంతోషపడింది. సూర్యుడు నవ్వాడు, తన కష్టానికి ఫలితం దక్కిందని తెలుసుకున్నాడు. ఇప్పుడు, అన్ని జంతువులు ఆ వెచ్చని రోజులను ఆస్వాదించి, అందమైన మైదానంలో కలిసి ఆడుకోవచ్చు."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-051",
    "english_text": "Once upon a time there was a brilliant spot. The spot was so shiny it lit up the world around it. All the animals and birds wanted to come and take a look at the beautiful spot.\nOne day a small bunny came near the spot and it started to sneeze. It was so loud that it scared the spot away! The bunny was so scared that it quickly ran away.\nWhen the other animals and birds noticed that spot had gone, they were very sad. Then they had an idea. The birds flew high in the sky and shouted loudly \"Bring back the spot!\".\nUnfortunately it was too late. The spot had gone and was never seen again. Everyone was so sad, but the little bunny was the saddest of all.",
    "telugu_text": "ఒకప్పుడు ఒక మెరిసే చోటు ఉండేది. ఆ చోటు చాలా మెరిసిపోతుండేది, అది చుట్టూ ఉన్న ప్రపంచాన్ని వెలిగించేది. అన్ని జంతువులు, పక్షులు ఆ అందమైన చోటును చూడడానికి రావాలని అనుకున్నాయి.\nఒక రోజు ఒక చిన్న కుందేలు ఆ చోటు దగ్గరకు వచ్చింది, అది తుమ్మడం మొదలుపెట్టింది. అది చాలా పెద్దగా తుమ్మింది, దాని వలన ఆ చోటు దూరమైపోయింది! కుందేలు చాలా భయపడి, వెంటనే పారిపోయింది.\nఇతర జంతువులు, పక్షులు ఆ చోటు పోయిందని గమనించినప్పుడు, అవి చాలా బాధపడ్డాయి. అప్పుడు వారికి ఒక ఆలోచన వచ్చింది. పక్షులు ఆకాశంలో ఎత్తుకు ఎగిరి పెద్దగా \"ఆ చోటును తిరిగి తీసుకురండి!\" అని అరిచాయి.\nఅయితే, అది చాలా ఆలస్యం అయింది. ఆ చోటు పోయి, మళ్ళీ ఎప్పుడూ చూడలేదు. అందరూ చాలా బాధపడ్డారు, కానీ ఆ చిన్న కుందేలు అన్నిటికంటే ఎక్కువగా బాధపడింది."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-099",
    "english_text": "Once upon a time, there was a little boy named Tim. He loved to step and jump all day long. One day, he saw a big quiz on the wall of his school. The quiz was about spicy food. Tim wanted to win the quiz and get a big prize.\nTim went home and asked his mom about spicy food. His mom told him that spicy food can be hot and make your mouth burn. Tim thought, \"I don't want to eat spicy food, but I want to win the quiz.\" So, he learned all about spicy food and went to school the next day.\nAt school, Tim took the quiz and won the prize. But the prize was a big, spicy pepper! Tim didn't want to eat it, but he didn't want to lose the prize either. So, he gave the spicy pepper to his friend who loved spicy food. Tim learned that winning is not always about getting something for yourself, but also about helping others.",
    "telugu_text": "ఒకానొకప్పుడు, టిమ్ అనే ఒక చిన్న పిల్లాడు ఉండేవాడు. అతను రోజంతా నడవడానికి, దూకడానికి చాలా ఇష్టపడేవాడు. ఒక రోజు, అతను తన పాఠశాల గోడపై ఒక పెద్ద క్విజ్ చూశాడు. ఆ క్విజ్ కారంగా ఉండే ఆహారం గురించి. టిమ్ ఆ క్విజ్లో గెలవాలని, పెద్ద బహుమతి పొందాలని అనుకున్నాడు.\nటిమ్ ఇంటికి వెళ్లి తన అమ్మను కారంగా ఉండే ఆహారం గురించి అడిగాడు. అతని అమ్మ కారంగా ఉండే ఆహారం వేడిగా ఉంటుందని, నోరు మంట పడుతుందని చెప్పింది. టిమ్ అనుకున్నాడు, \"నాకు కారంగా ఉండే ఆహారం తినాలని లేదు, కానీ నేను క్విజ్లో గెలవాలి.\" కాబట్టి, అతను కారంగా ఉండే ఆహారం గురించి అన్నీ నేర్చుకుని, మరుసటి రోజు పాఠశాలకు వెళ్ళాడు.\nపాఠశాలలో, టిమ్ క్విజ్లో పాల్గొని బహుమతి గెలిచాడు. కానీ ఆ బహుమతి ఒక పెద్ద, కారంగా ఉండే మిరపకాయ! టిమ్ దానిని తినకూడదని అనుకున్నాడు, కానీ బహుమతిని కోల్పోకూడదు కూడా అనుకున్నాడు. కాబట్టి, అతను కారంగా ఉండే మిరపకాయను కారంగా ఉండే ఆహారం ఇష్టపడే తన స్నేహితుడికి ఇచ్చాడు. గెలవడం అంటే ఎప్పుడూ మన కోసం ఏదో ఒకటి పొందడం మాత్రమే కాదు, ఇతరులకు సహాయం చేయడం కూడా అని టిమ్ నేర్చుకున్నాడు."
   }

  "TB06": [
   {
    "order_in_batch": 1,
    "item_id": "T-047",
    "english_text": "Once upon a time, there was a chubby cat named Tom. Tom was a very happy cat, but he had a problem. He always forgot where he put his toys. One day, he lost his favorite toy, a ball of yarn. Tom looked everywhere but could not find it.\nTom had a friend named Sue, a little bird. Sue was very smart and liked to help Tom. She said, \"I will remind you where you put your yarn.\" Sue flew around the house, looking for the yarn. She found it under a chair. Tom was so happy to have his yarn back.\nBut when Tom started to play with the yarn, he found a needle in it. The needle was sharp, and Tom was scared. He didn't want to get hurt. Sue had an idea. She took the needle and put it in a safe place. Now, Tom could play with his yarn without worrying about the needle. Tom and Sue played together all day, and they became the best of friends.",
    "telugu_text": "ఒకానొకప్పుడు, టామ్ అనే బొద్దుగా ఉండే పిల్లి ఉండేది. టామ్ చాలా సంతోషంగా ఉండే పిల్లి, కానీ అతనికి ఒక సమస్య ఉండేది. అతను తన బొమ్మలను ఎక్కడ పెట్టాడో ఎప్పుడూ మర్చిపోయేవాడు. ఒక రోజు, అతను తన ఇష్టమైన బొమ్మను, ఒక దారపు బంతిని పోగొట్టుకున్నాడు. టామ్ అన్ని చోట్లా చూశాడు కానీ దాన్ని కనుగొనలేకపోయాడు.\nటామ్కి సూ అనే స్నేహితురాలు ఉండేది, అది ఒక చిన్న పక్షి. సూ చాలా తెలివైనది మరియు టామ్కు సహాయం చేయడం అంటే ఇష్టం. ఆమె అంది, \"నువ్వు నీ దారం ఎక్కడ పెట్టావో నేను నీకు గుర్తు చేస్తాను.\" సూ ఆ ఇంటిలో ఎగురుతూ, దారాన్ని వెతుకుతూ ఉంది. ఆమె దాన్ని ఒక కుర్చీ కింద కనుగొంది. తన దారాన్ని తిరిగి పొందినందుకు టామ్ చాలా సంతోషించాడు.\nకానీ టామ్ దారంతో ఆడుకోవడం మొదలుపెట్టినప్పుడు, అందులో ఒక సూదిని కనుగొన్నాడు. ఆ సూది పదునైనది, మరియు టామ్ భయపడ్డాడు. అతనికి గాయపడాలనిపించలేదు. సూకి ఒక ఆలోచన వచ్చింది. ఆమె ఆ సూదిని తీసుకుని దాన్ని సురక్షితమైన చోట పెట్టింది. ఇప్పుడు, సూది గురించి ఆందోళన చెందకుండా టామ్ తన దారంతో ఆడుకోవచ్చు. టామ్ మరియు సూ రోజంతా కలిసి ఆడుకున్నారు, మరియు వారు మంచి స్నేహితులుగా మారారు."

   {
    "order_in_batch": 2,
    "item_id": "T-069",
    "english_text": "Once there was a small duck who wanted to be the same color as everyone else but he was born green. Every day the other ducks at the lake insisted that he was different and laughed at him. The small duck felt very frightened.\nOne day while he was playing by the edge of the lake, he was confronted by several other ducks. The leader of the group said to him, “We insist that you jump in the lake and come out with a different color. If you don't do it, you are not welcome here.”\nThe small duck was very scared and didn't want to jump in the lake, but he had no choice. He jumped and sank to the bottom. For a while nothing happened, but then he started to feel something strange happening to him. To his surprise, he felt his feathers turning from green to white.\nWhen the small duck surfaced, the other ducks were astonished. They had never seen a duck with such light feathers before. They cheered and cheered for the small duck, who had courageously defied their orders and accomplished a seemingly impossible task. From that day on, the small duck was accepted, and the other ducks at the lake no longer insisted he was different.",
    "telugu_text": "ఒక చిన్న ఆవుల పిల్ల ఉండేది, అది అందరిలాగే రంగు కావాలని కోరుకుంది, కానీ అది ఆకుపచ్చ రంగులో పుట్టింది. ప్రతిరోజూ సరస్సులోని మిగతా ఆవుల పిల్లలు అది వేరని, దానిని నవ్వుతూ చెప్పేవారు. ఆ చిన్న ఆవుల పిల్ల చాలా భయపడింది.\nఒక రోజు అది సరస్సు అంచున ఆడుకుంటుండగా, చాలా ఇతర ఆవుల పిల్లలు దానిని ఎదుర్కొన్నారు. గుంపు నాయకుడు దానితో, \"నువ్వు సరస్సులోకి దూకి, వేరే రంగులో బయటకు రా అని మేము చెబుతున్నాము. నువ్వు అలా చేయకపోతే, నీకు ఇక్కడ స్వాగతం లేదు,\" అన్నాడు.\nచిన్న ఆవుల పిల్ల చాలా భయపడింది, సరస్సులోకి దూకడానికి ఇష్టపడలేదు, కానీ దానికి వేరే మార్గం లేదు. అది దూకి, అడుగున మునిగిపోయింది. కొద్దిసేపు ఏమీ జరగలేదు, కానీ అప్పుడు దానికి ఏదో వింతగా జరుగుతున్నట్లు అనిపించింది. దాని ఆశ్చర్యానికి, దాని ఈకలు ఆకుపచ్చ నుండి తెలుపుగా మారుతున్నట్లు అనిపించింది.\nచిన్న ఆవుల పిల్ల నీటిపైకి వచ్చినప్పుడు, మిగతా ఆవుల పిల్లలు ఆశ్చర్యపోయారు. ఇంత తేలికైన ఈకలు ఉన్న ఆవుల పిల్లని వారు ఇంతకు ముందు ఎప్పుడూ చూడలేదు. వారు చిన్న ఆవుల పిల్ల కోసం చప్పట్లు కొట్టారు, ఎందుకంటే అది వారి ఆదేశాలను ధైర్యంగా ఉల్లంఘించి, అసాధ్యమైన పనిని పూర్తి చేసింది. ఆ రోజు నుండి, చిన్న ఆవుల పిల్ల అంగీకరించబడింది, మరియు సరస్సులోని మిగతా ఆవుల పిల్లలు అది వేరని అని ఒత్తిరించడం మానేశాయి."

   {
    "order_in_batch": 3,
    "item_id": "T-049",
    "english_text": "Once upon a time, there was a kind dog. The dog had a small house. The house was red and cute. The dog loved his house very much.\nOne day, a big bug came to the house. The bug wanted to bite the house. The kind dog did not want the bug to bite his house. So, the dog barked at the bug. The bug was scared and ran away.\nThe kind dog was happy that the bug did not bite his house. The dog's friends came to play. They all played together near the house. The kind dog and his friends were very happy.",
    "telugu_text": "ఒకానొకప్పుడు, ఒక దయగల కుక్క ఉండేది. ఆ కుక్కకు ఒక చిన్న ఇల్లు ఉండేది. ఆ ఇల్లు ఎరుపు రంగులో చాలా ముద్దుగా ఉండేది. ఆ కుక్క తన ఇంటిని చాలా ఇష్టపడేది.\nఒక రోజు, ఒక పెద్ద కీటకం ఇంటికి వచ్చింది. ఆ కీటకం ఇంటిని కొరకాలని అనుకుంది. దయగల కుక్క ఆ కీటకం తన ఇంటిని కొరకనివ్వకూడదని కోరుకుంది. అందుకే, కుక్క ఆ కీటకానికి అరిచింది. ఆ కీటకం భయపడి పారిపోయింది.\nకీటకం ఇంటిని కొరకకపోయినందుకు దయగల కుక్క సంతోషపడింది. కుక్క స్నేహితులు ఆడుకోవడానికి వచ్చారు. వాళ్ళు అందరూ ఇంటి దగ్గర కలిసి ఆడుకున్నారు. దయగల కుక్క మరియు అతని స్నేహితులు చాలా సంతోషంగా ఉన్నారు."

   {
    "order_in_batch": 4,
    "item_id": "T-140",
    "english_text": "Once upon a time there was a careless hanger who liked to blink a lot. As it was a sunny day, he blinked more than usual. He blinked so much that he eventually got tired and yawned, closing his eyes.\nThe hanger didn't realize that the sun had gone away, and the night had come. He stayed in the same place, still asleep.\nSuddenly, a bright flash of light woke him up. It was a beautiful star in the night sky. It twinkled and shined in all the colors of the rainbow.\nThe hanger was amazed. He quickly opened his eyes, blinked and waved at the star. The star winked and smiled at him.\nThe hanger thought the star was so magical, and he thanked it for its beauty. He blinked once more and fell asleep, happy to be back in the same place.",
    "telugu_text": "ఒకప్పుడు, చాలా అల్లరిగా ఉండే ఒక బట్టల పెట్టేవాడు ఉండేవాడు. అతనికి చాలా కళ్ళు మినుకుమినుకుమలు చేయడం అంటే ఇష్టం. అది సూర్యరశ్మి ఉన్న రోజు కాబట్టి, అతను ఎప్పుడూ మామూలుగా కంటే ఎక్కువగా కళ్ళు మినుకుమినుకుమలాడుతూ ఉండేవాడు. అతను చాలా కళ్ళు మినుకుమినుకుమలాడాడు, చివరికి అలసిపోయి, నిద్రమత్తుగా నిద్రలోకి జారుకున్నాడు.\nబట్టల పెట్టేవాడు సూర్యుడు వెళ్లిపోయి, రాత్రి వచ్చిందని గ్రహించలేదు. అతను అదే చోట, ఇంకా నిద్రిస్తూనే ఉన్నాడు.\nఅకస్మాత్తుగా, ఒక ప్రకాశవంతమైన కాంతి మెరుపు అతన్ని మేల్కొలిపింది. అది రాత్రి ఆకాశంలో ఉన్న ఒక అందమైన నక్షత్రం. అది మెరిసి, ఇంద్రధనుస్సులోని అన్ని రంగుల్లో ప్రకాశించింది.\nబట్టల పెట్టేవాడు ఆశ్చర్యపోయాడు. అతను త్వరగా కళ్ళు తెరిచి, కళ్ళు మినుకుమినుకుమలాడుతూ ఆ నక్షత్రానికి వీడ్కోలు చెప్పాడు. ఆ నక్షత్రం కన్ను కొట్టి, అతనికి నవ్వింది.\nఆ బట్టల పెట్టేవాడు ఆ నక్షత్రం చాలా మాయాజాలం అని అనుకున్నాడు, దాని అందానికి కృతజ్ఞతలు చెప్పాడు. అతను మరోసారి కళ్ళు మినుకుమినుకుమలాడుతూ, అదే చోట తిరిగి వచ్చి సంతోషంగా నిద్రపోయాడు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-088",
    "english_text": "One day, a quiet girl named Lily went with her mom to prepare for a big party. They went to the store to buy things like balloons, cake, and a big, funny skeleton. They wanted the party to be fun for everyone.\nAt the party, Lily's friends were playing and laughing. They saw the big, funny skeleton hanging on the wall. They all said, \"Wow, that's a cool skeleton!\" Lily was happy that her friends liked the skeleton.\nThen, something unexpected happened! The skeleton started to move and talk. It said, \"Hello, kids! Let's dance and have fun!\" The kids were surprised but they danced and played with the talking skeleton. The party was the best one ever, and everyone had a great time.",
    "telugu_text": "ఒక రోజు, లిల్లీ అనే నిశ్శబ్ద అమ్మాయి తన అమ్మతో కలిసి ఒక పెద్ద పార్టీకి సిద్ధం అవ్వడానికి వెళ్ళింది. బెలూన్లు, కేక్, మరియు ఒక పెద్ద, సరదామైన ఎముకగడను కొనడానికి వారు దుకాణానికి వెళ్లారు. వారు అందరికీ సరదాగా ఉండేలా పార్టీని కోరుకున్నారు.\nపార్టీలో, లిల్లీ స్నేహితులు ఆడుకుంటూ, నవ్వుతూ ఉన్నారు. వారు గోడపై వేలాడుతున్న పెద్ద, సరదా ఎముకగడను చూశారు. వారందరూ, \"వావ్, అది చాలా బాగుంది!\" అన్నారు. స్నేహితులు ఎముకగడను ఇష్టపడినందుకు లిల్లీ సంతోషపడింది.\nఅప్పుడు, ఏదో ఊహించనిది జరిగింది! ఆ ఎముకగడ కదలడం, మాట్లాడటం మొదలుపెట్టింది. అది, \"హలో, పిల్లలూ! వందడుగు వేద్దాం, సరదాగా ఆడుకుందాం!\" అంది. పిల్లలు ఆశ్చర్యపోయారు కానీ వారు మాట్లాడే ఎముకగడతో నాట్యం చేశారు, ఆడుకున్నారు. ఆ పార్టీ ఎప్పుడూ గొప్పదిగా ఉంది, అందరూ చాలా సంతోషంగా గడిపారు."
   }

  "TB07": [
   {
    "order_in_batch": 1,
    "item_id": "T-055",
    "english_text": "Once upon a time, there was a bird with a mighty wing. The bird liked to fly high in the sky. One day, the bird saw another bird with a pretty wing. The bird wanted to display its mighty wing to the pretty bird. So, the bird flew close to the pretty bird and showed off its wing.\nThe pretty bird did not like it. The pretty bird felt sad that the mighty bird was showing off. The two birds started to fight. They both wanted to be the best bird with the best wing. The fight made both birds very tired.\nSoon, they realized that fighting was not good. They both had nice wings and they could be friends. The mighty bird said sorry to the pretty bird. The pretty bird said sorry too. They both learned that it is better to be kind and share than to show off and fight. And from that day on, the two birds became best friends, flying together in the sky.",
    "telugu_text": "ఒకప్పుడు, ఒక బలమైన రెక్కలు ఉన్న పక్షి ఉండేది. ఆ పక్షి ఆకాశంలో ఎత్తుగా ఎగరడానికి ఇష్టపడేది. ఒక రోజు, ఆ పక్షికి అందమైన రెక్కలు ఉన్న మరొక పక్షి కనిపించింది. ఆ పక్షి తన బలమైన రెక్కను అందమైన పక్షికి చూపించాలనుకుంది. అందుకే, ఆ పక్షి అందమైన పక్షి దగ్గరకు ఎగిరి, తన రెక్కను చూపించింది.\nఅందమైన పక్షికి అది నచ్చలేదు. బలమైన పక్షి తన రెక్కను చూపించడం చూసి బాధపడింది. ఆ రెండు పక్షులు పోరాడటం మొదలుపెట్టాయి. రెండూ తమకు మంచి రెక్కలు, మంచి పక్షి కావాలని కోరుకున్నాయి. ఆ పోరాటం వల్ల రెండు పక్షులు చాలా అలసిపోయాయి.\nత్వరలోనే, పోరాటం మంచిది కాదని అవి గ్రహించాయి. రెండూ మంచి రెక్కలు కలిగి ఉన్నాయి, అవి స్నేహితులుగా ఉండవచ్చు. బలమైన పక్షి అందమైన పక్షికి క్షమాపణ చెప్పింది. అందమైన పక్షి కూడా క్షమాపణ చెప్పింది. చూపించడం, పోరాడటం కంటే దయగా ఉండటం, పంచుకోవడం మంచిదని అవి రెండూ నేర్చుకున్నాయి. ఆ రోజు నుండి, ఆ రెండు పక్షులు మంచి స్నేహితులుగా మారి, ఆకాశంలో కలిసి ఎగరడం మొదలుపెట్టాయి."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-004",
    "english_text": "One day, a grumpy cat named Tom found a ticket on the floor. He did not know what it was for, but he wanted to find out. He walked and walked, looking for someone who could tell him about the ticket.\nTom met a nice dog named Max. Max said the ticket was for a big party. Tom was happy about the party, but he did not like loud noises. He started to feel scared, but Max told him not to worry. They would go to the party together and have fun.\nWhen they got to the party, it was not loud at all! It was a quiet party for animals who did not like loud noises. Tom and Max were happy to be there. They ate good food, played fun games, and made new friends. At the end of the party, Tom was not grumpy anymore. He and Max had a great time, and they were glad they went to the party. They went home and settled down for a good night's sleep.",
    "telugu_text": "ఒక రోజు, టామ్ అనే చిరాకుపడే పిల్లి నేల మీద ఒక టికెట్ కనుగొన్నాడు. అది దేనికి అని అతనికి తెలియదు, కానీ అది తెలుసుకోవాలనిపించింది. అతను నడిచాడు, నడిచాడు, ఆ టికెట్ గురించి చెప్పగలిగే వారి కోసం వెతికాడు.\nటామ్ అనే మంచి కుక్కను టామ్ కలిశాడు. టికెట్ ఒక పెద్ద పార్టీ కోసం అని మాక్స్ చెప్పాడు. టామ్ ఆ పార్టీ గురించి సంతోషపడ్డాడు, కానీ అతనికి పెద్ద శబ్దాలు నచ్చలేదు. అతను భయపడటం మొదలుపెట్టాడు, కానీ మాక్స్ అతనికి చింతించవద్దని చెప్పాడు. వారు కలిసి పార్టీకి వెళ్లి సరదాగా గడుపుతారని.\nవారు పార్టీకి చేరుకున్నప్పుడు, అది అస్సలు పెద్ద శబ్దాలు లేవు! పెద్ద శబ్దాలు నచ్చని జంతువుల కోసం అది నిశ్శబ్దమైన పార్టీ. టామ్ మరియు మాక్స్ అక్కడ ఉండటం సంతోషంగా ఉంది. వారు మంచి ఆహారం తిన్నారు, సరదా ఆటలు ఆడారు, కొత్త స్నేహితులను చేసుకున్నారు. పార్టీ చివర్లో, టామ్ ఇక చిరాకుపడేవాడు కాదు. అతను మరియు మాక్స్ చాలా సరదాగా గడిపారు, వారు పార్టీకి వెళ్లడం సంతోషంగా అనిపించింది. వారు ఇంటికి వెళ్లి మంచి రాత్రి నిద్రపోవడానికి సిద్ధమయ్యారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-072",
    "english_text": "Once upon a time, there was an old cat named Tom. Tom loved to nap all day long. He had a favorite spot near a big tree where he would nap every day.\nOne day, Tom found a shiny knife under the tree. He had never seen a knife before. Tom was very curious and wanted to play with it. He pushed the knife with his paw and it moved. Tom was very happy to have a new toy.\nBut then, something unexpected happened. The knife turned into a big, friendly dog named Max! Max told Tom that he was a magic dog and was stuck as a knife until someone played with him. Tom and Max became best friends and they would nap and play together every day.",
    "telugu_text": "ఒకప్పుడు, టామ్ అనే ఒక పాత పిల్లి ఉండేది. టామ్ రోజంతా నిద్రపోవడానికి చాలా ఇష్టపడేది. ప్రతిరోజూ అది ఒక పెద్ద చెట్టు దగ్గర నిద్రపోయే ఒక ఇష్టమైన స్థలాన్ని కలిగి ఉండేది.\nఒక రోజు, టామ్ చెట్టు కింద మెరిసే కత్తిని కనుగొంది. అది ఇంతకు ముందు కత్తిని ఎప్పుడూ చూడలేదు. టామ్ చాలా ఆసక్తిగా ఉండి, దానితో ఆడుకోవాలని అనుకుంది. అది తన పావుతో కత్తిని నెట్టింది, అది కదిలింది. కొత్త బొమ్మ దొరికినందుకు టామ్ చాలా సంతోషపడింది.\nకానీ అప్పుడు, ఏదో ఊహించనిది జరిగింది. ఆ కత్తి ఒక పెద్ద, స్నేహపూర్వకమైన కుక్కగా, మాక్స్ గా మారింది! మాక్స్ టామ్తో అది ఒక మాయా కుక్క అని, ఎవరైనా దానితో ఆడుకుంటేనే అది కత్తిగా ఉంటుంది అని చెప్పింది. టామ్, మాక్స్ మంచి స్నేహితులు అయ్యారు, మరియు వారు ప్రతిరోజూ కలిసి నిద్రపోవడానికి మరియు ఆడుకోవడానికి ఇష్టపడ్డారు."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-033",
    "english_text": "Once, there was a kind car named Coby. Coby loved to help his friends. One day, Coby saw his friend, a little bike named Binky, who was very sad.\nBinky was sad because he had no fuel. Coby wanted to help Binky, so he went to find some fuel. Coby found a can of fuel and used it to cover Binky's tank. Binky was very happy.\nFrom that day on, Binky and Coby were best friends. They learned that being kind and helping others can make everyone happy. And that is the best thing to do.",
    "telugu_text": "ఒకప్పుడు, కోబీ అనే దయగల కారు ఉండేది. కోబీ తన స్నేహితులకు సహాయం చేయడం అంటే చాలా ఇష్టం. ఒక రోజు, కోబీ తన స్నేహితుడు, బిన్ని అనే చిన్న సైకిల్ కనిపించాడు, అది చాలా విచారంగా ఉంది.\nబిన్నికి ఇంధనం లేనందున అది విచారంగా ఉంది. కోబీ బిన్నికి సహాయం చేయాలనుకున్నాడు, కాబట్టి అది ఇంధనం వెతకడానికి వెళ్ళింది. కోబీ ఒక ఇంధన డబ్బాను కనుగొని, దానిని బిన్ని ట్యాంక్ను కప్పడానికి ఉపయోగించాడు. బిన్ని చాలా సంతోషపడ్డాడు.\nఆ రోజు నుండి, బిన్ని మరియు కోబీ మంచి స్నేహితులు అయ్యారు. దయగా ఉండటం మరియు ఇతరులకు సహాయం చేయడం వలన అందరూ సంతోషంగా ఉంటారని వారు నేర్చుకున్నారు. మరియు అదే చేయవలసిన ఉత్తమమైన పని."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-139",
    "english_text": "Once upon a time, in a big forest, there lived a long snake named Sam. Sam had a magic stone that could make him change colors. He loved to play with his magic stone and show it to his friends.\nOne day, Sam met a little bird named Bella. Bella saw the magic stone and said, \"Wow, that is so cool! Can you let me see it?\" Sam let Bella see the magic stone, and she touched it. Suddenly, Bella's feathers changed to many bright colors!\nBella was so happy and said, \"Thank you, Sam! This is so much fun!\" They played together all day, changing colors and showing their friends. The magic stone made Sam and Bella the happiest friends in the forest. And they always let their friends play with the magic stone too.",
    "telugu_text": "ఒకానొకప్పుడు, ఒక పెద్ద అడవిలో, సమ్ అనే పొడవైన పాము ఉండేది. సమ్ కి రంగులు మార్చగలిగే ఒక మాయా రాయి ఉండేది. సమ్ తన మాయా రాయితో ఆడుకోవడం, దాన్ని తన స్నేహితులకు చూపించడం అంటే చాలా ఇష్టం.\nఒక రోజు, సమ్ ఒక చిన్న పక్షి అయిన బెల్లాను కలిశాడు. బెల్లా ఆ మాయా రాయిని చూసి, \"వావ్, అది చాలా బాగుంది! నాకు చూపించగలవా?\" అంది. సమ్ బెల్లాకు మాయా రాయిని చూపించాడు, బెల్లా దానిని తాకింది. అకస్మాత్తుగా, బెల్లా ఈకలు చాలా ప్రకాశవంతమైన రంగులుగా మారాయి!\nబెల్లా చాలా సంతోషించి, \"ధన్యవాదాలు, సమ్! ఇది చాలా సరదాగా ఉంది!\" అని చెప్పింది. వాళ్ళు రోజంతా కలిసి ఆడుకున్నారు, రంగులు మార్చారు, తమ స్నేహితులకు చూపించారు. ఆ మాయా రాయి సమ్ మరియు బెల్లాను అడవిలో అత్యంత సంతోషంగా ఉండే స్నేహితులుగా చేసింది. మరియు వాళ్ళు ఎప్పుడూ తమ స్నేహితులకు కూడా మాయా రాయితో ఆడుకునేలా అనుమతించారు."
   }

  "TB08": [
   {
    "order_in_batch": 1,
    "item_id": "T-197",
    "english_text": "Once upon a time, there was a helpful dog named Spot. Spot loved to help his friends. One day, Spot saw a post. The post was very dirty. Spot wanted to help make it clean.\nSpot decided to polish the post. He licked and rubbed the post with his paws. The post became clean and shiny. But then, a big cat came. The cat was not happy. The cat said, \"That is my post! I like it dirty!\"\nSpot felt sad. He did not want to make the cat unhappy. So, Spot found some dirt and put it back on the post. The cat was happy again. Spot learned that sometimes helping means doing what others want, even if it is not what you want.",
    "telugu_text": "ఒకప్పుడు, స్పాట్ అనే సహాయకారి కుక్క ఉండేది. స్పాట్ తన స్నేహితులకు సహాయం చేయడం అంటే చాలా ఇష్టం. ఒక రోజు, స్పాట్ ఒక పోస్ట్ చూశాడు. ఆ పోస్ట్ చాలా మురికిగా ఉంది. దాన్ని శుభ్రం చేయడంలో స్పాట్ సహాయం చేయాలనుకున్నాడు.\nస్పాట్ ఆ పోస్ట్ను మెరిపించాలని నిర్ణయించుకున్నాడు. అతను తన పాదాలతో పోస్ట్ను నాలుకతో చల్లుకుని రుద్దాడు. ఆ పోస్ట్ శుభ్రంగా, మెరుస్తూ తయారైంది. కానీ అప్పుడు, ఒక పెద్ద పిల్లి వచ్చింది. ఆ పిల్లి సంతోషంగా లేదు. పిల్లి, \"అది నా పోస్ట్! నాకు మురికిగా ఉండడం ఇష్టం!\" అంది.\nస్పాట్ బాధపడ్డాడు. అతను పిల్లిని బాధపెట్టాలనుకోలేదు. అందుకే, స్పాట్ కొంచెం మట్టిని కనుగొని దాన్ని మళ్లీ పోస్ట్పై పెట్టాడు. పిల్లి మళ్లీ సంతోషపడింది. ఇతరులు కోరుకున్నది, అది మనకు నచ్చకపోయినా, సహాయం చేయడం అంటే కొన్నిసార్లు అదే అని స్పాట్ నేర్చుకున్నాడు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-106",
    "english_text": "Once upon a time, in a green field, there lived a sheep named Fluffy. Fluffy was a strong sheep who loved to play with his friends. They would run, jump, and have fun all day long.\nOne sunny day, Fluffy and his friends found a big pond. They were very hot and tired from playing, so they decided to soak in the cool water. They splashed and swam, and had a great time. Fluffy felt happy and strong after soaking in the pond.\nAs they played, a little bird came and told Fluffy and his friends that they should not stay in the water for too long. But they did not listen and kept playing. Soon, the sun went down, and it was time to go home. Fluffy and his friends were very cold and wet from the water. They wished they had listened to the little bird.\nThe next day, Fluffy and his friends played near the pond, but this time they listened to the little bird. They soaked for a short time, and then they went back to the green field to play. Fluffy learned that it is important to listen to others and not to do too much of a good thing.\nAnd so, Fluffy and his friends played happily ever after, always remembering to listen and to be careful when having fun.",
    "telugu_text": "ఒకప్పుడు, ఒక పచ్చని పొలంలో, ఫలఫీ అనే గొర్రె ఉండేది. ఫలఫీ చాలా బలంగా ఉండే గొర్రె, తన స్నేహితులతో ఆడుకోవడం అంటే చాలా ఇష్టం. వాళ్ళు రోజంతా పరిగెత్తేవారు, దూకేవారు, సరదాగా గడిపేవారు.\nఒక ఎండ రోజున, ఫలఫీ మరియు అతని స్నేహితులు ఒక పెద్ద చెరువును కనుగొన్నారు. ఆడుకోవడం వల్ల వాళ్ళు చాలా వేడిగా, అలసిపోయారు, కాబట్టి చల్లని నీటిలో మునిగిపోవాలని నిర్ణయించుకున్నారు. వాళ్ళు నీటిలో చిలికి, ఈత కొట్టారు, చాలా సరదాగా గడిపారు. చెరువులో మునిగిన తర్వాత ఫలఫీ సంతోషంగా, బలంగా అనిపించింది.\nవాళ్ళు ఆడుకుంటుండగా, ఒక చిన్న పక్షి వచ్చింది. అది ఫలఫీకి, అతని స్నేహితులకు నీటిలో ఎక్కువసేపు ఉండకూడదని చెప్పింది. కానీ వాళ్ళు వినలేదు, ఆడుకుంటూనే ఉన్నారు. త్వరలోనే సూర్యుడు అస్తమించాడు, ఇంటికి వెళ్లవలసిన సమయం వచ్చింది. ఫలఫీ మరియు అతని స్నేహితులు నీటి వల్ల చాలా చల్లగా, తడిగా ఉన్నారు. వాళ్ళు ఆ చిన్న పక్షి మాట వినాల్సింది అని కోరుకున్నారు.\nమరుసటి రోజు, ఫలఫీ మరియు అతని స్నేహితులు చెరువు దగ్గర ఆడుకున్నారు, కానీ ఈసారి వాళ్ళు చిన్న పక్షి మాట విన్నారు. కొద్దిసేపు మునిగి, ఆపై ఆ పచ్చని పొలంలో ఆడుకోవడానికి తిరిగి వెళ్లారు. ఇతరుల మాట వినడం ముఖ్యం, మరియు ఎక్కువ మంచి పనులు చేయకూడదని ఫలఫీ నేర్చుకున్నాడు.\nఅలా, ఫలఫీ మరియు అతని స్నేహితులు సంతోషంగా ఎప్పటికీ ఆడుకుంటూనే ఉన్నారు, సరదాగా ఉన్నప్పుడు వినడం మరియు జాగ్రత్తగా ఉండటం ఎప్పుడూ గుర్తుంచుకుంటూ."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-200",
    "english_text": "Once upon a time, there was a nosy cat named Tom. Tom liked to repeat everything he heard. One day, Tom heard two birds talking about a big war between the birds and the squirrels. Tom wanted to know more, so he went to the park to see the war.\nAt the park, Tom saw the birds on one side and the squirrels on the other side. The leader of the birds said, \"We must win this war!\" Tom, being nosy, went closer and repeated, \"Win this war!\" The birds looked at Tom and asked, \"Why are you here, cat?\"\n\"I heard you talking about the war,\" Tom said. \"I want to help you win!\" The birds thought about it and said, \"Okay, you can help us. But you must promise not to eat us!\" Tom promised, and they all worked together to win the war against the squirrels.\nIn the end, the birds and Tom won the war. They were all very happy and thanked Tom for his help. Tom learned that being nosy can sometimes be helpful, but he also learned not to repeat everything he hears. And from that day on, the birds and Tom became good friends.",
    "telugu_text": "ఒకప్పుడు, టామ్ అనే చిలిపి పిల్లి ఉండేది. టామ్ విన్న ప్రతిదాన్ని మళ్లీ మళ్లీ చెప్పడానికి ఇష్టపడేది. ఒక రోజు, టామ్ రెండు పక్షులు కోతులు మధ్య పెద్ద యుద్ధం గురించి మాట్లాడుకుంటున్నాయి అని విన్నాడు. టామ్ ఇంకా తెలుసుకోవాలని అనుకుని, ఆ యుద్ధాన్ని చూడడానికి పార్కుకు వెళ్ళాడు.\nపార్కులో, టామ్ ఒకవైపు పక్షులను, మరోవైపు కోతులను చూశాడు. పక్షుల నాయకుడు, \"మనం ఈ యుద్ధాన్ని గెలవాలి!\" అన్నాడు. చిలిపిగా ఉన్న టామ్ దగ్గరికి వెళ్లి, \"ఈ యుద్ధాన్ని గెలవాలి!\" అని మళ్లీ చెప్పాడు. పక్షులు టామ్ వైపు చూసి, \"నువ్వెందుకు ఇక్కడ ఉన్నావు, పిల్లి?\" అని అడిగారు.\n\"నేను మీరు యుద్ధం గురించి మాట్లాడుకుంటున్నారని విన్నాను,\" అన్నాడు టామ్. \"మీకు గెలవడానికి నేను సహాయం చేయాలనుకుంటున్నాను!\" పక్షులు దాని గురించి ఆలోచించి, \"సరే, నువ్వు మాకు సహాయం చేయవచ్చు. కానీ మమ్మల్ని తినవద్దని వాగ్దానం చెయ్!\" అని అన్నారు. టామ్ వాగ్దానం చేశాడు, వాళ్ళు అందరూ కోతులపై యుద్ధంలో గెలవడానికి కలిసి పనిచేశారు.\nచివరికి, పక్షులు మరియు టామ్ యుద్ధంలో గెలిచారు. వాళ్ళందరూ చాలా సంతోషపడ్డారు మరియు టామ్ సహాయానికి కృతజ్ఞతలు చెప్పారు. చిలిపిగా ఉండటం కొన్నిసార్లు సహాయపడగలదని, కానీ విన్న ప్రతిదాన్ని మళ్లీ మళ్లీ చెప్పకూడదని కూడా టామ్ నేర్చుకున్నాడు. ఆ రోజు నుండి, పక్షులు మరియు టామ్ మంచి స్నేహితులు అయ్యారు."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-075",
    "english_text": "Once upon a time, there was a lively cat named Mimi. She loved to play with her ball and run around the house. Mimi was always happy and full of energy.\nOne day, Mimi found a bag of mint candies on the table. She wanted to play with the bag, so she jumped up and knocked it down. The bag opened and the mint candies spilled all over the floor. Mimi was excited to play with the candies, but she didn't know that she had spoiled them.\nMimi's mom came into the room and saw the spoiled mint candies on the floor. She was not happy, but she knew that Mimi was just a lively cat who loved to play. Mimi's mom picked up the candies and put them away. Then, she gave Mimi a big hug and told her to be more careful next time.",
    "telugu_text": "ఒకప్పుడు, మిమి అనే చురుకైన పిల్లి ఉండేది. ఆమె తన బంతితో ఆడుకోవడానికి, ఇంట్లో తిరగడానికి చాలా ఇష్టపడేది. మిమి ఎప్పుడూ సంతోషంగా, ఉత్సాహంతో ఉండేది.\nఒక రోజు, మిమి టేబుల్పై ఉన్న నిమ్మకాయ మిఠాయిల సంచిని కనుగొంది. ఆమె ఆ సంచితో ఆడుకోవాలని అనుకుంది, కాబట్టి ఆమె దూకి, దాన్ని కింద పడేసింది. సంచి తెరుచుకుంది, నిమ్మకాయ మిఠాయిలు నేల అంతా చెల్లాచెదురుగా పడిపోయాయి. మిమి ఆ మిఠాయిలతో ఆడుకోవడానికి ఉత్సాహపడింది, కానీ అవి పాడైపోయాయని ఆమెకు తెలియదు.\nమిమి అమ్మ గదిలోకి వచ్చి నేలపై ఉన్న పాడైపోయిన నిమ్మకాయ మిఠాయిలను చూసింది. ఆమె సంతోషంగా లేదు, కానీ మిమి కేవలం ఆడుకోవడానికి ఇష్టపడే చురుకైన పిల్లి అని ఆమెకు తెలుసు. మిమి అమ్మ ఆ మిఠాయిలను తీసుకుని వాటిని పక్కన పెట్టేసింది. అప్పుడు, ఆమె మిమికి పెద్దగా కౌగిలించుకుని, వచ్చేసారి జాగ్రత్తగా ఉండమని చెప్పింది."
   },
   {

    "item_id": "T-028",
    "english_text": "Tom and Mia are friends. They like to play games. One day, they play a game with cards. The cards have numbers on them. The one who has the biggest number wins.\nTom and Mia each pick a card. Tom has a six. Mia has a four. Tom says, \"I win! I have a bigger number than you!\"\nMia is sad. She does not like to lose. She says, \"No, you don't win! You cheated! You looked at my card!\"\nTom says, \"I did not cheat! You are a sore loser! You are mean!\"\nTom and Mia start to fight. They push and pull each other. They are angry and loud.\nMom hears them. She comes to see what is wrong. She sees the cards and the trophy. The trophy is a prize for the winner. Mom says, \"Stop fighting, both of you! What is going on?\"\nTom and Mia tell Mom what happened. Mom says, \"You both played the game wrong. You are not supposed to compare your numbers. You are supposed to add them together. The one who has the highest sum wins. Six plus four is ten. You both have the same sum. You both win. You can share the trophy.\"\nTom and Mia look at each other. They feel silly. They say, \"Sorry, Mom. Sorry, friend. We did not know. We learned something new. We can share the trophy. We are still friends.\"\nMom smiles. She says, \"That's good. I'm glad you learned something new. And I'm glad you are still friends. You are different, but you are both special. Now, let's go and have some cookies.\"",
    "telugu_text": "టామ్ మరియు లిల్లీ స్నేహితులు. వాళ్ళకి ఆటలు ఆడటం ఇష్టం. ఒక రోజు, వాళ్ళు కార్డులతో ఒక ఆట ఆడారు. ఆ కార్డులపై సంఖ్యలు ఉన్నాయి. పెద్ద సంఖ్య ఉన్నవాడే గెలుస్తాడు.\nటామ్ మరియు లిల్లీ ఒక్కొక్క కార్డు తీసుకున్నారు. టామ్కి ఆరు వచ్చింది. లిల్లీకి నాలుగు వచ్చింది. టామ్, \"నేను గెలిచాను! నా దగ్గర నీకంటే పెద్ద సంఖ్య ఉంది!\" అన్నాడు.\nలిల్లీ బాధపడింది. ఓడిపోవడం ఆమెకు నచ్చదు. ఆమె, \"లేదు, నువ్వు గెలవలేదు! నువ్వు మోసం చేశావు! నువ్వు నా కార్డు చూశావు!\" అంది.\nటామ్, \"నేను మోసం చేయలేదు! నువ్వు ఓడిపోవడం ఇష్టం లేని దానివి! నువ్వు చెడ్డవాడివి!\" అన్నాడు.\nటామ్ మరియు లిల్లీ పోట్లాడటం మొదలుపెట్టారు. వాళ్ళు ఒకరినొకరు నెట్టారు, లాగారు. వాళ్ళు కోపంగా, పెద్దగా అరిచారు.\nఅమ్మ వాళ్ళని విన్నారు. ఏం జరుగుతుందో చూడడానికి వచ్చింది. ఆమె కార్డులు, ట్రోఫీ చూసింది. ట్రోఫీ గెలిచిన వారికి బహుమతి. అమ్మ, \"పోట్లాడటం ఆపుకోండి, మీ ఇద్దరికీ! ఏం జరుగుతోంది?\" అంది.\nటామ్ మరియు లిల్లీ అమ్మకు ఏం జరిగిందో చెప్పారు. అమ్మ, \"మీ ఇద్దరూ ఆటను తప్పుగా ఆడారు. మీ సంఖ్యలను పోల్చకూడదు. వాటిని కలిపి చూడాలి. ఎక్కువ మొత్తం ఉన్నవాడే గెలుస్తాడు. ఆరు ప్లస్ నాలుగు అంటే పది. మీ ఇద్దరికీ ఒకే మొత్తం వచ్చింది. మీ ఇద్దరూ గెలిచారు. మీరు ట్రోఫీ పంచుకోవచ్చు.\" అంది.\nటామ్ మరియు లిల్లీ ఒకరినొకరు చూసుకున్నారు. వాళ్ళకి అవివేకం అనిపించింది. వాళ్ళు, \"క్షమించు, అమ్మ. క్షమించు, స్నేహితురాలా. మాకు తెలియలేదు. మేము కొత్త విషయం నేర్చుకున్నాం. మేము ట్రోఫీ పంచుకోవచ్చు. మేము ఇంకా స్నేహితులం\" అన్నారు.\nఅమ్మ నవ్వింది. ఆమె, \"అది మంచిది. మీరు కొత్త విషయం నేర్చుకున్నందుకు నాకు సంతోషంగా ఉంది. మరియు మీరు ఇంకా స్నేహితులై ఉన్నందుకు నాకు సంతోషంగా ఉంది. మీరు వేరుగా ఉన్నారు, కానీ మీ ఇద్దరూ ప్రత్యేకమైనవారు. ఇప్పుడు, వెళ్లి కొన్ని కుకీలు తిందాం\" అంది."

    "item_id": "T-067",
    "english_text": "Once upon a time, there was a little dog named Spot. Spot was a happy dog, but sometimes he would do foolish things. One day, Spot saw his friend, a big cat named Whiskers.\nSpot said, \"Whiskers, let's play a game!\" Whiskers looked at Spot and frowned. He did not want to play a game. He was not in a playful mood.\nSpot did not understand why Whiskers was frowning. He thought maybe Whiskers was not happy with his body. Spot said, \"Whiskers, you have a nice body. You are a big, strong cat!\"\nWhiskers smiled and said, \"Thank you, Spot. I am just tired today. Maybe we can play a game tomorrow.\"\nSpot was happy that Whiskers was not sad about his body. They said goodbye and went back to their homes. The next day, they played a fun game together.",
    "telugu_text": "ఒకప్పుడు, స్పాట్ అనే చిన్న కుక్క ఉండేది. స్పాట్ సంతోషంగా ఉండే కుక్క, కానీ కొన్నిసార్లు అది తెలివితక్కువ పనులు చేసేది. ఒక రోజు, స్పాట్ తన స్నేహితుడు, విస్కర్స్ అనే పెద్ద పిల్లిని చూసింది.\nస్పాట్ అంది, \"విస్కర్స్, మనం ఒక ఆట ఆడుకుందాం!\" విస్కర్స్ స్పాట్ని చూసి ముఖం చిట్లించింది. అది ఆట ఆడాలని అనుకోలేదు. అది సరదాగా లేని మూడ్లో ఉంది.\nవిస్కర్స్ ఎందుకు ముఖం చిట్లించిందో స్పాట్ అర్థం కాలేదు. బహుశా విస్కర్స్ తన శరీరం గురించి సంతోషంగా లేకపోవచ్చు అనుకుంది. స్పాట్ అంది, \"విస్కర్స్, నీకు మంచి శరీరం ఉంది. నువ్వు పెద్ద, బలమైన పిల్లివి!\"\nవిస్కర్స్ నవ్వి, \"ధన్యవాదాలు, స్పాట్. నేను ఈ రోజు కొంచెం అలసిపోయాను. బహుశా మనం రేపు ఆట ఆడవచ్చు.\"\nవిస్కర్స్ తన శరీరం గురించి బాధపడలేదని స్పాట్ సంతోషపడింది. వారు వీడ్కోలు చెప్పి తమ ఇళ్లకు తిరిగి వెళ్లారు. మరుసటి రోజు, వారు కలిసి సరదాగా ఆట ఆడారు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-073",
    "english_text": "Lily and Ben were playing with their toys in the living room. Lily had a big doll with long hair and a pink dress. Ben had a small car with four wheels and a shiny horn. They were having fun, making noises and pretending to go on adventures.\nBut then, Ben saw something that made him curious. It was a rubber band that Lily had used to tie her doll's hair. Ben wanted to see what it was, so he grabbed it and pulled it. Lily saw him and shouted, \"No, Ben, that's mine! Give it back!\"\nBen did not listen. He kept pulling the rubber band, harder and harder. He wanted to see how far it could stretch. He thought it was brilliant. But then, something bad happened. The rubber band snapped and tore in two. One piece flew across the room and hit the window. The other piece hit Ben's face and made him cry.\nLily ran to Ben and hugged him. She was sorry that he was hurt. She said, \"I'm sorry, Ben. Are you okay? That rubber band was not a toy. It was for my doll's hair. It can hurt you if you pull it too hard.\"\nBen sniffed and rubbed his face. He said, \"I'm sorry, Lily. I didn't know. I just wanted to see what it was. It looked brilliant. But it was not fun. It was mean.\"\nLily smiled and kissed his cheek. She said, \"It's okay, Ben. I forgive you. Next time, ask me before you take something. And I'll share with you. Do you want to play with my doll? She has a lot of hair. You can comb it and make it pretty.\"\nBen nodded and smiled. He said, \"Yes, please. And you can play with my car. It has a loud horn. You can beep it and make it go fast.\"\nThey hugged and exchanged their toys. They were happy again. They played together and forgot about the rubber band. They were good friends.",
    "telugu_text": "లిల్లీ, బెన్ తమ బొమ్మలతో హాల్లో ఆడుకుంటున్నారు. లిల్లీకి పొడవాటి జుట్టు, గులాబీ రంగు డ్రెస్ ఉన్న పెద్ద బొమ్మ ఉంది. బెన్కు నాలుగు చక్రాలు, మెరిసే హారన్ ఉన్న చిన్న కారు ఉంది. వారు సరదాగా ఉన్నారు, శబ్దాలు చేస్తూ, సాహసయాత్రలకు వెళ్తున్నట్లు నటించారు.\nకానీ అప్పుడు, బెన్ ఏదో చూశాడు, అది అతన్ని ఆసక్తిగా చేసింది. అది లిల్లీ తన బొమ్మ జుట్టు కట్టడానికి ఉపయోగించిన రబ్బర్ బ్యాండ్. అది ఏమిటో చూడాలని బెన్కు అనిపించింది, కాబట్టి అతను దాన్ని పట్టుకుని లాగాడు. లిల్లీ అతన్ని చూసి, \"వద్దు, బెన్, అది నాది! తిరిగి ఇవ్వు!\" అని అరిచింది.\nబెన్ వినలేదు. అతను రబ్బర్ బ్యాండ్ను మరింత బలంగా, మరింత బలంగా లాగుతూనే ఉన్నాడు. అది ఎంత దూరం సాగగలదో చూడాలని అతను అనుకున్నాడు. అది అద్భుతంగా ఉందని అతను అనుకున్నాడు. కానీ అప్పుడు, ఏదో చెడు జరిగింది. రబ్బర్ బ్యాండ్ తెగిపోయి రెండు ముక్కలుగా విడిపోయింది. ఒక ముక్క గది అంతా ఎగిరి కిటికీని తగిలింది. మరొక ముక్క బెన్ ముఖాన్ని తాకింది, దానివల్ల అతను ఏడ్చాడు.\nలిల్లీ బెన్ దగ్గరకు పరిగెత్తి అతన్ని కౌగిలించుకుంది. అతను గాయపడినందుకు ఆమెకు చింతి. ఆమె అంది, \"సారీ, బెన్. నీకు బాగానే ఉన్నావా? ఆ రబ్బర్ బ్యాండ్ బొమ్మ కాదు. అది నా బొమ్మ జుట్టు కోసం. నువ్వు చాలా బలంగా లాగితే నీకు నొప్పి కలగవచ్చు.\"\nబెన్ ముక్కుముక్కు చేసుకుని తన ముఖాన్ని రుద్దుకున్నాడు. అతను అన్నాడు, \"సారీ, లిల్లీ. నాకు తెలియలేదు. అది ఏమిటో చూడాలనిపించింది. అది అద్భుతంగా కనిపించింది. కానీ అది సరదా కాదు. అది చెడ్డది.\"\nలిల్లీ నవ్వి అతని బుగ్గపై ముద్దు పెట్టింది. ఆమె అంది, \"పర్వాలేదు, బెన్. నేను నిన్ను క్షమించాను. వచ్చేసారి, ఏదైనా తీసుకోవడానికి ముందు నన్ను అడుగు. నేను నీతో పంచుకుంటాను. నా బొమ్మతో ఆడాలనుకుంటున్నావా? దాని దగ్గర చాలా జుట్టు ఉంది. నువ్వు దాన్ని దువ్వి అందంగా చేయవచ్చు.\"\nబెన్ తల ఊపి నవ్వాడు. అతను అన్నాడు, \"అవును, దయచేసి. నువ్వు నా కారుతో ఆడవచ్చు. దాని హారన్ పెద్దగా ఉంటుంది. నువ్వు దానిని బీప్ చేసి వేగంగా వెళ్లనివ్వవచ్చు.\"\nవారు కౌగిలించుకుని తమ బొమ్మలను మార్చుకున్నారు. వారు మళ్లీ సంతోషంగా ఉన్నారు. వారు కలిసి ఆడుకున్నారు మరియు రబ్బర్ బ్యాండ్ను మర్చిపోయారు. వారు మంచి స్నేహితులు."
   },

    "order_in_batch": 3,
    "item_id": "T-036",
    "english_text": "Once upon a time, there was an old man named Robert. He had a box that he kept in his house. One day, he opened the box and saw something very useful - a toy car. It was very old, but you could still see the paint and the wheels. \nRobert smiled and said, \"I'm so glad I kept this old toy car. It will be useful to me.\" \nHe took the car outside and started playing with it. He started pushing the car around the yard, making car noises as he went. \nSuddenly, a little girl came running up to him. She was only three years old and she stared at the car with wide eyes. Robert smiled at her and said, \"Good morning. Do you want to play with this car?\" \nThe little girl's eyes lit up and she nodded eagerly. She took the car away and started pushing it around, making the same car noises. \nRobert smiled and watched her. He knew he had been right to keep the old toy car - it had been useful after all.",
    "telugu_text": "ఒకానొకప్పుడు, రాబర్ట్ అనే ఒక పెద్దాయన ఉండేవాడు. అతని ఇంట్లో ఒక పెట్టె ఉండేది. ఒక రోజు, అతను ఆ పెట్టె తెరిచి, చాలా ఉపయోగకరమైనదాన్ని చూశాడు - ఒక బొమ్మ కారు. అది చాలా పాతది, కానీ రంగులు, చక్రాలు ఇంకా కనిపించేవి.\nరాబర్ట్ నవ్వి, \"నేను ఈ పాత బొమ్మ కారును ఉంచుకున్నందుకు చాలా సంతోషంగా ఉంది. ఇది నాకు ఉపయోగపడుతుంది.\" అన్నాడు.\nఅతను కారును బయటకు తీసి దానితో ఆడటం మొదలుపెట్టాడు. అతను కారును తోటలో తిప్పడం మొదలుపెట్టాడు, వెళ్తున్నప్పుడు కారు శబ్దాలు చేశాడు.\nఅకస్మాత్తుగా, ఒక చిన్న అమ్మాయి పరిగెత్తుకుంటూ అతని దగ్గరకు వచ్చింది. ఆమెకు మూడు సంవత్సరాలు మాత్రమే, ఆమె పెద్ద కళ్లతో కారును చూసింది. రాబర్ట్ ఆమెకు నవ్వి, \"శుభోదయం. నువ్వు ఈ కారుతో ఆడాలనుకుంటున్నావా?\" అన్నాడు.\nచిన్న అమ్మాయి కళ్ళు మెరిశాయి, ఆమె ఉత్సాహంగా తలూపింది. ఆమె కారును తీసుకుని, దానిని తిప్పడం మొదలుపెట్టి, అదే కారు శబ్దాలు చేసింది.\nరాబర్ట్ నవ్వి, ఆమెను చూశాడు. పాత బొమ్మ కారును ఉంచుకోవడం సరైనదని అతనికి తెలుసు - అది ఉపయోగపడింది కదా."

    "item_id": "T-103",
    "english_text": "Once upon a time, in a small village, there was a little girl named Lily. Lily loved to eat peaches. Every day, she would go to the big tree in her yard and pick a peach to eat. The peaches were very sweet and juicy.\nOne day, Lily went to the tree to pick a peach, but there were no more peaches left. She felt very sorry and sad. Lily didn't know what to do. Then, her mom told her to pray and ask for more peaches to grow on the tree.\nLily closed her eyes and prayed for more peaches. The next day, when she went to the tree, she saw many new peaches had grown. Lily was so happy and thanked her mom for teaching her how to pray. From that day on, Lily prayed every day and always had peaches to eat.",
    "telugu_text": "ఒకప్పుడు, ఒక చిన్న పల్లెటూరిలో, లిల్లీ అనే ఒక చిన్న అమ్మాయి ఉండేది. లిల్లీకి దానిమ్మలు తినడం అంటే చాలా ఇష్టం. ప్రతిరోజూ, ఆమె తన తోటలోని పెద్ద చెట్టు దగ్గరకు వెళ్లి తినడానికి ఒక దానిమ్మను తీసుకునేది. ఆ దానిమ్మలు చాలా తీయగా, రసంగా ఉండేవి.\nఒక రోజు, లిల్లీ ఒక దానిమ్మను తీసుకోవడానికి చెట్టు దగ్గరకు వెళ్లింది, కానీ ఇంక దానిమ్మలు మిగలలేదు. ఆమె చాలా బాధపడింది, విచారంగా అనిపించింది. లిల్లీ ఏమి చేయాలో తెలియలేదు. అప్పుడు, ఆమె అమ్మ ఆమెకు ప్రార్థించాలని, చెట్టుపై ఇంక దానిమ్మలు పెరగాలని అడగమని చెప్పింది.\nలిల్లీ కళ్ళు మూసుకుని ఇంక దానిమ్మల కోసం ప్రార్థించింది. మరుసటి రోజు, ఆమె చెట్టు దగ్గరకు వెళ్ళినప్పుడు, చాలా కొత్త దానిమ్మలు పెరిగాయిని చూసింది. లిల్లీ చాలా సంతోషించింది మరియు ప్రార్థించడం ఎలాగో నేర్పినందుకు తన అమ్మకు ధన్యవాదాలు చెప్పింది. ఆ రోజు నుండి, లిల్లీ ప్రతిరోజూ ప్రార్థించేది మరియు తినడానికి ఎప్పుడూ దానిమ్మలు ఉండేవి."

    "english_text": "Once upon a time, there was a little boy named Tim. He had a big toy bear. The bear was brown and soft. Tim loved his bear very much. They played together every day.\nOne day, Tim and his bear went to the park. They played on the swings and slides. Tim's bear seemed very happy. Tim put the bear on his shoulder and they went home.\nAt home, Tim's mom made them a nice snack. Tim and his bear felt successful after a fun day at the park. They ate their snack and went to bed. Tim and his bear were the best of friends.",
    "telugu_text": "ఒకప్పుడు, టిమ్ అనే చిన్న పిల్లాడు ఉండేవాడు. అతనికి ఒక పెద్ద బొమ్మ ఎలుగుబంటి ఉండేది. ఆ ఎలుగుబంటి గోధుమ రంగులో మరియు మృదువుగా ఉండేది. టిమ్ తన ఎలుగుబంటిని చాలా ఇష్టపడేవాడు. వాళ్ళు ప్రతిరోజూ కలిసి ఆడుకునేవారు.\nఒక రోజు, టిమ్ మరియు అతని ఎలుగుబంటి పార్కుకు వెళ్లారు. వాళ్ళు ఊయల మీద, స్లైడ్ మీద ఆడుకున్నారు. టిమ్ ఎలుగుబంటి చాలా సంతోషంగా కనిపించింది. టిమ్ ఆ ఎలుగుబంటిని తన భుజం మీద పెట్టుకుని ఇంటికి వెళ్లారు.\nఇంట్లో, టిమ్ అమ్మ వాళ్ళకి మంచి స్నాక్ చేసింది. పార్కులో సరదాగా గడిపిన తర్వాత టిమ్ మరియు అతని ఎలుగుబంటి సంతోషంగా అనిపించాయి. వాళ్ళు తమ స్నాక్ తిని పడుకున్నారు. టిమ్ మరియు అతని ఎలుగుబంటి మంచి స్నేహితులు."
