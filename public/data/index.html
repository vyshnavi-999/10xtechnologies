  "TB20": [
   {
    "order_in_batch": 1,
    "item_id": "T-136",
    "english_text": "Once upon a time, there was a wide tree in a big park. A little bird lived in the tree. The bird had a nest with eggs. The bird was happy and sang every day.\nOne day, a loud dog came to the park. The dog barked and ran near the tree. The little bird said, \"Please, don't disturb my eggs.\" The dog stopped barking and said, \"I am sorry. I will not disturb your eggs.\"\nThe bird and the dog became friends. They played in the park for a week. The bird sang and the dog wagged its tail. They were happy and had fun together.",
    "telugu_text": "ఒకప్పుడు, ఒక పెద్ద పార్కులో ఒక పెద్ద చెట్టు ఉండేది. ఆ చెట్టుపై ఒక చిన్న పక్షి నివసించేది. ఆ పక్షికి గుడ్లు పెట్టడానికి ఒక గూడు ఉండేది. ఆ పక్షి సంతోషంగా ఉండి ప్రతిరోజూ పాట పాడుకునేది.\nఒక రోజు, ఒక పెద్ద కుక్క పార్కుకు వచ్చింది. ఆ కుక్క మొరిగింది, చెట్టు దగ్గరకు పరిగెత్తింది. చిన్న పక్షి, \"దయచేసి, నా గుడ్లను ఇబ్బంది పెట్టవద్దు,\" అంది. కుక్క మొరగడం ఆపి, \"నన్ను క్షమించు. నేను నీ గుడ్లను ఇబ్బంది పెట్టను,\" అంది.\nఆ పక్షి, కుక్క స్నేహితులు అయ్యాయి. అవి ఒక వారం పాటు పార్కులో ఆడుకున్నాయి. పక్షి పాట పాడింది, కుక్క తోక ఊపింది. అవి సంతోషంగా ఉండి కలిసి సరదాగా గడిపాయి."

   {
    "order_in_batch": 2,
    "item_id": "T-091",
    "english_text": "One day, a little girl named Lily went to the beach with her family. She was very excited to play in the sand and water. But she was also a little nervous because she had never been to the beach before.\nLily started to play in the sand, making a big sandcastle. She saw a small palm tree and thought it would look nice next to her castle. But a big wave came and washed her castle away. Lily was sad and her hands were wet.\nLily's mom saw her and came to help. They sat in the sun to dry their hands. Then they built a new sandcastle together, far away from the water. Lily was happy again and not nervous anymore. She liked the beach and couldn't wait to come back.",
    "telugu_text": "ఒక రోజు, లిల్లీ అనే చిన్న అమ్మాయి తన కుటుంబంతో బీచ్కు వెళ్ళింది. ఇసుకలో, నీటిలో ఆడుకోవడానికి ఆమె చాలా ఉత్సాహంగా ఉంది. కానీ ఆమెకు కొంచెం భయంగా కూడా ఉంది, ఎందుకంటే ఆమె ఇంతకుముందు బీచ్కు వెళ్ళలేదు.\nలిల్లీ ఇసుకలో ఆడటం మొదలుపెట్టి, ఒక పెద్ద ఇసుక కోట నిర్మించింది. ఆమె ఒక చిన్న తాటి చెట్టును చూసింది, అది తన కోట పక్కన బాగుంటుందని అనుకుంది. కానీ ఒక పెద్ద అల వచ్చింది, అది ఆమె కోటను కడిగి తీసింది. లిల్లీకి విచారం కలిగింది, ఆమె చేతులు తడిగా ఉన్నాయి.\nలిల్లీ అమ్మ ఆమెను చూసి సహాయం చేయడానికి వచ్చింది. వారు చేతులు ఆరబెట్టుకోవడానికి సూర్యరశ్మిలో కూర్చున్నారు. అప్పుడు వారు నీటి నుండి దూరంగా ఒక కొత్త ఇసుక కోటను కలిసి నిర్మించారు. లిల్లీ మళ్ళీ సంతోషంగా ఉంది, ఇక భయపడలేదు. ఆమెకు బీచ్ అంటే ఇష్టం, తిరిగి రావడానికి ఆసక్తిగా ఉంది."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-150",
    "english_text": "Once upon a time, there was a little girl named Lily. She loved to play pretend. One day, she decided to prepare a fake class for her toys. She put her toys in a row and stood in front of them like a teacher.\n\"Hello, class,\" said Lily, \"today we will learn about colors.\" She held up a red ball. \"This is red.\" She picked up a blue toy car. \"This is blue.\" Her toys listened carefully as she taught them.\nLily's mom walked in and saw the fun class. She smiled and said, \"You are a great teacher, Lily.\" Lily felt happy and proud. She continued to teach her toys, and they all had a great day learning together.",
    "telugu_text": "ఒకప్పుడు, లిల్లీ అనే ఒక చిన్న అమ్మాయి ఉండేది. ఆమెకు ఊహించుకుని ఆడటం అంటే చాలా ఇష్టం. ఒక రోజు, ఆమె తన బొమ్మల కోసం ఒక నకిలీ తరగతిని సిద్ధం చేయాలని నిర్ణయించుకుంది. ఆమె తన బొమ్మలను వరుసలో పెట్టి, ఒక టీచర్లా వాటి ముందు నిలబడింది.\n\"హలో, క్లాస్,\" అంది లిల్లీ, \"ఈ రోజు మనం రంగుల గురించి నేర్చుకుందాం.\" ఆమె ఒక ఎర్రటి బంతిని పైకెత్తింది. \"ఇది ఎరుపు.\" ఆమె ఒక నీలం రంగు బొమ్మ కారును తీసుకుంది. \"ఇది నీలం.\" ఆమె చెప్పినప్పుడు ఆమె బొమ్మలు శ్రద్ధగా విన్నాయి.\nలిల్లీ అమ్మ లోపలికి వచ్చి ఆ సరదా తరగతిని చూసింది. ఆమె నవ్వి, \"నువ్వు గొప్ప టీచర్ లిల్లీ,\" అంది. లిల్లీ సంతోషంగా, గర్వంగా అనిపించింది. ఆమె తన బొమ్మలకు నేర్పించడం కొనసాగించింది, మరియు అవి అన్నీ కలిసి నేర్చుకోవడం ద్వారా చాలా మంచి రోజు గడిపాయి."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-053",
    "english_text": "One day, a modest cat named Sam set out to find a blue ball. He looked high and low, but he could not find it. He felt sad because the blue ball was his favorite toy. Sam met his friend, a dog named Max, and told him about the lost blue ball.\nMax wanted to help Sam find the blue ball. They looked under the big tree and in the tall grass, but they still could not find it. Then, they saw a big bird fly by with something blue in its beak. It was Sam's blue ball!\nSam and Max ran after the bird, but it flew away too fast. They were very tired, but they did not give up. They set a trap for the bird using a box and a stick. When the bird came down to take the bait, the box fell on it, and Sam got his blue ball back. Sam and Max were so happy that they jumped and played with the blue ball all day long.",
    "telugu_text": "ఒక రోజు, సమ్ అనే చిన్న పిల్లి నీలి బంతిని వెతకడానికి బయలుదేరింది. అది పైకి, కిందకి చూసింది, కానీ దొరకలేదు. నీలి బంతి తనకి ఇష్టమైన బొమ్మ కాబట్టి, అది బాధపడింది. సమ్ తన స్నేహితుడు అయిన మాక్స్ అనే కుక్కను కలిసింది, మరియు పోయిన నీలి బంతి గురించి అతనికి చెప్పింది.\nమాక్స్ సమ్ నీలి బంతిని కనుగొనడంలో సహాయం చేయాలనుకున్నాడు. వారు పెద్ద చెట్టు కింద మరియు పొడవైన గడ్డిలో చూశారు, కానీ ఇప్పటికీ దొరకలేదు. అప్పుడు, వారు ఒక పెద్ద పక్షిని చూశారు, అది దాని ముక్కులో నీలం రంగు వస్తువుతో ఎగురుతోంది. అది సమ్ యొక్క నీలి బంతి!\nసమ్ మరియు మాక్స్ ఆ పక్షిని వెంబడించారు, కానీ అది చాలా వేగంగా ఎగిరిపోయింది. వారు చాలా అలసిపోయారు, కానీ వారు వదిలిపెట్టలేదు. వారు ఒక పెట్టె మరియు కర్రను ఉపయోగించి పక్షి కోసం ఒక ఉచ్చు ఏర్పాటు చేశారు. పక్షి ఆహారం తీసుకోవడానికి కిందకు వచ్చినప్పుడు, పెట్టె దానిపై పడింది, మరియు సమ్ తన నీలి బంతిని తిరిగి పొందాడు. సమ్ మరియు మాక్స్ చాలా సంతోషంగా ఉన్నారు, వారు ఆ రోజు మొత్తం నీలి బంతితో గంతులు వేసి ఆడుకున్నారు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-077",
    "english_text": "Once upon a time there was a big secret. It was hidden way deep down in a special place. Everyone wanted to find the secret because they thought it was very special.\nSo, one day some friends decided to search for the hidden secret. First they looked in the sky, but they could not see it there. Then they looked in the trees. Still they could not find it. Finally, they decided to look inside a small cave.\nAt first, there did not seem to be anything inside the cave. But then the friends looked a little closer and saw something sitting in a corner. When they moved closer, the secret suddenly yielded. They were so excited!\nWhen the secret yielded, it became an event. Everyone celebrated and shared their joy with one another. And the friends were sure that would never forget the special hidden secret!",
    "telugu_text": "ఒకప్పుడు ఒక పెద్ద రహస్యం ఉండేది. అది ఒక ప్రత్యేకమైన చోట చాలా లోతుగా దాగి ఉంది. అది చాలా ప్రత్యేకమైనదని అందరూ అనుకున్నారు కాబట్టి, అందరూ ఆ రహస్యాన్ని కనుగొనాలని అనుకున్నారు.\nఅందుకే, ఒక రోజు కొంతమంది స్నేహితులు ఆ దాగి ఉన్న రహస్యాన్ని వెతకాలని నిర్ణయించుకున్నారు. మొదట వారు ఆకాశంలో చూశారు, కానీ అక్కడ అది కనిపించలేదు. ఆపై వారు చెట్ల వైపు చూశారు. అయినా వారు దాన్ని కనుగొనలేకపోయారు. చివరికి, వారు ఒక చిన్న గుహ లోపలికి చూడాలని నిర్ణయించుకున్నారు.\nమొదట, గుహ లోపల ఏమీ లేనట్లు అనిపించింది. కానీ అప్పుడు స్నేహితులు కొంచెం దగ్గరగా చూశారు మరియు ఒక మూలలో కూర్చున్నదాన్ని చూశారు. వారు దగ్గరగా కదిలినప్పుడు, ఆ రహస్యం అకస్మాత్తుగా బయటపడింది. వారు చాలా ఉత్సాహపడ్డారు!\nరహస్యం బయటపడినప్పుడు, అది ఒక గొప్ప సంఘటనగా మారింది. అందరూ ఆనందంగా జరుపుకున్నారు మరియు తమ సంతోషాన్ని ఒకరితో ఒకరు పంచుకున్నారు. మరియు ఆ స్నేహితులు ఆ ప్రత్యేకమైన దాగి ఉన్న రహస్యాన్ని ఎప్పటికీ మర్చిపోలేరని నిర్ధారించుకున్నారు!"
   }

  "TB21": [
   {
    "order_in_batch": 1,
    "item_id": "T-118",
    "english_text": "Tom and Sam are friends. They like to play with cars and balls. One day, they find a big egg in the park. It is white and smooth. They wonder what is inside.\n\"Maybe it is a dinosaur,\" Tom says.\n\"Maybe it is a bird,\" Sam says.\nThey decide to take the egg home and keep it warm. They put it in a box with a blanket. They wait and wait.\nThe next day, they hear a loud noise from the box. They run to see what is happening. They see a crack on the egg. Something is trying to come out.\n\"Look, look, it is hatching!\" Tom says.\nThey watch as a small, yellow creature breaks the shell. It has a beak, wings and feathers. It is a chick.\n\"Wow, it is a bird!\" Sam says.\nThe chick looks at them and peeps. It is hungry and thirsty. Tom and Sam find some seeds and water for it. They feed it and pet it. It is soft and cute.\n\"Hello, little bird. We are Tom and Sam. We are your friends,\" Tom says.\nThe chick peeps again. It likes them. It tries to flap its wings.\n\"Maybe we can teach it to fly,\" Sam says.\nThey take the chick outside and hold it gently. They toss it in the air and catch it. They do it again and again. The chick learns to flap its wings faster and stronger. It starts to fly by itself.\n\"Look, look, it is flying!\" Tom says.\nThey clap and cheer. They are proud of the chick. The chick flies around them and lands on their shoulders. It peeps happily. It is grateful to them.\n\"Good job, little bird. You are amazing,\" Sam says.\nThey hug the chick and smile. They are happy. They have a new friend.",
    "telugu_text": "టామ్, సామ్ స్నేహితులు. వాళ్లకు కార్లు, బంతులతో ఆడుకోవడం ఇష్టం. ఒక రోజు, వాళ్ళు పార్కులో ఒక పెద్ద గుడ్డును కనుగొన్నారు. అది తెలుపుగా, నునుపుగా ఉంది. లోపల ఏముందో వాళ్ళు ఆశ్చర్యపోయారు.\n\"అది డైనోసార్ కావచ్చు,\" టామ్ అన్నాడు.\n\"అది పక్షి కావచ్చు,\" సామ్ అన్నాడు.\nవాళ్ళు ఆ గుడ్డును ఇంటికి తీసుకుని, వేడి చేస్తారు. వాళ్ళు దాన్ని దుప్పటితో ఒక పెట్టెలో పెట్టారు. వాళ్ళు వేచి చూశారు, వేచి చూశారు.\nమరుసటి రోజు, పెట్టె నుండి పెద్ద శబ్దం వినిపించింది. ఏం జరుగుతుందో చూడడానికి వాళ్ళు పరుగెత్తారు. గుడ్డుపై ఒక పగులు కనిపించింది. ఏదో బయటకు రావడానికి ప్రయత్నిస్తోంది.\n\"చూడు, చూడు, అది గుడ్లు పెడుతోంది!\" టామ్ అన్నాడు.\nఒక చిన్న, పసుపు రంగు జీవి పెంకును పగలగొడుతుండగా వాళ్ళు చూశారు. దానికి ముక్కు, రెక్కలు, ఈకలు ఉన్నాయి. అది ఒక పక్షి పిల్ల.\n\"వావ్, అది పక్షి!\" సామ్ అన్నాడు.\nపక్షి పిల్ల వాళ్ళ వైపు చూసి చిన్నగా శబ్దం చేసింది. అది ఆకలితో, దాహంతో ఉంది. టామ్, సామ్ దానికి కొన్ని విత్తనాలు, నీళ్ళు కనుగొన్నారు. వాళ్ళు దానికి ఆహారం ఇచ్చి, దానిని నిమిరారు. అది మృదువుగా, ముద్దుగా ఉంది.\n\"హలో, చిన్న పక్షి. మేము టామ్, సామ్. మేము మీ స్నేహితులం,\" టామ్ అన్నాడు.\nపక్షి పిల్ల మళ్ళీ శబ్దం చేసింది. అది వాళ్ళను ఇష్టపడింది. అది తన రెక్కలను కొట్టుకోవడానికి ప్రయత్నించింది.\n\"మనం దానికి ఎగరడం నేర్పించగలం,\" సామ్ అన్నాడు.\nవాళ్ళు పక్షి పిల్లని బయటకు తీసుకుని, మెల్లగా పట్టుకున్నారు. వాళ్ళు దాన్ని గాలిలో విసిరి పట్టుకున్నారు. వాళ్ళు మళ్ళీ మళ్ళీ చేశారు. పక్షి పిల్ల వేగంగా, బలంగా తన రెక్కలను కొట్టుకోవడం నేర్చుకుంది. అది ఒంటరిగా ఎగరడం మొదలుపెట్టింది.\n\"చూడు, చూడు, అది ఎగురుతోంది!\" టామ్ అన్నాడు.\nవాళ్ళు చప్పట్లు కొట్టారు, సంతోషించారు. వాళ్ళు పక్షి పిల్ల గురించి గర్వపడ్డారు. పక్షి పిల్ల వాళ్ళ చుట్టూ ఎగిరి, వాళ్ళ భుజాలపై దిగింది. అది సంతోషంగా శబ్దం చేసింది. అది వాళ్ళకు కృతజ్ఞతగా ఉంది.\n\"చక్కగా చేశావు, చిన్న పక్షి. నువ్వు అద్భుతం,\" సామ్ అన్నాడు.\nవాళ్ళు పక్షి పిల్లని కౌగిలించుకుని నవ్వారు. వాళ్ళు సంతోషంగా ఉన్నారు. వాళ్ళకు ఒక కొత్త స్నేహితుడు దొరికాడు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-148",
    "english_text": "One day, a cheerful girl named Lily went to the library with her mom. Lily loved the library because it had many books with fun stories and pictures. She was excited to find a new book to read.\nIn the library, Lily saw her friend, Tim. Tim was looking for a book too. Lily asked, \"What book do you want?\" Tim shrugged and said, \"I don't know yet. Maybe a book about animals.\" They both looked for books together.\nAt last, Lily found a book about a big, friendly bear. She showed it to Tim and said, \"Look, I found a book about animals!\" Tim smiled and said, \"That looks fun! Let's read it together!\" They sat down and read the book, happy to have found a story they both liked.",
    "telugu_text": "ఒక రోజు, లిల్లీ అనే సంతోషంగా ఉండే అమ్మాయి తన అమ్మతో కలిసి గ్రంథాలయంకు వెళ్ళింది. గ్రంథాలయం చాలా పుస్తకాలు, సరదా కథలు, బొమ్మలతో ఉండటం వలన లిల్లీకి చాలా ఇష్టం. చదవడానికి కొత్త పుస్తకం దొరకాలని ఆమె ఉత్సాహపడింది.\nగ్రంథాలయంలో, లిల్లీ తన స్నేహితుడు టామ్ను చూసింది. టామ్ కూడా ఒక పుస్తకం కోసం వెతుకుతున్నాడు. లిల్లీ అడిగింది, \"నీకు ఏ పుస్తకం కావాలి?\" టామ్ భుజం వూపాడు (లేదా తల ఊపాడు) అని చెప్పి, \"నాకు ఇంకా తెలియదు. బహుశా జంతువుల గురించి ఒక పుస్తకం.\" వాళ్లిద్దరూ కలిసి పుస్తకాలను వెతికారు.\nచివరికి, లిల్లీ ఒక పెద్ద, స్నేహపూర్వక ఎలుగుబంటి గురించి ఒక పుస్తకం కనుగొంది. ఆమె దాన్ని టామ్కి చూపించి, \"చూడు, నాకు జంతువుల గురించి ఒక పుస్తకం దొరికింది!\" టామ్ నవ్వి, \"అది సరదాగా ఉంటుంది! మనం కలిసి చదువుదాం!\" వాళ్ళు కూర్చుని ఆ పుస్తకాన్ని చదివారు, వాళ్ళిద్దరికీ నచ్చిన కథ దొరికినందుకు సంతోషంగా ఉన్నారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-092",
    "english_text": "Once upon a time, there was a little girl named Lily. Lily loved to dance to music. She would balance on her toes and spin around. Her favorite thing to eat was delicious apples. She would eat one every day.\nOne day, Lily met a friendly squirrel. The squirrel said, \"Hi, I'm Sam! I like to dance too! Can we dance together?\" Lily smiled and said, \"Yes, let's dance!\" So, Lily and Sam danced to the music. They balanced and spun around together.\nAfter they danced, Lily gave Sam a delicious apple. They sat under a big tree and ate their apples. They were so happy to be friends. From that day on, Lily and Sam always danced together and shared delicious apples.",
    "telugu_text": "ఒకప్పుడు, లిల్లీ అనే ఒక చిన్న అమ్మాయి ఉండేది. లిల్లీకి పాటలకు నాట్యం చేయడం అంటే చాలా ఇష్టం. ఆమె తన వేళ్లపై అటూ ఇటూ నడుస్తూ, తిరుగుతూ ఉండేది. ఆమెకు తినడానికి ఇష్టమైనవి రుచికరమైన ఆపిల్స్. ఆమె ప్రతిరోజూ ఒకటి తినేది.\nఒక రోజు, లిల్లీ ఒక స్నేహపూర్వక ఉడుతను కలిసింది. ఉడుత, \"హాయ్, నేను సామ్! నాకు కూడా నాట్యం అంటే ఇష్టం! మనం కలిసి నాట్యం చేద్దామా?\" అంది. లిల్లీ నవ్వి, \"అవును, ఆడుకుందాం!\" అంది. అలా, లిల్లీ మరియు సామ్ పాటకి నాట్యం చేశారు. వారు కలిసి అటూ ఇటూ నడిచారు, తిరిగారు.\nవారు నాట్యం చేసిన తర్వాత, లిల్లీ సామ్కి ఒక రుచికరమైన ఆపిల్ ఇచ్చింది. వారు ఒక పెద్ద చెట్టు కింద కూర్చుని, తమ ఆపిల్స్ తిన్నారు. స్నేహితులుగా ఉండటం వలన వారు చాలా సంతోషపడ్డారు. ఆ రోజు నుండి, లిల్లీ మరియు సామ్ ఎల్లప్పుడూ కలిసి నాట్యం చేసి, రుచికరమైన ఆపిల్స్ పంచుకునేవారు."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-185",
    "english_text": "Once there was a girl named Lily. Lily loved to play with makeup. She thought it was perfect. She would put it on her face and look in the mirror. She liked to pretend she was a princess.\nOne day, Lily's friend Tom came to play. Tom saw the makeup and said, \"Let's play protect the makeup!\" Lily agreed, and they started to play. They pretended that they were guards, and the makeup was a treasure they had to protect.\nBut while they were playing, Lily's little brother came into the room. He saw the makeup and wanted to play too. He grabbed the makeup and ran away. Lily and Tom chased after him, but he was too fast. He dropped the makeup, and it broke into pieces.\nLily was sad. She said, \"My perfect makeup is gone.\" Tom felt bad too. They both learned that they should be more careful when playing with things they love.",
    "telugu_text": "ఒకప్పుడు లిల్లీ అనే ఒక అమ్మాయి ఉండేది. లిల్లీకి మేకప్ తో ఆడటం అంటే చాలా ఇష్టం. అది చాలా బాగుంటుందని ఆమె అనుకునేది. ఆమె దాన్ని తన ముఖం మీద పెట్టుకుని అద్దంలో చూసుకునేది. ఆమె ఒక రాణిలా నటించడం అంటే ఇష్టం.\nఒక రోజు, లిల్లీ స్నేహితుడు టామ్ ఆడుకోవడానికి వచ్చాడు. టామ్ మేకప్ చూసి, \"మనం మేకప్ను కాపాడుకుందాం!\" అన్నాడు. లిల్లీ ఒప్పుకుంది, వాళ్ళు ఆడటం మొదలుపెట్టారు. వాళ్ళు తమని సైనికులు అనుకుని, మేకప్ ఒక నిధిలాగా దాన్ని కాపాడుకోవాలి అనుకున్నారు.\nకానీ వాళ్ళు ఆడుకుంటుండగా, లిల్లీకి చిన్న తమ్ముడు ఆ గదిలోకి వచ్చాడు. అతను మేకప్ చూసి కూడా ఆడాలని అనుకున్నాడు. అతను మేకప్ను పట్టుకుని పారిపోయాడు. లిల్లీ, టామ్ అతన్ని వెంబడించారు, కానీ అతను చాలా వేగంగా పారిపోయాడు. అతను మేకప్ను కింద పడేసి, అది ముక్కలైపోయింది.\nలిల్లీకి బాధగా అనిపించింది. ఆమె, \"నా అందమైన మేకప్ పోయింది,\" అంది. టామ్మూ బాధపడ్డాడు. వాళ్లిద్దరూ వాళ్ళకి ఇష్టమైన వాటితో ఆడుకునేటప్పుడు మరింత జాగ్రత్తగా ఉండాలని నేర్చుకున్నారు."
   },
   {

    "item_id": "T-015",
    "english_text": "Once upon a time, in a small town, there was a fancy race. Everyone wanted to win. A little boy named Tim and his dog, Spot, wanted to join the race too. They were very excited.\nThe race began, and all the people and animals started to run. Tim and Spot ran very fast. They saw their friend, Sue, who was holding a big red ball. Sue said, \"Hi Tim and Spot! Let's play with my ball later!\" Tim and Spot said, \"Yes, after the race!\"\nTim and Spot ran and ran. They were very tired, but they did not stop. At last, they reached the end of the race. They were so happy to see that they had won! Everyone cheered for them.\nAfter the race, Tim, Spot, and Sue played with the big red ball. They had a lot of fun. That night, Tim and Spot went to bed with big smiles on their faces. They were very proud of their big win.",
    "telugu_text": "ఒకప్పుడు, ఒక చిన్న పట్టణంలో, ఒక అద్భుతమైన పరుగు పందెం జరిగింది. అందరూ గెలవాలని అనుకున్నారు. టిమ్ అనే చిన్న పిల్లాడికి, అతని కుక్క స్పాట్ అనే కుక్కకి కూడా ఆ పరుగు పందెంలో పాల్గొనాలనిపించింది. వాళ్ళు చాలా ఉత్సాహంగా ఉన్నారు.\nపరుగు మొదలైంది, అందరూ మనుషులు, జంతువులు పరుగెత్తడం మొదలుపెట్టాయి. టిమ్ మరియు స్పాట్ చాలా వేగంగా పడ్డారు. వాళ్ళు తమ స్నేహితురాలు సూనుని చూశారు, ఆమె ఒక పెద్ద ఎర్రటి బంతిని పట్టుకుని ఉంది. సూను అంది, \"హాయ్ టిమ్ మరియు స్పాట్! తర్వాత నా బంతితో ఆడుకుందాం!\" టిమ్ మరియు స్పాట్ అన్నారు, \"అవును, పరుగు తర్వాత!\"\nటిమ్ మరియు స్పాట్ పరుగెత్తారు, పరుగెత్తారు. వాళ్ళు చాలా అలసిపోయారు, కానీ ఆగలేదు. చివరికి, వాళ్ళు పరుగు ముగింపుకు చేరుకున్నారు. వాళ్ళు గెలిచామని చూసి చాలా సంతోషించారు! అందరూ వాళ్ళ కోసం కేకలు వేశారు.\nపరుగు తర్వాత, టిమ్, స్పాట్ మరియు సూను పెద్ద ఎర్రటి బంతితో ఆడుకున్నారు. వాళ్ళు చాలా సరదాగా గడిపారు. ఆ రాత్రి, టిమ్ మరియు స్పాట్ పెద్ద చిరునవ్వులతో పడుకున్నారు. వాళ్ళ పెద్ద గెలుపు గురించి వాళ్ళు చాలా గర్వపడ్డారు."

  "TB22": [
   {
    "order_in_batch": 1,
    "item_id": "T-193",
    "english_text": "Once upon a time, in a small town, there was a girl named Lily. She loved to wear her red hat. One day, Lily went to the park to play with her friends. They played with a ball and had lots of fun.\nIn the park, Lily saw a big bean on the ground. She picked it up and showed it to her friend Tom. Tom said, \"Wow, that's a big bean! What should we do with it?\" Lily thought for a moment and said, \"Let's plant it and see what happens!\"\nThe next day, Lily and Tom went back to the park to see the bean. They were so surprised to see that the bean had grown into a big beanstalk! It reached all the way up to the sky. Lily and Tom were very excited but also a little scared. Lily said, \"Let's be careful and not be careless. We don't know what's up there.\"\nLily and Tom climbed the beanstalk and found a big castle in the sky. They went inside and met a nice giant who was wearing a big, shiny crown. The giant told them that he was lonely and wanted friends to play with. Lily and Tom decided to visit the giant often and became good friends with him. From that day on, they had lots of fun together and everyone was happy.",
    "telugu_text": "ఒకానొకప్పుడు, ఒక చిన్న పట్టణంలో, లిల్లీ అనే ఒక అమ్మాయి ఉండేది. ఆమె తన ఎర్రటి టోపీ ధరించడానికి చాలా ఇష్టపడేది. ఒక రోజు, లిల్లీ తన స్నేహితులతో ఆడుకోవడానికి పార్కుకు వెళ్లింది. వారు ఒక బంతితో ఆడుకున్నారు మరియు చాలా సరదాగా గడిపారు.\nపార్కులో, లిల్లీ నేలపై ఒక పెద్ద గింజను చూసింది. ఆమె దాన్ని తీసుకుని తన స్నేహితుడు టామ్కి చూపించింది. టామ్ అన్నాడు, \"వావ్, అది పెద్ద గింజ! మనం దానితో ఏం చేయాలి?\" లిల్లీ కొద్దిసేపు ఆలోచించి, \"మనం దాన్ని నాటుదాం, ఏమవుతుందో చూద్దాం!\" అంది.\nమరుసటి రోజు, లిల్లీ మరియు టామ్ ఆ గింజను చూడటానికి పార్కుకు తిరిగి వెళ్లారు. ఆ గింజ ఒక పెద్ద గింజ చెట్టుగా పెరిగిందని చూసి వారు చాలా ఆశ్చర్యపోయారు! అది ఆకాశం వరకు పెరిగింది. లిల్లీ మరియు టామ్ చాలా ఉత్సాహంగా ఉన్నప్పటికీ, కొంచెం భయపడ్డారు కూడా. లిల్లీ అంది, \"మనం జాగ్రత్తగా ఉండాలి, తొందరపడకూడదు. అక్కడ ఏం ఉందో మనకు తెలియదు.\"\nలిల్లీ మరియు టామ్ ఆ గింజ చెట్టుపైకి ఎక్కారు మరియు ఆకాశంలో ఒక పెద్ద కోటను కనుగొన్నారు. వారు లోపలికి వెళ్లి, పెద్ద, మెరిసే కిరీటం ధరించిన ఒక మంచి పెద్ద మనిషిని కలిశారు. ఆ పెద్ద మనిషి తాను ఒంటరిని, ఆడుకోవడానికి స్నేహితులు కావాలని చెప్పాడు. లిల్లీ మరియు టామ్ ఆ పెద్ద మనిషిని తరచుగా కలవాలని నిర్ణయించుకున్నారు మరియు అతనితో మంచి స్నేహితులు అయ్యారు. ఆ రోజు నుండి, వారు కలిసి చాలా సరదాగా గడిపారు మరియు అందరూ సంతోషంగా ఉన్నారు."

   {
    "order_in_batch": 2,
    "item_id": "T-102",
    "english_text": "Once upon a time, there was a little boy named Tim. Tim had a big toy car that he loved to play with. One day, he set his toy car on the floor and began to push it around.\nAs Tim played with his toy car, he found a small, sour lemon. He didn't like the sour taste, so he put the lemon in the car's trunk. Tim wanted to give the lemon to his friend, Sally.\nTim pushed the car, with the lemon inside, all the way to Sally's house. He gave the lemon to Sally, and she said, \"Thank you!\" They played with the toy car together and had a lot of fun. Tim was happy he could pass the sour lemon to his friend.",
    "telugu_text": "ఒకానొకప్పుడు, టిమ్ అనే ఒక చిన్న పిల్లాడు ఉండేవాడు. టిమ్కి ఆడుకోవడానికి ఇష్టమైన ఒక పెద్ద బొమ్మ కారు ఉండేది. ఒక రోజు, అతను తన బొమ్మ కారును నేలపై పెట్టి, దాన్ని నెట్టడం మొదలుపెట్టాడు.\nటిమ్ తన బొమ్మ కారుతో ఆడుకుంటుండగా, అతను ఒక చిన్న, పుల్లని నిమ్మకాయను కనుగొన్నాడు. అతనికి ఆ పుల్లని రుచి నచ్చలేదు, కాబట్టి అతను ఆ నిమ్మకాయను కారు టంక్లో పెట్టాడు. టిమ్ ఆ నిమ్మకాయను తన స్నేహితురాలు సాలికి ఇవ్వాలనుకున్నాడు.\nటిమ్ ఆ నిమ్మకాయతో కారును నెట్టి, సాలి ఇంటి వరకు తీసుకువెళ్ళాడు. అతను ఆ నిమ్మకాయను సాలికి ఇచ్చాడు, ఆమె \"ధన్యవాదాలు!\" అంది. వారు కలిసి ఆ బొమ్మ కారుతో ఆడుకున్నారు మరియు చాలా సరదాగా గడిపారు. పుల్లని నిమ్మకాయను తన స్నేహితురాలికి ఇవ్వగలిగినందుకు టిమ్ సంతోషించాడు."
   },

    "telugu_text": "ఒకప్పుడు ఒక తీయని చిన్న కుక్కపిల్ల ఉండేది. అది దాని యజమానులతో కలిసి ఉండటం చాలా సంతోషంగా ఉండేది. ప్రతిరోజూ, ఆ కుక్కపిల్ల తోటలో తిరగడానికి వెళ్ళేది.\nఒక రోజు, కుక్కపిల్ల తోటలో ఏదో వింతగా కనిపించింది. అది చాలా పెద్ద లోహపు ట్యాంక్. దానిపై పెద్ద వెండి తాళం వేసి ఉంది.\nకుక్కపిల్ల చాలా ఆసక్తిగా ఉండి, ఆ తాళాన్ని తెరవడానికి ప్రయత్నించాలని నిర్ణయించుకుంది. కొద్ది ప్రయత్నాల తర్వాత, కుక్కపిల్ల చివరికి తాళాన్ని తెరిచింది.\nట్యాంక్ లోపల, కుక్కపిల్ల చాలా కాలంగా కోరుకుంటున్న దాని ఉంది - తాజాగా చేసిన తీయని స్నాక్స్ ఉన్న ఒక పెద్ద గిన్నె!\nకుక్కపిల్ల చాలా సంతోషించి, ఆ స్నాక్స్ చాలా ఆనందింది. అప్పటి నుండి, తీయని స్నాక్స్ మళ్ళీ నిండి ఉంటే జాగ్రత్తగా ట్యాంక్ను చూసుకునేది."

    "item_id": "T-151",
    "english_text": "Once upon a time in a big forest, there was a thoughtful bear named Ben. Ben liked to test things. One day, Ben saw a big pile of lumber. He thought, \"What can I do with this lumber?\"\nBen had an idea. He would use the lumber to make a new house. He started to work on his house. He tested the lumber to see if it was strong. The lumber was very strong. Ben was happy.\nAs Ben was building his house, his friend, a little bird, came to visit. The bird saw the strong house Ben had made. The bird was amazed. Ben was proud of his house. He knew that the lumber he tested would make a good house. And they all lived happily ever after.",
    "telugu_text": "ఒకానొకప్పుడు ఒక పెద్ద అడవిలో, బెన్ అనే ఆలోచనాపరుడైన ఎలుగుబంటి ఉండేది. బెన్కు వస్తువులను పరీక్షించడం అంటే ఇష్టం. ఒక రోజు, బెన్ ఒక పెద్ద కలప కుప్పను చూశాడు. \"ఈ కలపతో నేను ఏమి చేయగలను?\" అని అనుకున్నాడు.\nబెన్కు ఒక ఆలోచన వచ్చింది. అతను ఆ కలపను ఉపయోగించి కొత్త ఇల్లు కట్టాలని అనుకున్నాడు. అతను తన ఇంటిపై పని చేయడం మొదలుపెట్టాడు. అది బలంగా ఉందో లేదో చూడటానికి అతను కలపను పరీక్షించాడు. ఆ కలప చాలా బలంగా ఉంది. బెన్ సంతోషపడ్డాడు.\nబెన్ తన ఇల్లు కడుతున్నప్పుడు, అతని స్నేహితుడు, ఒక చిన్న పక్షి వచ్చి సందర్శించడానికి వచ్చింది. ఆ పక్షి బెన్ కట్టిన బలంగా ఉన్న ఇంటిని చూసింది. పక్షి ఆశ్చర్యపోయింది. బెన్ తన ఇంటికి గర్వపడ్డాడు. అతను పరీక్షించిన కలప మంచి ఇంటిని తయారు చేస్తుందని తెలుసుకున్నాడు. వాళ్ళు అందరూ సంతోషంగా ఆనందంగా జీవించారు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-066",
    "english_text": "One day, a big dog and a little cat were playing outside. The big dog said, \"I have a big brain, so I can run fast and catch the ball.\" The little cat said, \"I have a small brain, but I can still try.\"\nThey both saw a ball far away. The big dog said, \"Let's hurry and get the ball!\" They both ran as fast as they could. The big dog was sure he would win because of his big brain.\nBut as they got close to the ball, a little bird came down and took the ball away. The big dog and little cat were both surprised. The little bird said, \"I have a small brain, but I am fast too!\"\nThe big dog and little cat learned that having a big brain doesn't always make you the best at everything. They all played together and had lots of fun.",
    "telugu_text": "ఒక రోజు, ఒక పెద్ద కుక్క మరియు ఒక చిన్న పిల్లి బయట ఆడుకుంటున్నాయి. పెద్ద కుక్క, \"నాకు పెద్ద మెదడు ఉంది, కాబట్టి నేను వేగంగా పరిగెత్తి బంతిని పట్టుకోగలను,\" అంది. చిన్న పిల్లి, \"నాకు చిన్న మెదడు ఉంది, కానీ నేను ప్రయత్నించగలను,\" అంది.\nవాళ్లిద్దరూ దూరంగా ఉన్న ఒక బంతిని చూశారు. పెద్ద కుక్క, \"త్వరగా వెళ్లి బంతిని తీసుకుందాం!\" అంది. వాళ్లిద్దరూ వీలైనంత వేగంగా పరుగెత్తారు. పెద్ద కుక్క తన పెద్ద మెదడు వల్ల గెలుస్తాడని నమ్మింది.\nకానీ వాళ్ళు బంతి దగ్గరకు వచ్చినప్పుడు, ఒక చిన్న పక్షి కిందకి వచ్చి బంతిని తీసుకుపోయింది. పెద్ద కుక్క మరియు చిన్న పిల్లి ఇద్దరూ ఆశ్చర్యపోయారు. చిన్న పక్షి, \"నాకు చిన్న మెదడు ఉంది, కానీ నేను కూడా వేగంగా ఉన్నాను!\" అంది.\nపెద్ద కుక్క మరియు చిన్న పిల్లి పెద్ద మెదడు ఉంటే అన్ని విషయాలలోనే ఉత్తమంగా ఉండదని తెలుసుకున్నారు. వాళ్ళు అందరూ కలిసి ఆడుకున్నారు మరియు చాలా సరదాగా గడిపారు."
   }
  ],
  "TB23": [
   {
    "order_in_batch": 1,
    "item_id": "T-168",
    "english_text": "One day, a little girl named Lily went to the park with her mom. Lily wore her clean, red sweater. At the park, she saw her friend Tim. Tim liked her sweater and said, \"Nice sweater, Lily!\"\n\"Thank you, Tim!\" Lily said with a smile. They played together and had a lot of fun. They ran, jumped, and laughed. But then, they saw a big puddle. Lily and Tim wanted to jump in the puddle, but they did not want to get their clothes dirty.\nLily had an idea. She took off her clean sweater and put it on the ground. Tim and Lily stood on the sweater, and they jumped into the puddle. They splashed and played, and their clothes stayed clean. When it was time to go home, Lily and Tim gave each other a big hug.\n\"Let's play again soon!\" Tim said. \"Yes, let's!\" Lily agreed. They went home with their moms, happy and tired from their fun day at the park.",
    "telugu_text": "ఒక రోజు, లిల్లీ అనే చిన్న అమ్మాయి తన అమ్మతో పార్కుకు వెళ్ళింది. లిల్లీ తన శుభ్రమైన, ఎర్రటి స్వెటర్ వేసుకుంది. పార్కులో, ఆమె తన స్నేహితుడు టామ్ను చూసింది. టామ్కు ఆమె స్వెటర్ నచ్చింది, \"చక్కటి స్వెటర్, లిల్లీ!\" అన్నాడు.\n\"ధన్యవాదాలు, టామ్!\" లిల్లీ నవ్వుతూ అంది. వారు కలిసి ఆడుకున్నారు మరియు చాలా సరదాగా గడిపారు. వారు పరుగెత్తారు, గంతులు వేయారు, మరియు నవ్వారు. కానీ అప్పుడు, వారు ఒక పెద్ద నీటి గుంటను చూశారు. లిల్లీ మరియు టామ్ ఆ నీటి గుంటలో దూకాలనుకున్నారు, కానీ వారి బట్టలు కలుషితం కాకూడదని వారు కోరుకున్నారు.\nలిల్లీకి ఒక ఆలోచన వచ్చింది. ఆమె తన శుభ్రమైన స్వెటర్ను తీసి నేలపై పెట్టింది. టామ్ మరియు లిల్లీ ఆ స్వెటర్పై నిలబడి, ఆ నీటి గుంటలో దూకారు. వారు చిలకరించి ఆడుకున్నారు, మరియు వారి బట్టలు శుభ్రంగానే ఉన్నాయి. ఇంటికి వెళ్ళే సమయం అయినప్పుడు, లిల్లీ మరియు టామ్ ఒకరినొకరు గట్టిగా కౌగిలించుకున్నారు.\n\"త్వరలో మళ్ళీ ఆడుకుందాం!\" టామ్ అన్నాడు. \"అవును, ఆడుకుందాం!\" లిల్లీ అంగీకరించింది. వారు తమ అమ్మలతో కలిసి ఇంటికి వెళ్లారు, పార్కులో గడిపిన సరదా రోజుతో సంతోషంగా మరియు అలసిపోయి."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-020",
    "english_text": "Once upon a time, there was a big tree in the forest. A man came with an axe to cut the tree. The tree was sad because it did not want to be cut. The man was not nice to the tree. The tree started to suffer when the man used the axe.\nA little bird saw the tree and the man. The bird thought the man was stupid for hurting the tree. The bird wanted to help the tree. The bird flew down and took the man's hat. The man was mad and chased the bird.\nThe bird led the man far away from the tree. The man was so tired, he forgot about the tree and went home. The tree was happy and did not suffer anymore. The bird and the tree became good friends.",
    "telugu_text": "ఒకప్పుడు, అడవిలో ఒక పెద్ద చెట్టు ఉండేది. ఒక మనిషి కొట్టడానికి గొడ్డలితో వచ్చాడు. చెట్టు కోయబడటానికి ఇష్టపడలేదు కాబట్టి అది విచారించింది. ఆ మనిషి చెట్టుతో మంచివాడు కాలేదు. మనిషి గొడ్డలిని వాడినప్పుడు చెట్టు బాధపడటం మొదలుపెట్టింది.\nఒక చిన్న పక్షి ఆ చెట్టును, మనిషిని చూసింది. మనిషి చెట్టుకు హాని చేయడం తెలివితక్కువ అనుకుంది. పక్షి చెట్టుకు సహాయం చేయాలనుకుంది. పక్షి కిందకి ఎగిరి మనిషి టోపీని తీసుకుంది. మనిషి కోపంతో మారి పక్షిని వెంబడించాడు.\nఆ పక్షి మనిషిని చెట్టు నుండి చాలా దూరంగా తీసుకెళ్లింది. మనిషి చాలా అలసిపోయాడు, చెట్టు గురించి మర్చిపోయి ఇంటికి వెళ్ళాడు. చెట్టు సంతోషంగా ఉండి, ఇక బాధపడలేదు. పక్షి, చెట్టు మంచి స్నేహితులు అయ్యాయి."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-169",
    "english_text": "Once upon a time there were two brothers, John and Harry. One day, John wanted to play with a set of black marbles, but Harry warned him: \"Those marbles are dangerous! Let's not play with them.\" However, John was stubborn and threw the marbles in the air, scattering them around the room.\nJohn and Harry started to scramble for the marbles. Suddenly, John tripped over one of the marbles and hurt his ankle.\nWhen he started crying, Harry said: \"See, I told you these marbles were dangerous. We'd better be careful from now on\".\nThe brothers learnt an important lesson that day: Sometimes it's better to listen to the advice of others, especially if it keeps us safe.",
    "telugu_text": "ఒకప్పుడు జాన్ మరియు హ్యారీ అనే ఇద్దరు అన్నదమ్ములు ఉండేవారు. ఒక రోజు, జాన్ నల్లటి గోళీలతో ఆడుకోవాలని అనుకున్నాడు, కానీ హ్యారీ అతనికి హెచ్చరించాడు: \"ఆ గోళీలు ప్రమాదకరం! వాటితో ఆడుకుందాం.\" అయినప్పటికీ, జాన్ మొండిగా ఉండి, గోళీలను గాలిలోకి విసిరి, గది అంతా చెల్లాచెదురు చేశాడు.\nజాన్ మరియు హ్యారీ గోళీల కోసం పరుగులు తీశారు. అకస్మాత్తుగా, జాన్ ఒక గోళీపై తడబడి తన మడమకు గాయపడ్డాడు.\nఅతను ఏడవటం మొదలుపెట్టినప్పుడు, హ్యారీ అన్నాడు: \"చూశావా, నేను ఈ గోళీలు ప్రమాదకరం అని చెప్పాను. ఇకపై మనం జాగ్రత్తగా ఉండాలి.\"\nఆ రోజు అన్నదమ్ములు ఒక ముఖ్యమైన పాఠం నేర్చుకున్నారు: ఎప్పుడైతే మనల్ని సురక్షితంగా ఉంచుతుందో, ముఖ్యంగా ఇతరుల సలహాలను వినడం మంచిది."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-143",
    "english_text": "Once upon a time, in a small house, there lived a boy named Tim. He had a powerful whistle. When he blew it, all his friends came to play.\nOne day, Tim and his friends played near the house. Tim said, \"I will lock the door, so no one can go in.\" He locked the door with a big key and put it in his pocket.\nThey played all day. When it was time to go home, Tim blew his whistle. \"Bye, friends!\" he said. But, oh no! The key was not in his pocket. Tim looked everywhere, but he could not find it.\nFinally, his friend Sue found the key under a big rock. \"Here it is!\" she said. Tim was so happy. He unlocked the door and went inside. From that day on, he always checked his pockets before he played.",
    "telugu_text": "ఒకానొకప్పుడు, ఒక చిన్న ఇంట్లో, టిమ్ అనే ఒక అబ్బాయి ఉండేవాడు. అతనికి ఒక శక్తివంతమైన హారన్ ఉండేది. అతను దానిని ఊదితే, అతని స్నేహితులందరూ ఆడుకోవడానికి వచ్చేవాళ్ళు.\nఒక రోజు, టిమ్ మరియు అతని స్నేహితులు ఇంటి దగ్గర ఆడుకున్నారు. టిమ్, \"నేను తలుపు లాక్ చేస్తాను, ఎవరూ లోపలికి రాలేరు,\" అన్నాడు. అతను ఒక పెద్ద తాళంతో తలుపు లాక్ చేసి, దాన్ని తన జేబులో పెట్టాడు.\nవారు రోజంతా ఆడుకున్నారు. ఇంటికి వెళ్లవలసిన సమయం అయినప్పుడు, టిమ్ తన హారన్ను ఊదాడు. \"బై, స్నేహితులారా!\" అన్నాడు. కానీ, అయ్యో! తాళం అతని జేబులో లేదు. టిమ్ అన్ని చోట్లా చూశాడు, కానీ దాన్ని కనుగొనలేకపోయాడు.\nచివరికి, అతని స్నేహితురాలు సూ (సూ) ఒక పెద్ద రాయి కింద తాళాన్ని కనుగొంది. \"ఇదిగో!\" అంది. టిమ్ చాలా సంతోషించాడు. అతను తలుపు తీసి లోపలికి వెళ్ళాడు. ఆ రోజు నుండి, అతను ఆడుకునే ముందు ఎప్పుడూ తన జేబులను తనిఖీ చేసుకునేవాడు."
   },
   {

    "english_text": "Once upon a time, there was a veterinarian named Jane. She loved animals and took care of them. She had a big dog named Max. Max was very playful, but sometimes he was careless.\nOne day, Max found a toy and tried to attach it to his collar. But he was too careless and got stuck in a tree. Jane did not know where Max was. She looked and looked for him. She was very sad.\nThen, a little bird saw Max in the tree. The bird flew to Jane and told her where Max was. Jane was so happy! She went to the tree and helped Max get free. Max learned to be more careful, and they lived happily ever after.",
    "telugu_text": "ఒకప్పుడు, జేన్ అనే పశువైద్యురాలు ఉండేది. ఆమెకు జంతువులంటే చాలా ఇష్టం, వాటిని చూసుకునేది. ఆమెకు మాక్స్ అనే పెద్ద కుక్క ఉండేది. మాక్స్ చాలా సరదాగా ఉండేది, కానీ కొన్నిసార్లు అతను అజాగ్రత్తగా ఉండేవాడు.\nఒక రోజు, మాక్స్ ఒక బొమ్మను కనుగొని దానిని తన మెడకు కట్టడానికి ప్రయత్నించాడు. కానీ అతను చాలా అజాగ్రత్తగా ఉన్నాడు, చెట్టులో చిక్కుకుపోయాడు. జేన్ మాక్స్ ఎక్కడ ఉన్నాడో తెలియలేదు. ఆమె వెతకడం, వెతకడం చేసింది. ఆమె చాలా బాధపడింది.\nఅప్పుడు, ఒక చిన్న పక్షి చెట్టులో మాక్స్ను చూసింది. ఆ పక్షి జేన్ దగ్గరకు ఎగిరి వచ్చి మాక్స్ ఎక్కడ ఉన్నాడో చెప్పింది. జేన్ చాలా సంతోషించింది! ఆమె చెట్టు దగ్గరకు వెళ్లి మాక్స్ను విముక్తి చేయడంలో సహాయం చేసింది. మాక్స్ మరింత జాగ్రత్తగా ఉండటం నేర్చుకున్నాడు, మరియు వారు సంతోషంగా జీవించారు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-179",
    "english_text": "One day, a little girl named Sue went to her bookcase. She wanted to find a fun book to read. But the bookcase was very tall, and Sue was very small. She tried to reach a book, but she could not manage to get it.\nSue saw her big brother, Tom, and asked for help. \"Tom, can you help me get a book? The bookcase is too tall for me.\" Tom was very nice and helped Sue get a book from the bookcase. \nWhen they opened the book, they found it was a smelly book about animals. They laughed and said, \"Ew, this book is smelly!\" They read the book together and had lots of fun.",
    "telugu_text": "ఒక రోజు, సూ అనే చిన్న అమ్మ తన పుస్తకాల అర దగ్గరకు వెళ్లింది. ఆమె చదవడానికి ఒక సరదా పుస్తకం వెతకాలనుకుంది. కానీ ఆ పుస్తకాల అర చాలా ఎత్తుగా ఉంది, మరియు సూ చాలా చిన్నది. ఆమె ఒక పుస్తకాన్ని అందుకోవడానికి ప్రయత్నించింది, కానీ ఆమె దాన్ని అందుకోలేకపోయింది.\nసూ తన పెద్ద అన్న అయిన టామ్ను చూసి సహాయం అడిగింది. \"టామ్, నాకు ఒక పుస్తకం తీసుకోవడంలో సహాయం చేస్తావా? పుస్తకాల అర నాకు చాలా ఎత్తుగా ఉంది.\" టామ్ చాలా మంచివాడు మరియు సూకు పుస్తకాల అర నుండి ఒక పుస్తకాన్ని తీసుకోవడంలో సహాయం చేశాడు.\nవారు ఆ పుస్తకాన్ని తెరిచినప్పుడు, అది జంతువుల గురించి వాసన వచ్చే పుస్తకం అని వారికి తెలిసింది. వారు నవ్వుకున్నారు మరియు \"అబ్బా, ఈ పుస్తకం వాసన వస్తోంది!\" అన్నారు. వారు కలిసి ఆ పుస్తకాన్ని చదివి చాలా సరదాగా గడిపారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-144",
    "english_text": "Once upon a time, there was a pale cat. The cat liked to seat on a big rock near the tall tree. One day, the cat went to seat on the rock, but the rock was gone.\nThe cat looked around and saw a big dog. The dog had taken the rock to seat on it. The cat was sad and asked the dog, \"Can I seat on the rock with you?\" The dog said, \"No, it's my rock now.\"\nThe cat walked away and found a new place to seat. It was a soft pile of leaves under the tree. The cat was happy with the new place. The dog saw the cat and wanted to seat on the leaves too. The cat said, \"We can share and seat together.\"\nThe dog and the cat became friends and shared the leaves. They learned that sharing is good and makes everyone happy.",
    "telugu_text": "ఒకప్పుడు, ఒక లేత రంగు పిల్లి ఉండేది. ఆ పిల్లి ఎత్తైన చెట్టు దగ్గర ఉన్న పెద్ద రాయి మీద కూర్చోవడం అంటే చాలా ఇష్టం. ఒక రోజు, ఆ పిల్లి ఆ రాయి మీద కూర్చోవడానికి వెళ్ళింది, కానీ ఆ రాయి పోయింది.\nపిల్లి చుట్టూ చూసింది, ఒక పెద్ద కుక్కను చూసింది. ఆ కుక్క ఆ రాయిని తీసుకుని దాని మీద కూర్చుంది. పిల్లికి విచారం కలిగింది, అది కుక్కతో, \"నేను నీతో కలిసి ఆ రాయి మీద కూర్చోవచ్చా?\" అని అడిగింది. కుక్క, \"లేదు, అది ఇప్పుడు నా రాయి,\" అంది.\nపిల్లి దూరంగా నడిచి, కూర్చోవడానికి కొత్త చోటును కనుగొంది. అది చెట్టు కింద ఉన్న మెత్తటి ఆకుల గుట్ట. పిల్లి కొత్త చోటుతో సంతోషపడింది. కుక్క ఆ పిల్లిని చూసి, ఆ ఆకుల మీద కూడా కూర్చోవాలని అనుకుంది. పిల్లి, \"మనం పంచుకుని కలిసి కూర్చోవచ్చు,\" అంది.\nకుక్క, పిల్లి స్నేహితులు అయ్యాయి, ఆ ఆకులను పంచుకున్నాయి. పంచుకోవడం మంచిదని, అది అందరినీ సంతోషపెడుతుందని అవి నేర్చుకున్నాయి."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-095",
    "english_text": "Lily and Ben were playing in the garden. They liked to dig in the dirt and look for bugs. They found a big worm and a shiny beetle. They put them in a jar.\n\"Look, we have pets now!\" Lily said.\n\"Can we keep them?\" Ben asked.\n\"Sure, why not? They are very nice and quiet,\" Lily said.\nThey went inside to show their mom. But mom was not happy. She saw the jar and frowned.\n\"Put that down, right now! That is poison!\" she said.\n\"Poison? What is poison?\" Lily asked.\n\"Poison is something bad that can make you sick or hurt you. That beetle is poison. It has a red spot on its back. That means it can bite you and give you poison,\" mom said.\nLily and Ben felt scared. They did not want to get poison. They did not want to get sick or hurt. They dropped the jar and ran away.\nMom picked up the jar and threw it in the trash. She washed her hands and hugged Lily and Ben.\n\"It's okay, you are safe now. But you have to be careful. Not all bugs are nice. Some are poison. You have to ask me before you touch anything you don't know,\" she said.\nLily and Ben nodded. They felt sorry for the worm and the beetle. They felt miserable. They did not want to play in the garden anymore. They wanted to play with their toys instead.",
    "telugu_text": "లిల్లీ, బెన్ తోటలో ఆడుకుంటున్నారు. వాళ్లకు మట్టిలో తవ్వుతూ కీటకాలను వెతకడం అంటే ఇష్టం. వాళ్లకు ఒక పెద్ద పురుగు, మెరిసే కీటకం దొరికాయి. వాళ్లు వాటిని ఒక సీసాలో పెట్టారు.\n\"చూడు, మనకు ఇప్పుడు పెంపుడు జంతువులు వచ్చాయి!\" లిల్లీ అంది.\n\"మనం వాటిని ఉంచుకోవచ్చా?\" బెన్ అడిగాడు.\n\"తప్పకుండా, ఎందుకు లేదు? అవి చాలా మంచివి, నిశ్శబ్దంగా ఉంటాయి,\" లిల్లీ అంది.\nవాళ్లు వాళ్ల అమ్మ దగ్గరకు చూపించడానికి లోపలికి వెళ్లారు. కానీ అమ్మ సంతోషంగా లేదు. ఆమె సీసాను చూసి ముఖం చిట్లించింది.\n\"అది ఇప్పుడే పక్కన పెట్టు! అది విషం!\" అంది ఆమె.\n\"విషమా? విషం అంటే ఏమిటి?\" లిల్లీ అడిగింది.\n\"విషం అంటే నీకు అనారోగ్యం కలిగించగలిగే లేదా బాధపెట్టగలిగే చెడు విషయం. ఆ కీటకం విషం. దాని వెనక ఎర్రటి మచ్చ ఉంది. అంటే అది నిన్ను కుట్టి విషం ఇవ్వగలదు,\" అంది అమ్మ.\nలిల్లీ, బెన్ భయపడ్డారు. వాళ్లు విషం తినడానికి ఇష్టపడలేదు. వాళ్లు అనారోగ్యంగా లేదా గాయపడటానికి ఇష్టపడలేదు. వాళ్లు సీసాను పడేసి పారిపోయారు.\nఅమ్మ సీసాను తీసుకుని చెత్తలో పారేసింది. ఆమె చేతులు కడుక్కుని లిల్లీ, బెన్ ని హత్తుకుంది.\n\"పర్వాలేదు, ఇప్పుడు నువ్వు సురక్షితంగా ఉన్నావు. కానీ నువ్వు జాగ్రత్తగా ఉండాలి. అన్ని కీటకాలు మంచివి కావు. కొన్ని విషపూరితమైనవి. నువ్వు ఏదైనా తాకడానికి ముందు నాకు అడగాలి, నీకు తెలియని వాటిని,\" అంది.\nలిల్లీ, బెన్ తల ఊపారు. వాళ్లకు ఆ పురుగు, కీటకం పట్ల జాలి కలిగింది. వాళ్లు విచారంగా అనిపించింది. వాళ్లు ఇంక తోటలో ఆడాలని అనుకోలేదు. వాళ్లు బదులుగా తమ బొమ్మలతో ఆడాలని అనుకున్నారు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-090",
    "english_text": "Once upon a time, there was a little cat named Kitty. Kitty was an unusual cat because she had a very long tail. One day, Kitty went to the kitchen to find something to eat.\nIn the kitchen, she saw a big bowl of soup. Kitty wanted to taste the soup, so she used her long tail to stir it. She stirred and stirred the soup until it was cold.\nWhen Kitty's mom came into the kitchen, she saw the cold soup and asked Kitty what happened. Kitty told her mom about her long tail and how she used it to stir the soup. Kitty's mom told her that it was not nice to play with food and that she should use her tail for other things.\nFrom that day on, Kitty learned not to play with food and to use her tail in a good way. The moral of the story is to always use what we have for the right things and not to play with food.",
    "telugu_text": "ఒకప్పుడు, కిట్టి అనే ఒక చిన్న పిల్లి ఉండేది. కిట్టి ఒక విచిత్రమైన పిల్లి, ఎందుకంటే దాని తోక చాలా పొడవుగా ఉండేది. ఒక రోజు, కిట్టి తినడానికి ఏదో వెతకడానికి వంటగదికి వెళ్లింది.\nవంటగదిలో, అది ఒక పెద్ద సూప్ గిన్నెను చూసింది. కిట్టి ఆ సూప్ను రుచి చూడాలని అనుకుంది, కాబట్టి అది తన పొడవైన తోకను ఉపయోగించి దాన్ని కదిలించింది. అది సూప్ను చల్లబడే వరకు కదిలించింది.\nకిట్టి అమ్మ వంటగదిలోకి వచ్చినప్పుడు, అది చల్లటి సూప్ను చూసి కిట్టికి ఏమైందో అని అడిగింది. కిట్టి తన అమ్మకు తన పొడవైన తోక గురించి, అది సూప్ను కదిలించడానికి ఎలా ఉపయోగించిందో చెప్పింది. కిట్టి అమ్మ, ఆహారంతో ఆడుకోవడం మంచిది కాదని, తన తోకను వేరే పనుల కోసం ఉపయోగించాలని చెప్పింది.\nఆ రోజు నుండి, కిట్టి ఆహారంతో ఆడుకోకూడదని, తన తోకను మంచి పద్ధతిలో ఉపయోగించాలని నేర్చుకుంది. ఈ కథలోని నీతి ఏమిటంటే, మన దగ్గర ఉన్న వాటిని సరైన పనుల కోసం ఉపయోగించాలి, ఆహారంతో ఆడుకోకూడదు."

  "TB26": [
   {
    "order_in_batch": 1,
    "item_id": "T-048",
    "english_text": "Once upon a time, there was a big, spoiled cat named Fluffy. Fluffy did not like to bathe. One day, Fluffy's mom said, \"Fluffy, you need to bathe.\" Fluffy said, \"No, I don't want to.\"\nThat night, there was a loud thunder. Fluffy was scared and hid under the bed. The thunder made a lot of rain outside. Fluffy thought, \"Maybe if I go out in the rain, I will get clean and not need to bathe.\"\nFluffy went outside and played in the rain. The rain stopped and Fluffy was wet. But, Fluffy was not clean. Fluffy was now dirty and muddy. Fluffy's mom saw him and said, \"Oh, Fluffy! Now you really need to bathe.\" Fluffy agreed and finally took a bath.",
    "telugu_text": "ఒకప్పుడు, ఫలఫీ అనే పెద్ద, అల్లరి పిల్లి ఉండేది. ఫలఫీకి స్నానం చేయడం అంటే ఇష్టం ఉండేది కాదు. ఒక రోజు, ఫలఫీ అమ్మ, \"ఫలఫీ, నీకు స్నానం చేయాలి,\" అంది. ఫలఫీ, \"వద్దు, నాకు వద్దు,\" అంది.\nఆ రాత్రి, పెద్దగా ఉరుము వినిపించింది. ఫలఫీ భయపడి మంచం కింద దాక్కుంది. ఉరుము వల్ల బయట చాలా వర్షం పడింది. ఫలఫీ అనుకుంది, \"బహుశా నేను వర్షంలో బయటికి వెళ్తే, నాకు శుభ్రంగా మారి, స్నానం చేయవలసిన అవసరం ఉండదు.\"\nఫలఫీ బయటికి వెళ్లి వర్షంలో ఆడింది. వర్షం ఆగిపోయింది, ఫలఫీ తడిపోయింది. కానీ, ఫలఫీ శుభ్రంగా లేదు. ఫలఫీ ఇప్పుడు మురికిగా, బురదలో ఉంది. ఫలఫీ అమ్మ అతన్ని చూసి, \"ఓహ్, ఫలఫీ! ఇప్పుడు నీకు నిజంగా స్నానం చేయాలి,\" అంది. ఫలఫీ ఒప్పుకుంది మరియు చివరికి స్నానం చేసింది."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-134",
    "english_text": "One day, a boy named Tim went to the park. He saw a mysterious bug. It was a mosquito! The mosquito was big and had a long nose. Tim was scared.\nTim ran to his mom and said, \"Mom, I saw a big bug! It was mysterious.\" His mom smiled and said, \"Don't worry, Tim. It's just a mosquito. It can't hurt you.\"\nTim felt better. He went back to the park and saw the mosquito again. This time, he was brave. He said, \"Hi, mosquito!\" The mosquito flew away.\nTim saw many other bugs in the park. He decided to sort them. He put the big bugs in one group and the small bugs in another group. Tim had fun sorting the bugs.\nAt the end of the day, Tim told his mom about the mysterious mosquito and the other bugs. His mom was proud of him for being brave and sorting the bugs. They went home happy.",
    "telugu_text": "ఒక రోజు, టిమ్ అనే ఒక అబ్బాయి పార్కుకు వెళ్ళాడు. అతను ఒక రహస్యమైన కీటకాన్ని చూశాడు. అది దోమ! ఆ దోమ పెద్దదిగా ఉండి, పొడవాటి ముక్కు కలిగి ఉంది. టిమ్ భయపడ్డాడు.\nటిమ్ తన అమ్మ దగ్గరకు పరిగెత్తి, \"అమ్మా, నేను ఒక పెద్ద కీటకాన్ని చూశాను! అది రహస్యమైనది,\" అన్నాడు. అతని అమ్మ నవ్వి, \"చింతించకు, టిమ్. అది కేవలం దోమ. అది నిన్ను బాధించలేదు,\" అంది.\nటిమ్కు మంచి అనుభూతి కలిగింది. అతను తిరిగి పార్కుకు వెళ్లి మళ్ళీ దోమను చూశాడు. ఈసారి, అతను ధైర్యంగా ఉన్నాడు. అతను, \"హాయ్, దోమ!\" అన్నాడు. ఆ దోమ ఎగిరిపోయింది.\nటిమ్ పార్కులో చాలా ఇతర కీటకాలను చూశాడు. అతను వాటిని వేరు చేయడానికి నిర్ణయించుకున్నాడు. అతను పెద్ద కీటకాలను ఒక సమూహంలో, చిన్న కీటకాలను మరొక సమూహంలో పెట్టాడు. కీటకాలను వేరు చేయడం టిమ్కు సరదాగా అనిపించింది.\nఆ రోజు చివర్లో, టిమ్ తన అమ్మకు ఆ రహస్యమైన దోమ గురించి మరియు ఇతర కీటకాల గురించి చెప్పాడు. కీటకాలను వేరు చేసినందుకు ధైర్యంగా ఉన్నందుకు అతని అమ్మ గర్వపడింది. వారు సంతోషంగా ఇంటికి వెళ్లారు."

   {
    "order_in_batch": 3,
    "item_id": "T-032",
    "english_text": "Once upon a time, there was a little girl who was only three years old. She was curious and wanted to explore everywhere. One day, she decided to take a peek inside the closet. She opened the door and saw that it was very gloomy inside! She was scared to go inside and take a closer look.\nBut after a few moments, she decided to take a few brave steps into the closet. She looked around carefully and noticed that there were lots of different things in there! She saw some exciting toys, old clothes, and shiny decorations. She carefully took the decorations out of the closet and looked closely at each one.\nAfter a while, the little girl got tired and decided to take all her decorations out of the closet. She was so excited to show her friends the things she had found! She had a wonderful afternoon playing with her new treasures.",
    "telugu_text": "ఒకప్పుడు, మూడు సంవత్సరాల చిన్న అమ్మాయి ఉండేది. ఆమె చాలా ఉత్సాహంగా ఉండేది, అన్ని చోట్లా చూడాలని అనుకునేది. ఒక రోజు, ఆమె అల్మారా లోపలికి చూడాలని నిర్ణయించుకుంది. ఆమె తలుపు తెరిచింది, లోపల చాలా చీకటిగా ఉందని చూసింది! లోపలికి వెళ్లి దగ్గరగా చూడడానికి ఆమె భయపడింది.\nకానీ కొద్దిసేపటి తర్వాత, ఆమె ధైర్యంగా అల్మారా లోపలికి అడుగు పెట్టాలని నిర్ణయించుకుంది. ఆమె జాగ్రత్తగా చుట్టూ చూసింది, లోపల చాలా రకాల వస్తువులు ఉన్నాయని గమనించింది! ఆమె కొన్ని ఆసక్తికరమైన బొమ్మలు, పాత బట్టలు, మెరిసే అలంకరణలు చూసింది. ఆమె ఆ అలంకరణలను జాగ్రత్తగా అల్మారా నుండి తీసి ప్రతి దానిని దగ్గరగా చూసింది.\nకొంత సమయం తర్వాత, చిన్న అమ్మాయి అలసిపోయింది మరియు తన అలంకరణలన్నింటినీ అల్మారా నుండి తీయాలని నిర్ణయించుకుంది. తాను కనుగొన్న వాటిని తన స్నేహితులకు చూపించడానికి ఆమె చాలా ఉత్సాహపడింది! తన కొత్త నిధులతో ఆడుకుంటూ ఆమెకు అద్భుతమైన మధ్యాహ్నం గడిచింది."

   {
    "order_in_batch": 4,
    "item_id": "T-043",
    "english_text": "Once upon a time, there was a big billboard in the town. On the billboard, there was a picture of a cat. The cat had a big smile and looked happy. The cat was loyal and loved to follow its owner everywhere.\nOne day, the cat was very thirsty. It wanted to drink some water. The cat went to the park and found a small pond. The cat leaned down and started to drink the water from the pond. It felt so good to drink the water that the cat's big smile grew even bigger.\nAfter the cat finished drinking, it went back to its owner. The owner was happy to see the cat and gave it a big hug. They walked home together, with the loyal cat following its owner, and the big billboard with the smiling cat watched them as they went. The cat and its owner were happy, and they lived happily ever after.",
    "telugu_text": "ఒకానొకప్పుడు, పట్టణంలో ఒక పెద్ద బోర్డు ఉండేది. ఆ బోర్డుపై ఒక పిల్లి బొమ్మ ఉంది. ఆ పిల్లికి పెద్ద చిరునవ్వు ఉంది, అది సంతోషంగా కనిపించింది. ఆ పిల్లి చాలా నమ్మకమైనది, తన యజమానిని ఎక్కడికైనా అనుసరించడానికి ఇష్టపడేది.\nఒక రోజు, ఆ పిల్లికి చాలా దాహం వేసింది. అది కొంచెం నీళ్లు తాగాలని అనుకుంది. ఆ పిల్లి పార్కుకు వెళ్లి ఒక చిన్న చెరువును కనుగొంది. ఆ పిల్లి వంగి, చెరువు నుండి నీళ్లు తాగడం మొదలుపెట్టింది. నీళ్లు తాగడం చాలా బాగుంది, ఆ పిల్లి పెద్ద చిరునవ్వు ఇంకా పెద్దదిగా మారింది.\nపిల్లి నీళ్లు తాగిన తర్వాత, అది తన యజమాని దగ్గరకు వెళ్లింది. యజమాని పిల్లిని చూసి సంతోషించి, దానికి పెద్దగా కౌగిల తిప్పింది. వారు కలిసి ఇంటికి నడిచారు, నమ్మకమైన పిల్లి యజమానిని అనుసరించింది, ఆ నవ్వుతున్న పిల్లితో ఉన్న పెద్ద బోర్డు వారిని వెళ్తున్నప్పుడు చూసింది. పిల్లి, దాని యజమాని సంతోషంగా ఉన్నారు, మరియు వారు సంతోషంగా జీవించారు."

    "order_in_batch": 5,
    "item_id": "T-120",
    "english_text": "Once upon a time there was a little boat called Jo. Jo was cute and its sail was bright green.\nOne day Jo decided to go on an adventure.\nJo said \"I want to go sailing! I want to fit on my sail and explore the wide blue sea.\" \nJo asked his best friend Sidney the seagull to come along. Sidney replied \"Great idea! I'll fit too!\"\nSo off they went, Jo and Sidney, sailing across the open ocean. \nThey laughed and sang as they explored the waves, until finally they came upon a beautiful island. Jo was so happy that he had gone sailing and was able to fit with Sidney on his sail.",
    "telugu_text": "ఒకప్పుడు జో అనే చిన్న పడవ ఉండేది. జో చాలా ముద్దుగా ఉండేది, దాని తెరచాప పచ్చగా ఉండేది.\nఒక రోజు జో సాహసం చేయడానికి నిర్ణయించుకుంది.\nజో అంది, \"నేను పడవలో ప్రయాణించాలని అనుకుంటున్నాను! నేను నా తెరచాపపై కూర్చోవాలి, ఈ పెద్ద నీలి సముద్రాన్ని అన్వేషించాలి.\"\nజో తన మంచి స్నేహితుడైన సిడ్నీ సీగల్ ఆవును తోడుగా రావాలని అడిగింది. సిడ్నీ ఇలా సమాధానం ఇచ్చింది, \"గొప్ప ఆలోచన! నేను కూడా కూర్చుంటాను!\"\nఅలా వారు బయలుదేరారు, జో మరియు సిడ్నీ, తెరిచిన సముద్రంపై ప్రయాణించారు.\nవారు అలలను అన్వేషిస్తున్నప్పుడు నవ్వుతూ, పాటలు పాడారు, చివరికి వారు ఒక అందమైన ద్వీపానికి చేరుకున్నారు. జో చాలా సంతోషపడింది, ఎందుకంటే అది పడవలో ప్రయాణించింది మరియు సిడ్నీతో తన తెరచాపపై కూర్చోగలిగింది."

    "item_id": "T-137",
    "english_text": "Once upon a time, in a modest little house, there lived a girl named Lily. Lily loved the color orange. She had orange clothes, orange toys, and even an orange cat. She loved to eat oranges too. One day, she found a big orange in her garden.\nLily wanted to marry a boy who loved oranges like she did. She thought that if she gave him the big orange, he would marry her. So, she took the big orange and went to find a boy who loved oranges.\nLily met a boy named Tom. Tom loved oranges too! Lily gave Tom the big orange, and he was very happy. But when they opened the orange, something unexpected happened. Inside the orange, there was a little ring! Tom said, \"Lily, I was going to ask you to marry me, and now we have a ring from the orange!\" They laughed and decided to marry each other. And they lived happily ever after, with their orange cat and many oranges.",
    "telugu_text": "ఒకానొకప్పుడు, ఒక చిన్న, సాధారణ ఇంట్లో లిల్లీ అనే అమ్మాయి ఉండేది. లిల్లీకి నారింజ రంగు అంటే చాలా ఇష్టం. ఆమెకు నారింజ రంగు బట్టలు, నారింజ రంగు బొమ్మలు, ఇంకా నారింజ రంగు పిల్లి కూడా ఉండేది. ఆమెకు నారింజ తినడం కూడా అంటే చాలా ఇష్టం. ఒక రోజు, ఆమె తన తోటలో ఒక పెద్ద నారింజను కనుగొంది.\nలిల్లీకి తనలాగే నారింజ అంటే ఇష్టపడే అబ్బాయిని పెళ్లి చేసుకోవాలనిపించింది. ఆ పెద్ద నారింజ అతనికి ఇస్తే, అతను తనను పెళ్లి చేసుకుంటాడని ఆమె అనుకుంది. అందుకే, ఆమె ఆ పెద్ద నారింజను తీసుకుని, నారింజ అంటే ఇష్టపడే అబ్బాయిని వెతకడానికి వెళ్ళింది.\nలిల్లీ టామ్ అనే అబ్బాయిని కలిసింది. టామ్కి కూడా నారింజ అంటే చాలా ఇష్టం! లిల్లీ టామ్కి ఆ పెద్ద నారింజ ఇచ్చింది, అతను చాలా సంతోషించాడు. కానీ వారు ఆ నారింజను తెరిచినప్పుడు, ఏదో ఊహించనిది జరిగింది. నారింజ లోపల, ఒక చిన్న ఉంగరం ఉంది! టామ్ అన్నాడు, \"లిల్లీ, నేను నిన్ను పెళ్లి చేసుకోవాలని అనుకున్నాను, ఇప్పుడు మనకు నారింజ నుండి ఒక ఉంగరం వచ్చింది!\" వారు నవ్వుకున్నారు, ఒకరినొకరు పెళ్లి చేసుకోవాలని నిర్ణయించుకున్నారు. మరియు వారు తమ నారింజ పిల్లితో, చాలా నారింజలతో సంతోషంగా ఆనందంగా జీవించారు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-124",
    "english_text": "One day, a fat cat named Tom was sitting by a screen. He liked to watch the birds outside. A little bird named Tim saw Tom and wanted to tease him. Tim flew down and said, \"Hi Tom, can you catch me?\"\nTom got up and tried to catch Tim, but the screen was in the way. Tom bumped into the screen and it fell down. Tim laughed and flew away. Tom was sad and didn't like being teased.\nThen, something unexpected happened. A big wind came and blew away the screen. Now, Tom could go outside. He saw Tim and said, \"I can catch you now!\" But instead of catching Tim, Tom decided to play with him. They became friends and played together every day.",
    "telugu_text": "ఒక రోజు, టామ్ అనే ఊరట పిల్లి ఒక తెర దగ్గర కూర్చుని ఉంది. అతను బయట పక్షులను చూడటానికి ఇష్టపడేవాడు. టిమ్ అనే చిన్న పక్షి టామ్ను చూసి అతన్ని ఆటపట్టించాలని అనుకుంది. టిమ్ కిందకి ఎగిరి వచ్చి, \"హాయ్ టామ్, నన్ను పట్టుకోగలవా?\" అంది.\nటామ్ లేచి టిమ్ను పట్టుకోవడానికి ప్రయత్నించాడు, కానీ తెర అడ్డుగా ఉంది. టామ్ తెరను తగిలింది, అది కింద పడింది. టిమ్ నవ్వి ఎగిరిపోయింది. టామ్ బాధపడ్డాడు, ఆటపట్టించడం అంటే అతనికి నచ్చలేదు.\nఅప్పుడు, ఏదో ఊహించనిది జరిగింది. పెద్ద గాలి వచ్చింది, అది తెరను పంపివేసింది. ఇప్పుడు, టామ్ బయటకు వెళ్లగలిగాడు. అతను టిమ్ను చూసి, \"నేను నిన్ను ఇప్పుడు పట్టుకోగలను!\" అన్నాడు. కానీ టిమ్ను పట్టుకోవడానికి బదులుగా, టామ్ దానితో ఆడుకోవాలని నిర్ణయించుకున్నాడు. వారు స్నేహితులు అయ్యారు మరియు ప్రతిరోజూ కలిసి ఆడుకున్నారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-101",
    "english_text": "One day, a little boy named Tim went to the park. He saw a big guard. The guard was there to keep everyone safe. Tim wanted to touch the guard's hat, but he was too short.\n\"Can I touch your hat?\" Tim asked the guard. The guard smiled and said, \"Yes, but you have to close your eyes and count to ten first.\" Tim closed his eyes and started counting.\nWhen Tim opened his eyes, he saw a big, red balloon. It was floating down from the sky. Tim touched the balloon and it lifted him up. Now he could touch the guard's hat. Tim felt happy and safe.\nThe guard laughed and said, \"That was unexpected! Now you can touch my hat!\" Tim touched the hat and then the balloon brought him back down. Tim and the guard became good friends, and they played in the park every day.",
    "telugu_text": "ఒక రోజు, టిమ్ అనే చిన్న పిల్లాడు పార్కుకు వెళ్ళాడు. అతను ఒక పెద్ద గార్డ్ను చూశాడు. ఆ గార్డ్ అందరినీ సురక్షితంగా ఉంచడానికి అక్కడ ఉన్నాడు. టిమ్ గార్డ్ టోపీని తాకాలనుకున్నాడు, కానీ అతను చాలా చిన్నవాడు.\n\"నేను మీ టోపీని తాకవచ్చా?\" టిమ్ గార్డ్ని అడిగాడు. గార్డ్ నవ్వి, \"అవును, కానీ నువ్వు ముందు కళ్ళు మూసుకుని పది వరకు లెక్కించాలి.\" టిమ్ కళ్ళు మూసుకుని లెక్కించడం మొదలుపెట్టాడు.\nటిమ్ కళ్ళు తెరిచినప్పుడు, అతను ఒక పెద్ద, ఎర్రటి బెలూన్ను చూశాడు. అది ఆకాశం నుండి కిందకు తేలుతోంది. టిమ్ బెలూన్ను తాకాడు, అది అతన్ని పైకి లేపింది. ఇప్పుడు అతను గార్డ్ టోపీని తాకగలిగాడు. టిమ్ సంతోషంగా, సురక్షితంగా అనిపించాడు.\nగార్డ్ నవ్వి, \"అది ఊహించనిది! ఇప్పుడు నువ్వు నా టోపీని తాకవచ్చు!\" టిమ్ టోపీని తాకాడు, ఆపై బెలూన్ అతన్ని కిందకు తీసుకువచ్చింది. టిమ్ మరియు గార్డ్ మంచి స్నేహితులు అయ్యారు, మరియు వారు ప్రతిరోజూ పార్కులో ఆడుకున్నారు."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-173",
    "english_text": "Once upon a time, there was a green frog named Bob. Bob loved to eat bugs. One day, he saw a big, green leaf with a bug on it. He wanted to eat the bug, but the leaf was too high for him to reach.\nBob asked his friend, Sam the squirrel, to help him. Sam said, \"I can help you, but first we need to split the leaf in half.\" So, they both pushed and pulled until the leaf split into two pieces.\nNow, Bob could reach the bug. He ate it and said, \"Yum! What a good taste!\" But then, he saw another bug on the other half of the leaf. Bob wanted to eat it too, but Sam said, \"No, that bug is mine. We split the leaf, so I get half and you get half.\"\nBob didn't want to share, so they had a little fight. In the end, they decided to share the bugs and be friends again. From that day on, they always shared their food and played together happily.",
    "telugu_text": "ఒకప్పుడు, బాబ్ అనే పచ్చని కప్ప ఉండేది. బాబ్ కు కీటకాలు తినడం అంటే చాలా ఇష్టం. ఒక రోజు, అది ఒక పెద్ద, పచ్చని ఆకును, దానిపై ఒక కీటకం కనిపించింది. అది ఆ కీటకాన్ని తినాలని అనుకుంది, కానీ ఆ ఆకు దానికంటే చాలా ఎత్తులో ఉంది.\nబాబ్ తన స్నేహితుడు, సమ్ అనే ఉడుతను సహాయం చేయమని అడిగాడు. సమ్ అన్నాడు, \"నేను నీకు సహాయం చేయగలను, కానీ ముందు మనం ఆ ఆకును రెండుగా విడదీయాలి.\" అలా, ఆ ఆకు రెండు ముక్కలుగా విడిపోయే వరకు వాళ్లిద్దరూ నెట్టి, లాగారు.\nఇప్పుడు, బాబ్ ఆ కీటకాన్ని అందుకోగలిగాడు. అది తిని, \"యమ్! ఎంత మంచి రుచి!\" అన్నాడు. కానీ అప్పుడు, ఆ ఆకులో ఉన్న మరో సగం వైపు మరొక కీటకం కనిపించింది. బాబ్ కూడా దానిని తినాలని అనుకున్నాడు, కానీ సమ్ అన్నాడు, \"వద్దు, ఆ కీటకం నాది. మనం ఆ ఆకును రెండుగా విడదీశాము, కాబట్టి నాకు సగం, నీకు సగం వస్తుంది.\"\nబాబ్ పంచుకోవడానికి ఇష్టపడలేదు, కాబట్టి వాళ్ళిద్దరూ కొంచెం గొడవపడ్డారు. చివరికి, వాళ్ళు కీటకాలను పంచుకోవాలని, మళ్ళీ స్నేహితులుగా ఉండాలని నిర్ణయించుకున్నారు. ఆ రోజు నుండి, వాళ్ళు ఎప్పుడూ తమ ఆహారాన్ని పంచుకుని సంతోషంగా కలిసి ఆడుకునేవారు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-171",
    "english_text": "Once upon a time, there was a little girl named Lucy. She liked to play with her toys all day. One day, she saw a big open box in the corner of her room. She did not know what was inside, so she went to look.\nWhen she looked in the box, she found a lot of files. The files were full of papers with colors and shapes. Lucy did not know what to do with them. She decided to take the files and show them to her mom.\nLucy's mom saw the files and smiled. She told Lucy that they could make a fun game happen with the files. They took the papers with colors and shapes and put them on the floor. They played a game of matching the shapes and colors. Lucy was very happy and had a great day with her mom.",
    "telugu_text": "ఒకప్పుడు, లూసీ అనే ఒక చిన్న అమ్మాయి ఉండేది. ఆమె రోజంతా తన బొమ్మలతో ఆడుకోవడం అంటే చాలా ఇష్టం. ఒక రోజు, ఆమె తన గది మూలలో ఒక పెద్ద తెరిచిన పెట్టెను చూసింది. లోపల ఏముందో ఆమెకు తెలియక, వెళ్లి చూసింది.\nఆమె పెట్టెలో చూసేసరికి, చాలా ఫైల్స్ దొరికాయి. ఆ ఫైల్స్లో రంగులు, ఆకారాలతో కూడిన కాగితాలు నిండి ఉన్నాయి. లూసీ వాటితో ఏం చేయాలో తెలియలేదు. ఆమె ఆ ఫైల్స్ను తీసుకుని తన అమ్మకు చూపించాలని నిర్ణయించుకుంది.\nలూసీ అమ్మ ఆ ఫైల్స్ను చూసి నవ్వింది. ఫైల్స్తో ఒక సరదా ఆట ఆడవచ్చని ఆమె లూసీకి చెప్పింది. వారు రంగులు, ఆకారాలు ఉన్న కాగితాలను తీసుకుని నేలపై పెట్టారు. వారు ఆ ఆకారాలు, రంగులను సరిపోల్చే ఆట ఆడారు. లూసీ చాలా సంతోషించింది, తన అమ్మతో అద్భుతమైన రోజు గడిపింది."
   }

  "TB28": [
   {
    "order_in_batch": 1,
    "item_id": "T-188",
    "english_text": "One day, a little boy named Tim went to the park. He saw a big chain on the ground. He didn't want anyone to trip on it, so he decided to prevent that from happening. Tim asked his mom for help.\n\"Mom, can you help me move this chain?\" Tim said. His mom smiled and helped him pick up the chain. They moved it to a safe place where no one could trip on it.\nAfter they moved the chain, Tim saw a sour lemon on the ground. He picked it up and said, \"Mom, this lemon is sour! Can we make lemonade?\" His mom laughed and said, \"Yes, let's make some lemonade together!\" They went home and made lemonade with the sour lemon. Tim was happy because he helped prevent people from tripping on the chain and got to make lemonade with his mom.",
    "telugu_text": "ఒక రోజు, టిమ్ అనే చిన్న పిల్లాడు పార్కుకు వెళ్ళాడు. నేలపై ఒక పెద్ద గొలుసు చూశాడు. ఎవరూ దానిపై తడబడకూడదని అతను అనుకున్నాడు, కాబట్టి అది జరగకుండా ఆపాలని నిర్ణయించుకున్నాడు. టిమ్ తన అమ్మను సహాయం కోసం అడిగాడు.\n\"అమ్మా, ఈ గొలుసును కదపడంలో నువ్వు నాకు సహాయం చేయగలవా?\" అని టిమ్ అన్నాడు. అతని అమ్మ నవ్వి, గొలుసును ఎత్తడానికి అతనికి సహాయం చేసింది. ఎవరూ తడబడకుండా ఉండటానికి అది సురక్షితమైన ప్రదేశానికి కదిలించారు.\nవారు గొలుసును కదిలించిన తర్వాత, టిమ్ నేలపై పుల్లని నిమ్మకాయను చూశాడు. అతను దానిని తీసుకుని, \"అమ్మా, ఈ నిమ్మకాయ పుల్లగా ఉంది! మనం నిమ్మరసం తయారు చేయవచ్చా?\" అని అన్నాడు. అతని అమ్మ నవ్వి, \"అవును, మనం కలిసి నిమ్మరసం చేద్దాం!\" అంది. వారు ఇంటికి వెళ్లి పుల్లని నిమ్మకాయతో నిమ్మరసం తయారు చేశారు. టిమ్ సంతోషంగా ఉన్నాడు, ఎందుకంటే అతను ప్రజలు గొలుసుపై తడబడకుండా ఆపడంలో సహాయం చేశాడు మరియు తన అమ్మతో కలిసి నిమ్మరసం తయారు చేయగలిగాడు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-064",
    "english_text": "One day, a bright sun was in the sky. A little girl named Lily went for a walk. She saw a big mailbox on the side of the road. The mailbox was red and blue. Lily liked the colors.\nLily wanted to know what was inside the mailbox. She asked her mom, \"What is in the mailbox?\" Her mom did not know. She did a little shrug. Lily wanted to find out.\nLily opened the mailbox. Inside, she found a pretty card. The card had a picture of a happy cat on it. Lily smiled. She showed her mom the card. Her mom smiled too. They walked back home, happy with their find.",
    "telugu_text": "ఒక రోజు, ఆకాశంలో ఒక ప్రకాశవంతమైన సూర్యుడు ఉన్నాడు. లిల్లీ అనే ఒక చిన్న అమ్మాయి నడవడానికి వెళ్ళింది. రోడ్డు పక్కన ఒక పెద్ద పోస్ట్ బాక్స్ చూసింది. ఆ పోస్ట్ బాక్స్ ఎరుపు మరియు నీలం రంగులలో ఉంది. లిల్లీకి ఆ రంగులు నచ్చాయి.\nపోస్ట్ బాక్స్లో లోపల ఏముందో లిల్లీ తెలుసుకోవాలని అనుకుంది. ఆమె తన అమ్మని, \"పోస్ట్ బాక్స్లో ఏముంది?\" అని అడిగింది. అమ్మకు తెలియదు. ఆమె కొంచెం భుజం వంచింది. లిల్లీ తెలుసుకోవాలని అనుకుంది.\nలిల్లీ పోస్ట్ బాక్స్ను తెరిచింది. లోపల, ఆమె ఒక అందమైన కార్డును కనుగొంది. ఆ కార్డుపై సంతోషంగా ఉన్న పిల్లి బొమ్మ ఉంది. లిల్లీ నవ్వింది. ఆమె ఆ కార్డును తన అమ్మకు చూపించింది. అమ్మ కూడా నవ్వింది. వారు తమ దొరికిన దానితో సంతోషంగా ఇంటికి నడిచారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-146",
    "english_text": "Once upon a time, there was a graceful cat named Luna. Luna loved to dance on a stage. Every day, she would jump, spin, and dance with her friends.\nOne day, a little boy named Tim came to watch Luna dance. He saw her on the stage and said, \"Wow! You are very good at dancing, Luna!\" Luna smiled and said, \"Thank you, Tim! I love to dance.\"\nOne day while Luna was dancing, a butterfly flew by. Luna wanted to catch the butterfly, so she jumped and tried to grab it. But the butterfly was too fast! Tim laughed and said, \"Luna, you are a great dancer, but you can't catch the butterfly!\" Luna laughed too and went back to dancing on the stage with her friends.",
    "telugu_text": "ఒకప్పుడు, లూనా అనే అందమైన పిల్లి ఉండేది. లూనాకు వేదికపై నాట్యం చేయడం అంటే చాలా ఇష్టం. ప్రతిరోజూ, ఆమె తన స్నేహితులతో కలిసి దూకి, తిరుగుతూ, నాట్యం చేసేది.\nఒక రోజు, టిమ్ అనే చిన్న పిల్లాడు లూనా నృత్యం చూడడానికి వచ్చాడు. అతను ఆమెను వేదికపై చూసి, \"వావ్! నువ్వు చాలా బాగా నాట్యం చేస్తావు, లూనా!\" అన్నాడు. లూనా నవ్వి, \"ధన్యవాదాలు, టిమ్! నాకు నాట్యం అంటే చాలా ఇష్టం,\" అంది.\nఒక రోజు లూనా నాట్యం చేస్తుండగా, ఒక సీతాకోకచిలుక ఎగిరింది. లూనా ఆ సీతాకోకచిలుకను పట్టుకోవాలని అనుకుంది, కాబట్టి ఆమె దూకి, పట్టుకోవడానికి ప్రయత్నించింది. కానీ ఆ సీతాకోకచిలుక చాలా వేగంగా ఉంది! టిమ్ నవ్వాడు, \"లూనా, నువ్వు గొప్ప నర్తకివి, కానీ నువ్వు సీతాకోకచిలుకను పట్టుకోలేవు!\" లూనా కూడా నవ్వి, తన స్నేహితులతో కలిసి వేదికపై మళ్లీ నాట్యం చేయడం మొదలుపెట్టింది."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-035",
    "english_text": "One day, a small bird named Tim was flying in the sky. He saw dark clouds coming. It was a storm! Tim was scared and needed a place to hide.\nHe saw a big tree and met a creative squirrel named Sam. Sam said, \"Come, I will keep you safe in my home.\"\nTim and Sam became friends. They played and shared food. The storm went away. Tim said, \"Thank you, Sam, for keeping me safe.\"\nThe moral of the story is to help others when they need it.",
    "telugu_text": "ఒక రోజు, టిమ్ అనే చిన్న పక్షి ఆకాశంలో ఎగురుతోంది. అది నల్లటి మేఘాలు వస్తున్నాయని చూసింది. అది తుఫాను! టిమ్ భయపడి దాక్కోవడానికి ఒక చోటు కావాలి.\nఅతను ఒక పెద్ద చెట్టును చూసి, సమ్ అనే సృజనాత్మక ఉడుతను కలిశాడు. సమ్ అన్నాడు, \"రా, నేను నిన్ను నా ఇంట్లో సురక్షితంగా ఉంచుతాను.\"\nటిమ్, సమ్ స్నేహితులు అయ్యారు. వారు ఆడుకున్నారు, ఆహారం పంచుకున్నారు. తుఫాను పోయింది. టిమ్ అన్నాడు, \"నన్ను సురక్షితంగా ఉంచినందుకు ధన్యవాదాలు, సమ్.\"\nఈ కథలోని నీతి, అవసరమైనప్పుడు ఇతరులకు సహాయం చేయాలి."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-187",
    "english_text": "Lily liked to play with her spoon. She would carry it everywhere she went. She would pretend it was a magic wand, a microphone, or a shovel. She would make noises with it, like beep, boop, or brrr.\nOne day, she was playing with her spoon in the garden. She saw a big bug on a flower. It had many legs and eyes. It looked scary. Lily was fearful of the bug. She wanted to run away. But she also wanted to see it closer.\nShe took a step towards the flower. She held her spoon in front of her. She hoped the spoon would protect her from the bug. She said, \"Shoo, shoo, go away, bug!\"\nThe bug did not move. It looked at Lily with its many eyes. It made a buzzing sound. Lily felt more fearful. She took another step back. She dropped her spoon on the ground. She turned around and ran to the house.\nShe ran to her mom and hugged her. She told her about the bug and the spoon. Her mom smiled and comforted her. She said, \"It's okay, Lily. The bug was not going to hurt you. It was just a bee. Bees are good for the flowers. And your spoon is still in the garden. Do you want to go and get it?\"\nLily nodded. She felt less fearful. She wanted her spoon back. She and her mom went to the garden. They saw the bee fly away from the flower. They saw the spoon on the ground. Lily picked it up and hugged it. She said, \"Thank you, mom. I'm sorry, bee. You can have the flower. I have my spoon.\"",
    "telugu_text": "లిల్లీకి తన చెంచాతో ఆడటం అంటే చాలా ఇష్టం. అది ఎక్కడికి వెళ్లినా తీసుకెళ్లేది. అది ఒక మ్యాజిక్ వండర్, మైక్రోఫోన్ లేదా తవ్వకాల లాగా నటించేది. అది దానితో శబ్దాలు చేసేది, బీప్, బూప్ లేదా బర్ర్ లాగా.\nఒక రోజు, ఆమె తోటలో తన చెంచాతో ఆడుకుంటోంది. ఒక పువ్వు మీద పెద్ద కీటకం కనిపించింది. దానికి చాలా కాళ్లు, కళ్ళు ఉన్నాయి. అది భయపెట్టేదిగా కనిపించింది. లిల్లీకి ఆ కీటకం అంటే భయం. ఆమె పారిపోవాలని అనుకుంది. కానీ దాన్ని దగ్గరగా చూడాలని కూడా కోరుకుంది.\nఆమె పువ్వు వైపు ఒక అడుగు వేసింది. తన చెంచాను తన ముందు పట్టుకుంది. ఆ కీటకం నుండి తనను రక్షించాలని ఆశించింది. \"హు, హు, పో, పో, పో, కీటకా!\" అంది.\nఆ కీటకం కదల్లేదు. దాని చాలా కళ్ళతో లిల్లీని చూసింది. అది గుసగుసలాడే శబ్దం చేసింది. లిల్లీకి ఇంకా భయం వేసింది. ఆమె వెనక్కి మరో అడుగు వేసింది. తన చెంచాను నేలపై వదిలేసింది. ఆమె వెనక్కి తిరిగి ఇంటికి పరుగు తీసింది.\nఆమె తన అమ్మ దగ్గరకు పరిగెత్తి, ఆమెను కౌగిలించుకుంది. ఆ కీటకం గురించి, చెంచా గురించి ఆమెకు చెప్పింది. ఆమె అమ్మ నవ్వి, ఆమెను ఓదార్చింది. \"పర్వాలేదు, లిల్లీ. ఆ కీటకం నిన్ను బాధపెట్టలేదు. అది కేవలం తేనెటీగ. తేనెటీగలు పువ్వులకు మంచివి. ఇంకా నీ చెంచా తోటలోనే ఉంది. నువ్వు వెళ్లి దాన్ని తీసుకోవాలనుకుంటున్నావా?\"\nలిల్లీ తల ఊపింది. ఆమెకు భయం తగ్గింది. ఆమె తన చెంచా తిరిగి కావాలని కోరుకుంది. ఆమె మరియు ఆమె అమ్మ తోటలోకి వెళ్లారు. వారు తేనెటీగ పువ్వు నుండి ఎగిరిపోవడం చూశారు. వారు నేలపై ఉన్న చెంచాను చూశారు. లిల్లీ దాన్ని తీసుకుని కౌగిలించుకుంది. \"ధన్యవాదాలు, అమ్మా. నన్ను క్షమించు, తేనెటీగ. నువ్వు ఆ పువ్వును తీసుకో. నా దగ్గర నా చెంచా ఉంది.\""
   }

   {
    "order_in_batch": 1,
    "item_id": "T-096",
    "english_text": "Once upon a time, a girl named Ann went to camp. She loved camp. Ann made many friends there. They played all day long.\nOne day, Ann and her friends wanted to cook. They wanted to make a big meal for everyone. But they did not know how to cook. They were sad.\nAnn had an idea. She asked her mom to help them cook. Her mom was very good at cooking. They all cooked together. The meal was yummy. Everyone at camp was happy.",
    "telugu_text": "ఒకప్పుడు, ఆన్ అనే అమ్మాయి క్యాంపుకి వెళ్లింది. ఆమెకు క్యాంప్ అంటే చాలా ఇష్టం. ఆన్ అక్కడ చాలా స్నేహితులను చేసుకుంది. వాళ్ళు రోజంతా ఆడుకున్నారు.\nఒక రోజు, ఆన్ మరియు ఆమె స్నేహితులు వంట చేయాలనుకున్నారు. వాళ్ళు అందరికీ పెద్ద భోజనం చేయాలనుకున్నారు. కానీ వాళ్లకు ఎలా వండాలి అనేది తెలియలేదు. వాళ్ళు విచారించారు.\nఆన్ కి ఒక ఆలోచన వచ్చింది. ఆమె తన అమ్మని వంటలో సహాయం చేయమని అడిగింది. ఆమె అమ్మ వంట చేయడంలో చాలా బాగా చేస్తుంది. వాళ్ళందరూ కలిసి వండారు. భోజనం చాలా రుచిగా ఉంది. క్యాంప్లోని అందరూ సంతోషంగా ఉన్నారు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-013",
    "english_text": "Once upon a time, there was a big, messy house. In the house, there was a boy named Tim. Tim liked to play with his toys and make a big mess. One day, Tim's mom said, \"We will introduce you to the elevator today!\"\nTim and his mom went to a tall building. They walked inside and saw a big box with doors. \"This is the elevator,\" said Tim's mom. They got inside the elevator, and Tim pushed a button. The elevator went up, up, up! Tim felt funny in his tummy. When the elevator stopped, the doors opened, and they were in a new place.\nTim and his mom went back home. Tim thought the elevator was fun. He wanted to ride it again. His mom said, \"We can ride the elevator again, but first, we must clean your messy room!\" Tim and his mom cleaned the room together. After that, they went back to the tall building to ride the elevator again.",
    "telugu_text": "ఒకానొకప్పుడు, ఒక పెద్ద, గందరగోళమైన ఇల్లు ఉండేది. ఆ ఇంట్లో టామ్ అనే ఒక అబ్బాయి ఉండేవాడు. టామ్ తన బొమ్మలతో ఆడుకోవడానికి మరియు పెద్ద గందరగోళం చేయడానికి ఇష్టపడేవాడు. ఒక రోజు, టామ్ అమ్మ, \"ఈ రోజు మేము నీకు ఎలివేటర్ పరిచయం చేస్తాము!\" అంది.\nటామ్ మరియు అతని అమ్మ ఒక ఎత్తైన భవనానికి వెళ్లారు. వారు లోపలికి నడిచారు మరియు తలుపులు ఉన్న ఒక పెద్ద పెట్టెను చూశారు. \"ఇది ఎలివేటర్,\" అంది టామ్ అమ్మ. వారు ఎలివేటర్లో లోపలికి వెళ్లారు, మరియు టామ్ ఒక బటన్ను నొక్కాడు. ఎలివేటర్ పైకి, పైకి, పైకి! టామ్ తన కడుపులో విచిత్రంగా అనిపించింది. ఎలివేటర్ ఆగినప్పుడు, తలుపులు తెరుచుకున్నాయి, మరియు వారు ఒక కొత్త ప్రదేశంలో ఉన్నారు.\nటామ్ మరియు అతని అమ్మ ఇంటికి తిరిగి వెళ్లారు. ఎలివేటర్ సరదాగా ఉందని టామ్ అనుకున్నాడు. అతను మళ్లీ దానిపై ప్రయాణించాలనుకున్నాడు. అతని అమ్మ అంది, \"మనం మళ్లీ ఎలివేటర్లో ప్రయాణించవచ్చు, కానీ ముందుగా, మనం నీ గదిని శుభ్రం చేయాలి!\" టామ్ మరియు అతని అమ్మ కలిసి గదిని శుభ్రం చేశారు. ఆ తర్వాత, వారు మళ్లీ ఎత్తైన భవనానికి వెళ్లి ఎలివేటర్లో ప్రయాణించారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-181",
    "english_text": "One day, a little boy named Tim went to the park. He saw a big tree with a yummy red apple. Tim wanted the apple, so he tried to reach it. But the apple was too high up. Tim was sad.\nJust then, Tim heard a voice. The voice was coming from the tree! The tree could talk! The tree said, \"Hello Tim, I can help you get the yummy apple.\" Tim was very surprised. He did not know trees could talk.\nThe tree shook its branches and the apple fell down. Tim was happy and said \"Thank you!\" to the tree. Tim took a bite of the yummy apple and shared it with the talking tree. From that day on, Tim and the talking tree were best friends.",
    "telugu_text": "ఒక రోజు, టిమ్ అనే చిన్న పిల్లాడు పార్కుకు వెళ్ళాడు. అక్కడ అతనికి ఒక పెద్ద చెట్టు కనిపించింది, దానిపై రుచికరమైన ఎర్రటి ఆపిల్ ఉంది. టిమ్కి ఆ ఆపిల్ కావాలి, కాబట్టి అతను దాన్ని అందుకోవడానికి ప్రయత్నించాడు. కానీ ఆ ఆపిల్ చాలా ఎత్తులో ఉంది. టిమ్ బాధపడ్డాడు.\nఅప్పుడే, టిమ్ ఒక స్వరాన్ని విన్నాడు. ఆ స్వరం చెట్టు నుండి వస్తోంది! చెట్టు మాట్లాడగలదు! చెట్టు అంది, \"హలో టిమ్, నేను నీకు రుచికరమైన ఆపిల్ తీసుకోవడంలో సహాయం చేయగలను.\" టిమ్ చాలా ఆశ్చర్యపోయాడు. చెట్లు మాట్లాడగలవని అతనికి తెలియదు.\nచెట్టు తన కొమ్మలను కదిలించింది, ఆపిల్ కింద పడింది. టిమ్ సంతోషపడి చెట్టుకు \"ధన్యవాదాలు!\" అన్నాడు. టిమ్ ఆ రుచికరమైన ఆపిల్ను కొరికి, మాట్లాడే చెట్టుతో పంచుకున్నాడు. ఆ రోజు నుండి, టిమ్ మరియు మాట్లాడే చెట్టు మంచి స్నేహితులు అయ్యారు."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-170",
    "english_text": "Once upon a time, there was a grumpy cat named Bob. He had blue fur and lived in a big, cozy house. Bob liked to play with his toys, but sometimes he would get very grumpy.\nOne day, Bob saw a big, blue ball in his room. He wanted to play with it, but it was too big for him to hold. He tried and tried, but he just couldn't hold it in his paws. Bob became very grumpy.\nThen, a little girl named Sue came to visit. She saw Bob and the big, blue ball. Sue picked up the ball and gave it to Bob. They played together all day, and Bob wasn't grumpy anymore.",
    "telugu_text": "ఒకప్పుడు, బాబ్ అనే చిరాకుపడే పిల్లి ఉండేది. దాని బొచ్చు నీలం రంగులో ఉండేది, అది ఒక పెద్ద, హాయిగా ఉండే ఇంట్లో నివసించేది. బాబ్ తన బొమ్మలతో ఆడుకోవడం అంటే ఇష్టం, కానీ కొన్నిసార్లు అది చాలా చిరాకు పడేది.\nఒక రోజు, బాబ్ తన గదిలో ఒక పెద్ద, నీలం రంగు బంతిని చూసింది. అది దానితో ఆడుకోవాలని అనుకుంది, కానీ అది దాని చేతుల్లో పట్టుకోడానికి చాలా పెద్దదిగా ఉంది. అది ప్రయత్నించింది, ప్రయత్నించింది, కానీ అది దాని పావులతో పట్టుకోలేకపోయింది. బాబ్ చాలా చిరాకు పడింది.\nఅప్పుడు, సూ అనే ఒక చిన్న అమ్మాయి రావడం వచ్చింది. ఆమె బాబ్ను, ఆ పెద్ద, నీలం బంతిని చూసింది. సూ ఆ బంతిని తీసుకుని బాబ్కు ఇచ్చింది. వాళ్ళు రోజంతా కలిసి ఆడుకున్నారు, మరియు బాబ్ మళ్ళీ చిరాకు పడలేదు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-189",
    "english_text": "Once upon a time, there was a little girl named Mia. Mia had a nosy cat named Tom. One day, Mia lost her sock. She looked everywhere for it, but she could not find it. Mia was sad and she frowned.\nMia asked Tom, \"Have you seen my sock?\" Tom shook his head. He wanted to help Mia. So, they both looked for the sock together. They looked under the bed, behind the door, and inside the toy box.\nFinally, Tom found the sock under the table. He gave it to Mia. Mia was happy and said, \"Thank you, Tom!\" Tom was happy too. Mia and Tom played with the sock and had lots of fun.",
    "telugu_text": "ఒకప్పుడు, మియా అనే ఒక చిన్న అమ్మాయి ఉండేది. మియాకి టామ్ అనే ఒక చిలిపి పిల్లి ఉండేది. ఒక రోజు, మియా తన సాక్సును పోగొట్టుకుంది. అది ఎక్కడో వెతకడం, కానీ దొరకలేదు. మియా బాధపడింది మరియు ముఖం చిట్లించింది.\nమియా టామ్కి, \"నా సాక్సు చూశావా?\" టామ్ తల ఊపింది. అతను మియాకి సహాయం చేయాలనుకున్నాడు. కాబట్టి, వాళ్లిద్దరూ కలిసి సాక్సు కోసం వెతికారు. వాళ్ళు మంచం కింద, తలుపు వెనుక, మరియు బొమ్మ పెట్టెలో చూశారు.\nచివరికి, టామ్ టేబుల్ కింద సాక్సును కనుగొన్నాడు. అతను దాన్ని మియాకి ఇచ్చాడు. మియా సంతోషంగా, \"ధన్యవాదాలు, టామ్!\" అంది. టామ్ కూడా సంతోషపడ్డాడు. మియా మరియు టామ్ సాక్సుతో ఆడుకున్నారు మరియు చాలా సరదాగా గడిపారు."
   }
