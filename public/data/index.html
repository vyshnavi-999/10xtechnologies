    "item_id": "T-052",
    "english_text": "Once upon a time, there was a little pilot who had a small red plane. He loved to fly high in the sky and make people happy.\nOne day, the little pilot saw a baby bug who needed help. The bug was trying to crawl up a big hill, but it was too hard for him. The little pilot wanted to help the bug, so he put on his serious face and thought of a plan.\nThe pilot got some string and tied it to his plane. He flew down to the bug and tied the other end of the string to the bug. Then, the pilot flew up high and pulled the bug up the hill. The bug was so happy and thanked the little pilot. They became best friends and played together every day.",
    "telugu_text": "ఒకప్పుడు, ఒక చిన్న పైలట్ ఉండేవాడు, అతనికి ఒక చిన్న ఎర్రటి విమానం ఉండేది. అతనికి ఆకాశంలో ఎత్తుకు ఎగరడం, ప్రజలను సంతోషపెట్టడం అంటే చాలా ఇష్టం.\nఒక రోజు, ఆ చిన్న పైలట్ ఒక చిన్న కీటకాన్ని చూశాడు, దానికి సహాయం అవసరం. ఆ కీటకం ఒక పెద్ద కొండపైకి పాకడానికి ప్రయత్నిస్తోంది, కానీ అది అతనికి చాలా కష్టంగా ఉంది. ఆ చిన్న పైలట్ ఆ కీటకానికి సహాయం చేయాలనుకున్నాడు, కాబట్టి అతను సీరియస్ ముఖం పెట్టుకుని ఒక ప్రణాళిక వేసుకున్నాడు.\nపైలట్కు ఒక దారం దొరికింది, దానిని తన విమానానికి కట్టాడు. అతను కీటకం దగ్గరకు ఎగిరి, దారం యొక్క మరొక చివరను కీటకానికి కట్టాడు. అప్పుడు, పైలట్ చాలా ఎత్తుకు ఎగిరి, ఆ కీటకాన్ని కొండపైకి లాగాడు. ఆ కీటకం చాలా సంతోషించి, చిన్న పైలట్కు కృతజ్ఞతలు చెప్పింది. వాళ్ళు మంచి స్నేహితులయ్యారు, ప్రతిరోజూ కలిసి ఆడుకున్నారు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-163",
    "english_text": "One day, a boy named Tim wanted to borrow a toy aeroplane from his friend, Sam. Sam said yes, and Tim was very happy. He could not wait to play with the aeroplane.\nTim took the aeroplane outside and made it fly high in the sky. He made it go up and down, and around in big circles. Tim was having a lot of fun with the aeroplane.\nAfter playing for a long time, Tim gave the aeroplane back to Sam. They both smiled and said they had a great day. Tim and Sam were very good friends who liked to share their toys.",
    "telugu_text": "ఒక రోజు, టిమ్ అనే అబ్బాయి తన స్నేహితుడు సామ్ నుండి ఒక బొమ్మ విమానాన్ని అప్పుగా తీసుకోవాలనుకున్నాడు. సామ్ ఒప్పుకున్నాడు, టిమ్ చాలా సంతోషించాడు. అతను ఆ విమానంతో ఆడుకోవడానికి వేచి ఉండలేకపోయాడు.\nటిమ్ ఆ విమానాన్ని బయటకు తీసుకుని ఆకాశంలో చాలా ఎత్తుకు ఎగరవేసాడు. అది పైకి, కిందకి వెళ్ళింది, పెద్ద వృత్తాలలో తిరిగింది. టిమ్ ఆ విమానంతో చాలా సరదాగా గడిపాడు.\nచాలా సేపు ఆడుకున్న తర్వాత, టిమ్ ఆ విమానాన్ని సామ్కి తిరిగి ఇచ్చాడు. వాళ్లిద్దరూ నవ్వుకున్నారు, వారు గొప్ప రోజు గడిపారని చెప్పారు. టిమ్ మరియు సామ్ చాలా మంచి స్నేహితులు, వాళ్ళిద్దరూ తమ బొమ్మలను పంచుకోవడానికి ఇష్టపడేవారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-061",
    "english_text": "One day, a cute little cat went to play with her friend, the dog. They liked to run and jump in the park. The sun was shining and the birds were singing. The cat and dog were very happy.\nThe cat saw a big red ball and said, \"Let's play with the ball!\" The dog agreed, and they took turns pushing the ball with their noses. They laughed and had lots of fun.\nBut then, the cat tried to jump on the ball and fell down. The dog said, \"Are you okay?\" The cat felt embarrass, but she got up and said, \"Yes, I am okay. Thank you.\" They gave each other a friendly touch and continued to play with the ball, enjoying their day in the park.",
    "telugu_text": "ఒక రోజు, ఒక ముద్దుల చిన్న పిల్లి తన స్నేహితుడైన కుక్కతో ఆడుకోవడానికి వెళ్ళింది. అవి పార్కులో పరుగెత్తడానికి, దూకడానికి ఇష్టపడ్డాయి. సూర్యుడు ప్రకాశిస్తున్నాడు, పక్షులు పాటలు పాడుతున్నాయి. పిల్లి, కుక్క చాలా సంతోషంగా ఉన్నాయి.\nపిల్లికి ఒక పెద్ద ఎర్రటి బంతి కనిపించింది, అది \"బంతితో ఆడుకుందాం!\" అంది. కుక్క అంగీకరించింది, వాళ్ళు తమ ముక్కులతో బంతిని నెట్టడానికి వంతులు తీసుకున్నారు. వాళ్ళు నవ్వారు, చాలా సరదాగా గడిపారు.\nకానీ అప్పుడు, పిల్లి బంతిపైకి దూకడానికి ప్రయత్నించింది, కింద పడిపోయింది. కుక్క \"నువ్వు బాగా ఉన్నావా?\" అంది. పిల్లి సిగ్గుపడింది, కానీ లేచి \"అవును, నేను బాగానే ఉన్నాను. ధన్యవాదాలు\" అంది. అవి ఒకరినొకరు స్నేహపూర్వకంగా తాకి, బంతితో ఆడుకోవడం కొనసాగించాయి, పార్కులో తమ రోజును ఆనందిశాయి."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-159",
    "english_text": "One day, a little girl named Mia went to the park with her mom. Mia saw a big seat. She wanted to sit on it, but it was too high. Mia's mom said, \"If you can climb up and sit on the seat, you will get a reward.\"\nMia tried to climb up, but she was not calm. She was scared. Her mom told her, \"Take a deep breath and be calm. You can do it!\" Mia took a deep breath and tried again. This time, she was calm and climbed up the seat.\nMia was so happy she made it on the seat. Her mom was proud of her. She gave Mia a reward - a big, yummy ice cream cone. Mia and her mom had a great day at the park.",
    "telugu_text": "ఒక రోజు, మియా అనే చిన్న అమ్మాయి తన అమ్మతో పార్కుకు వెళ్ళింది. మియా ఒక పెద్ద కుర్చీని చూసింది. ఆమె దానిపై కూర్చోవాలని అనుకుంది, కానీ అది చాలా ఎత్తుగా ఉంది. మియా అమ్మ అంది, \"నువ్వు పైకి ఎక్కి కూర్చోగలిగితే, నీకు బహుమతి వస్తుంది.\"\nమియా పైకి ఎక్కడానికి ప్రయత్నించింది, కానీ ఆమె ప్రశాంతంగా లేదు. ఆమె భయపడింది. ఆమె అమ్మ ఆమెకు చెప్పింది, \"ఒక లోతైన శ్వాస తీసుకో, ప్రశాంతంగా ఉండు. నువ్వు చేయగలవు!\" మియా ఒక లోతైన శ్వాస తీసుకుని మళ్ళీ ప్రయత్నించింది. ఈసారి, ఆమె ప్రశాంతంగా ఉండి కుర్చీపైకి ఎక్కింది.\nమియా కుర్చీపై కూర్చొని చాలా సంతోషించింది. ఆమె అమ్మ ఆమెను గర్వపడింది. ఆమె మియాకు ఒక బహుమతి ఇచ్చింది - ఒక పెద్ద, రుచికరమైన ఐస్ క్రీమ్ కోన్. మియా మరియు ఆమె అమ్మ పార్కులో అద్భుతమైన రోజు గడిపారు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-065",
    "english_text": "One day, a little girl named True went for a walk. She wanted to meet new friends. She walked and walked until she saw something big and tall.\nTrue saw an impressive tree. It was very big and had many leaves. She said \"hello\" to the tree. The tree did not talk, but True felt happy. She liked the tree a lot. She wanted to be friends with the tree.\nEvery day, True would visit the impressive tree. They would play together. True would hide behind the tree and then jump out. True and the tree were very good friends. And that is how True met her impressive tree friend.",
    "telugu_text": "ఒక రోజు, ట్రూ అనే చిన్న అమ్మాయి నడవడానికి వెళ్ళింది. ఆమె కొత్త స్నేహితులను కలవాలనుకుంది. ఆమె నడిచింది, నడిచింది, అప్పుడు ఒక పెద్ద, ఎత్తైన దానిని చూసింది.\nట్రూ ఒక అద్భుతమైన చెట్టును చూసింది. అది చాలా పెద్దదిగా ఉంది, చాలా ఆకులు ఉన్నాయి. ఆమె చెట్టుకు \"హలో\" అంది. చెట్టు మాట్లాడలేదు, కానీ ట్రూ సంతోషంగా అనిపించింది. ఆమెకు ఆ చెట్టు చాలా నచ్చింది. ఆమె ఆ చెట్టుతో స్నేహం చేయాలనుకుంది.\nప్రతి రోజు, ట్రూ ఆ అద్భుతమైన చెట్టును సందర్శించేది. వారు కలిసి ఆడుకునేవారు. ట్రూ చెట్టు వెనుక దాక్కుని, ఆపై దూకి వచ్చేది. ట్రూ మరియు ఆ చెట్టు చాలా మంచి స్నేహితులు. అలా ట్రూ తన అద్భుతమైన చెట్టు స్నేహితురాలిని కలుసుకుంది."
   }

  "TB11": [
   {
    "order_in_batch": 1,
    "item_id": "T-172",
    "english_text": "One day, a little boy named Tim went to play outside. He saw a big black box. It was incredible! He wanted to open it, but his mom said, \"Resist, Tim! It might be dangerous.\"\nTim was sad, but he listened to his mom. He went to play with his ball. But then, something unexpected happened. The black box started to shake and make noise. Tim and his mom looked at the box, scared.\nSuddenly, the black box opened, and out came a big, friendly dog! The dog wagged its tail and said, \"Hello, Tim! I am a talking dog! Let's be friends!\" Tim and his mom were very surprised but happy. They all played together and had lots of fun.",
    "telugu_text": "ఒక రోజు, టిమ్ అనే చిన్న పిల్లాడు బయట ఆడుకోవడానికి వెళ్ళాడు. అతను ఒక పెద్ద నల్ల పెట్టెను చూశాడు. అది అద్భుతంగా ఉంది! అతను దానిని తెరవాలని అనుకున్నాడు, కానీ అతని అమ్మ, \"నిలబడు, టిమ్! అది ప్రమాదకరం కావచ్చు,\" అంది.\nటిమ్ బాధపడ్డాడు, కానీ అతను తన అమ్మ మాట విన్నాడు. అతను తన బాల్తో ఆడుకోవడానికి వెళ్ళాడు. కానీ అప్పుడు, ఏదో ఊహించనిది జరిగింది. ఆ నల్ల పెట్టె కదలడం మొదలుపెట్టి శబ్దం చేసింది. టిమ్ మరియు అతని అమ్మ భయంతో ఆ పెట్టె వైపు చూశారు.\nఅకస్మాత్తుగా, ఆ నల్ల పెట్టె తెరుచుకుంది, మరియు ఒక పెద్ద, స్నేహపూర్వక కుక్క బయటకు వచ్చింది! కుక్క తన తోకను ఊపింది మరియు, \"హలో, టిమ్! నేను మాట్లాడే కుక్కని! మనం స్నేహితులమైదాం!\" అంది. టిమ్ మరియు అతని అమ్మ చాలా ఆశ్చర్యపోయారు కానీ సంతోషంగా ఉన్నారు. వాళ్ళు అందరూ కలిసి ఆడుకున్నారు మరియు చాలా సరదాగా గడిపారు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-089",
    "english_text": "Once upon a time, there was a smart little dog named Max. Max loved to eat. One day, he saw a big cake on the table. He thought, \"I want to eat that cake!\"\nMax tried to reach the cake, but he was too small. He asked his friend, a bird named Tim, \"Can you help me get the cake?\" Tim said, \"Yes, but we may get in trouble.\" Max did not listen and said, \"Please help me.\"\nSo, Tim helped Max reach the cake. They both ate the cake and it was very yummy. But soon, Mom came and saw the mess. She said, \"Max and Tim, you are in trouble for eating the cake!\" Max and Tim felt bad for what they did.\nThe moral of the story is to always listen to your friends and not do things that can get you in trouble.",
    "telugu_text": "ఒకప్పుడు, మాక్స్ అనే తెలివైన చిన్న కుక్క ఉండేది. మాక్స్ తినడానికి చాలా ఇష్టం. ఒక రోజు, అది టేబుల్పై ఒక పెద్ద కేక్ చూసింది. అది అనుకుంది, \"నేను ఆ కేక్ తినాలి!\"\nమాక్స్ కేక్ దగ్గరకు వెళ్లడానికి ప్రయత్నించింది, కానీ అది చాలా చిన్నది. అది తన స్నేహితుడు, టిమ్ అనే పక్షిని అడిగింది, \"నువ్వు నాకు కేక్ తీయడంలో సహాయం చేయగలవా?\" టిమ్ చెప్పింది, \"అవును, కానీ మనకు ఇబ్బంది పడవచ్చు.\" మాక్స్ వినలేదు, \"దయచేసి నాకు సహాయం చెయ్యి.\"\nఅలా, టిమ్ మాక్స్ కి కేక్ అందుకోవడానికి సహాయం చేసింది. ఇద్దరూ కేక్ తిన్నారు, అది చాలా రుచిగా ఉంది. కానీ త్వరలోనే, అమ్మ వచ్చింది మరియు ఆ గందరగోళాన్ని చూసింది. ఆమె అంది, \"మాక్స్, టిమ్, కేక్ తిన్నందుకు మీ ఇద్దరికీ ఇబ్బంది!\" మాక్స్ మరియు టిమ్ తమ చేసిన దాని గురించి బాధపడ్డారు.\nఈ కథలోని నీతి ఏమిటంటే, ఎల్లప్పుడూ మీ స్నేహితులను వినండి మరియు మిమ్మల్ని ఇబ్బంది పెట్టే పనులు చేయవద్దు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-176",
    "english_text": "One day, a girl named Lily went for a walk with her dog, Max. They walked to a big park. In the park, they saw a tall pole. Lily thought it was fun to play near the pole.\nLily said to Max, \"Do you hear that? It sounds like a bird!\" Max barked and wagged his tail. They looked up and saw a small bird sitting on the pole. The bird was singing a pretty song.\nLily and Max found a fruit tree near the pole. They picked a fruit and took a bite. \"Yuck!\" said Lily, \"This fruit is sour!\" Max didn't like the sour fruit either. They laughed and continued to play near the pole, listening to the bird sing its song.",
    "telugu_text": "ఒక రోజు, లిల్లీ అనే అమ్మాయి తన కుక్క టామ్తో కలిసి నడవడానికి వెళ్ళింది. వారు ఒక పెద్ద పార్కుకు నడిచారు. పార్కులో, వారు ఒక పొడవైన స్తంభాన్ని చూశారు. లిల్లీ ఆ స్తంభం దగ్గర ఆడుకోవడం సరదాగా ఉందని అనుకుంది.\nలిల్లీ టామ్తో, \"నువ్వు వింటున్నావా? ఇది పక్షిలా వినిపిస్తోంది!\" టామ్ మొరిగింది, తోక ఊపింది. వారు పైకి చూశారు, స్తంభం మీద ఒక చిన్న పక్షి కూర్చుని ఉంది. ఆ పక్షి ఒక అందమైన పాట పాడుతోంది.\nలిల్లీ మరియు టామ్ స్తంభం దగ్గర ఒక పండ్ల చెట్టును కనుగొన్నారు. వారు ఒక పండును తీసుకుని కొరికినారు. \"అబ్బా!\" అంది లిల్లీ, \"ఈ పండు పుల్లగా ఉంది!\" టామ్ కూడా ఆ పుల్లని పండును ఇష్టపడలేదు. వారు నవ్వుకున్నారు మరియు పక్షి పాట వింటూ స్తంభం దగ్గర ఆడుకోవడం కొనసాగించారు."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-011",
    "english_text": "Once upon a time, there was a little girl named Lily. She lived in a small house with her mommy and daddy. Lily loved to play with her toys and jump high on her bed.\nOne day, Lily's mommy was making dinner in the kitchen. She asked Lily to help her. \"Lily, can you cover the pot with the lid, please?\" Lily nodded and carefully put the lid on the pot. She felt proud to help her mommy.\nAt dinner time, Lily's daddy said, \"Wow, this dinner is so yummy! Did you help mommy make it, Lily?\" Lily smiled and said, \"Yes, I covered the pot!\" They all laughed and enjoyed their dinner together.",
    "telugu_text": "ఒకప్పుడు, లిల్లీ అనే ఒక చిన్న అమ్మాయి ఉండేది. ఆమె తన అమ్మ, నాన్నతో ఒక చిన్న ఇంట్లో నివసించేది. లిల్లీ తన బొమ్మలతో ఆడుకోవడం, తన మంచం మీద ఎత్తుగా దూకడం అంటే చాలా ఇష్టం.\nఒక రోజు, లిల్లీ అమ్మ వంటగదిలో భోజనం తయారుచేస్తోంది. ఆమె లిల్లీని సహాయం చేయమని అడిగింది. \"లిల్లీ, దయచేసి కుండపై మూత పెట్టగలవా?\" లిల్లీ తల ఊపి, జాగ్రత్తగా కుండపై మూత పెట్టింది. తన అమ్మకు సహాయం చేసినందుకు ఆమెకు గర్వంగా అనిపించింది.\nభోజన సమయానికి, లిల్లీ నాన్న అన్నాడు, \"వావ్, ఈ భోజనం చాలా రుచిగా ఉంది! లిల్లీ, అమ్మకు సహాయం చేసిందా?\" లిల్లీ నవ్వి, \"అవును, నేను కుండపై మూత పెట్టాను!\" వాళ్ళందరూ కలిసి నవ్వుతూ తమ భోజనాన్ని ఆనందిశారు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-119",
    "english_text": "Once upon a time, there was a little boy named Tim. Tim had an adorable dog named Spot. They loved to play in the backyard together. One sunny day, Tim and Spot were playing with a red ball.\n\"Spot, go get the ball!\" Tim said, as he threw the ball far away. Spot ran fast to get the ball and brought it back to Tim. They played like this for a long time, laughing and having fun.\nThen, Tim saw a big tree in the backyard. He wanted to climb it but was scared. Spot looked at Tim and barked, \"Woof, woof!\" Tim knew Spot was telling him to trust himself. So, Tim tried to climb the tree. With Spot watching, Tim climbed higher and higher until he reached the top. He was so happy and proud.\n\"Thank you, Spot!\" Tim said. \"I did it because I trusted myself and you.\" Spot wagged his tail and barked, \"Woof, woof!\" They both smiled and continued to play in the backyard, knowing they could trust each other no matter what. And they lived happily ever after.",
    "telugu_text": "ఒకానొకప్పుడు, టిమ్ అనే ఒక చిన్న పిల్లాడు ఉండేవాడు. టిమ్కి స్పాట్ అనే చాలా మంచి కుక్క ఉండేది. వాళ్లిద్దరూ తోటలో కలిసి ఆడుకోవడం అంటే చాలా ఇష్టం. ఒక సూర్యరశ్మి పడే రోజున, టిమ్ మరియు స్పాట్ ఒక ఎర్రటి బంతితో ఆడుకుంటున్నారు.\n\"స్పాట్, బంతిని తీసుకురా!\" అని టిమ్ బంతిని చాలా దూరం విసిరినప్పుడు అన్నాడు. స్పాట్ వేగంగా పరిగెత్తి బంతిని తీసుకువచ్చి టిమ్కి ఇచ్చింది. వాళ్ళు చాలా సేపు ఇలా ఆడుకున్నారు, నవ్వుతూ సరదాగా గడిపారు.\nఅప్పుడు, టిమ్ తోటలో ఒక పెద్ద చెట్టును చూశాడు. అతను దానిపైకి ఎక్కాలని అనుకున్నాడు కానీ భయపడ్డాడు. స్పాట్ టిమ్ని చూసి, \"వూఫ్, వూఫ్!\" అని మొరిగింది. స్పాట్ తనను తాను నమ్మమని టిమ్కి చెబుతోందని టిమ్కి అర్థమైంది. అందుకే, టిమ్ ఆ చెట్టుపైకి ఎక్కడానికి ప్రయత్నించాడు. స్పాట్ చూస్తూ, టిమ్ పైకి, పైకి ఎక్కాడు, చివరికి పైకి చేరుకున్నాడు. అతను చాలా సంతోషంగా, గర్వంగా ఉన్నాడు.\n\"ధన్యవాదాలు, స్పాట్!\" అని టిమ్ అన్నాడు. \"నేను నన్ను, నిన్ను నమ్మాను కాబట్టి నేను చేశాను.\" స్పాట్ తోక ఊపుతూ, \"వూఫ్, వూఫ్!\" అని మొరిగింది. వాళ్లిద్దరూ నవ్వుతూ తోటలో ఆడుకోవడం కొనసాగించారు, ఏమైనా జరిగినా ఒకరినొకరు నమ్మవచ్చని తెలుసుకున్నారు. వాళ్ళు సంతోషంగా ఆనందంగా జీవించారు."
   }

  "TB12": [
   {
    "order_in_batch": 1,
    "item_id": "T-104",
    "english_text": "Once upon a time, in a big green forest, there lived a little deer. The deer had a lot of friends. They liked to play and run all day. The sun was always shining, and the birds were always singing.\nOne day, the deer was running fast and did not see a big stick. The deer stepped on the stick and heard a loud \"snap\". The deer felt hurt and could not walk well. It was sad and did not want to play anymore.\nThe deer's friends saw it was hurt and wanted to help. They brought soft leaves and wrapped them around the deer's leg. Soon, the deer started to feel better. It was happy and could play again. The deer and its friends played all day, and they were all very happy.",
    "telugu_text": "ఒకప్పుడు, ఒక పెద్ద పచ్చని అడవిలో, ఒక చిన్న జింక ఉండేది. ఆ జింకకు చాలా స్నేహితులు ఉండేవి. వాళ్ళు రోజంతా ఆడుకోవడానికి, పరిగెత్తడానికి ఇష్టపడేవారు. సూర్యుడు ఎప్పుడూ ప్రకాశిస్తూ ఉండేవాడు, పక్షులు ఎప్పుడూ పాటలు పాడుతూ ఉండేవి.\nఒక రోజు, జింక వేగంగా పరిగెడుతోంది, పెద్ద కర్రను చూడలేదు. జింక ఆ కర్రపై అడుగు పెట్టి పెద్ద \"టప్\" అనే శబ్దం వింది. జింకకు నొప్పిగా అనిపించి, బాగా నడవలేకపోయింది. అది విచారంగా ఉండి, మళ్లీ ఆడుకోవాలని అనుకోలేదు.\nజింక స్నేహితులు అది గాయపడినట్లు చూసి, సహాయం చేయాలని అనుకున్నారు. వాళ్ళు మెత్తని ఆకులను తీసుకువచ్చి, వాటిని జింక కాలికి చుట్టారు. త్వరలోనే, జింకకు మంచిగా అనిపించింది. అది సంతోషంగా ఉండి మళ్లీ ఆడగలిగింది. జింక మరియు దాని స్నేహితులు రోజంతా ఆడుకున్నారు, వాళ్ళందరూ చాలా సంతోషంగా ఉన్నారు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-157",
    "english_text": "Once upon a time, in a great big park, there were pretty flowers that bloom. A little boy named Timmy loved to play near the flowers. He liked to watch them grow and bloom. They were so pretty and colorful.\nOne day, Timmy was playing near the flowers when he saw a big red ambulance. The ambulance was very loud and had bright lights. Timmy was curious and wanted to see what was happening. He ran towards the ambulance, leaving the pretty flowers behind.\nAs Timmy got closer to the ambulance, he tripped and fell. He was hurt and started to cry. The ambulance had to leave to help someone else, and Timmy was left all alone. He missed the pretty flowers that bloom and wished he had stayed with them.",
    "telugu_text": "ఒకప్పుడు, ఒక పెద్ద పార్కులో, అందమైన పువ్వులు వికసించేవి. టిమ్మి అనే చిన్న పిల్లాడికి పువ్వుల దగ్గర ఆడుకోవడం అంటే చాలా ఇష్టం. అవి పెరగడం, వికసించడం చూడటానికి అతనికి నచ్చేది. అవి చాలా అందంగా, రంగురంగులవి.\nఒక రోజు, టిమ్మి పువ్వుల దగ్గర ఆడుకుంటున్నప్పుడు, అతను ఒక పెద్ద ఎర్రటి ఆంబులెన్స్ను చూశాడు. ఆ ఆంబులెన్స్ చాలా పెద్ద శబ్దంతో ఉంది, మరియు ప్రకాశవంతమైన లైట్లు ఉన్నాయి. టిమ్మికి ఆసక్తి కలిగింది, ఏమి జరుగుతుందో చూడాలనిపించింది. అతను అందమైన పువ్వులను వదిలేసి ఆ ఆంబులెన్స్ వైపు పరుగెత్తాడు.\nటిమ్మి ఆ ఆంబులెన్స్కు దగ్గరగా వెళ్ళేసరికి, అతను తడబడి పడిపోయాడు. అతనికి గాయమైంది మరియు ఏడవడం మొదలుపెట్టాడు. ఆ ఆంబులెన్స్ వేరే వాడికి సహాయం చేయడానికి వెళ్ళవలసి వచ్చింది, మరియు టిమ్మి ఒంటరిగా మిగిలిపోయాడు. వికసించే అందమైన పువ్వులను అతను కోల్పోయాడు మరియు వారితోనే ఉండాలని కోరుకున్నాడు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-078",
    "english_text": "One day, a wise dog named Buddy was playing in the park. He saw a cable on the ground. Buddy was very curious, so he picked it up with his mouth.\nA little girl named Lily saw Buddy with the cable. She said, \"Hey, that's my cable! Please give it back!\" Buddy felt bad and gave the cable back to Lily. He said, \"I'm sorry, I didn't know it was yours.\"\nLily looked at Buddy and said, \"It's okay, I forgive you. Thank you for giving it back.\" Buddy was happy that Lily forgave him. They became friends and played together in the park every day.",
    "telugu_text": "ఒక రోజు, బడ్డీ అనే తెలివైన కుక్క పార్కులో ఆడుకుంటున్నాడు. నేలపై ఒక కేబుల్ చూశాడు. బడ్డీ చాలా ఆసక్తిగా ఉన్నాడు, అందుకే దాన్ని తన నోటితో తీసుకున్నాడు.\nలిల్లీ అనే చిన్న అమ్మాయి కేబుల్తో ఉన్న బడ్డీని చూసింది. ఆమె అంది, \"హేయ్, అది నా కేబుల్! దయచేసి నాకు తిరిగి ఇవ్వు!\" బడ్డీకి బాధగా అనిపించి, కేబుల్ను లిల్లీకి తిరిగి ఇచ్చాడు. అతను, \"సారీ, అది నీదో నాకు తెలియలేదు,\" అన్నాడు.\nలిల్లీ బడ్డీని చూసి అంది, \"పర్వాలేదు, నేను నీకు క్షమించాను. దాన్ని తిరిగి ఇచ్చినందుకు ధన్యవాదాలు.\" లిల్లీ తనను క్షమించాడనందుకు బడ్డీ సంతోషించాడు. వాళ్ళు స్నేహితులయ్యారు, ప్రతిరోజూ పార్కులో కలిసి ఆడుకున్నారు."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-040",
    "english_text": "Once upon a time, there was a big sink in a small house. The sink was full of water. A little duck named Ducky lived in the house. Ducky loved to play in the sink. He would jump in and splash water all around.\nOne day, a rude cat named Kitty came to the house. Kitty saw Ducky playing in the sink. Kitty wanted to play too. But Kitty did not like water. So, Kitty tried to push Ducky out of the sink. Ducky did not want to leave the sink.\nDucky had an idea. He splashed water on Kitty. Kitty did not like the water. Kitty ran away from the sink. Ducky was happy. He could play and splash in the sink again. And Kitty learned not to be rude to others.",
    "telugu_text": "ఒకప్పుడు, ఒక చిన్న ఇంట్లో పెద్ద సింక్ ఉండేది. ఆ సింక్లో నీళ్లు నిండి ఉన్నాయి. డకీ అనే చిన్న ఆవుల పిల్ల ఆ ఇంట్లో ఉండేది. డకీకి సింక్లో ఆడుకోవడం అంటే చాలా ఇష్టం. అది దూకి, నీటిని అన్ని వైపులా చిమ్ముతూ ఆడుకునేది.\nఒక రోజు, కిట్టి అనే అల్లరి పిల్లి ఆ ఇంటికి వచ్చింది. కిట్టి సింక్లో ఆడుకుంటున్న డకీని చూసింది. కిట్టి కూడా ఆడుకోవాలని అనుకుంది. కానీ కిట్టికి నీళ్లు నచ్చలేదు. అందుకే, కిట్టి డకీని సింక్ నుండి బయటకు నెట్టడానికి ప్రయత్నించింది. డకీ సింక్ నుండి బయటకు వెళ్లడానికి ఇష్టపడలేదు.\nడకీకి ఒక ఆలోచన వచ్చింది. అది కిట్టిపై నీళ్లు చిమ్మింది. కిట్టికి నీళ్లు నచ్చలేదు. కిట్టి సింక్ నుండి పారిపోయింది. డకీ సంతోషపడింది. అది మళ్లీ సింక్లో ఆడుకోవచ్చు, నీళ్లు చిమ్మవచ్చు. మరియు కిట్టి ఇతరులతో అల్లరి చేయకూడదని నేర్చుకుంది."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-126",
    "english_text": "Once upon a time, in a charming little house, there lived a cat named Fluffy. Fluffy loved to play with her toys and run around the house. But most of all, Fluffy loved the silence when everyone was asleep.\nOne night, when the house was very quiet, Fluffy went on an adventure. She tiptoed down the hall, her soft paws making no sound. She loved the feeling of the cool floor under her feet. Fluffy peeked into the big room and saw something new.\nIn the middle of the room, there was a big, shiny box. Fluffy was very curious. She walked closer and closer to the box, her eyes wide open. She tapped the box with her paw and heard a loud sound. Fluffy jumped back, scared. But then, she saw the box was just a toy. Fluffy loved the new toy and played with it all night long. And when the sun came up, she went back to her bed, happy and tired from her adventure.",
    "telugu_text": "ఒకానొకప్పుడు, ఒక అందమైన చిన్న ఇంట్లో, ఫలఫీ అనే పిల్లి ఉండేది. ఫలఫీ తన బొమ్మలతో ఆడుకోవడం, ఇంట్లో పరిగెత్తడం అంటే చాలా ఇష్టం. కానీ అన్నిటికంటే ఎక్కువగా, అందరూ నిద్రపోతున్నప్పుడు వచ్చే నిశ్శబ్దాన్ని ఫలఫీకి చాలా ఇష్టం.\nఒక రాత్రి, ఇల్లు చాలా నిశ్శబ్దంగా ఉన్నప్పుడు, ఫలఫీ ఒక సాహసానికి బయలుదేరింది. ఆమె మెత్తని పాదాలు ఎలాంటి శబ్దం చేయకుండా హాలులో నడిచింది. తన కాళ్ళ కింద ఉన్న చల్లని నేల అనుభూతిని ఆమెకు చాలా నచ్చింది. ఫలఫీ పెద్ద గదిలోకి తొంగి చూసింది, అక్కడ ఏదో కొత్తదానిని చూసింది.\nగది మధ్యలో, ఒక పెద్ద, మెరిసే పెట్టె ఉంది. ఫలఫీకి చాలా ఆసక్తి కలిగింది. ఆమె పెట్టె దగ్గరికి, దగ్గరికి నడిచింది, కళ్ళు పెద్దవిగా తెరిచి చూసింది. ఆమె తన పాదంతో పెట్టెను తట్టింది, పెద్ద శబ్దం వినిపించింది. ఫలఫీ భయంతో వెనక్కి దూకింది. కానీ అప్పుడు, ఆ పెట్టె కేవలం ఒక బొమ్మ అని చూసింది. ఫలఫీకి ఆ కొత్త బొమ్మ అంటే చాలా ఇష్టం, అది రాత్రంతా దానితో ఆడింది. సూర్యుడు ఉదయిస్తున్నప్పుడు, ఆమె తన పడక దగ్గరికి వెళ్లింది, తన సాహసం వల్ల సంతోషంగా, అలసిపోయి."
   }

  "TB13": [
   {
    "order_in_batch": 1,
    "item_id": "T-021",
    "english_text": "Once upon a time, in a big red barn, there lived a pretty bird. The bird was very attractive with bright colors. It could sing nice songs too. All the animals in the barn loved to listen to the bird sing.\nOne day, the bird saw the animals clap for another animal. The bird wanted the animals to clap for it too. So, the bird tried to sing louder and jump higher. It wanted to be the best.\nBut the bird tried too hard. It jumped so high that it hit its head on the barn roof. The bird fell down and could not sing anymore. The animals were sad. The moral of the story is not to try too hard to be the best, or you might get hurt.",
    "telugu_text": "ఒకప్పుడు, ఒక పెద్ద ఎర్రటి గిడ్డంగిలో, ఒక అందమైన పక్షి ఉండేది. ఆ పక్షి చాలా ఆకర్షణీయంగా ఉండేది, ప్రకాశవంతమైన రంగులతో. అది మంచి పాటలు కూడా పాడేది. గిడ్డంగిలోని జంతువులన్నీ ఆ పక్షి పాట వినడానికి ఇష్టపడేవి.\nఒక రోజు, ఆ పక్షి జంతువులు వేరే జంతువు కోసం చప్పట్లు కొట్టడం చూసింది. ఆ పక్షి కూడా జంతువులు తన కోసం చప్పట్లు కొట్టాలని అనుకుంది. అందుకే, పక్షి గట్టిగా పాడటానికి ప్రయత్నించింది, ఇంకా ఎత్తుగా దూకడానికి ప్రయత్నించింది. అది ఉత్తమమైనది కావాలని కోరుకుంది.\nకానీ పక్షి చాలా కష్టపడింది. అది చాలా ఎత్తుకు దూకింది, దాని తల గిడ్డంగి పైకప్పుపై తగిలింది. పక్షి కింద పడిపోయింది, ఇక పాడలేకపోయింది. జంతువులు విచారంగా ఉన్నాయి. ఈ కథలోని నీతి ఏమిటంటే, ఉత్తమమైనది కావడానికి చాలా కష్టపడకూడదు, లేదంటే గాయపడవచ్చు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-133",
    "english_text": "Once upon a time, there was a family who celebrated the summertime. They got ready and went outside to enjoy the sun.\nThe father looked up at the sky and said, “Let’s put down this blanket and celebrate!”\nThe mother said, “Yes! Everyone find a spot to sit down.”\nThe little sister said, “Oh, I see a pretty flower!”\nThe little brother said, “I want to show you my new shoes. Look! They have attractive toes!”\nEveryone was so happy and they celebrated nature and the summer sunshine. They played tag, ran and laughed until it was time to go.\nThey all hugged each other and the father said, “It was great to celebrate with you all!”",
    "telugu_text": "ఒకానొకప్పుడు, ఒక కుటుంబం వేసవిని జరుపుకుంది. వారు సిద్ధమై బయటకు వెళ్లి సూర్యుడిని ఆస్వాదించడానికి వెళ్లారు.\nతండ్రి ఆకాశం వైపు చూసి, \"ఈ దుప్పటిని పక్కన పెట్టి వేడుకుందాం!\" అన్నారు.\nతల్లి, \"అవును! అందరూ కూర్చునే చోటు కనుక్కోండి.\" అన్నారు.\nచిన్న చెల్లి, \"ఓహ్, నాకు ఒక అందమైన పువ్వు కనిపించింది!\" అంది.\nచిన్న తమ్ముడు, \"నేను నీకు నా కొత్త బూట్లు చూపించాలనుకుంటున్నాను. చూడు! వాటి వేళ్లు చాలా ఆకర్షణీయంగా ఉన్నాయి!\" అన్నాడు.\nఅందరూ చాలా సంతోషంగా ఉండి, ప్రకృతిని, వేసవి సూర్యరశ్మిని జరుపుకున్నారు. వారు ట్యాగ్ గేమ్ ఆడుకున్నారు, పరిగెత్తారు, నవ్వారు, వెళ్లవలసిన సమయం వరకు.\nఅందరూ ఒకరినొకరు కౌగిలించుకున్నారు, తండ్రి, \"మీ అందరితో కలిసి వేడుక చేసుకోవడం చాలా బాగుంది!\" అన్నారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-123",
    "english_text": "Once upon a time, there was a big stage. On the stage, there were many animals. They were getting ready for a show. One animal was very bossy. His name was Lion. He told everyone what to do. The other animals did not like it, but they did what he said.\nOne day, a little mouse came to the stage. He wanted to be in the show too. The bossy Lion said, \"No, you are too small.\" The little mouse was sad but did not go away. He stayed and watched.\nThe day of the show came. The bossy Lion was not ready. He needed more time. He told the other animals to delay the show. They did not want to listen to him anymore. They started the show without him. The little mouse saw the bossy Lion was sad. He went to help him. The bossy Lion was surprised and said, \"Thank you.\"\nThe show went on, and the little mouse was now part of it. But the bossy Lion was left out. He did not get to be in the show. The other animals were happy without him. The bossy Lion learned that being bossy is not good.",
    "telugu_text": "ఒకప్పుడు, ఒక పెద్ద వేదిక ఉండేది. ఆ వేదికపై చాలా జంతువులు ఉండేవి. అవి ఒక ప్రదర్శన కోసం సిద్ధమవుతున్నాయి. ఒక జంతువు చాలా అహంకారిగా ఉండేది. దాని పేరు సింహం. అది అందరికీ ఏమి చేయాలో చెప్పేది. మిగతా జంతువులు దానిని ఇష్టపడలేదు, కానీ అది చెప్పినట్లు చేశాయి.\nఒక రోజు, ఒక చిన్న ఎలుక వేదికపైకి వచ్చింది. అది కూడా ప్రదర్శనలో పాల్గొనాలని అనుకుంది. అహంకారి సింహం, \"వద్దు, నువ్వు చాలా చిన్నవాడివి,\" అంది. చిన్న ఎలుక బాధపడింది కానీ వెళ్ళలేదు. అది ఉండి చూసింది.\nప్రదర్శన రోజు వచ్చింది. అహంకారి సింహం సిద్ధంగా లేదు. దానికి ఇంకా సమయం కావాలి. అది మిగతా జంతువులకు ప్రదర్శనను ఆలస్యం చేయమని చెప్పింది. అవి ఇక దాని మాట వినడానికి ఇష్టపడలేదు. అవి దాని లేకుండా ప్రదర్శన మొదలుపెట్టాయి. చిన్న ఎలుక అహంకారి సింహం బాధగా ఉందని చూసింది. అది సహాయం చేయడానికి వెళ్లింది. అహంకారి సింహం ఆశ్చర్యపోయి, \"ధన్యవాదాలు,\" అంది.\nప్రదర్శన కొనసాగింది, మరియు చిన్న ఎలుక ఇప్పుడు దానిలో భాగమైంది. కానీ అహంకారి సింహం బయటపడింది. అది ప్రదర్శనలో పాల్గొనలేకపోయింది. దాని లేకుండా మిగతా జంతువులు సంతోషంగా ఉన్నాయి. అహంకారి సింహం అహంకారం మంచిది కాదని నేర్చుకుంది."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-161",
    "english_text": "Once upon a time, there was a little girl named Sue. Sue loved to go for a walk with her dog, Spot. They would go to the park and play. One day, Sue wanted to be very organized. She made a list of things to do before their walk.\nSue started to worry when she could not find Spot's leash. She looked everywhere. She looked under the bed, behind the couch, and in the closet. Sue was sad and did not know what to do. She wanted to go for a walk, but she needed the leash.\nThen, Sue remembered where she last saw the leash. It was in the kitchen! Sue ran to the kitchen and found the leash. She was so happy. Sue and Spot went for their walk and had a great time. From that day on, Sue always put the leash in the same place so she would not worry again.",
    "telugu_text": "ఒకప్పుడు, సూ అనే ఒక చిన్న అమ్మాయి ఉండేది. సూ తన కుక్క స్పాట్ తో నడవడానికి చాలా ఇష్టపడేది. వాళ్ళు పార్కుకి వెళ్లి ఆడుకునేవారు. ఒక రోజు, సూ చాలా చక్కగా ఉండాలని అనుకుంది. వాళ్ళ నడకకు ముందు చేయవలసిన వాటి జాబితా తయారు చేసింది.\nస్పాట్ లీష్ ఎక్కడ ఉందో దొరకనప్పుడు సూ కంగారు పడటం మొదలుపెట్టింది. ఆమె అన్ని చోట్లా చూసింది. మంచం కింద, సోఫా వెనుక, మరియు అల్మారంలో చూసింది. సూ బాధపడింది మరియు ఏమి చేయాలో తెలియలేదు. ఆమె నడవడానికి వెళ్లాలనుకుంది, కానీ ఆమెకు లీష్ అవసరం.\nఅప్పుడు, సూ చివరిసారి లీష్ ఎక్కడ చూశారో గుర్తు చేసుకుంది. అది వంటగదిలో ఉంది! సూ వంటగదికి పరిగెత్తి లీష్ దొరికేసింది. ఆమె చాలా సంతోషించింది. సూ మరియు స్పాట్ వారి నడకకు వెళ్లారు మరియు చాలా సరదాగా గడిపారు. ఆ రోజు నుండి, సూ ఎప్పుడూ లీష్ను ఒకే చోట పెట్టింది, తద్వారా ఆమె మళ్లీ కంగారు పడదు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-165",
    "english_text": "One day, a little boy named Tim went on a safari with his mom and dad. They saw many animals like big elephants, tall giraffes, and fast zebras. Tim was very happy to see all the animals.\nAs they were walking, they saw a fierce lion. The lion roared loudly. Tim asked his mom, \"Why is the lion so loud and fierce?\" His mom answered, \"The lion is the king of the jungle. He is strong and protects his family.\"\nTim, his mom, and his dad continued their safari adventure. They saw more animals and took many pictures. At the end of the day, they went home with big smiles, happy to have seen all the amazing animals.",
    "telugu_text": "ఒక రోజు, టిమ్ అనే చిన్న పిల్లాడు తన అమ్మ, నాన్నతో కలిసి జంతు ప్రయాణానికి వెళ్ళాడు. వాళ్ళు పెద్ద ఏనుగులు, పొడవైన జింకలు, మరియు వేగంగా పరుగెత్తే జెబ్రా వంటి చాలా జంతువులను చూశారు. టిమ్ అన్ని జంతువులను చూసి చాలా సంతోషించాడు.\nవాళ్ళు నడుస్తున్నప్పుడు, వాళ్ళు ఒక భయంకరమైన సింహాన్ని చూశారు. సింహం పెద్దగా గర్జించింది. టిమ్ తన అమ్మను అడిగాడు, \"సింహం ఎందుకు అంత పెద్దగా, భయంకరంగా అరుస్తోంది?\" అతని అమ్మ సమాధానం చెప్పింది, \"సింహం అడవికి రాజు. అది బలంగా ఉంటుంది మరియు తన కుటుంబాన్ని కాపాడుతుంది.\"\nటిమ్, అతని అమ్మ, మరియు అతని నాన్న వారి జంతు ప్రయాణ సాహసాన్ని కొనసాగించారు. వాళ్ళు మరిన్ని జంతువులను చూశారు మరియు చాలా ఫోటోలు తీసుకున్నారు. ఆ రోజు చివర్లో, వాళ్ళు పెద్ద నవ్వులతో ఇంటికి వెళ్లారు, అన్ని అద్భుతమైన జంతువులను చూసి సంతోషంగా ఉన్నారు."
   }
  ],
  "TB14": [
   {
    "order_in_batch": 1,
    "item_id": "T-142",
    "english_text": "Once upon a time, there was a little boy named Tim. He lived in a small house with his mom and dad. Tim was a slow boy, but he loved to play and have fun.\nOne day, Tim's mom was cooking in the kitchen. She told Tim, \"Wait here, I need to go to the store. Don't touch the hot stove, it can burn you.\" Tim said, \"Okay, Mom, I will wait.\" But Tim was curious about the stove and wanted to see how it worked.\nWhile Tim's mom was at the store, Tim went to the stove and touched it. \"Ouch!\" he cried. His hand burned, and he was very sad. Just then, his mom came back and saw what happened. She said, \"Tim, I told you to wait and not touch the stove!\" Tim replied, \"I'm sorry, Mom. I just wanted to see how it worked.\"\nTim's mom took care of his burn and told him, \"Next time, listen to me when I tell you to wait. It's for your own safety.\" Tim learned his lesson and never touched the hot stove again.",
    "telugu_text": "ఒకప్పుడు, టిమ్ అనే ఒక చిన్న పిల్లాడు ఉండేవాడు. అతను తన అమ్మ, నాన్నతో ఒక చిన్న ఇంట్లో నివసించేవాడు. టిమ్ నెమ్మదిగా ఉండేవాడు, కానీ ఆడుకోవడానికి, సరదాగా ఉండటానికి చాలా ఇష్టపడేవాడు.\nఒక రోజు, టిమ్ అమ్మ వంటగదిలో వంట చేస్తుండగా, టిమ్తో అంది, \"ఇక్కడ ఉండు, నేను దుకాణానికి వెళ్లాలి. వేడి స్టవ్ ను తాకకు, అది నిన్ను కాల్చేస్తుంది.\" టిమ్ అన్నాడు, \"సరే, అమ్మా, నేను ఇక్కడే ఉంటాను.\" కానీ టిమ్కు స్టవ్ గురించి ఆసక్తి కలిగింది, అది ఎలా పనిచేస్తుందో చూడాలనిపించింది.\nటిమ్ అమ్మ దుకాణానికి వెళ్ళినప్పుడు, టిమ్ స్టవ్ దగ్గరకు వెళ్లి దానిని తాకాడు. \"అయ్యో!\" అని అరిచాడు. అతని చేతికి మంట పడింది, అతను చాలా బాధపడ్డాడు. సరిగ్గా అప్పుడే, అతని అమ్మ తిరిగి వచ్చి ఏమి జరిగిందో చూసింది. ఆమె అంది, \"టిమ్, నేను నీకు వేచి ఉండమని, స్టవ్ను తాకవద్దని చెప్పాను!\" టిమ్ బదులిచ్చాడు, \"సారీ, అమ్మా. అది ఎలా పనిచేస్తుందో చూడాలనిపించింది.\"\nటిమ్ అమ్మ అతని గాయాన్ని చూసుకుని, \"తరువాత, నేను నీకు వేచి ఉండమని చెప్పినప్పుడు నన్ను విను. అది నీ భద్రత కోసం.\" టిమ్ తన పాఠం నేర్చుకున్నాడు మరియు మళ్లీ వేడి స్టవ్ను తాకలేదు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-008",
    "english_text": "One day, a powerful wolf went for a walk. He loved to sing. As he walked, he sang a happy song. He met a little bird who was sad.\n\"Why are you sad?\" asked the wolf. The bird said, \"I can't sing. My voice is too small.\"\nThe wolf told the bird, \"I can help you. Let's sing together.\" The bird was happy. They sang a beautiful song together.\nSoon, other animals came to listen. They all sang together. They learned that when they help each other, they can do great things. The moral of the story is to help your friends, and you can achieve more together.",
    "telugu_text": "ఒక రోజు, ఒక శక్తివంతమైన వలలో నడవడానికి వెళ్ళాడు. అతనికి పాటలు పాడటం అంటే చాలా ఇష్టం. అతను నడుస్తుండగా, ఒక సంతోషకరమైన పాట పాడాడు. అతను విచారంగా ఉన్న ఒక చిన్న పక్షిని కలిశాడు.\n\"నువ్వు ఎందుకు విచారంగా ఉన్నావు?\" అని వలలో అడిగాడు. పక్షి, \"నేను పాడలేను. నా గొంతు చాలా చిన్నది.\" అంది.\nవలలో పక్షికి, \"నేను నీకు సహాయం చేయగలను. మనం కలిసి పాడదాం.\" అని చెప్పాడు. పక్షి సంతోషపడింది. వారు కలిసి ఒక అందమైన పాట పాడారు.\nత్వరలోనే, వేరే జంతువులు వినడానికి వచ్చాయి. వాళ్ళు అందరూ కలిసి పాడారు. ఒకరికొకరు సహాయం చేసుకుంటే, మనం గొప్ప పనులు చేయగలం అని వాళ్ళు నేర్చుకున్నారు. ఈ కథలోని నీతి ఏమిటంటే, నీ స్నేహితులకు సహాయం చెయ్, కలిసి మనం ఇంకా ఎక్కువ సాధించగలం."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-098",
    "english_text": "Once upon a time, there was a little flower. The flower was sad because it could not bloom. It wanted to be big and pretty like the other flowers.\nOne day, a kind nurse from the hospital saw the sad flower. She wanted to help it bloom. The nurse gave the flower water and love every day.\nSoon, the sad flower started to grow. It became big and pretty. The flower was so happy it could bloom. The nurse and the flower became the best of friends. And they lived happily ever after.",
    "telugu_text": "ఒకప్పుడు, ఒక చిన్న పువ్వు ఉండేది. ఆ పువ్వు వికసించలేక బాధపడింది. అది మిగతా పువ్వులలా పెద్దదిగా, అందంగా ఉండాలని కోరుకుంది.\nఒక రోజు, ఆసుపత్రి నుండి ఒక దయగల నర్సు ఆ బాధపడిన పువ్వును చూసింది. ఆమె దాన్ని వికసించడానికి సహాయం చేయాలనుకుంది. ఆ నర్సు ఆ పువ్వుకు ప్రతిరోజూ నీళ్లు, ప్రేమ ఇచ్చింది.\nత్వరలోనే, ఆ బాధపడిన పువ్వు పెరగడం మొదలుపెట్టింది. అది పెద్దదిగా, అందంగా మారింది. ఆ పువ్వు చాలా సంతోషంగా ఉంది, అది వికసించగలిగింది. ఆ నర్సు, ఆ పువ్వు మంచి స్నేహితులు అయ్యారు. వాళ్ళు సంతోషంగా ఎప్పటికీ జీవించారు."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-007",
    "english_text": "Once upon a time, in a small town, there lived a girl named Lily and a boy named Tom. They were best friends and loved to play together. One day, they found a big red bike with two pedals. They both wanted to ride the bike, but there was only one seat.\nLily said, \"I want to ride the bike first!\" Tom also wanted to ride and said, \"No, I want to ride first!\" They began to quarrel. They were both very sad because they could not agree.\nThen, they saw an empty box near the bike. Lily had an idea. \"Tom, let's put the empty box on the bike, so we can both sit and ride together!\" Tom agreed, and they put the box on the bike. Now, they could both ride the bike and pedal together. They were very happy and did not quarrel anymore.",
    "telugu_text": "ఒకప్పుడు, ఒక చిన్న పట్టణంలో, లిల్లీ అనే అమ్మాయి, టామ్ అనే అబ్బాయి నివసించేవారు. వాళ్ళు చాలా మంచి స్నేహితులు, కలిసి ఆడుకోవడానికి ఇష్టపడేవారు. ఒక రోజు, వాళ్ళు రెండు పెడల్స్ ఉన్న పెద్ద ఎరుపు సైకిల్ను కనుగొన్నారు. ఇద్దరూ సైకిల్పై ప్రయాణించాలని అనుకున్నారు, కానీ ఒకే ఒక్క సీటు మాత్రమే ఉంది.\nలిల్లీ అంది, \"నేను ముందు సైకిల్పై వెళ్లాలనుకుంటున్నాను!\" టామ్ కూడా వెళ్లాలనుకుని, \"లేదు, నేను ముందు వెళ్లాలి!\" అన్నాడు. వాళ్ళు గొడవ పడటం మొదలుపెట్టారు. వాళ్ళకి ఏకీభవించలేక చాలా బాధగా అనిపించింది.\nఅప్పుడు, వాళ్ళు సైకిల్ దగ్గర ఉన్న ఖాళీ పెట్టెను చూశారు. లిల్లీకి ఒక ఆలోచన వచ్చింది. \"టామ్, మనం ఆ ఖాళీ పెట్టెను సైకిల్పై పెడదాం, అప్పుడు మనం ఇద్దరం కూర్చుని కలిసి ప్రయాణించవచ్చు!\" టామ్ ఒప్పుకున్నాడు, వాళ్ళు పెట్టెను సైకిల్పై పెట్టారు. ఇప్పుడు, వాళ్ళిద్దరూ కలిసి సైకిల్పై ప్రయాణించి, పెడల్స్ కూడా ఒకేసారి తిప్పవచ్చు. వాళ్ళు చాలా సంతోషంగా ఉండి, ఇక గొడవ పడలేదు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-198",
    "english_text": "Once upon a time, there was a little girl called Mia who was worried. It was the day of her school presentation and Mama had told her to finish building a structure with chocolate. \nMia worked hard, but the structure wouldn't stand. Every time she put the pieces together, they fell apart a few minutes later. With each try she was more and more worried. \nJust then, her Papa came in the room. \"What's wrong, Mia?\" Papa asked. \nMia told him about how she couldn't finish the structure. Papa lightly smiled. He told her \"It's ok, Mia. It's okay to be worried, but at the end of the day, it's your heart that matters the most. That's what counts\". \nMia felt better then. With a little bit of help from Papa, she was able to finish the structure and had a great school presentation.  \nMoral of the story: even when you are worried, remember that it is your heart and kindness that truly counts.",
    "telugu_text": "ఒకప్పుడు, మియా అనే ఒక చిన్న అమ్మాయి ఉండేది, ఆమె చాలా ఆందోళన చెందుతోంది. అది ఆమె పాఠశాల ప్రదర్శన రోజు, మరియు అమ్మ ఆమెకు చాక్లెట్తో ఒక నిర్మాణం పూర్తి చేయమని చెప్పింది.\nమియా చాలా కష్టపడింది, కానీ ఆ నిర్మాణం నిలబడలేదు. ప్రతిసారీ ఆమె ముక్కలను కలిపినప్పుడు, అవి కొన్ని నిమిషాల తర్వాత విడిపోతాయి. ప్రతి ప్రయత్నంతో ఆమె మరింత ఆందోళన చెందింది.\nఅప్పుడే, ఆమె నాన్న గదిలోకి వచ్చారు. \"ఏమైంది, మియా?\" అని నాన్న అడిగారు.\nమియా నిర్మాణం పూర్తి చేయలేకపోయాందని అతనికి చెప్పింది. నాన్న నవ్వుతూ చిన్నగా నవ్వారు. ఆయన ఆమెకు \"పర్వాలేదు, మియా. ఆందోళన చెందడం మంచిదే, కానీ రోజు చివర్లో, నీ హృదయం చాలా ముఖ్యం. అదే లెక్క\" అని చెప్పారు.\nమియాకు అంత తేలికపడింది. నాన్న సహాయంతో కొంచెం సహాయం తీసుకుని, ఆమె ఆ నిర్మాణం పూర్తి చేసి గొప్ప పాఠశాల ప్రదర్శన ఇచ్చింది.\nనీతి: నువ్వు ఆందోళన చెందుతున్నా కూడా, నీ హృదయం మరియు దయ చాలా ముఖ్యమని గుర్తుంచుకో."
   }

   {
    "order_in_batch": 1,
    "item_id": "T-058",
    "english_text": "Once upon a time, there was a little girl named Lily. She loved to stir her juice in her cooler. Every day, she would sit outside and stir her juice with a big smile on her face.\nOne day, while Lily was stirring her juice, a big angry bird came and tried to take her cooler away. Lily was scared, but she didn't want to lose her cooler. So, she held on tight and said, \"No, angry bird! This is my cooler!\"\nThe angry bird tried again, but Lily was too strong. She kept stirring her juice and the angry bird flew away. Lily was so happy that she had saved her cooler. From that day on, she always made sure to keep an eye out for any angry birds while she stirred her juice.",
    "telugu_text": "ఒకప్పుడు, లిల్లీ అనే ఒక చిన్న అమ్మాయి ఉండేది. ఆమె తన కూలర్లో తన జ్యూస్ను కలుపుకోవడం అంటే చాలా ఇష్టం. ప్రతిరోజూ, ఆమె బయట కూర్చుని, ముఖంలో పెద్ద నవ్వుతో తన జ్యూస్ను కలుపుకునేది.\nఒక రోజు, లిల్లీ తన జ్యూస్ను కలుపుతుండగా, ఒక పెద్ద కోపంగా ఉన్న పక్షి వచ్చింది. అది ఆమె కూలర్ను తీసుకెళ్లడానికి ప్రయత్నించింది. లిల్లీ భయపడింది, కానీ తన కూలర్ను కోల్పోకూడదని ఆమెకు అనిపించలేదు. అందుకే, ఆమె గట్టిగా పట్టుకుని, \"వద్దు, కోపంగా ఉన్న పక్షీ! ఇది నా కూలర్!\" అంది.\nకోపంగా ఉన్న పక్షి మళ్లీ ప్రయత్నించింది, కానీ లిల్లీ చాలా బలంగా ఉంది. ఆమె తన జ్యూస్ను కలుపుతూనే ఉంది, ఆ కోపంగా ఉన్న పక్షి ఎగిరిపోయింది. తన కూలర్ను కాపాడుకున్నందుకు లిల్లీ చాలా సంతోషించింది. ఆ రోజు నుండి, ఆమె తన జ్యూస్ను కలుపుతున్నప్పుడు ఎప్పుడూ ఏదైనా కోపంగా ఉన్న పక్షులు ఉన్నాయేమో అని చూసుకునేది."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-107",
    "english_text": "Once there was a girl named Sally. She loved books so much that she would go to the library every day. One day, when Sally was at the library, it started to get very hot! The sun was melting the ice cream that was in her hand.\nSally was worried. She didn't know what to do. Then she saw a helpful librarian standing nearby. She asked the librarian for help. The librarian said she could help keep the ice cream cold. She gave Sally a plastic bag and a pack of ice cubes.\nSally put the ice cubes in the plastic bag, around the ice cream. She thanked the librarian and kept exploring the library. The ice cubes kept the ice cream from melting. Sally was very happy and so was the librarian. They both smiled as Sally ate her ice cream.",
    "telugu_text": "ఒకప్పుడు సాలి అనే ఒక అమ్మాయి ఉండేది. ఆమెకు పుస్తకాలు అంటే చాలా ఇష్టం, అందుకే ప్రతిరోజూ లైబ్రరీకి వెళ్ళేది. ఒక రోజు, సాలి లైబ్రరీలో ఉన్నప్పుడు, చాలా వేడిగా మారింది! సూర్యుడు ఆమె చేతిలోని ఐస్ క్రీమ్ను కరిగించేస్తున్నాడు.\nసాలి ఆందోళన చెందింది. ఏమి చేయాలో ఆమెకు తెలియలేదు. అప్పుడు ఆమె పక్కనే ఉన్న సహాయకమైన గ్రంథపఠకుడిని చూసింది. ఆమె గ్రంథపఠకుడిని సహాయం అడిగింది. గ్రంథపఠకుడు ఐస్ క్రీమ్ను చల్లగా ఉంచడంలో సహాయం చేయగలనని చెప్పాడు. అతను సాలికి ఒక ప్లాస్టిక్ సంచిని, మరియు మంచు ముక్కల (ఐస్ క్యూబ్స్) ప్యాకెట్ను ఇచ్చాడు.\nసాలి ఆ మంచు ముక్కలను ప్లాస్టిక్ సంచిలో, ఐస్ క్రీమ్ చుట్టూ పెట్టింది. ఆమె గ్రంథపఠకుడికి ధన్యవాదాలు చెప్పి, లైబ్రరీలో ఇంకా చుట్టూ తిరిగింది. ఆ మంచు ముక్కలు ఐస్ క్రీమ్ కరగకుండా ఆపాయి. సాలి చాలా సంతోషంగా ఉంది, గ్రంథపఠకుడు కూడా సంతోషంగా ఉన్నాడు. సాలి తన ఐస్ క్రీమ్ను తింటుండగా, వాళ్లిద్దరూ నవ్వారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-083",
    "english_text": "Once upon a time, there was a creative boy named Tim. Tim loved to play with his toy cars. He had a big red car, a small blue car, and a yellow truck. Tim liked to make the cars go fast and make loud noises. He was a good player with his cars.\nOne day, Tim learned a new word: \"reverse.\" He asked his mommy, \"What does reverse mean?\" Mommy said, \"Reverse means to go backward.\" Tim thought that was fun. So, he made his cars go backward. The big red car went reverse, the small blue car went reverse, and the yellow truck went reverse too.\nTim played with his cars all day long. He made them go forward and reverse, fast and slow. He was very creative with his games. He made up a story where the cars had to save a kitty from a tree. Tim was happy, and his mommy was proud of her creative player.",
    "telugu_text": "ఒకప్పుడు, టిమ్ అనే ఒక సృజనాత్మకమైన అబ్బాయి ఉండేవాడు. టిమ్ తన బొమ్మ కార్లతో ఆడుకోవడం అంటే చాలా ఇష్టం. అతనికి ఒక పెద్ద ఎరుపు కారు, ఒక చిన్న నీలం కారు, మరియు ఒక పసుపు ట్రక్ ఉండేవి. టిమ్ కార్లను వేగంగా నడపడానికి, పెద్ద శబ్దాలు చేయడానికి ఇష్టపడేవాడు. అతను తన కార్లతో మంచి ఆటగాడు.\nఒక రోజు, టిమ్ ఒక కొత్త పదం నేర్చుకున్నాడు: \"రివర్స్\". అతను తన అమ్మని అడిగాడు, \"రివర్స్ అంటే ఏమిటి?\" అమ్మ చెప్పింది, \"రివర్స్ అంటే వెనక్కి వెళ్లడం.\" టిమ్ అది సరదాగా అనిపించింది. కాబట్టి, అతను తన కార్లను వెనక్కి నడపాడు. పెద్ద ఎరుపు కారు రివర్స్ అయ్యింది, చిన్న నీలం కారు రివర్స్ అయ్యింది, మరియు పసుపు ట్రక్ కూడా రివర్స్ అయ్యింది.\nటిమ్ రోజంతా తన కార్లతో ఆడాడు. అతను వాటిని ముందుకు, వెనక్కి, వేగంగా, నెమ్మదిగా నడపాడు. అతను తన ఆటలతో చాలా సృజనాత్మకంగా ఉండేవాడు. కార్లు ఒక చెట్టు నుండి ఒక పిల్లిని రక్షించవలసి వచ్చినట్లు అతను ఒక కథను కల్పించాడు. టిమ్ సంతోషంగా ఉన్నాడు, మరియు అతని అమ్మ తన సృజనాత్మక ఆటగాడి గురించి గర్వపడింది."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-014",
    "english_text": "One day, a lovely cat named Kitty went for a walk. She saw a little boy named Tim. Tim was holding a green lime. Kitty was curious and wanted to know what it was.\n\"Hi Tim,\" said Kitty. \"What is that green thing?\" Tim smiled and said, \"This is a lime. It is a fruit.\" Kitty wanted to try the lime, so Tim gave it to her.\nKitty took a small bite of the lime, but it was very sour. She made a funny face. Tim laughed and said, \"Kitty, limes are not sweet. They are sour.\" Kitty decided she did not like limes, but she still liked Tim. So, she gave him a kiss on the cheek. Tim blushed and said, \"Thank you, Kitty.\" They both laughed and continued to play together.",
    "telugu_text": "ఒక రోజు, కిట్టి అనే ఒక అందమైన పిల్లి బయటకు నడవడానికి వెళ్ళింది. ఆమెకు టిమ్ అనే ఒక చిన్న అబ్బాయి కనిపించాడు. టిమ్ ఒక పచ్చని నిమ్మకాయ పట్టుకుని ఉన్నాడు. కిట్టికి ఆసక్తి కలిగింది, అది ఏమిటో తెలుసుకోవాలనిపించింది.\n\"హాయ్ టిమ్,\" అంది కిట్టి. \"ఆ పచ్చని వస్తువు ఏమిటి?\" టిమ్ నవ్వి, \"ఇది నిమ్మకాయ. ఇది పండు.\" కిట్టి నిమ్మకాయ రుచి చూడాలని అనుకుంది, కాబట్టి టిమ్ దాన్ని ఆమెకు ఇచ్చాడు.\nకిట్టి నిమ్మకాయ ముక్కను కొద్దిగా తిన్నది, కానీ అది చాలా పుల్లగా ఉంది. ఆమె ఒక విచిత్రమైన ముఖం చేసింది. టిమ్ నవ్వాడు మరియు అన్నాడు, \"కిట్టి, నిమ్మకాయలు తీయగా ఉండవు. అవి పుల్లగా ఉంటాయి.\" కిట్టికి నిమ్మకాయలు నచ్చలేదని నిర్ణయించుకుంది, కానీ ఆమెకు టిమ్ అంటే ఇష్టం. కాబట్టి, ఆమె అతని బుగ్గపై ముద్దు పెట్టింది. టిమ్ సిగ్గుపడి, \"ధన్యవాదాలు, కిట్టి.\" వాళ్లిద్దరూ నవ్వుకున్నారు మరియు కలిసి ఆడుకుంటూ కొనసాగించారు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-016",
    "english_text": "Once upon a time, there was a mill. In the mill, there was a cook. The cook liked to make rare treats. One day, a little girl came to the mill. She wanted to see the cook make the rare treats.\nThe little girl said, \"Hi, cook! Can you show me how to make the rare treats?\" The cook was happy to show her. They started to cook together. The little girl learned how to make the rare treats.\nIn the end, the little girl and the cook made many rare treats. They had a fun day at the mill. The little girl said, \"Thank you, cook!\" And the cook said, \"You're welcome! Come back soon!\" The little girl went home with a big smile and a bag of rare treats.",
    "telugu_text": "ఒకప్పుడు, ఒక గిరి ఉండేది. ఆ గిరిలో ఒక వంటవాడు ఉండేవాడు. ఆ వంటవాడికి అరుదైన స్వీట్లు చేయడం అంటే చాలా ఇష్టం. ఒక రోజు, ఒక చిన్న అమ్మాయి ఆ గిరికి వచ్చింది. ఆ వంటవాడు అరుదైన స్వీట్లు ఎలా తయారు చేస్తాడో చూడాలని ఆమెకు కోరిక.\nచిన్న అమ్మాయి, \"హాయ్, వంటవాడా! అరుదైన స్వీట్లు ఎలా చేయాలో నాకు చూపించగలవా?\" అంది. వంటవాడు ఆమెకు చూపించడానికి సంతోషించాడు. వాళ్లిద్దరూ కలిసి వంట చేయడం మొదలుపెట్టారు. చిన్న అమ్మాయి అరుదైన స్వీట్లు ఎలా చేయాలో నేర్చుకుంది.\nచివరికి, చిన్న అమ్మాయి, వంటవాడు చాలా అరుదైన స్వీట్లను తయారు చేశారు. వాళ్ళకి ఆ గిరిలో సరదాగా ఒక రోజు గడిచింది. చిన్న అమ్మాయి, \"ధన్యవాదాలు, వంటవాడా!\" అంది. వంటవాడు, \"సంతోషం! త్వరగా రా!\" అన్నాడు. చిన్న అమ్మాయి పెద్ద నవ్వుతో, అరుదైన స్వీట్ల సంచితో ఇంటికి వెళ్లిపోయింది."
   }

   {
    "order_in_batch": 1,
    "item_id": "T-003",
    "english_text": "One day, a big orange lion named Leo went for a walk. He saw a tall tree with a little bird on it. Leo wanted to say hello to the bird, but the bird was too high up. Leo thought, \"I will try to climb the tree.\"\nLeo tried to climb the tree, but his paws were too big. He tried and tried, but he kept falling down. He felt sad. Then, he saw a tiny ant. The ant said, \"I can help you climb the tree!\" Leo laughed, \"How can a tiny ant help a big lion like me?\"\nThe tiny ant told Leo to follow her. They went to a big hill. The ant said, \"Climb this hill first. It will help you learn to climb the tree.\" Leo tried to climb the hill, and it was easy! He was so happy. He went back to the tree and tried again. This time, Leo climbed the tree and said hello to the bird. The bird was so happy that the big orange lion could reach her. Leo learned that even a tiny ant can help a big lion.",
    "telugu_text": "ఒక రోజు, లియో అనే పెద్ద నారింజ సింహం నడవడానికి వెళ్ళింది. అది ఒక ఎత్తైన చెట్టును చూసింది దానిపై ఒక చిన్న పక్షి ఉంది. లియో ఆ పక్షికి నమస్కారం చెప్పాలనుకుంది, కానీ పక్షి చాలా ఎత్తులో ఉంది. లియో అనుకుంది, \"నేను చెట్టు ఎక్కడానికి ప్రయత్నిస్తాను.\"\nలియో చెట్టు ఎక్కడానికి ప్రయత్నించింది, కానీ దాని పాదాలు చాలా పెద్దవి. అది ప్రయత్నించింది, ప్రయత్నించింది, కానీ అది కింద పడిపోతూనే ఉంది. అది విచారంగా అనిపించింది. అప్పుడు, అది ఒక చిన్న చీమను చూసింది. చీమ, \"నేను నీకు చెట్టు ఎక్కడానికి సహాయం చేయగలను!\" లియో నవ్వింది, \"ఒక చిన్న చీమ నా లాంటి పెద్ద సింహానికి ఎలా సహాయం చేయగలదు?\"\nచిన్న చీమ లియోను తనను అనుసరించమని చెప్పింది. వారు ఒక పెద్ద కొండకు వెళ్లారు. చీమ, \"ముందు ఈ కొండ ఎక్కు. అది నీకు చెట్టు ఎక్కడం నేర్చుకోవడానికి సహాయపడుతుంది.\" లియో కొండ ఎక్కడానికి ప్రయత్నించింది, అది సులభంగా ఉంది! అది చాలా సంతోషపడింది. అది చెట్టు దగ్గరకు వెళ్లి మళ్ళీ ప్రయత్నించింది. ఈసారి, లియో చెట్టు ఎక్కి పక్షికి నమస్కారం చెప్పింది. పెద్ద నారింజ సింహం దానికి చేరుకోగలిగినందుకు పక్షి చాలా సంతోషించింది. ఒక చిన్న చీమ కూడా పెద్ద సింహానికి సహాయం చేయగలదని లియో నేర్చుకుంది."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-196",
    "english_text": "Once upon a time, there was a small girl. She was three years old and loved to eat her favorite food, banana.\nOne day, the little girl's mommy and daddy shut the door, so the girl could not go out and she was sad. But then, she noticed something. It was another banana in the room.\nThe little girl was so excited! She jumped to grab the banana, but when she grabbed it, it hurt her hand. Tears filled her eyes and she was scared.\nBut then, she heard her mommy's calm voice. \"Don't be scared, it's okay,\" her mom said. She gently took the banana away and gave the little girl a hug.\nThe little girl hugged her mom and soon she stopped feeling scared and started to feel better. And from that day on, she would always remember one important thing: to be careful whenever she grabbed a banana.",
    "telugu_text": "ఒకప్పుడు, ఒక చిన్న అమ్మాయి ఉండేది. ఆమెకు మూడు సంవత్సరాలు, ఆమెకు తనకిష్టమైన ఆహారం, అరటిపండు తినడం అంటే చాలా ఇష్టం.\nఒకరోజు, చిన్న అమ్మాయి అమ్మ, నాన్న తలుపు మూసేసి, అమ్మాయి బయటకు వెళ్లలేకపోయింది, ఆమెకు బాధగా అనిపించింది. కానీ అప్పుడు, ఆమె ఏదో గమనించింది. గదిలో ఇంకో అరటిపండు ఉంది.\nచిన్న అమ్మాయి చాలా ఉత్సాహపడింది! ఆమె అరటిపండును అందుకోవడానికి దూకింది, కానీ అది పట్టుకున్నప్పుడు, ఆమె చేతికి నొప్పి కలిగింది. ఆమె కళ్ళలో నీళ్ళు నిండిపోయాయి, ఆమె భయపడింది.\nకానీ అప్పుడు, ఆమె అమ్మ ప్రశాంతమైన స్వరాన్ని వింది. \"భయపడకు, అంతా బాగానే ఉంది,\" అని అమ్మ అంది. ఆమె మెల్లగా అరటిపండును తీసుకుని, చిన్న అమ్మాయిని కౌగిలించుకుంది.\nచిన్న అమ్మాయి తన అమ్మను కౌగిలించుకుంది, త్వరలోనే ఆమెకు భయం పోయి, మంచిగా అనిపించింది. ఆ రోజు నుండి, ఆమె ఎప్పుడూ ఒక ముఖ్యమైన విషయాన్ని గుర్తుంచుకునేది: అరటిపండును అందుకోవడానికి ఎప్పుడూ జాగ్రత్తగా ఉండాలి."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-105",
    "english_text": "Once upon a time, there was a little girl named Lily. Lily was very hungry. She wanted to find some food. She walked and walked until she saw a big tree with many apples.\nLily said, \"I want to eat those apples, but they are too high. I need help!\" Suddenly, a magic bird flew down from the sky. The bird said, \"I can help you, Lily. I will save you from your hungry tummy!\"\nThe bird flew up and picked an apple for Lily. But as the bird gave Lily the apple, something unexpected happened. The apple turned into a big, yummy cake! Lily and the magic bird were very surprised. They laughed and ate the cake together, and Lily's hungry tummy was happy.",
    "telugu_text": "ఒకానొకప్పుడు, లిల్లీ అనే ఒక చిన్న అమ్మాయి ఉండేది. లిల్లీకి చాలా ఆకలిగా ఉంది. ఆమెకు కొంచెం ఆహారం దొరకాలనిపించింది. ఆమె నడిచింది, నడిచింది, అప్పుడు చాలా ఆపిల్స్ ఉన్న పెద్ద చెట్టును చూసింది.\nలిల్లీ అంది, \"నేను ఆ ఆపిల్స్ తినాలనుకుంటున్నాను, కానీ అవి చాలా ఎత్తులో ఉన్నాయి. నాకు సహాయం కావాలి!\" అకస్మాత్తుగా, ఒక మాయా పక్షి ఆకాశం నుండి కిందకు ఎగిరి వచ్చింది. ఆ పక్షి అంది, \"నేను నీకు సహాయం చేయగలను, లిల్లీ. నీ ఆకలితో ఉన్న కడుపు నుండి నిన్ను కాపాడుతాను!\"\nఆ పక్షి ఎగిరి పైకి వెళ్లి లిల్లీ కోసం ఒక ఆపిల్ను తీసుకువచ్చింది. కానీ పక్షి లిల్లీకి ఆపిల్ను ఇచ్చేసరికి, ఏదో ఊహించనిది జరిగింది. ఆ ఆపిల్ ఒక పెద్ద, రుచికరమైన కేక్గా మారింది! లిల్లీకి, ఆ మాయా పక్షికి చాలా ఆశ్చర్యం కలిగింది. వారు నవ్వుకున్నారు, ఆ కేక్ను కలిసి తిన్నారు, లిల్లీకి ఆకలి తీరింది."

   {
    "order_in_batch": 4,
    "item_id": "T-060",
    "english_text": "One day, a grumpy cat named Tom was walking in the woods. He saw a big cross on a tree. He was very curious and wanted to know what it was. Tom went closer to the cross and saw a big pot next to it. He thought it was very strange.\nTom saw a spoon next to the pot. He decided to stir the pot to see what was inside. As he stirred, he heard a loud noise. It was a big, scary bear! The bear said, \"Why are you touching my pot?\"\nTom was scared and said, \"I'm sorry, I didn't know it was yours.\" The bear was very angry and said, \"You shouldn't touch things that don't belong to you!\"\nTom tried to run away, but the bear was faster. The bear caught Tom and ate him up. The grumpy cat should have listened to the bear and not touched the pot.",
    "telugu_text": "ఒక రోజు, టామ్ అనే చిరాకుపడే పిల్లి అడవిలో నడుచుకుంటూ వెళ్తున్నాడు. అతను ఒక చెట్టు మీద పెద్ద క్రాస్ (గుర్తు) చూశాడు. అతను చాలా ఆసక్తిగా ఉన్నాడు, అది ఏమిటో తెలుసుకోవాలని అనుకున్నాడు. టామ్ క్రాస్ దగ్గరికి వెళ్లి, దాని పక్కన ఒక పెద్ద కుండను చూశాడు. అది చాలా వింతగా అనిపించింది.\nటామ్ కుండ పక్కన ఒక చెంచా (స్పూన్) చూశాడు. లోపల ఏముందో చూడడానికి కుండను కలుపుదామనుకున్నాడు. అతను కలుపుతుండగా, అతను పెద్ద శబ్దం విన్నాడు. అది ఒక పెద్ద, భయంకరమైన ఎలుగుబంటి! ఎలుగుబంటి, \"నువ్వు నా కుండను ఎందుకు తాకుతున్నావు?\" అంది.\nటామ్ భయపడి, \"క్షమించండి, అది మీది అని నాకు తెలియలేదు,\" అన్నాడు. ఎలుగుబంటి చాలా కోపంగా, \"నీకు నీకు చెందని వాటిని తాకకూడదు!\" అంది.\nటామ్ పారిపోవడానికి ప్రయత్నించాడు, కానీ ఎలుగుబంటి వేగంగా ఉంది. ఎలుగుబంటి టామ్ను పట్టుకుని తినేసింది. చిరాకుపడే పిల్లి ఎలుగుబంటి మాట వినాలి, కుండను తాకకూడదని అనుకోవాలి."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-116",
    "english_text": "One day, a little girl named Lucy went to the park. She saw her friend Tom. Tom had a soft toy bear. Lucy liked the bear. She wanted to play with it.\n\"Hi Tom, can I play with your soft bear?\" Lucy asked. Tom said, \"Yes, you can play with my bear. But first, can you help me find my tea? I lost it in the park.\" Lucy agreed to help Tom find his tea.\nThey looked and looked for the tea. Then, Lucy saw a dog. The dog had a cup in its mouth. Lucy recognized the cup. It was Tom's tea! The dog ran away with the tea. Lucy and Tom laughed. They did not expect the dog to take the tea! They played with the soft bear and had fun at the park.",
    "telugu_text": "ఒక రోజు, లూసీ అనే చిన్న అమ్మాయి పార్కుకు వెళ్ళింది. ఆమె తన స్నేహితుడు టామ్ను చూసింది. టామ్ దగ్గర ఒక మెత్తని బొమ్మ ఎలుగుబంటి ఉంది. లూసీకి ఆ ఎలుగుబంటి నచ్చింది. ఆమె దానితో ఆడుకోవాలని అనుకుంది.\n\"హాయ్ టామ్, నేను నీ మెత్తని ఎలుగుబంటితో ఆడుకోవచ్చా?\" లూసీ అడిగింది. టామ్ అన్నాడు, \"అవును, నువ్వు నా ఎలుగుబంటితో ఆడుకోవచ్చు. కానీ ముందు, నా టీని కనుక్కోవడానికి నాకు సహాయం చేస్తావా? నేను దాన్ని పార్కులో పోగొట్టుకున్నాను.\" టామ్ టీని కనుక్కోవడానికి లూసీ అంగీకరించింది.\nవారు టీ కోసం వెతికారు, వెతికారు. అప్పుడు, లూసీ ఒక కుక్కను చూసింది. ఆ కుక్క నోట్లో ఒక కప్పు ఉంది. లూసీ ఆ కప్పును గుర్తించింది. అది టామ్ టీ! కుక్క టీతో పారిపోయింది. లూసీ, టామ్ నవ్వుకున్నారు. కుక్క టీని తీసుకుంటుందని వారు ఊహించలేదు! వారు మెత్తని ఎలుగుబంటితో ఆడుకున్నారు మరియు పార్కులో సరదాగా గడిపారు."
   }

  "TB17": [
   {
    "order_in_batch": 1,
    "item_id": "T-080",
    "english_text": "Once upon a time, in a wide field, there was a big tree. The tree was very old and wise. It had seen many things in nature. One day, a little bird came to live in the tree. The bird was sad because it had no friends.\nOne day, a strong wind came and split the tree in half. The little bird was scared but stayed with the tree. The tree told the bird, \"Don't be scared. I am still here for you.\" The bird felt better and stayed with the tree.\nSoon, other animals came to live with the tree too. They all worked together to fix the tree. The tree was happy and the little bird had many friends. The moral of the story is: even when things are broken, we can still help and be friends with each other.",
    "telugu_text": "ఒకానొకప్పుడు, ఒక పెద్ద పొలంలో, ఒక పెద్ద చెట్టు ఉండేది. ఆ చెట్టు చాలా పాతది మరియు తెలివైనది. అది ప్రకృతిలో చాలా విషయాలు చూసింది. ఒక రోజు, ఒక చిన్న పక్షి ఆ చెట్టుపై నివసించడానికి వచ్చింది. ఆ పక్షికి స్నేహితులు లేక చాలా బాధగా ఉంది.\nఒక రోజు, ఒక బలమైన గాలి వచ్చింది మరియు ఆ చెట్టును రెండుగా చీల్చింది. చిన్న పక్షి భయపడింది కానీ చెట్టుతోనే ఉండిపోయింది. చెట్టు పక్షికి చెప్పింది, \"భయపడకు. నేను నీ కోసం ఇక్కడే ఉన్నాను.\" పక్షికి మంచి అనుభూతి కలిగింది మరియు చెట్టుతోనే ఉండిపోయింది.\nత్వరలోనే, ఇతర జంతువులు కూడా చెట్టుతో నివసించడానికి వచ్చాయి. అవి అన్నీ కలిసి చెట్టును సరిచేయడానికి పనిచేశాయి. చెట్టు సంతోషంగా ఉంది మరియు చిన్న పక్షికి చాలా స్నేహితులు దొరికారు. ఈ కథలోని నీతి ఏమిటంటే: విషయాలు పగిలిపోయినా, మనం ఇంకా ఒకరికొకరం సహాయం చేయగలం మరియు స్నేహితులుగా ఉండగలం."

   {
    "order_in_batch": 2,
    "item_id": "T-194",
    "english_text": "Once upon a time, there was a lively little dog named Spot. Spot liked to play with his toys and run around his house. He was a very happy dog.\nOne day, Spot's family got some new furniture. They got a big chair and a soft couch. Spot was very excited. He wanted to give his toys to the new furniture so they could play too.\nSpot put his ball on the chair and his teddy bear on the couch. He was so happy to see his toys on the new furniture. Spot and his toys had a fun day playing together in their lively home.",
    "telugu_text": "ఒకప్పుడు, స్పాట్ అనే చురుకైన చిన్న కుక్క ఉండేది. స్పాట్ తన బొమ్మలతో ఆడుకోవడానికి, తన ఇంటి చుట్టూ పరిగెత్తడానికి ఇష్టపడేది. అది చాలా సంతోషంగా ఉండే కుక్క.\nఒక రోజు, స్పాట్ కుటుంబానికి కొత్త ఫర్నిచర్ వచ్చింది. వారికి ఒక పెద్ద కుర్చీ, ఒక మెత్తటి సోఫా వచ్చింది. స్పాట్ చాలా ఉత్సాహపడ్డాడు. ఆ కొత్త ఫర్నిచర్కు తన బొమ్మలను ఇవ్వాలని అనుకున్నాడు, అప్పుడు అవి కూడా ఆడుకోవచ్చు.\nస్పాట్ తన బంతిని కుర్చీపై పెట్టి, తన టెడ్డీ బేర్ను సోఫాపై పెట్టాడు. తన బొమ్మలు కొత్త ఫర్నిచర్పై ఉన్నందుకు స్పాట్ చాలా సంతోషించాడు. స్పాట్ మరియు అతని బొమ్మలు వారి చురుకైన ఇంట్లో కలిసి ఆడుకుంటూ సరదాగా గడిపారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-068",
    "english_text": "Once upon a time, there was a little girl named Lucy. She loved to skip and play outside with her friends. One sunny day, Lucy met a slow turtle named Mr. Wisdom. Mr. Wisdom was very old and wise.\nLucy and Mr. Wisdom became good friends. They liked to play together in the park. Lucy would skip fast, and Mr. Wisdom would move slow. They laughed and had lots of fun. Lucy learned many things from her new friend.\nOne day, Mr. Wisdom told Lucy that being slow can be good too. It helps you think and see things better. Lucy listened and tried to be slow sometimes. She found out that she could learn more when she was slow. Lucy was happy because her friend Mr. Wisdom taught her something new.",
    "telugu_text": "ఒకప్పుడు, లూసీ అనే ఒక చిన్న అమ్మాయి ఉండేది. ఆమె గెంతుతూ, తన స్నేహితులతో బయట ఆడుకోవడం అంటే చాలా ఇష్టం. ఒక సంతోషకరమైన రోజున, లూసీ అనే అమ్మాయి ఒక నెమ్మదిగా నడిచే తాబేలు అయిన మిస్టర్ విజ్డమ్ను కలిసింది. మిస్టర్ విజ్డమ్ చాలా వయసు మళ్లినవాడు మరియు తెలివైనవాడు.\nలూసీ మరియు మిస్టర్ విజ్డమ్ మంచి స్నేహితులు అయ్యారు. వాళ్ళిద్దరూ పార్కులో కలిసి ఆడుకోవడం అంటే చాలా ఇష్టం. లూసీ వేగంగా గెంతుతుంటే, మిస్టర్ విజ్డమ్ నెమ్మదిగా కదిలేవాడు. వాళ్ళు నవ్వుకుంటూ చాలా సరదాగా గడిపారు. లూసీ తన కొత్త స్నేహితుడి నుండి చాలా విషయాలు నేర్చుకుంది.\nఒక రోజు, మిస్టర్ విజ్డమ్ లూసీకి నెమ్మదిగా ఉండటం కూడా మంచిదని చెప్పాడు. అది నీకు ఆలోచించడానికి మరియు విషయాలను బాగా చూడటానికి సహాయపడుతుంది. లూసీ విన్నది మరియు కొన్నిసార్లు నెమ్మదిగా ఉండటానికి ప్రయత్నించింది. నెమ్మదిగా ఉన్నప్పుడు ఆమె ఇంకా ఎక్కువ నేర్చుకోగలదని ఆమె తెలుసుకుంది. తన స్నేహితుడు మిస్టర్ విజ్డమ్ ఆమెకు కొత్త విషయం నేర్పినందుకు లూసీ సంతోషపడింది."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-125",
    "english_text": "Once upon a time, a little girl named Sue loved to shake her toys. She had a big dream to make them come to life. She played with them every day, and they were her best friends.\nOne day, Sue found a new toy in her room. It was a small, deaf dog. The dog could not hear, but it was very cute. Sue shook the dog, and something unexpected happened. The deaf dog came to life!\nThe dog wagged its tail and played with Sue. They had so much fun together. Sue's dream had come true! From that day on, the little girl and the deaf dog were the best of friends, and they played together every day. And Sue learned that even if someone is different, they can still be a great friend.",
    "telugu_text": "ఒకానొకప్పుడు, సూ అనే ఒక చిన్న అమ్మాయి తన బొమ్మలను ఊపడానికి చాలా ఇష్టపడేది. వాటిని నిజమైన జీవులుగా మార్చాలని ఆమెకు ఒక పెద్ద కల ఉండేది. ఆమె ప్రతిరోజూ వాటితో ఆడుకునేది, అవి ఆమెకు మంచి స్నేహితులు.\nఒక రోజు, సూ తన గదిలో ఒక కొత్త బొమ్మను కనుగొంది. అది ఒక చిన్న, చెవిటి కుక్క. కుక్కకు వినలేకపోయింది, కానీ అది చాలా ముద్దుగా ఉండేది. సూ ఆ కుక్కను ఊపింది, అప్పుడు ఊహించనిది జరిగింది. చెవిటి కుక్క బ్రతికి వచ్చింది!\nకుక్క తోకను ఊపింది, సూతో ఆడుకుంది. వాళ్లిద్దరూ చాలా సరదాగా గడిపారు. సూ కల నిజమైంది! ఆ రోజు నుండి, ఆ చిన్న అమ్మాయికి, ఆ చెవిటి కుక్కకు మంచి స్నేహితులు అయ్యారు, వాళ్ళు ప్రతిరోజూ కలిసి ఆడుకునేవారు. మరియు ఎవరైనా భిన్నంగా ఉన్నా, వారు ఇప్పటికీ గొప్ప స్నేహితులు కాగలరని సూ నేర్చుకుంది."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-022",
    "english_text": "Once upon a time there was a big car. It was shiny and red. In the red car sat Jack and his sister.\nJack and his sister were very excited. They were going on a special drive. \"Are you ready?\" said Jack.\nHis sister smiled and said, \"Yes, I'm ready!\".\nThey drove to a big, wide open space. Jack and his sister got out of the car and saw a big yellow sign. It said: \"MINE\".\nJack and his sister knew they were at the right place. They were ready to explore the mine. \nJack smiled and said, \"Let's go exploring\". \nHis sister nodded and said, \"Yes, let's go!\"\nThey explored the mine for hours, finding lots of rocks and gems. \nFinally, Jack and his sister drove home. They were tired but it had been a fantastic adventure.",
    "telugu_text": "ఒకప్పుడు ఒక పెద్ద కారు ఉండేది. అది మెరిసిపోతూ ఎరుపు రంగులో ఉండేది. ఆ ఎరుపు కారులో జాక్ మరియు అతని చెల్లి కూర్చున్నారు.\nజాక్ మరియు అతని చెల్లి చాలా ఉత్సాహంగా ఉన్నారు. వారు ఒక ప్రత్యేకమైన ప్రయాణం చేయబోతున్నారు. \"నువ్వు సిద్ధమా?\" అని జాక్ అన్నాడు.\nఅతని చెల్లి నవ్వి, \"అవును, నేను సిద్ధంగా ఉన్నాను!\" అంది.\nవారు ఒక పెద్ద, విశాలమైన ఖాళీ స్థలానికి ప్రయాణించారు. జాక్ మరియు అతని చెల్లి కారు నుండి దిగి ఒక పెద్ద పసుపు గుర్తును చూశారు. దానిపై \"నాది\" అని రాసి ఉంది.\nజాక్ మరియు అతని చెల్లి వారు సరైన ప్రదేశంలో ఉన్నారని తెలుసుకున్నారు. వారు గనిని అన్వేషించడానికి సిద్ధంగా ఉన్నారు.\nజాక్ నవ్వి, \"వెళ్దాం అన్వేషించడానికి\" అన్నాడు.\nఅతని చెల్లి తల ఊపి, \"అవును, వెళ్దాం!\" అంది.\nవారు గంటల తరబడి గనిని అన్వేషించారు, చాలా రాయిలు మరియు రత్నాలను కనుగొన్నారు.\nచివరికి, జాక్ మరియు అతని చెల్లి ఇంటికి తిరిగి వచ్చారు. వారు అలసిపోయారు కానీ అది అద్భుతమైన సాహసం."
   }

  "TB18": [
   {
    "order_in_batch": 1,
    "item_id": "T-042",
    "english_text": "One day, a little boy named Tim found a light jar in his room. It was so light that it felt like it had nothing inside. Tim was very curious about the jar.\nTim went to his mom and said, \"Mom, look at this light jar I found. Can I open it?\" His mom smiled and said, \"Sure, Tim. But be careful.\"\nTim opened the jar and a small, friendly bug came out. The bug said, \"Hi, I am Bug. Can you help me find my home?\" Tim was happy to help. He said, \"Yes, Bug. I will help you find your home.\"\nAs they started looking for Bug's home, the bug saw a tree and said, \"That is my home!\" Tim put Bug on the tree and Bug was very happy. Tim felt good to help his new friend.\nBefore Tim left, Bug said, \"Thank you, Tim. You are a kind friend.\" Tim smiled and went back to his mom. He told her about helping Bug and she was proud of him.",
    "telugu_text": "ఒక రోజు, టిమ్ అనే చిన్న పిల్లాడికి తన గదిలో ఒక వెలుగు సీసా దొరికింది. అది చాలా తేలికగా ఉంది, లోపల ఏమీ లేనట్లు అనిపించింది. టిమ్కి ఆ సీసా గురించి చాలా ఆసక్తి కలిగింది.\nటిమ్ తన అమ్మ దగ్గరకు వెళ్లి, \"అమ్మా, నేను కనుగొన్న ఈ వెలుగు సీసాను చూడు. నేను దీన్ని తెరవవచ్చా?\" అమ్మ నవ్వి, \"తప్పకుండా, టిమ్. కానీ జాగ్రత్తగా ఉండు.\" అంది.\nటిమ్ సీసాను తెరిచాడు, అప్పుడు ఒక చిన్న, స్నేహపూర్వకమైన కీటకం బయటకు వచ్చింది. ఆ కీటకం, \"హాయ్, నేను బగ్ని. నా ఇంటిని కనుగొనడంలో నువ్వు నాకు సహాయం చేయగలవా?\" అంది. సహాయం చేయడానికి టిమ్కి సంతోషం కలిగింది. అతను, \"అవును, బగ్. నేను నీ ఇంటిని కనుగొనడంలో నీకు సహాయం చేస్తాను.\" అన్నాడు.\nవారు బగ్ ఇంటిని వెతకడం మొదలుపెట్టగానే, ఆ కీటకం ఒక చెట్టును చూసి, \"అది నా ఇల్లు!\" అంది. టిమ్ బగ్ను చెట్టుపై ఉంచాడు, బగ్ చాలా సంతోషపడింది. తన కొత్త స్నేహితుడికి సహాయం చేయడం టిమ్కి మంచి అనుభూతి కలిగింది.\nటిమ్ వెళ్ళే ముందు, బగ్, \"ధన్యవాదాలు, టిమ్. నువ్వు దయగల స్నేహితుడివి.\" అంది. టిమ్ నవ్వి తన అమ్మ దగ్గరకు వెళ్ళాడు. అతను బగ్కు సహాయం చేసిన విషయం ఆమెకు చెప్పాడు, ఆమె అతన్ని గర్వపడింది."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-027",
    "english_text": "One day, a girl named Sue and her dog, Max, went for a walk. They saw a big, red top. Sue picked it up and said, \"I will spin this top!\" She spun the top and it went round and round. Max barked and wagged his tail. He was proud of Sue.\nSue and Max walked more and found a man. The man had a print of a cat on his shirt. Sue said, \"I like your shirt!\" The man said, \"Thank you, I like your top!\" Sue and Max smiled and walked away.\nAt the end of the day, Sue and Max went home. They played with the top and spun it again and again. Sue was proud of her new top and Max was proud of Sue. They had a fun day and went to bed happy.",
    "telugu_text": "ఒక రోజు, సూ అనే అమ్మాయి తన కుక్క మాక్స్ తో నడవడానికి వెళ్ళింది. వాళ్ళు ఒక పెద్ద, ఎర్రటి టోప్ చూశారు. సూ దాన్ని తీసుకుని, \"నేను ఈ టోప్ను తిప్పుతాను!\" అంది. ఆమె టోప్ను తిప్పింది, అది గుండ్రంగా తిరిగింది. మాక్స్ అరిచింది, తన తోకను ఊపింది. అతను సూ గురించి గర్వపడ్డాడు.\nసూ మరియు మాక్స్ ఇంకా నడిచారు, ఒక మనిషిని కనుగొన్నారు. ఆ మనిషి చొక్కా మీద పిల్లి బొమ్మ ఉంది. సూ అంది, \"నాకు నీ చొక్కా నచ్చింది!\" ఆ మనిషి అన్నాడు, \"ధన్యవాదాలు, నాకు నీ టోప్ నచ్చింది!\" సూ మరియు మాక్స్ నవ్వి, దూరంగా నడిచారు.\nఆ రోజు చివర్లో, సూ మరియు మాక్స్ ఇంటికి వెళ్లారు. వాళ్ళు టోప్తో ఆడుకున్నారు, దాన్ని మళ్ళీ మళ్ళీ తిప్పారు. సూ తన కొత్త టోప్ గురించి గర్వపడింది, మాక్స్ సూ గురించి గర్వపడ్డాడు. వాళ్ళు సరదాగా గడిపారు, సంతోషంగా నిద్రపోయారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-084",
    "english_text": "Once upon a time, there was a little girl named Lily. Lily had a birthday coming up. She was very excited and wanted to have a big party. She wanted to invite all her friends to her birthday party.\nLily's mom helped her pick out party hats and balloons. They had a hard time finding the right ones. They wanted the hats and balloons to match. They looked and looked until they finally found the perfect hats and balloons that matched.\nOn the day of her birthday party, Lily and her friends had lots of fun. They played games, ate cake, and opened presents. Everyone loved the matching hats and balloons. Lily was so happy to have a special birthday party with her friends.",
    "telugu_text": "ఒకానొకప్పుడు, లిల్లీ అనే ఒక చిన్న అమ్మాయి ఉండేది. లిల్లీకి పుట్టినరోజు రాబోతోంది. ఆమె చాలా ఉత్సాహంగా ఉంది మరియు పెద్ద పార్టీ చేయాలని అనుకుంది. ఆమె తన పుట్టినరోజు పార్టీకి తన స్నేహితులందరినీ ఆహ్వానించాలనుకుంది.\nలిల్లీ అమ్మ ఆమెకు పార్టీ టోపీలు మరియు బెలూన్లను ఎంచుకోవడంలో సహాయం చేసింది. సరైన వాటిని కనుగొనడానికి వారికి కష్టమైంది. టోపీలు మరియు బెలూన్లు సరిపోవాలని వారు కోరుకున్నారు. అవి సరిపోయే సరైన టోపీలు మరియు బెలూన్లను కనుగొనడానికి వారు చూశారు, చూశారు, చివరికి సరిపోయే టోపీలు మరియు బెలూన్లను కనుగొన్నారు.\nతన పుట్టినరోజు పార్టీ రోజున, లిల్లీ మరియు ఆమె స్నేహితులు చాలా సరదాగా గడిపారు. వారు ఆటలు ఆడారు, కేక్ తిన్నారు మరియు బహుమతులు తెరిచారు. అందరూ సరిపోయే టోపీలు మరియు బెలూన్లను చాలా ఇష్టపడ్డారు. తన స్నేహితులతో ఒక ప్రత్యేకమైన పుట్టినరోజు పార్టీ ఉండటం లిల్లీకి చాలా సంతోషంగా ఉంది."

   {
    "order_in_batch": 4,
    "item_id": "T-162",
    "english_text": "One day, a famous dog named Max wanted to raise a little puppy. Max was very good at tricks, so he thought he could teach the puppy too. Max found a tiny puppy named Sam and said, \"Hi Sam, I will help you learn tricks.\"\nMax and Sam played every day. Max showed Sam how to sit, jump, and roll over. Sam was a fast learner. They had lots of fun together.\nOne day, Max decided they needed a license to be real trick dogs. Max and Sam went to the Trick Dog School. They showed the teacher all the tricks they knew. The teacher was very happy and gave them a special license. Max and Sam were proud and continued to do tricks together every day.",
    "telugu_text": "ఒక రోజు, మాక్స్ అనే ప్రసిద్ధ కుక్కకి ఒక చిన్న పిల్లను పెంచాలనిపించింది. మాక్స్ అద్భుతమైన ట్రిక్స్ చేయడంలో చాలా మంచివాడు, కాబట్టి అతను ఆ పిల్లకు కూడా నేర్పించగలడని అనుకున్నాడు. మాక్స్ ఒక చిన్న పిల్లను, సమ్ అని కనుగొని, \"హాయ్ సమ్, నేను నీకు ట్రిక్స్ నేర్పించడానికి సహాయం చేస్తాను\" అన్నాడు.\nమాక్స్ మరియు సమ్ ప్రతిరోజూ ఆడుకున్నారు. మాక్స్ సమ్ కి ఎలా కూర్చోవాలి, దూకాలి మరియు తల తిప్పాలి అని చూపించాడు. సమ్ చాలా త్వరగా నేర్చుకున్నాడు. వారు కలిసి చాలా సరదాగా గడిపారు.\nఒక రోజు, నిజమైన ట్రిక్ కుక్కలు కావడానికి వారికి లైసెన్స్ అవసరమని మాక్స్ నిర్ణయించుకున్నాడు. మాక్స్ మరియు సమ్ ట్రిక్ డాగ్ స్కూల్కు వెళ్లారు. వారు తమకు తెలిసిన అన్ని ట్రిక్స్ ఉపాధ్యాయుడికి చూపించారు. ఉపాధ్యాయుడు చాలా సంతోషించి వారికి ఒక ప్రత్యేక లైసెన్స్ ఇచ్చాడు. మాక్స్ మరియు సమ్ గర్వపడ్డారు మరియు ప్రతిరోజూ కలిసి ట్రిక్స్ చేయడం కొనసాగించారు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-054",
    "english_text": "Once, there was a farmer. He wanted to unite his farm and a mountain. He was determined to do it. Everyone thought he was going to fail... but he didn't! He came up with an unusual plan.\nHe started to build a bridge over the mountain. Everyone was amazed to see it! It took him a very long time, but eventually, he finished it. \nOn a warm summer day, the bridge was finally complete. He was so excited. Everyone was watching when he united his farm with the mountain. The farmer was so proud – he felt like he had achieved something great.\nThe bridge was strong and sturdy, and it was a beautiful way for the farmer to unite his farm with the mountain. It was a remarkable thing, and it gave everyone hope that anything is possible.",
    "telugu_text": "ఒకప్పుడు, ఒక రైతు ఉండేవాడు. అతను తన పొలాన్ని ఒక కొండతో కలపాలనుకున్నాడు. అది చేయాలని అతను కట్టుదిట్టంగా నిర్ణయించుకున్నాడు. అందరూ అతను విఫలమవుతాడని అనుకున్నారు... కానీ అతను విఫలమవ్వలేదు! అతను ఒక విచిత్రమైన ప్రణాళికను వేశాడు.\nఅతను కొండపై ఒక వంతెన కట్టడం మొదలుపెట్టాడు. దానిని చూసి అందరూ ఆశ్చర్యపోయారు! దానికి చాలా సమయం పట్టింది, కానీ చివరికి అతను పూర్తి చేశాడు.\nఒక వేసవి రోజున, ఆ వంతెన చివరకు పూర్తయింది. అతను చాలా సంతోషించాడు. అతను తన పొలాన్ని కొండతో కలిపినప్పుడు అందరూ చూస్తున్నారు. రైతు చాలా గర్వపడ్డాడు – అతను ఏదో గొప్ప పని సాధించినట్లు భావించాడు.\nఆ వంతెన బలంగా, దృఢంగా ఉంది, మరియు రైతు తన పొలాన్ని కొండతో కలపడానికి అది ఒక అందమైన మార్గం. అది ఒక అద్భుతమైన విషయం, మరియు ఏదైనా సాధ్యమే అని అందరికీ ఆశ ఇచ్చింది."
   }

  "TB19": [
   {
    "order_in_batch": 1,
    "item_id": "T-180",
    "english_text": "Tom and Lily were playing with their toys in the living room. They had a big box of blocks, cars, dolls and animals. They liked to build towers, roads, houses and farms with their toys.\nBut Tom and Lily did not like to share. They always wanted the same toy and they fought over it. One day, they both wanted the same red car. They pulled and pulled on the car, trying to take it from each other.\n\"Give me the car!\" Tom shouted.\n\"No, it's mine!\" Lily yelled.\nThey pulled so hard that the car split in two. The wheels and the windows fell off. The car was broken. Tom and Lily looked at the broken car and started to cry.\nMom heard their cries and came to the living room. She saw the broken car and the mess of toys. She was very angry.\n\"What did you do?\" Mom asked.\n\"We broke the car!\" Tom and Lily said.\nMom shook her head. \"You are very naughty. You need to learn to share and play nicely. Now you have no car to play with. And you have to clean up this dust and put away your toys. No more playing for you today. Go to your rooms and think about what you did.\"\nTom and Lily felt very sad. They wished they had shared the car and played nicely. They walked to their rooms, leaving the broken car and the dust behind. They had no fun at all.",
    "telugu_text": "టామ్, లిల్లీ తమ బొమ్మలతో హాల్లో ఆడుకుంటున్నారు. వాళ్ళ దగ్గర పెద్ద పెట్టెలో బ్లాక్స్, కార్లు, బొమ్మలు, జంతువులు ఉన్నాయి. వాళ్ళు తమ బొమ్మలతో టవర్లు, రోడ్లు, ఇళ్ళు, పొలాలు నిర్మించడం అంటే చాలా ఇష్టం.\nకానీ టామ్, లిల్లీ పంచుకోవడానికి ఇష్టపడలేదు. వాళ్ళకి ఎప్పుడూ ఒకే బొమ్మ కావాలని, దాని కోసం వాళ్ళు గొడవ పడేవారు. ఒక రోజు, వాళ్ళిద్దరికీ ఒకే ఎర్రటి కారు కావాలనిపించింది. వాళ్ళు కారును తీసుకోడానికి ఒకరినొకరు లాగారు.\n\"నాకు కారు ఇవ్వు!\" టామ్ అరిచాడు.\n\"వద్దు, అది నాది!\" లిల్లీ అరిచింది.\nవాళ్ళు చాలా బలంగా లాగారు, ఆ కారు రెండు ముక్కలైంది. చక్రాలు, కిటికీలు కిందపడ్డాయి. కారు పగిలిపోయింది. టామ్, లిల్లీ పగిలిన కారు వైపు చూసి ఏడవడం మొదలుపెట్టారు.\nఅమ్మ వాళ్ళ ఏడుపు విని హాల్లోకి వచ్చింది. ఆమె పగిలిన కారును, బొమ్మల గందరగోళాన్ని చూసింది. ఆమె చాలా కోపంగా ఉంది.\n\"మీరు ఏం చేశారు?\" అని అమ్మ అడిగింది.\n\"మేము కారును పగలగొట్టాం!\" టామ్, లిల్లీ అన్నారు.\nఅమ్మ తల ఊపింది. \"మీరు చాలా అల్లరి పిల్లలు. మీరు పంచుకోవడం, చక్కగా ఆడటం నేర్చుకోవాలి. ఇప్పుడు ఆడటానికి మీకు కారు లేదు. ఇంకా ఈ దుమ్మును శుభ్రం చేసి మీ బొమ్మలను సర్దాలి. ఈ రోజు ఇక ఆడుకోవడానికి లేదు. మీ గదులకు వెళ్లి మీరు ఏం చేశారో ఆలోచించండి.\"\nటామ్, లిల్లీ చాలా బాధపడ్డారు. వాళ్ళు కారును పంచుకుని, చక్కగా ఆడి ఉంటే బాగుండు అనుకున్నారు. వాళ్ళు పగిలిన కారును, దుమ్మును వదిలేసి తమ గదులకు నడిచారు. వాళ్ళకి అసలు సరదాగా అనిపించలేదు."
   },
   {
    "order_in_batch": 2,
    "item_id": "T-135",
    "english_text": "Once upon a time, there was a little boy named Tom. He liked to play with his toy tube. Tom was always careful with his toys. One day, he went to the park with his mom. He took his toy tube with him.\nAt the park, Tom saw a girl named Sue. Sue was sad because she did not have a toy to play with. Tom thought for a moment and said, \"I can lend you my toy tube, but you have to be careful with it.\" Sue smiled and said, \"I promise I will be careful.\"\nSue and Tom played with the toy tube all day. They had a lot of fun. At the end of the day, Sue gave the toy tube back to Tom. She was careful, just like she promised. Tom was happy that he could help his new friend. They both went home with a big smile on their faces.",
    "telugu_text": "ఒకప్పుడు, టామ్ అనే ఒక చిన్న పిల్లాడు ఉండేవాడు. అతనికి తన బొమ్మ ట్యూబ్తో ఆడుకోవడం అంటే చాలా ఇష్టం. టామ్ తన బొమ్మల విషయంలో ఎప్పుడూ జాగ్రత్తగా ఉండేవాడు. ఒక రోజు, అతను తన అమ్మతో పార్కుకు వెళ్ళాడు. అతను తన బొమ్మ ట్యూబ్ను తనతో తీసుకువెళ్ళాడు.\nపార్కులో, టామ్ సూ అనే ఒక అమ్మాయిని చూశాడు. సూకి ఆడుకోవడానికి బొమ్మ లేకపోవడం వలన విచారంగా ఉంది. టామ్ ఒక్క క్షణం ఆలోచించి, \"నేను నీకు నా బొమ్మ ట్యూబ్ అద్దెకు ఇవ్వగలను, కానీ నువ్వు దానితో జాగ్రత్తగా ఉండాలి\" అన్నాడు. సూ నవ్వి, \"నేను జాగ్రత్తగా ఉంటానని మాట ఇస్తున్నాను\" అంది.\nసూ మరియు టామ్ ఆ రోజు మొత్తం బొమ్మ ట్యూబ్తో ఆడుకున్నారు. వాళ్ళకి చాలా సరదాగా అనిపించింది. ఆ రోజు చివర్లో, సూ బొమ్మ ట్యూబ్ను టామ్కి తిరిగి ఇచ్చింది. ఆమె తన మాట ప్రకారం జాగ్రత్తగా ఉంది. తన కొత్త స్నేహితుడికి సహాయం చేయగలిగానని టామ్ సంతోషించాడు. వాళ్లిద్దరూ ముఖాల్లో పెద్ద చిరునవ్వుతో ఇంటికి వెళ్ళారు."
   },
   {
    "order_in_batch": 3,
    "item_id": "T-164",
    "english_text": "Once upon a time, there was a little girl named Sue. Sue loved her home very much. One day, she went for a walk and saw a big, interesting rock. She wanted to take the rock home, but it was too heavy.\nSue saw her friend, Tim. Tim was strong. She urged Tim to help her carry the rock. Tim agreed, and they both carried the rock back to Sue's home. They were very tired, but happy.\nWhen they got home, the rock started to shake. Suddenly, the rock cracked open and a small, cute puppy came out! Sue and Tim were so surprised. Now, they had a new friend to play with at home.",
    "telugu_text": "ఒకప్పుడు, సూ అనే ఒక చిన్న అమ్మాయి ఉండేది. సూ తన ఇంటిని చాలా ఇష్టపడేది. ఒక రోజు, ఆమె నడవడానికి వెళ్ళింది, ఒక పెద్ద, ఆసక్తికరమైన రాయిని చూసింది. ఆమె ఆ రాయిని ఇంటికి తీసుకెళ్లాలనుకుంది, కానీ అది చాలా బరువుగా ఉంది.\nసూ తన స్నేహితుడు టామ్ను చూసింది. టామ్ బలంగా ఉన్నాడు. ఆమె టామ్ను రాయిని మోయడానికి సహాయం చేయమని కోరింది. టామ్ అంగీకరించాడు, వాళ్లిద్దరూ ఆ రాయిని సూ ఇంటికి తిరిగి మోశారు. వాళ్ళు చాలా అలసిపోయారు, కానీ సంతోషంగా ఉన్నారు.\nవాళ్ళు ఇంటికి వచ్చినప్పుడు, ఆ రాయి కదలడం మొదలుపెట్టింది. అకస్మాత్తుగా, ఆ రాయి పగిలి చిన్న, ముద్దుగా ఉండే కుక్కపిల్ల బయటకు వచ్చింది! సూ, టామ్ చాలా ఆశ్చర్యపోయారు. ఇప్పుడు, వాళ్ళకి ఇంట్లో ఆడుకోవడానికి ఒక కొత్త స్నేహితుడు వచ్చాడు."
   },
   {
    "order_in_batch": 4,
    "item_id": "T-175",
    "english_text": "Once upon a time, there was a sweet pirate named Tim. Tim had a big ship and he liked to sail on the sea. One day, Tim saw a small island and he wanted to settle there.\nWhen Tim got to the island, he saw a little girl. She was sad because she lost her toy. Tim said, \"Don't worry, I will help you find your toy!\" They looked around the island together.\nAfter a while, they found the toy under a tree. The little girl was so happy and said, \"Thank you, Tim!\" Tim felt good for helping her. They became friends and Tim settled on the island with the little girl. They played and had fun every day.",
    "telugu_text": "ఒకప్పుడు, టిమ్ అనే ఒక మంచి ముసముడు ఉండేవాడు. టిమ్కి ఒక పెద్ద ఓడ ఉండేది, అతనికి సముద్రంలో ప్రయాణించడం అంటే చాలా ఇష్టం. ఒక రోజు, టిమ్ ఒక చిన్న దీవిని చూశాడు, అక్కడ నివసించాలని అనుకున్నాడు.\nటిమ్ ఆ దీవికి చేరుకున్నప్పుడు, ఒక చిన్న అమ్మాయిని చూశాడు. ఆమె తన బొమ్మను పోగొట్టుకున్నందున బాధగా ఉంది. టిమ్, \"చింతించకు, నీ బొమ్మను కనుక్కోవడానికి నేను నీకు సహాయం చేస్తాను!\" అన్నాడు. వాళ్లిద్దరూ కలిసి ఆ దీవిని చుట్టూ చూశారు.\nకొంతకాలం తర్వాత, వాళ్ళు ఒక చెట్టు కింద బొమ్మను కనుగొన్నారు. చిన్న అమ్మాయి చాలా సంతోషించి, \"ధన్యవాదాలు, టిమ్!\" అంది. ఆమెకు సహాయం చేసినందుకు టిమ్కి చాలా సంతోషంగా అనిపించింది. వాళ్ళు స్నేహితులయ్యారు, టిమ్ ఆ చిన్న అమ్మాయితో ఆ దీవిలో నివసించాడు. వాళ్ళు ప్రతిరోజూ ఆడుకున్నారు, సరదాగా గడిపారు."
   },
   {
    "order_in_batch": 5,
    "item_id": "T-129",
    "english_text": "Once upon a time, there was a big dog named Max. Max was an obedient dog. He would always listen to his owner, Mom. One day, Max and Mom went for a walk. Max was so happy to lead Mom through the park. They saw many fun things like trees, birds, and other dogs.\n\"Max, let's go this way!\" said Mom. Max wagged his tail and led Mom to a big, pretty tree. They sat under the tree and had a nice lunch. Max ate his dog food and Mom ate her sandwich. They were both very happy.\nSuddenly, a little cat came out of the tree! Max and Mom did not expect to see a cat there. The cat looked lost and scared. Max knew he had to help. He wagged his tail and led the cat back to its home. The cat's owner was so happy to see her cat again. She hugged Max and thanked him. Max felt proud to be an obedient dog and help his new friend. And from that day on, Max, Mom, and the cat spent many happy years together.",
    "telugu_text": "ఒకప్పుడు, మాక్స్ అనే పెద్ద కుక్క ఉండేది. మాక్స్ చాలా మంచి కుక్క. అది ఎప్పుడూ తన యజమాని, అమ్మ మాట వినేది. ఒక రోజు, మాక్స్, అమ్మ కలిసి నడవడానికి వెళ్లారు. పార్కులో చెట్లు, పక్షులు, మరియు ఇతర కుక్కలు వంటి చాలా సరదా విషయాలు కనిపించాయి.\n\"మాక్స్, మనం ఈ దారిలో వెళ్దాం!\" అంది అమ్మ. మాక్స్ తోక ఊపుతూ అమ్మను ఒక పెద్ద, అందమైన చెట్టు దగ్గరకు తీసుకెళ్లింది. వాళ్ళు చెట్టు కింద కూర్చుని మంచి భోజనం చేశారు. మాక్స్ తన కుక్క ఆహారం తిన్నది, అమ్మ తన శాండ్విచ్ తిన్నది. వాళ్ళిద్దరూ చాలా సంతోషంగా ఉన్నారు.\nఅకస్మాత్తుగా, ఒక చిన్న పిల్లి చెట్టు నుండి బయటకు వచ్చింది! మాక్స్, అమ్మ అక్కడ పిల్లిని చూడటం ఊహించలేదు. ఆ పిల్లి తప్పిపోయినట్లు, భయపడినట్లు కనిపించింది. మాక్స్ సహాయం చేయాలని తెలుసుకుంది. అది తోక ఊపుతూ ఆ పిల్లిని దాని ఇంటికి తిరిగి తీసుకెళ్లింది. ఆ పిల్లి యజమాని తన పిల్లిని మళ్ళీ చూడటం చాలా సంతోషించింది. ఆమె మాక్స్ను కౌగిలించుకుని, ధన్యవాదాలు చెప్పింది. మంచి కుక్కగా, తన కొత్త స్నేహితుడికి సహాయం చేసినందుకు మాక్స్ గర్వపడ్డాడు. ఆ రోజు నుండి, మాక్స్, అమ్మ, మరియు ఆ పిల్లి చాలా సంతోషకరమైన సంవత్సరాలు కలిసి గడిపారు."
   }
