<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070708">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Lyric Lite · Samples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+Telugu:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Tamil:wght@400;500&family=Noto+Sans+Malayalam:wght@400;500&family=Noto+Sans+Kannada:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070708; --bg2: #0d0d10; --card: #111114; --card2: #16161a; --line: #222228; --line2: #2e2e36;
    --fg: #f4f1ea; --muted: #8c8a93; --dim: #5d5b64; --gold: #d6d6db; --gold2: #ffffff; --gold3: #a6a6ad;   /* brand: monochrome (10X Technologies | Lyric wordmark) */
    --violet: #a78bfa; --violet2: #c4b5fd; --wave: #3a3452; --err: #f0a07c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--fg); -webkit-font-smoothing: antialiased;
    font: 400 0.9375rem/1.55 Geist, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 85% -10%, #17171b 0%, transparent 60%), radial-gradient(900px 500px at -10% 15%, #120f1f 0%, transparent 55%), var(--bg); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 20; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 10px; }
  .wrap { max-width: 980px; margin: 0 auto; padding-block: 28px 72px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

  /* brand bar */
  .brand { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 12px; color: var(--fg); text-decoration: none; }
  .mark { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(145deg, var(--gold2), var(--gold) 60%, var(--gold3));
    color: #0a0a0b; font: 700 1rem/1 Geist, sans-serif; letter-spacing: -.04em; box-shadow: 0 8px 30px -8px color-mix(in srgb, var(--gold) 60%, transparent), inset 0 1px 0 #fff6; }
  .word { font: 600 1.125rem/1.1 Geist, sans-serif; letter-spacing: -.01em; }
  .word span { display: block; font: 500 0.6562rem/1.5 "Geist Mono", monospace; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
  .wordmark { height: 1.9rem; width: auto; display: block; }
  .lite { font: 500 0.6875rem/1 "Geist Mono", monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--fg); border: 1px solid var(--line2); border-radius: 999px; padding: 6px 10px; }
  @media (max-width: 600px) { .wordmark { height: 1.4rem; } }
  .who { display: flex; align-items: center; gap: 10px; font-size: 0.8125rem; color: var(--muted); }
  .who b { color: var(--fg); font-weight: 500; }
  .link { background: none; border: 0; padding: 0; color: var(--gold); cursor: pointer; font-size: 0.8125rem; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--gold) 40%, transparent); }

  /* steps */
  .steps { display: flex; gap: 8px; margin: 22px 0 0; font: 500 0.6875rem/1 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); flex-wrap: wrap; }
  .steps span { display: flex; align-items: center; gap: 8px; }
  .steps span + span::before { content: ""; width: 22px; height: 1px; background: var(--line2); }
  .steps .on { color: var(--gold2); }
  .steps .done { color: var(--muted); }

  .eyebrow { font: 500 0.7188rem/1 "Geist Mono", monospace; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); display: flex; gap: 10px; align-items: center; margin-top: 40px; }
  .eyebrow::before { content: ""; width: 26px; height: 1px; background: var(--gold); opacity: .7; }
  h1 { font: 400 clamp(2.375rem, 7vw, 4.125rem)/1.03 "Instrument Serif", Georgia, serif; margin: 14px 0 0; letter-spacing: -.01em; text-wrap: balance; }
  h1 em { color: var(--gold2); }
  .lede { color: var(--muted); max-width: 60ch; margin: 14px 0 0; font-size: 1rem; text-wrap: pretty; }

  .back { display: inline-flex; align-items: center; gap: 8px; margin-top: 30px; background: none; border: 1px solid var(--line2); border-radius: 999px; padding: 7px 14px 7px 10px; color: var(--muted); cursor: pointer; font-size: 0.8125rem; transition: all .18s; }
  .back:hover { color: var(--fg); border-color: var(--dim); }
  .back svg { width: 16px; height: 16px; }

  /* form */
  .panel { margin-top: 30px; background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 22px; padding: clamp(18px, 4vw, 30px); box-shadow: 0 30px 60px -40px #000; display: grid; gap: 20px; max-width: 640px; }
  .field { display: grid; gap: 8px; }
  .field label { font: 500 0.6875rem/1 "Geist Mono", monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .field label i { font-style: normal; color: var(--dim); letter-spacing: .04em; text-transform: none; }
  .field input, .field select, .field textarea { width: 100%; background: var(--bg2); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; font-size: 0.9375rem; transition: border-color .18s, box-shadow .18s; }
  .field textarea { resize: vertical; min-height: 74px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 18%, transparent); }
  .roles { display: flex; flex-wrap: wrap; gap: 8px; }
  .role { border: 1px solid var(--line2); background: transparent; border-radius: 999px; padding: 8px 14px; font-size: 0.8438rem; color: var(--muted); cursor: pointer; transition: all .18s; }
  .role:hover { color: var(--fg); border-color: var(--dim); }
  .role[aria-pressed="true"] { color: #0a0a0b; background: linear-gradient(180deg, var(--gold2), var(--gold)); border-color: transparent; }
  .err { color: var(--err); font-size: 0.8125rem; min-height: 1em; margin: 0; }
  .note { color: var(--dim); font-size: 0.7812rem; margin: 0; }
  .cta { justify-self: start; display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer; font: 600 0.9062rem Geist, sans-serif;
    color: #0a0a0b; background: linear-gradient(180deg, var(--gold2), var(--gold)); box-shadow: 0 10px 30px -12px color-mix(in srgb, var(--gold) 70%, transparent); transition: transform .15s, filter .15s; }
  .cta:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .cta svg { width: 16px; height: 16px; }

  /* language cards */
  .langs { margin-top: 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
  .lang { position: relative; overflow: hidden; display: grid; gap: 10px; text-align: left; padding: 22px; min-height: 160px; align-content: space-between; border-radius: 20px;
    border: 1px solid var(--line); background: linear-gradient(180deg, var(--card2), var(--bg2)); cursor: pointer; transition: border-color .2s, transform .2s, box-shadow .2s; min-width: 0; }
  .lang:hover { border-color: color-mix(in srgb, var(--gold) 60%, transparent); transform: translateY(-2px); box-shadow: 0 18px 50px -28px color-mix(in srgb, var(--gold) 70%, transparent); }
  .lang .nat { font: 500 2.125rem/1.25 "Noto Sans Telugu", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Malayalam", "Noto Sans Kannada", sans-serif; }
  .lang .en { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 0.875rem; color: var(--gold2); }
  .lang .en i { font: normal 400 0.6875rem "Geist Mono", monospace; color: var(--dim); }
  .lang .ghost { position: absolute; right: -6px; bottom: -22px; font: 400 6rem/1 "Instrument Serif", serif; color: transparent; -webkit-text-stroke: 1px color-mix(in srgb, var(--gold) 18%, transparent); pointer-events: none; }

  /* listen page */
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 16px; background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line2); background: transparent; border-radius: 999px; padding: 7px 13px; font-size: 0.8125rem; color: var(--muted); cursor: pointer; transition: all .18s; }
  .chip:hover { color: var(--fg); border-color: var(--dim); }
  .chip[aria-pressed="true"] { color: #0b0b0c; background: var(--fg); border-color: var(--fg); }
  .chip.lng { font-family: "Noto Sans Telugu", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Malayalam", "Noto Sans Kannada", Geist, sans-serif; }
  .chip.lng[aria-pressed="true"] { color: #0a0a0b; background: linear-gradient(180deg, var(--gold2), var(--gold)); border-color: transparent; }
  .group { margin-top: 34px; }
  .group-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .group-h h2 { margin: 0; font: 400 1.875rem/1 "Instrument Serif", serif; }
  .group-h h2 em { color: var(--violet2); font-style: italic; }
  .group-h span { font: 400 0.75rem "Geist Mono", monospace; color: var(--dim); }
  .clips { display: grid; gap: 12px; margin-top: 14px; }
  .clip { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; padding: 16px 18px; border: 1px solid var(--line); border-radius: 18px;
    background: linear-gradient(180deg, var(--card2), var(--card)); transition: border-color .2s, box-shadow .2s; }
  .clip.on { border-color: color-mix(in srgb, var(--violet) 55%, transparent); box-shadow: 0 16px 50px -30px color-mix(in srgb, var(--violet) 80%, transparent); }
  .clip:hover { border-color: color-mix(in srgb, var(--violet) 35%, var(--line)); }
  .clip.heard .num::after { content: " · heard"; color: color-mix(in srgb, var(--violet) 75%, var(--dim)); }
  .play { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line2); background: linear-gradient(145deg, var(--violet2), var(--violet)); color: #0d0a1a; display: grid; place-items: center; cursor: pointer; box-shadow: 0 8px 24px -10px color-mix(in srgb, var(--violet) 70%, transparent); transition: transform .15s, background .2s; }
  .play:hover { transform: scale(1.05); }
  .play { border-color: transparent; }
  .clip.on .play { background: #fff; color: #0d0a1a; box-shadow: 0 0 0 4px color-mix(in srgb, var(--violet) 35%, transparent); }
  .play svg { width: 17px; height: 17px; }
  .wave { position: relative; height: 46px; cursor: pointer; min-width: 0; touch-action: none; }
  .bars { position: absolute; inset: 0; display: flex; align-items: center; gap: 2px; }
  .bars i { flex: 1 1 0; min-width: 1px; border-radius: 2px; background: var(--wave); }
  .bars.top { clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0); }
  .bars.top i { background: linear-gradient(180deg, var(--violet2), var(--violet)); }
  .time { font: 400 0.75rem "Geist Mono", monospace; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; min-width: 82px; }
  .clip.on .time { color: var(--violet2); }
  .meta { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .dl { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 1px solid var(--line2); color: var(--dim); display: grid; place-items: center; transition: color .2s, border-color .2s, background .2s; }
  .dl:hover, .dl:focus-visible { color: var(--fg); border-color: color-mix(in srgb, var(--violet) 55%, transparent); background: color-mix(in srgb, var(--violet) 14%, transparent); }
  .dl svg { width: 14px; height: 14px; }
  .txt { grid-column: 2 / 4; margin: 0; font-size: 1.1562rem; line-height: 1.8; color: #d9d5cc; overflow-wrap: anywhere; text-wrap: pretty; }
  .clip.on .txt { color: var(--fg); }
  .txt:lang(te) { font-family: "Noto Sans Telugu", sans-serif; } .txt:lang(hi) { font-family: "Noto Sans Devanagari", sans-serif; }
  .txt:lang(ta) { font-family: "Noto Sans Tamil", sans-serif; } .txt:lang(ml) { font-family: "Noto Sans Malayalam", sans-serif; }
  .txt:lang(kn) { font-family: "Noto Sans Kannada", sans-serif; }
  .num { grid-column: 2 / 4; font: 400 0.6875rem "Geist Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: -4px; }

  footer { margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--dim); font-size: 0.7812rem; line-height: 1.7; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  footer b { color: var(--muted); font-weight: 500; }
  .view { animation: in .35s ease both; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (max-width: 600px) {
    .clip { grid-template-columns: 44px minmax(0, 1fr); padding: 14px; }
    .play { width: 44px; height: 44px; }
    .meta { grid-column: 2; justify-content: space-between; }
    .time { text-align: left; min-width: 0; }
    .txt, .num { grid-column: 1 / -1; font-size: 1.0625rem; }
    .num { font-size: 0.6562rem; }
    .lang .nat { font-size: 1.875rem; }
    .bar { position: static; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a class="logo" href="#details" aria-label="10X Technologies Lyric Lite, home"><img class="wordmark" src="brand/lyric-white.svg" alt="10X Technologies | Lyric" width="263" height="31"><span class="lite">Lite</span></a>
    <div class="who" id="who" hidden></div>
  </div>
  <div class="steps" id="steps" aria-label="Progress"></div>
  <main id="view"></main>
  <footer>
    <span>Every clip was generated by the model from the text shown. © 10X Technologies</span>
  </footer>
</div>
<script>window.LYRIC_TRACK_URL = "https://lyriclistenapp.vercel.app/api/track";</script>
<script src="clips.js"></script>
<script src="app.js"></script>
</body>
</html>
